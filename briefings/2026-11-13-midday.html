  <noscript><main><p>原定12:00 · 完成13:47 · 實際發布13:52</p><h1>補刊 · 國際外交、公共安全與科技政策焦點</h1><p>2026-11-13 時事焦點</p><article><h2>美特使稱歐洲將參與下一輪烏克蘭和談　克宮尚未證實</h2><p>烏克蘭和談的參與安排出現新動向。美國特使魏科夫11月12日與俄羅斯總統普丁會面後表示，普丁同意讓歐洲代表加入下一輪會談，烏克蘭總統澤倫斯基對此表示歡迎。不過，克宮外交顧問鄂夏柯夫在會後簡報中並未證實這項安排，各方是否已就歐洲參與達成共識，仍有待確認。

魏科夫在克里姆林宮會談後接受俄羅斯國營電視台訪問，強調歐洲是美方的夥伴，參與談判至關重要。他隨後與另一名美國總統特使庫許納前往愛爾蘭，與正在都柏林出席歐洲峰會的澤倫斯基簡短會談。

澤倫斯基表示，樂見後續還有多輪會談，也歡迎歐洲參與。他希望議程納入停火及緩和衝突的具體步驟，讓談判能排除障礙、繼續推進。

然而，戰後安全安排仍有明顯分歧。普丁反對歐洲構想在和平協議達成後派西方部隊進駐烏克蘭，稱俄方會視此為安全威脅，並警告可能導致戰事重啟。他要求美方與歐洲盟友溝通；鄂夏柯夫則批評歐洲目前對烏克蘭的立場，形同讓戰爭持續。</p><aside>編輯觀察：歐洲能否取得談判席位，與各方能否接受戰後安全安排，是兩個不同層次的問題。美方宣布的參與進展，尚不能視為俄歐對停戰條件的分歧已經縮小。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611130040.aspx">中央社國際</a></p><ul></ul></article><article><h2>川普要求墨西哥攔阻北上移民　威脅將關稅加倍</h2><p>美國總統川普11月12日要求墨西哥阻止北上的移民隊伍抵達美墨邊界，否則將把對墨西哥的關稅提高一倍。這是川普提出的附帶條件威脅，並非已宣布實施的關稅調整；墨西哥近期則已多次採取攔阻行動。

近幾天至少有兩支移民隊伍試圖北上，一支約1000人，另一支約100人。隊伍成員表示，他們希望川普所屬共和黨在期中選舉受挫後，美國能放寬邊境限制。這是移民的期待，不代表美方已改變政策；川普則在「真實社群」發文，強調不會放行，要求墨方立即阻止移民前進。

墨西哥安全人員10日攔截約100人的隊伍，當時這批移民剛渡過墨西哥與瓜地馬拉之間的河流，據報有數十人遭拘留。另一支約1000人的隊伍則在兩天前未遇阻攔地進入墨西哥，截至12日正穿越南部、與瓜地馬拉接壤的奇亞帕斯州。

墨西哥自9月以來已多次攔阻從中美洲北上的移民團體，另有一支隊伍預計15日從宏都拉斯出發。川普此時將移民攔阻與關稅掛鉤，也使邊境問題與雙邊貿易談判交織：墨西哥是美國最大的貿易夥伴，兩國目前正重新談判彼此自由貿易協定的條款。</p><aside>編輯觀察：此案須分清政治施壓與政策實施：關稅加倍仍是威脅，移民對邊境放寬的期待也不是政策變更。後續觀察重點是墨方攔阻措施，以及美方是否正式採取貿易行動。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611130046.aspx">中央社國際</a></p><ul></ul></article><article><h2>巴拉圭Ueno銀行案擴大偵辦　檢方搜查前總統官邸</h2><p>巴拉圭Ueno銀行倒閉案擴大偵辦，檢方11月12日搜查前總統潘尼亞的官邸，中央銀行官員殷斯佛蘭也在住家遭搜查時被逮捕。潘尼亞已遭彈劾並被審前羈押，面臨利用職權圖利銀行等指控；他否認所有指控。

Ueno銀行因嚴重資不抵債疑慮，於11月3日遭到接管，數十萬名巴拉圭人無法動用帳戶，潘尼亞也因此遭彈劾及逮捕。檢察署表示，這次官邸搜查是針對前總統案件的偵查程序之一。當局先前已於9日搜查他位於亞松森的私人住宅，查扣文件、手機及電腦。

調查也涉及銀行主管與金融監管官員。Ueno銀行高階主管瓦茲蓋斯的得力助手阿斯蒂加拉加已向警方自首；曾領導Ueno銀行的前中央銀行總裁卡瓦洛，目前也遭審前羈押。

潘尼亞曾持有Ueno控股公司股份，直到去年才出售。他被控運用總統影響力，將數百萬政府存款導向Ueno，並在接獲可疑貸款與清償能力警告後，仍刻意隱瞞或淡化銀行財務困境。這些仍屬偵辦中的指控，不能將搜查、逮捕或羈押視為有罪認定。</p><aside>編輯觀察：案件同時涉及民眾帳戶使用、政府存款流向與金融監管責任。銀行遭接管及多人被偵辦，仍不足以確定個別人士的刑事責任，須區分金融衝擊、檢方指控與司法認定。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611130041.aspx">中央社國際</a></p><ul></ul></article><article><h2>紐約公寓倒塌至少8死18傷　市府擴查相關業者百處工地</h2><p>美國紐約市布魯克林區一棟3層樓公寓11月11日倒塌，造成至少8人死亡、18人受傷。消防局12日在確認瓦礫堆中已無其他罹難者後結束搜救。市長曼達尼宣布，將調查相鄰工地涉及的5家公司，並檢查與這些業者相關的另外100處工地。

倒塌發生於當地時間11日下午4時左右，建築物倒入旁邊正在準備地基的開挖工地，也摧毀相鄰住宅大樓的一面牆。官方紀錄顯示，倒塌公寓建於1930年，內有4個住宅單位。市府另下令同側街道3處地址的住戶撤離，等待安全檢查。

官員表示，救援人員在瓦礫堆中發現6具遺體，另有2人傷重不治；死者包括2名兒童及2名工人。事故與後續事件造成的18名傷者中，有4人是參與救援的消防員。約250名人員投入晝夜搜救，12日仍在豪雨中清理瓦礫。

調查也將檢視工地先前的違規紀錄。法新社檢視的市府建築局文件顯示，該工地4月曾因拆除作業可能存在危險而遭勒令停工，涉事公司因工程持續進行遭罰1萬美元。官員強調，倒塌原因仍待釐清，目前尚未證實這些違規情事與事故有關。</p><p><a href="https://www.cna.com.tw/news/aopl/202611130037.aspx">中央社國際</a></p><ul></ul></article><article><h2>義大利3778所公校再收炸彈恐嚇信　政府將啟動技術小組</h2><p>義大利11月12日再度發生大規模校園炸彈恐嚇事件，3778所公立學校收到匿名威脅電郵，77所學校緊急疏散，其中36所在安全檢查後恢復上課。總理府召開安全會議，決定13日上午啟動技術小組，制定短、中、長期應變措施，並將其他可能遭駭客攻擊的目標納入因應範圍。

這是連續第二天出現大規模恐嚇。11日已有超過6000所學校接獲威脅信，寄件網域顯示來自台灣大葉大學；12日的郵件則來自一名菲律賓教師的電子郵件帳號，寄件者仍使用相同俄文化名。第二波信件除要求總理梅洛尼辭職，也謊稱已有學校發生爆炸並造成傷亡。

總理府表示，疏散學校數量下降，顯示前一天向各校傳達的應變指南已有初步成效。政府希望學校依循指引處理威脅，避免因虛假訊息恐慌而輕易疏散，同時由技術小組建立後續應變措施。

義大利目前朝「跨國混合戰」方向調查，懷疑外國勢力藉此測試社會韌性與公共安全應變系統。「共和報」等媒體引述專家研判，操作者可能切換不同國家教育機構的伺服器作為跳板；「晚郵報」則稱，相關電郵帳號遭盜用後在暗網販售。這些仍屬調查方向或媒體說法，現有資料不足以確認幕後操作者，不能僅憑寄件網域或俄文化名判定其所屬國家。</p><p><a href="https://www.cna.com.tw/news/aopl/202611130028.aspx">中央社國際</a></p><ul></ul></article><article><h2>漢密爾頓訪拉法關卡　籲以色列放行加薩援助物資</h2><p>加薩人道援助物資的通行情況受到關注。英國賽車手漢密爾頓11月10日抵達埃及北西奈半島阿里什，並訪問埃及與加薩邊境的拉法關卡，了解援助運送工作。他表示，現場有滿載食品與日用品的卡車等待入境，呼籲以色列履行停火協議義務，允許援助車輛通行。

埃及媒體「金字塔報」報導，訪問期間正逢埃及紅新月會派出第308支援助車隊，運送超過2581噸人道物資。漢密爾頓表示，他看到卡車在關卡排隊，卻遭拒絕入境或嚴重延誤；排在最前方的一名司機告訴他，已在車上等候超過12小時。

漢密爾頓也表示，他在物流中心看到遭拒收的物資堆放，對拒收理由感到沮喪。報導列出的被扣留物資包括睡袋、急救包、醫療設備、輪椅及兒童足球。卡車受阻與物資遭拒的具體情況，來自他的現場陳述及該報報導。

這名7屆F1世界冠軍在社群平台發文，強調任何人的生命都不應被輕視，剝奪自由、安全與尊嚴並不公正。他呼籲放行援助卡車，也表示不希望世界對巴勒斯坦人的苦難習以為常或視而不見。</p><p><a href="https://www.cna.com.tw/news/aopl/202611130032.aspx">中央社國際</a></p><ul></ul></article><article><h2>立陶宛青年團體抗議台灣代表處更名要求　籲政府維持價值外交</h2><p>立陶宛兩個青年組織11月12日在國會旁發起抗議，反對政府要求台灣駐立陶宛代表處更名，並呼籲政府不要為改善與中國的關係，放棄以價值為基礎的外交政策。多名國會友台小組議員到場聲援。

代表處名稱近日再度成為爭議焦點。立陶宛媒體日前披露，立國外交部官員曾向台灣代表處遞交非正式文件，要求更名並設定期限。這項披露涉及更名要求，並不代表代表處已完成更名。

發起活動的「青年保守派聯盟」與「立陶宛自由青年組織」，要求執政聯盟、外交部長及總統傾聽年輕世代對外交方向的看法。青年保守派聯盟理事梅克利斯表示，政府應優先考量立陶宛與台灣共享的價值，而非經濟利益。自由青年組織幹部柯查尼納斯則認為，政府雖以務實考量解釋對中政策轉變，卻尚未充分說明為何必須如此。

參與聲援的議員也對政策調整提出質疑。根維拉斯主張，中國先前單方面改變與立陶宛的外交關係，若要恢復，應由中國主動採取行動，不應以犧牲民主夥伴為代價；凱里斯則呼籲維持外交政策延續性。兩個發起團體中，青年保守派聯盟是反對黨祖國聯盟的青年組織，自由青年組織則是非黨派青年非政府組織。</p><aside>編輯觀察：抗議凸顯，代表處名稱爭議不只是雙邊外交問題，也牽動立陶宛國內對經濟利益、民主價值與外交政策延續性的取捨。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611130030.aspx">中央社政治</a></p><ul></ul></article><article><h2>G7外長聯合聲明重申台海和平重要性　支持台灣參與國際組織</h2><p>七大工業國集團（G7）外長與歐盟外交暨安全政策高級代表在聯合聲明中，重申維持台灣海峽和平與穩定的重要性，並支持台灣有意義地參與國際組織。台灣外交部11月12日回應，部長林佳龍對此表達高度歡迎與感謝。

這場會議於11月9日至10日在巴黎舉行，會後聲明涵蓋烏克蘭、中東及印太等區域情勢，台海和平與台灣國際參與也是其中議題。外交部指出，這是G7成員繼今年6月17日領袖峰會聯合聲明後，再度重申維護台海和平穩定的重要性。

外交部將此次表態解讀為「維護台海現狀已是國際共識」，並強調台海和平穩定攸關區域及全球安全與繁榮。對於後續合作，外交部表示，台灣將持續深化與G7成員及理念相近夥伴的關係，共同維護以規則為基礎的國際秩序，以及民主、自由與法治等價值。</p><p><a href="https://www.cna.com.tw/news/aipl/202611120342.aspx">中央社政治</a></p><ul></ul></article><article><h2>施振榮將代表台灣出席深圳APEC　林佳龍強調平等參與權利</h2><p>2026年亞太經濟合作經濟領袖會議將於11月18日至19日在中國深圳舉行，總統賴清德敦請宏碁集團創辦人暨榮譽董事長施振榮擔任領袖代表。外交部長林佳龍表示，台灣不會輕易放棄參與國際事務及發聲的機會。

林佳龍11月12日在臉書說明，台灣是APEC正式完整會員，享有與其他經濟體平等參與各項會議的權利。他表示，APEC是台灣參與的重要國際組織，歷年領袖代表都肩負拓展國際合作、深化區域經貿關係的任務，並感謝施振榮承擔此次工作。

施振榮曾於2007年擔任APEC領袖代表，當時提出「APEC數位機會中心」第二階段倡議。對於這次出席，林佳龍期待他傳達台灣的重要主張，以台灣的觀點與經驗參與全球經濟發展討論，提升台灣的國際能見度。

APEC目前共有21個會員經濟體，台灣於1991年以Chinese Taipei名稱加入。此次會議尚未舉行，林佳龍的說明聚焦代表任務與參與權利，相關期待仍有待會議期間的實際進展。</p><p><a href="https://www.cna.com.tw/news/aipl/202611120325.aspx">中央社政治</a></p><ul></ul></article><article><h2>黃仁勳卸任輝達執行長、克瑞斯暫代　赴美國會說明日期協商中</h2><p>輝達董事會11月12日宣布，黃仁勳辭去總裁、執行長及董事職務，立即生效，由財務長克瑞斯擔任臨時執行長，董事會另行尋找正式接班人。Harvey C. Jones將出任首位獨立董事長，並表示公司業務持續運作、未受中斷。克瑞斯則在聲明中表示，將與領導團隊延續公司在加速運算與AI領域的工作，服務客戶、合作夥伴、開發者及股東。

這次人事異動發生在黃仁勳婚外情及往來對象疑涉中國情報活動的報導延燒之際。美國眾議院相關委員會主席表示，黃仁勳已同意赴國會說明，出席日期仍在協商；議員原先要求他於11月18日參加閉門簡報。外交事務委員會主席馬斯特預期，簡報將錄影並製作逐字紀錄。輝達董事會表示，沒有理由相信美國國安或公司機密受到損害，並已針對相關報導展開調查；中國政府則駁斥間諜指控，稱其意在抹黑。

市場反應並不一致。輝達12日收盤下跌4.34%，報166.19美元，單日市值減少約1,800億美元；美超微在相關風波及司法調查報導下，下跌11.30%。台灣市場13日早盤則走高，台股一度上漲近1,400點至44,489.48點，新台幣兌美元在32.8元附近波動。聯發科、創意、世芯-KY等ASIC族群攻上漲停，反映市場對替代晶片供應商可能受惠的預期，但股價表現不等於訂單轉移已經發生。

接班安排與執行能力是後續觀察重點。The Decoder與TechCrunch均指出，黃仁勳未建立明確接班計畫。對台灣供應鏈的影響，台新投顧評估，AI晶片訂單多元化可能加速，但主要業者仍與台廠密切合作，整體供應鏈架構不致出現重大變化；兆豐國際投顧副總經理黃國偉則認為，輝達短期產品布局不至於受影響，長期須觀察執行效率。這些均屬產業分析，尚非已確認的營運結果。

開放模型策略是否延續，也尚無定論。TechCrunch指出，輝達以130億美元收購Hugging Face的交易尚未完成，克瑞斯將如何處理交易及開放模型生態系支持政策仍不明朗；不過，一名輝達內部人士向該媒體表示，預期領導層更替不會影響Nemotron模型開發。現階段不能將外界疑慮視為輝達已改變政策。</p><aside>編輯觀察：目前必須分開觀察公司治理、國會調查與市場交易三條線：人事更替已發生，但間諜指控、訂單移轉及策略轉向都不能因股價波動而被視為已獲證實。</aside><p><a href="https://the-decoder.com/jensen-huang-resigns-as-nvidia-ceo-after-espionage-scandal-wipes-out-1-4-trillion-in-market-value/">The Decoder</a></p><ul><li><a href="https://techcrunch.com/2026/11/12/jensen-huang-is-out-at-nvidia-who-is-colette-kress-his-interim-replacement/">TechCrunch AI</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611130042.aspx">中央社國際</a></li><li><a href="https://techcrunch.com/2026/11/12/jensen-huang-agrees-to-testify-before-congress/">TechCrunch AI</a></li><li><a href="https://www.cna.com.tw/news/afe/202611130019.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/afe/202611130048.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/afe/202611130039.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/afe/202611130043.aspx">中央社財經</a></li><li><a href="https://techcrunch.com/2026/11/12/jensen-huangs-exit-puts-nvidias-support-for-open-source-in-question/">TechCrunch AI</a></li></ul></article><article><h2>美司法部據報調查黃樂是否涉美超微產品走私　尚無起訴定論</h2><p>美國司法部據報正在調查黃樂是否涉及將美超微製造的產品走私至中國。彭博引述一名匿名知情人士表示，調查由紐約曼哈頓聯邦檢察官辦公室主導。目前尚不清楚黃樂或相關企業可能扮演何種角色，也無法確認這項調查是否與美國或亞洲已起訴的晶片走私案件直接相關；調查可能在未提出任何起訴的情況下結束。

另一宗已起訴案件涉及美超微共同創辦人廖益賢。曼哈頓聯邦檢察官今年3月指控他與另外兩人，涉嫌共謀將搭載輝達晶片的伺服器運往一家未具名東南亞公司，再轉運中國客戶。廖益賢已表示不認罪，並已離開美超微；美超微未被列為被告。不能因產品或公司名稱重疊，就認定兩項調查已有關聯。

美超微表示，正全力配合美國、台灣與新加坡當局的調查及要求，並稱Megaspeed並非、也從未是其客戶。黃樂的前東家Megaspeed先前也遭報導受到半導體走私調查，該公司否認不法行為。美國司法部與曼哈頓聯邦檢察官辦公室均拒絕置評。

另據CNBC報導，私人情報公司Tesari分析黃樂的人脈及企業關係後，提出她與華為可能存在間接關聯的說法；CNBC稱，其檢視的文件顯示，與黃樂有關聯的企業曾涉及向華為提供輝達晶片算力。這些是媒體與私人公司的調查說法，不是法院認定，也不足以據此確認黃樂具有間諜身分或已違反出口管制。輝達、華為及黃仁勳未回應CNBC的置評請求，該媒體則未能聯繫上黃樂。</p><aside>編輯觀察：這起事件的關鍵在法律程序與證據界線：接受調查不等於遭到起訴，已起訴的其他案件也不能直接用來證明黃樂涉案。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611130055.aspx">中央社國際</a></p><ul></ul></article><article><h2>美據報擬管制中國AI企業遠端算力　新增範圍含星馬泰等7國</h2><p>美國商務部據報正準備敲定新規，禁止中國AI企業透過其他國家的資料中心，遠端取得先進AI晶片算力。The Information引述兩名知情人士表示，管制範圍將新增包括馬來西亞、新加坡、泰國在內的7國，最快可能於11月公布，但商務部仍在與其他政府機關協商。

這項規則方向將把管制焦點從晶片實體流向，延伸至海外資料中心提供的遠端運算服務。報導指出，新制將擴大商務部工業暨安全局現行半導體相關管制措施，目的在防止中國遠端使用晶片，以及晶片被走私入境；最終適用細節仍待敲定，不能視為已生效政策。

騰訊、阿里巴巴與字節跳動等中國企業已簽署海外資料中心協議，藉此使用輝達高階晶片訓練AI模型。這類安排正面臨海外與中國境內更嚴格的檢視，北京也在推動提高國產晶片使用率。另據Axios報導，川普曾力推更嚴格的對中出口管制，商務部長盧特尼克則是主要反對者；目前仍須等待正式規則，才能判斷相關協議將如何受到影響。</p><aside>編輯觀察：若規則依報導方向落實，跨境算力服務本身將成為管制重點，影響不只在晶片出口，也涉及中國AI企業如何取得海外運算資源；具體影響仍取決於正式條文。</aside><p><a href="https://www.cna.com.tw/news/ait/202611120205.aspx">中央社科技</a></p><ul></ul></article><article><h2>澳洲擬對前沿AI設強制安全規範，要求獨立稽核與事故通報</h2><p>澳洲政府宣布推動人工智慧安全立法，擬首次對在澳洲營運的前沿AI公司實施強制安全規範，鎖定最先進、風險程度最高的模型。方案仍待諮詢完成後公布更多細節，尚不能視為已生效的企業義務。

依目前規劃，開發前沿模型的公司須接受獨立稽核、持續進行安全檢查，並公開安全框架；發生安全事件時，也須立即向政府通報。通報要求的目的之一，是及早掌握AI代理出現失控行為的警訊。

政府另規劃成立新的監督機構，與Australian AI Safety Institute共同推動合規監督，違規者將面臨高額罰則。不過，目前資料尚未交代具體罰款金額、適用門檻與實施時程。

總理Anthony Albanese與相關官員表示，政府希望先建立國內安全規範，再投入國際協商，藉此保護民眾與國家利益。政府也將建立信任、提高監管穩定性列為目標，期待吸引投資，並讓AI在經濟與醫療領域發揮效益。</p><aside>編輯觀察：提案將獨立檢驗、持續監測與事故通報納入同一監管架構；後續適用門檻與執行細節，將是判斷企業實際責任的重要依據。</aside><p><a href="https://the-decoder.com/australias-proposed-ai-safety-bill-would-force-frontier-model-makers-to-open-up-to-independent-testing/">The Decoder</a></p><ul></ul></article><article><h2>微軟365、Outlook與Teams中斷，波及OpenAI及Anthropic連接器</h2><p>微軟365、Outlook與Teams於美東時間11月12日發生服務中斷，美國用戶大量回報問題，影響也延伸至OpenAI及Anthropic使用的微軟連接器。微軟表示，已修復北美Teams的中斷問題，但這不代表其他受影響服務均已恢復。

服務中斷追蹤網站Downdetector彙整的資料顯示，截至美東時間下午2時07分，Outlook問題回報超過9萬7000件，微軟365超過3萬8000件，Teams則約4500件。這些數字是問題回報件數，不能直接當作實際受影響人數。

微軟表示，正採取措施降低影響，並稱北美Teams的相關影響已完全排除。公司隨後也指出，問題可能影響其他地區用戶的微軟365服務連線。

AI服務方面，OpenAI表示正在調查微軟連接器問題，可能造成新建立的連線無法正常運作，相關工具也可能未能如預期運作。Anthropic則表示，已發現上游供應商出現問題，影響其微軟365連接器；目前資訊未顯示兩家公司的AI服務全面中斷。</p><aside>編輯觀察：這次中斷不只涉及辦公與通訊服務，也顯示AI工具連接外部服務時，仍可能受到上游系統故障牽動；核心AI服務與連接器的可用性須分開判讀。</aside><p><a href="https://www.cna.com.tw/news/ait/202611130010.aspx">中央社科技</a></p><ul></ul></article><article><h2>公督盟稱捐款資料庫遭複製，暫停線上捐款並提醒防詐</h2><p>公民監督國會聯盟11月12日表示，委外捐款系統遭入侵，已確認公督盟捐款資料庫曾被複製，捐款者姓名、電子郵件、電話、地址及捐款紀錄等可能外洩。目前已暫時關閉線上捐款頁面，並主動通知捐款者提高警覺。

公督盟說，9日接獲捐款管理系統服務廠商網絡行動科技（NetiCRM）通知，得知廠商內部伺服器遭入侵。12日上午收到的最新調查結果顯示，攻擊者利用廠商內部系統漏洞取得管理權限，進一步攻擊公督盟工作人員使用的電子郵件系統、相關管理帳號及捐款資料庫。雖有境外IP異常攻擊紀錄，實際攻擊者身分與來源仍待查證。

針對信用卡資料，公督盟表示，過去系統設計已採脫鉤處理，因此不在這次外洩範圍。公督盟已向內政部致電通報資安事件，尋求外部資安團隊協助檢查帳號及系統，並與廠商持續釐清實際外洩範圍、修復系統及檢討委外管理機制。

公督盟提醒，不會要求捐款者操作ATM、轉帳辦理退款或變更扣款設定。若接到以「重複扣款」、「捐款設定錯誤」或「辦理退款」為由的陌生電話、訊息，可向公督盟官方電話02-2367-1571查證，或撥打165反詐騙專線。</p><aside>編輯觀察：聯絡資料與捐款紀錄可能讓冒名訊息更具可信度；即使公督盟稱信用卡資料未受波及，捐款者仍應留意假退款與假扣款通知。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611120334.aspx">中央社政治</a></p><ul></ul></article><article><h2>國台辦否認跨國鎮壓　陸委會：應以司法調查事證檢驗</h2><p>針對中國大陸國台辦稱跨國鎮壓是謊言，陸委會發言人梁文傑11月12日在例行記者會回應，是否涉及跨國鎮壓，應以司法調查掌握的事證為依據，不能僅憑國台辦的說法否認。他並援引暴力攻擊、假車禍及監控等不同案件，說明陸委會的判斷。

在印太戰略智庫執行長矢板明夫遭攻擊案中，梁文傑表示，警方調查顯示，有境外人士不滿矢板明夫對兩岸問題的發言，出資委託他人組成跨國施暴集團；案件涉及香港幫派成員分工、事前勘察部署，以及實際攻擊與把風。他並稱，嫌犯廖港發遭起訴後，已在法院開庭時坦承犯行，對起訴罪名全數認罪。

梁文傑另指出，相聲演員黃逸豪假車禍案具有境外出資指使、境內分工策劃、蓄意製造假車禍及事後回報等特徵。對於國台辦將相關案件稱為普通治安事件或「惡意抹黑」，他主張應檢視檢方掌握的證據，而非以「義憤」解釋；他也表示，民進黨籍立委沈伯洋被監控案具有相同特徵。

梁文傑強調，不同政治立場都應享有自由表達意見的權利，不應因批評中共而遭跟監、恐嚇或暴力傷害。他將防範此類行為，定位為保障人民言論自由及台灣民主制度的重要課題。</p><aside>編輯觀察：這次爭議的核心，是如何以可檢驗的司法證據判斷境外指使與組織分工。政府的案件說明與法院最終認定仍須區分，不宜將不同案件直接視為同一犯罪集團。</aside><p><a href="https://www.cna.com.tw/news/acn/202611120311.aspx">中央社政治</a></p><ul></ul></article><article><h2>Nebius規劃明年逾400億美元資本支出　微軟算力交付延至2027年</h2><p>雲端運算業者Nebius在第三季財報電話會議提出，2027年資本支出預計達400億至450億美元，將仰賴客戶預付款及以客戶合約為基礎的融資支應。不過，供應微軟算力的新澤西州Vineland資料中心已延誤數月，使擴張計畫面臨交付與資金調度壓力。

Nebius與微軟的合約價值最高達194億美元，目前規劃在2026年底前交付略多於一半的相關容量，其餘延至2027年第二季。公司將延誤歸因於場地營運商DataOne在轉用Bloom Energy燃料電池期間，比原先預期更快停止臨時發電。

依Nebius對合約的說明，若未如期交付、也未提供替代容量，微軟可在寬限期後終止受影響的服務，合約亦設有延遲交付罰則。Nebius表示微軟參與了規劃過程，但未說明微軟是否同意新時程；目前也沒有微軟公開取消合約的消息。

公司預期，客戶預付款與以投資等級合約支撐的資產融資，可涵蓋明年資本支出最高85%，並稱自行興建的資料中心均準時或提前上線，將供應2027年起多數新增容量。Nebius季末持有74億美元現金，並預測2027年營收達120億至130億美元、第四季稅前損益兩平。

第三季營收為9.81億美元，年增571%，但約三分之一來自新合作模式的一次性款項。受第三方場地延誤影響，公司將2026年營收預測下修2億美元至30億美元，股價當日收跌17%。</p><aside>編輯觀察：以預付款及合約融資支持擴張，讓建置進度與資金安排緊密相連。觀察重點不只是支出規模，也包括容量能否依約交付、客戶是否接受調整，以及延誤罰則對財務的影響。</aside><p><a href="https://techcrunch.com/2026/11/12/nebius-tests-the-neocloud-playbook-with-40-billion-in-planned-spending/">TechCrunch</a></p><ul></ul></article><article><h2>Norwest募得40億美元新基金　擴大跨產業AI投資布局</h2><p>投資機構Norwest募得40億美元新基金，為其第18檔、也是成立65年來規模最大的一檔基金。這家由Wells Fargo單一出資支持的多階段投資機構，計畫將資金投入多種產業與多個國家，並加深人工智慧布局。

Norwest列出的主要投資市場包括美國、印度與以色列。公司表示，將關注在消費、醫療與科技等核心產業開發產品及服務的AI新創，並持續擴大實體AI、語音AI、代理式資安與航太領域的投資。

資深管理合夥人Jeff Crowe表示，採取廣泛布局，是因為公司認為AI的影響橫跨產業、地理區域與應用。他特別看好開發AI原生應用與基礎設施、實體AI、特定領域模型及資安解決方案的早期企業，並認為AI轉型有潛力深入企業、消費與醫療服務的多個層面。

近期投資案例包括開發AI代理測試與評估工具的Coval，以及為機器人開發AI基礎模型的Generalist AI。Norwest上一檔基金於2024年完成30億美元募資，自該基金推出以來，已進行超過87筆投資；新基金規模則再增加10億美元。</p><aside>編輯觀察：這筆募資顯示Norwest將以更大的基金延續多階段、跨產業投資，AI則是其加碼方向之一。判讀資金流向時，仍須區分基金總規模與實際投入AI的金額，不能將兩者畫上等號。</aside><p><a href="https://techcrunch.com/2026/11/12/norwest-pushes-deeper-into-ai-with-new-4b-fund/">TechCrunch AI</a></p><ul></ul></article><article><h2>AlphaGenome 2聚焦特定細胞類型，預測基因變異影響</h2><p>Google Deepmind發布基因體研究模型AlphaGenome 2，將預測重點從跨組織的整體分析，轉向特定細胞類型。依公司說明，新模型除了讀取DNA序列，也把指定的生物狀態納入輸入，藉此計算基因變異在該細胞類型中的影響，而非一次平行預測多種組織的結果。

Google Deepmind表示，模型使用來自人類與小鼠、涵蓋68種組織的逾1.07億份個別細胞資料訓練。預測項目包括基因表現強度、DNA在細胞核內的包裝與可接近程度，以及DNA甲基化。研究人員也可輸入部分量測資料，例如細胞的基因活性，再由模型推估其他性質，協助安排後續實驗。

在涵蓋28種原代免疫細胞類型的TenK10K基準測試中，Google Deepmind公布的結果顯示，AlphaGenome 2辨識出約30%的因果變異，並在43%的案例中正確預測變異會提高或降低基因表現；經微調的前代模型兩項結果分別為16%與23%。這些數字屬公司公布的模型評測，不代表已具備臨床診斷能力。

AlphaGenome 2目前透過API開放非商業研究使用，商業使用者則須透過封閉預覽取得存取權。Google Deepmind也已預先計算數百種細胞與組織狀態的預測結果，供研究分析使用；系統尚未獲准用於臨床診斷。</p><aside>編輯觀察：將預測細化到細胞類型，有助於研究不同細胞對同一基因變異的反應差異；但模型推估與臨床診斷仍是不同層次，評測進步不能直接等同治療效益。</aside><p><a href="https://the-decoder.com/google-deepmind-shifts-genomics-ai-from-bulk-tissue-predictions-to-single-cell-type-resolution-with-alphagenome-2/">The Decoder</a></p><ul></ul></article><article><h2>Google推出Gemini 4 Hydrogen，提供四級推理設定與百萬詞元輸出</h2><p>Google推出通用AI模型Gemini 4 Hydrogen，主打快速處理日常任務，並開始向開發者與一般使用者推出。開發者可透過AI Studio及Android Studio中的Gemini API使用；Gemini應用程式與Google搜尋也在推出範圍內，付費Pro與Ultra訂戶則可透過Google Antigravity使用。

Hydrogen提供low、medium、high與新增的xhigh四種推理設定，預設為high。模型的輸入上下文視窗與輸出上限均為100萬詞元，輸入每100萬詞元收費1.50美元，輸出則為7.50美元。不同推理設定的實際任務成本，仍會受到詞元用量影響。

Google表示，Hydrogen在預設high設定下，於Artificial Analysis Intelligence Index取得51分，高於Argon的50分；調至xhigh後可達54分。公司另稱，相較Gemini 3.8 Flash，新模型在預設推理設定下完成任務的速度為其2.5倍。這些比較屬Google公布的效能說法，不能直接視為所有工作情境下的表現。

Artificial Analysis的評測則呈現不同任務間的落差：Hydrogen在Terminal-Bench 4.0取得54%，在Terminal-Bench-Science 0.1取得50%，兩項均低於該評測所列的Claude Sonnet 5.5最高設定結果。推理強度也牽動成本與分數：xhigh的每項任務成本約3.16美元，high約1.87美元；medium與low雖更便宜，智慧指數卻分別降至41與27分。Artificial Analysis指出，xhigh使用的輸出詞元接近high的兩倍。</p><aside>編輯觀察：開發者選型不能只看單一總分或每百萬詞元價格；推理設定、任務類型與實際輸出用量，會共同影響完成工作的成本。</aside><p><a href="https://the-decoder.com/googles-gemini-4-hydrogen-outscores-the-bigger-argon-just-four-weeks-after-its-launch/">The Decoder</a></p><ul></ul></article><article><h2>Claude Meetings開放團隊與企業測試，目前僅支援Google Meet</h2><p>Anthropic推出Claude Meetings，讓Claude以可見參與者身分加入視訊會議。這項功能目前向Team與Enterprise方案提供測試版，支援平台暫時只有Google Meet，並非所有用戶或視訊服務都能使用。

依Anthropic介紹，Claude可在會議中回答問題、產生文件與白板，並記錄筆記和待辦事項，預設以文字回應；獲得授權後，也能存取已連接的工具。會議結束後，Claude產生的筆記、逐字稿與文件，會集中放在claude.ai的專屬頁面。

資料權限方面，隱私控制預設會阻止Claude加入有外部參與者的會議。採用HIPAA或客戶自行管理加密設定的組織，目前仍無法使用Meetings。Anthropic表示，未來會增加支援平台，但現有資料未列出新增平台名單或時程。</p><aside>編輯觀察：企業評估會議AI時，除了記錄與文件產生功能，也須確認外部與會者限制、工具授權，以及既有合規與加密設定是否適用。</aside><p><a href="https://the-decoder.com/claude-meetings-lets-anthropics-ai-join-your-video-calls/">The Decoder</a></p><ul></ul></article><article><h2>Meta擴大Muse代打電話功能，付費用戶可委託聯絡美國商家</h2><p>Meta將消費型AI代理Muse的代打電話功能擴大至所有付費訂戶，使用者可要求它代為致電美國商家。這項功能自9月開始測試，原先只有部分提出申請的早期使用者能試用。

目前Muse訂閱方案每月最低20美元，提供每週5億個詞元；較高用量方案則為每月100美元，可取得30億個詞元。Meta上月表示，Muse用戶已超過1,000萬人，但這項整體用戶數並不等同於付費或使用代打電話功能的人數。

Meta人工智慧長、Superintelligence Labs主管Alexandr Wang提出的使用情境，包括聯絡有線電視業者、車輛管理機關，以及不提供線上訂位的餐廳。這些是公司列舉的用途，並非各類任務均能完成的保證。

代打電話仍面臨接聽端是否願意互動的問題：部分商家與接線人員辨識出來電者是AI後，會直接掛斷電話。Wang另表示，建立Muse電子郵件地址的功能即將開放給免費用戶，電話功能目前則仍限付費使用。</p><aside>編輯觀察：AI代理開始代替使用者進入電話服務流程，但能撥打電話不等於能完成委託。付費門檻與接聽端的配合程度，是評估服務實用性的不同面向。</aside><p><a href="https://techcrunch.com/2026/11/12/muse-can-now-place-calls-to-u-s-businesses-if-you-pay/">TechCrunch</a></p><ul></ul></article><article><h2>United Airlines限制未授權AI代理訂票，將調整平台與通路政策</h2><p>United Airlines表示，將限制未經授權的第三方個人AI代理或助理，代替旅客訂購機票及管理預訂。措施不只涵蓋航空公司自有數位平台，也將透過旅行社與彙整平台等通路實施，並包括更新訂位、開票及分銷政策。

公司提出的主要理由，是帳號安全與操作授權風險。United警告，旅客若把帳號憑證交給第三方AI助理，可能暴露敏感資訊；這些工具採取的操作，也可能造成非出於使用者本意的購買、帳戶變更，或動用MileagePlus哩程。

United另稱，使用AI代理可能牴觸聯邦航空規範，並以報到程序為例，說明須由人類完成報到，確認行李沒有違禁物品。這是公司提出的規範說明，重點在於相關確認須由人類完成，並未明確限定必須由旅客本人操作。

這項限制明確針對未授權的第三方個人AI代理或助理，不能直接解讀為全面禁止所有AI應用。</p><aside>編輯觀察：這起政策案例顯示，AI代理能否完成交易，不只取決於技術能力，也涉及服務業者是否承認其授權，以及哪些確認程序仍須由人類完成。</aside><p><a href="https://techcrunch.com/2026/11/12/united-airlines-blocks-ai-agents-from-booking-flights-citing-cybersecurity-risks/">TechCrunch AI</a></p><ul></ul></article><article><h2>ElevenLabs推出Scribe v3語音辨識模型，錄音準確度與即時表現須分開看</h2><p>ElevenLabs推出兩款語音轉文字模型：Scribe v3用於預錄音檔，Scribe v3 Live則面向低延遲的即時應用。兩者均已透過ElevenAPI開發介面及ElevenAgents平台提供，鎖定會議多人交談重疊、電話背景雜音等辨識情境。

公司宣稱，Scribe v3在102種語言的整體評估中，字詞錯誤較前代減少約25%，並改善大型群體對話中的說話者辨識；Scribe v3 Live也首度提供即時區分說話者的功能。針對語音代理，Live版本會結合對話脈絡與音訊訊號判斷發言是否結束，目標是避免使用者短暫思考或慢慢念出數字時，就被系統打斷。

The Decoder報導，Artificial Analysis的外部評測顯示，Scribe v3的轉錄準確度位居前段，僅落後Alibaba的一款預覽模型；但速度與價格表現居中。Microsoft與xAI的受測模型處理速度快上數倍、價格約為一半，代價是錯誤率略高。

這項評測只衡量預錄音檔的字詞錯誤，沒有涵蓋說話者辨識、較少見語言的改善，也沒有測試Scribe v3 Live的即時互動表現，因此不能用錄音轉錄成績推定對話品質。開發者另可預先加入專業詞彙，並以自然語言設定數字、日期等輸出格式；這些控制功能與即時模型的效果，仍須和轉錄準確度分開評估。</p><aside>編輯觀察：錄音轉錄與即時語音代理需要不同的評估標準。採用者除了比較錯誤率，也須分別衡量處理速度、成本，以及系統判斷使用者是否說完話的能力。</aside><p><a href="https://the-decoder.com/elevenlabs-scribe-v3-live-uses-conversational-context-to-stop-voice-agents-from-cutting-off-callers-mid-sentence/">The Decoder</a></p><ul></ul></article><article><h2>Whoop推出健康資料社群功能，全會員層級可自選分享對象</h2><p>穿戴裝置業者Whoop於11月12日推出社群功能Whoop Humans，將在Whoop應用程式內向所有會員層級開放，不另收費。會員可追蹤親友，選擇分享睡眠、恢復狀態、運動與成就等資料，也能附上照片和文字，追蹤者則可留言及表達反應。

Whoop原有的Teams功能以群組和排行榜為核心，同一群組成員可看見彼此資訊；Humans則讓會員決定誰能追蹤自己，以及哪些資料對誰可見。例如，教練可追蹤多名客戶，但客戶之間不必互相公開資料。執行長Will Ahmed表示，新功能採自願加入方式。

健康資訊進入社群互動後，分享界線也成為重點。Ahmed表示，會員可移除追蹤者，或啟用「隱身模式」，暫時停止顯示資訊而不更動原有設定；標記為敏感的活動預設不分享，健康警示與醫療資訊則不會分享。公司另稱，使用者可檢舉令人不適的留言或照片，檢舉內容會經審查。

Whoop會員最低年齡為13歲，部分國家門檻更高；未成年會員分享資料仍受同意程序及隱私設定約束。對於家長能否追蹤青少年的資料，Ahmed未直接回答，僅提及隱私控制。他也表示，公司不出售會員資料，亦不將資料授權給第三方。這些都是公司對服務及資料使用方式的說明。</p><aside>編輯觀察：Whoop正把個人健康追蹤延伸為親友與教練間的互動工具。編輯觀察重點在於，使用者能否清楚理解分享對象、資料範圍與暫停分享的方式，尤其涉及未成年會員時。社群互動增加不等於健康改善，不能將功能推出視為醫療效果的證明。</aside><p><a href="https://techcrunch.com/2026/11/12/whoop-just-launched-a-social-network/">TechCrunch</a></p><ul></ul></article></main></noscript>
