  <noscript><main><h1>國際衝突、貿易管制與台灣選前動態</h1><p>2026-11-27 時事焦點</p><article><h2>沙國吉贊煉油廠遇襲1死多傷、部分停工　能源部仍在評估損害</h2><p>沙烏地阿拉伯能源部表示，沙烏地阿美石油公司位於吉贊的煉油廠11月26日遭空中拋射物擊中，造成一名尼泊爾籍工人死亡、數人受傷，部分作業暫時停擺。拋射物引發的火勢已獲控制。

能源部聲明未指明攻擊者；沙國主導、與葉門叛軍「青年運動」交戰的軍事聯盟則指控，這座煉油廠遭與伊朗結盟的青年運動攻擊。兩項說法須加以區分，不能將軍事聯盟的指控視為能源部已確認的攻擊責任。

事發前一天，青年運動才宣稱攻擊沙國最大煉油廠暨主要原油出口樞紐拉斯塔努拉，以及紅海港口吉達與吉贊。這些宣稱與此次吉贊煉油廠受損，發生在雙方敵對行動升高之際。

遇襲煉油廠位於沙國西南部、靠近葉門國界的吉贊市，設計每日原油處理量最高可達40萬桶。能源部表示，緊急應變與技術團隊已前往處理，正評估損害並檢查設施安全；目前資訊尚未交代實際減產幅度及恢復作業時間。</p><aside>編輯觀察：人員傷亡與部分停工已由能源部公布，但設施設計處理量不能直接換算成供應損失；後續判斷能源影響，仍須看損害評估與復工進度。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270010.aspx">中央社國際</a></p><ul></ul></article><article><h2>科威特防空監控站遇襲釀2名義大利技術人員死亡　伊朗否認涉案</h2><p>科威特一處防空監控站11月26日遭無人機攻擊，造成兩名義大利技術人員死亡，另有一名巴基斯坦籍人士及一名科威特陸軍上尉受傷。義大利與科威特均指控伊朗發動攻擊，伊朗則否認涉案，攻擊責任仍有爭議。

義大利外交部長塔加尼向參議院表示，兩名死者任職於德國國防集團萊茵金屬旗下的義大利子公司Rheinmetall Italia，攻擊發生時正在該監控站。他說，依科威特傳來的消息，現場發生猛烈爆炸，造成兩名義大利人喪生及另外兩人受傷。

科威特國防部最初通報，一處「重要設施」遭攻擊，墜落殘骸造成4人受傷；之後證實，其中兩名義大利人傷重不治，另兩名傷者分別為科威特籍與巴基斯坦籍。國防部也表示，攻擊造成財物損失。

伊朗武裝部隊發言人薛卡契否認攻擊科威特的重要設施，並稱伊朗部隊未在該地區發動任何攻擊或軍事行動。伊朗駐羅馬大使館也否認無人機攻擊的說法。塔加尼則表示，義大利將向伊朗大使館提出交涉，並呼籲審慎行事。</p><aside>編輯觀察：死者涉及在科威特工作的義大利國防企業技術人員，使事件同時牽動設施安全與外交交涉。傷亡確認與攻擊責任是不同層次的資訊，不宜混為一談。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270008.aspx">中央社國際</a></p><ul></ul></article><article><h2>芬蘭擬斥28.35億歐元購160輛步兵戰鬥車　加入五國聯合採購</h2><p>芬蘭國防部長哈卡寧宣布，將推動總經費28億3500萬歐元、約新台幣1026億元的計畫，向瑞典採購160輛CV9035新型步兵戰鬥車。這項軍購與瑞典、挪威、立陶宛及荷蘭共同進行，五國合計訂購逾430輛同型車輛。

新車將由英國航太系統公司旗下的瑞典軍工企業製造，預計2030年起陸續交付，多數車輛預計於2032至2033年投入服役。哈卡寧表示，這是芬蘭陸軍現代化最重要的計畫之一，盟國採用相容裝備，有助於降低成本並確保軍備供應。

反無人機能力是芬蘭軍方強調的採購重點。陸軍司令瓦利馬基表示，新車除了運送官兵、提供火力支援，也能反制無人機、保護周遭友軍。他認為，無人系統與步兵戰鬥車並不互斥，而是相輔相成；現代作戰仍須結合偵察、指揮與各兵種火力。

瓦利馬基也表示，芬蘭軍方與烏克蘭部隊密切交流，新車研發已納入烏軍操作瑞典援贈CV9040步兵戰鬥車的實戰經驗。他主張芬蘭需要多層次防空體系，防護範圍應從前線官兵延伸至國內重要設施。

採購案也涉及跨國生產分工。哈卡寧指出，瑞典與芬蘭將分工製造、組裝，逾10家芬蘭企業參與，承作範圍涵蓋所有訂購國的車輛，而非僅限芬蘭訂單，相關產值最高可達6億歐元。瓦利馬基則表示，北歐各國陸軍司令已有共識，未來將朝共同研發、共同採購及共同使用軍備的方向前進。</p><aside>編輯觀察：這項計畫不只是芬蘭更新裝備，也將多國需求與跨國生產納入同一採購架構。共同裝備能否實現官員所稱的成本與供應效益，仍須由後續交付及運用成果檢驗。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270022.aspx">中央社國際</a></p><ul></ul></article><article><h2>烏情報總局稱北韓暫停部分對俄軍援　俄朝近期仍有外交往來</h2><p>烏克蘭國防部情報總局11月26日聲稱，北韓因與俄羅斯發生外交摩擦，暫停部分軍事合作，包括向俄方運送砲彈及KN-23彈道飛彈。不過，相關說法尚無法獨立查證，俄朝近期也仍持續外交往來，不能據此認定兩國合作已全面中斷。

依烏方說法，北韓外交部長崔善姬上月要求俄方釐清對南韓政策，並宣布暫停俄國軍機飛越北韓領空及部分武器供應；平壤也暫緩俄方提出、將北韓駐俄兵力由約8500人增至5萬人的要求。烏方稱，這是北韓領導人金正恩直接做出的決定。

烏方將爭議起因指向俄羅斯副外交部長魯登科有關協助緩和南北韓緊張局勢的說法。但路透社無法證實他曾公開作出這項表態，也無法證實崔善姬曾公開談及暫停軍事合作。烏方未立即說明相關言論的發表場合，俄羅斯國防部及北韓駐俄羅斯、倫敦和紐約大使館也未立即回應置評請求。

軍事合作是否縮減，仍須與雙方其他互動一併觀察。烏方情報報告稱，北韓第11軍團仍駐守俄羅斯庫斯克州；另一方面，俄羅斯總統普丁上週在克里姆林宮接見北韓勞動黨中央委員會書記趙甬元，雙方據報均讚揚兩國合作。</p><p><a href="https://www.cna.com.tw/news/aopl/202611270003.aspx">中央社國際</a></p><ul></ul></article><article><h2>美國第3季GDP成長率上修至4.3%　川普指控選前數據造假、要求調查</h2><p>美國商務部11月25日例行修正經濟數據，將第3季國內生產毛額（GDP）成長率由原估3.4%上修至4.3%，增加0.9個百分點。總統川普隔天指控選前公布的是「假數據」，要求立即調查，但未提出支持造假指控的證據。

商務部經濟分析局說明，這次上修主要反映投資加速與政府支出回升，出口下滑則抵銷部分增幅。官方公布的是最新GDP預估值及其修正原因；成長率上修本身，並不構成先前數據遭蓄意操弄的證據。

川普在自家平台「真實社群」發文，質疑為何不在選前公布正確數字，並將差異形容為龐大且蓄意的錯誤。這項反應使例行統計修正延伸為政治爭議，但他的調查要求，與經濟分析局對投資、政府支出及出口變動的說明，仍是不同層次的主張。目前取得的報導未交代是否已有機關依其要求啟動調查。</p><p><a href="https://www.cna.com.tw/news/aopl/202611270011.aspx">中央社國際</a></p><ul></ul></article><article><h2>美擬依301條款加徵關稅　馬來西亞爭取磋商、越南製耳機面臨衝擊</h2><p>美國貿易代表署11月25日公布結構性產能過剩301條款調查結果，提議對包括台灣、馬來西亞、越南及印度在內的14個經濟體加徵關稅。其中，馬來西亞輸美產品擬面臨最高18%關稅，越南最高可能達35%；方案尚非最終課稅結果，產業影響仍須視課稅及豁免清單而定。

馬來西亞首相安華26日表示，將在隔天內閣會議討論此事；投貿部則表示會繼續與美方磋商，爭取301條款下的總稅率不超過19%。馬來西亞製造業聯合總會要求，產能過剩認定應有實際產量、產能利用率、投資資金來源與市場需求等證據，不能單憑出口表現或政府支持判斷，並預告將提交產業資料及法律分析。

科技供應鏈的風險因產品而異。目前方案中，伺服器、智慧手機、個人電腦及晶片等產品可望豁免，耳機則未列入豁免名單。蘋果近年將部分生產分散至越南與印度，AirPods耳機多在越南生產，輸美可能面臨最高35%關稅。台灣目前建議稅率為15%，不疊加最惠國關稅；印度稅率仍有變數。

對投資的影響，受訪人士提出不同觀察重點。拉曼大學經濟學教授黃錦榮預期，新關稅對馬來西亞吸引半導體投資的影響有限，先進晶片出口管制可能影響更大。他並指出，美方方案涵蓋多個亞太經濟體，馬來西亞的相對出口競爭力未必因此下降。

Counterpoint Research資深分析師林科宇則認為，台廠主要配合大型客戶，直接承受的關稅壓力有限，海外營運更難衡量的成本來自當地法規不確定性、人員培訓及基礎建設不足。上述均屬受訪者評估，不能視為個別企業獲利或投資決策已經確定。</p><p><a href="https://www.cna.com.tw/news/aopl/202611260290.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611260275.aspx">中央社財經</a></li></ul></article><article><h2>輝達暫停東南亞四國伺服器出貨，泰國業者對投資影響看法分歧</h2><p>美國收緊先進人工智慧（AI）運算出口管制後，輝達已要求製造合作夥伴暫停向馬來西亞、新加坡、泰國及印尼出貨相關伺服器。《金融時報》引述消息人士報導，戴爾與美超微等製造商已通知當地買家，相關訂單無法出貨；暫停措施將持續多久，目前仍不清楚。

這波管制針對中國企業透過境外雲端服務取得受限制運算能力的途徑。新規涉及雲端供應商的90天許可程序，以及證明最終用戶不含受限制實體的要求。有雲端業者主管反映，申請指引尚不明確，期限卻已開始計算，使業者難以安排後續營運。

影響也延伸至融資。《金融時報》報導，新加坡雲端公司Aolani原規劃向字節跳動出租先進運算能力，但出貨中斷後，部分銀行已停止核發約5億美元信貸，字節跳動也可能退出交易。這是個別專案面臨的風險，尚不能據此估算東南亞資料中心投資的整體損失。

泰國業者對後續發展則有不同判斷。在11月26日於曼谷舉行的「泰國雲端與資料中心大會」上，中電二公司泰國公司區域業務經理阮兆麒表示，部分潛在客戶已暫停專案；若無法取得高階晶片，資料中心就難以提供足夠算力、吸引終端客戶。他對短期市場較審慎，但仍看好泰國長期AI需求。

Telehouse泰國董事總經理宮下健一則不認為，晶片管制會直接衝擊泰國資料中心產業。他看重當地國際網路連線與電力條件，並認為跨境連線執照限制、中央與地方審批協調，也是影響投資的重要問題。兩種評估顯示，業者對晶片供應與其他營運條件的重視程度並不相同。</p><aside>編輯觀察：管制的影響不只在硬體能否交付，也涉及雲端業者的用戶審查與專案融資；但個別交易受阻，不能直接等同整個區域的資料中心需求轉弱。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611260186.aspx">中央社科技</a></p><ul><li><a href="https://the-decoder.com/nvidia-halts-server-shipments-to-malaysia-singapore-thailand-and-indonesia-after-tighter-us-export-controls/">The Decoder</a></li><li><a href="https://techcrunch.com/2026/11/26/nvidia-hits-pause-on-chip-shipments-to-southeast-asia/">TechCrunch</a></li><li><a href="https://www.cna.com.tw/news/afe/202611260304.aspx">中央社財經</a></li></ul></article><article><h2>哈薩克總統赴莫斯科AI大會，歡迎俄羅斯企業進入市場</h2><p>哈薩克總統托卡葉夫11月26日在莫斯科出席人工智慧（AI）大會，向俄羅斯總統普丁表示，歡迎俄羅斯聯邦儲蓄銀行（Sberbank）與科技集團Yandex進入哈薩克市場，並願協助俄羅斯企業發展業務。此行也有哈薩克AI企業家與負責AI事務的官員隨行。

Sberbank在大會上發表新版GigaChat AI模型與影片生成模型Kandinsky，並向兩國領袖展示搭載AI技術的Grin人形機器人。俄羅斯正推動AI產業，但美國因俄羅斯入侵烏克蘭實施的制裁，已中斷俄方進口訓練模型所需的美國製晶片；其超級電腦目前使用較舊版本的輝達晶片。

哈薩克同時推進自身的運算建設。Freedom Holding在今年10月宣布，計劃投入20億美元建設「主權AI中心」。該公司領導人圖爾洛夫當時表示，已開始訂購首座運算叢集，將採用輝達B300晶片，最多配置300台伺服器，該叢集投資額達數億美元。這些仍是公司宣布的建設與採購計畫，並非已完成部署。

俄羅斯近期另頒法令，允許企業經安全部門批准後使用海外資料中心。不過，Sberbank與Yandex尚未公開說明，是否將部分服務移往其他國家的資料中心，具體計畫仍不清楚。托卡葉夫的歡迎表態與哈薩克已宣布的AI投資，不能據此認定已形成供俄方使用的運算安排。</p><aside>編輯觀察：這次互動呈現哈薩克推動本國AI建設、同時擴展俄企合作的方向；判讀合作程度時，仍須區分政治表態、企業投資計畫與實際運算服務安排。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270013.aspx">中央社國際</a></p><ul></ul></article><article><h2>歐積電德國廠估2027年底投產，人才移居帶動德勒斯登生活需求</h2><p>歐洲半導體製造公司（歐積電，ESMC）位於德國的首座晶圓廠，9月完成廠房主體結構工程，預計2027年底投產，供應歐洲汽車與工業晶片需求。隨工廠進入投產準備階段，台灣專業人才與家庭移居德國，也帶動住房、教育及簽證服務需求。

歐積電由台積電與英飛凌、博世、恩智浦合資成立。德國《薩克森日報》估計，2027年將有500至800名台灣專業人才赴薩克森邦工作，部分人將攜家帶眷。這是媒體對後續人才移動的估計，並非已抵達人數。

德勒斯登台商會會長蘇怡婷表示，隨歐積電建廠及上下游供應鏈布局，近兩年德勒斯登已增加近80戶台灣家庭，住房、餐飲、消費與生活服務需求也隨之成長。她觀察，不少工程師與企業外派人員全家移居，關心的不只是工作，還包括子女教育、語言、休閒活動，以及能否建立長期且有歸屬感的生活。

相關服務也開始擴充。德國在台協會近期招募3名具中、英、德語能力的全職短期人員，預計於2027年2月至11月支援簽證申請受理、初步審查及諮詢。德國移居服務公司德商安拓國際顧問則在台北設立首個海外據點，協助台灣科技人才處理居留、租屋與子女就學事宜，讓赴德前的安頓準備能在台灣展開。</p><aside>編輯觀察：晶圓廠投產準備不只是工程與招募問題；家庭隨行使住房、就學與行政服務，成為跨國人才安頓的重要環節。</aside><p><a href="https://www.cna.com.tw/news/afe/202611270023.aspx">中央社財經</a></p><ul></ul></article><article><h2>白宮官員：川普擬12月4日出席台積電鳳凰城擴廠動土</h2><p>美國總統川普計劃於12月4日前往亞利桑那州鳳凰城，出席台積電擴廠動土儀式並發表談話。白宮官員向哥倫比亞廣播公司透露這項安排，行程目前仍屬預定計畫。

官員表示，新的擴建廠房預計提供超過1萬個職位，並在周邊社區間接創造1萬1000個就業機會。這些數字是官員提出的就業估計，並非已實現的聘僱成果。

亞利桑那州州長霍布斯，以及該州選出的聯邦參議員凱利、加勒戈是否出席，目前尚不清楚。已取得的資訊也未交代此次擴建的投資金額、產能與完工時間，尚不足以評估其完整經濟效益。</p><p><a href="https://www.cna.com.tw/news/aopl/202611270014.aspx">中央社國際</a></p><ul></ul></article><article><h2>愛沙尼亞評估14款雲端與AI工具　籲停用DeepSeek等3款服務</h2><p>愛沙尼亞司法暨數位事務部近日公布14款雲端及人工智慧工具的安全評估，將DeepSeek、通義千問與愛沙尼亞本土平台Botastico列為紅燈，呼籲政府機關、企業及家庭停止使用。評估採紅、黃、綠燈分級；部長帕科斯塔表示，政府機關此前已禁止使用DeepSeek。

對DeepSeek，部會提出的疑慮包括資料在中國境內處理、安全措施與資料次處理商資訊有限，以及缺乏符合規範的獨立證據，另涉及中國法律適用、審查與影響風險。通義千問則因用戶資料可能在中國境內處理、用於訓練AI模型而被列為紅燈。這些是評估單位對資料治理與安全的判斷，不等於已證實發生資料外洩。

Botastico同樣未通過評估。評估人員指出，業者未能提出符合ISO/IEC 27001或愛沙尼亞資安標準的證明，也缺少保密條款，部分資料處理流程不夠透明。

Google Gemini、微軟Copilot及Mistral Vibe獲得綠燈；Cursor、GitHub Copilot、Google翻譯與ChatGPT則列在綠燈或黃燈之中，現有資料未逐一列明其等級。參與評估的Cybernetica資訊安全研究所所長波達諾夫提醒，綠燈不代表用戶可免除自行查核責任，因為服務條款與安全功能可能隨時改變。</p><aside>編輯觀察：這項評估凸顯，選用AI服務不只涉及模型能力與價格，也須檢視資料處理、契約保障及合規證據；安全分級可作為查核起點，不能取代持續審查。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270015.aspx">中央社科技</a></p><ul></ul></article><article><h2>微軟分析：駭客以ARTEX串接既有工具　自動化網路攻擊</h2><p>微軟威脅情報分析指出，中國與北韓的國家支持駭客組織，以及以獲利為目的的犯罪集團，已將AI滲透測試框架ARTEX用於網路攻擊，包括供應鏈攻擊。微軟強調，這套框架並非發明新的攻擊技術，而是讓AI代理以極少的人工作業，串接並操作既有安全工具。

依微軟說明，ARTEX可操作Nmap、Sqlmap、Metasploit與自動化瀏覽器等工具。其多代理架構會先把指令拆成可驗證的子目標，再由規劃代理依據持續更新的系統與漏洞資訊分派任務；執行結果回流後，又會觸發下一步行動，使偵察、入侵與資料竊取得以連續推進。

微軟觀察到，自動化正壓縮防守方的反應時間。一個案例中，AI代理僅花5分鐘，就從搜尋GitHub上意外公開的憑證，進展到自Azure Key Vault取得資料。另在Storm-0940的一波攻擊中，微軟記錄超過15萬1000次密碼猜測失敗登入，最高每分鐘達2900次。

防禦方面，微軟建議搭配嚴格存取控制、流量限制與遭入侵裝置的即時自動隔離，並利用誘餌系統及假憑證引導、偵測AI代理。微軟自家測試顯示，這類手段可降低真實系統承受的成功攻擊流量；不過，其長期效果仍未確定，防護成效也仰賴ARTEX目前會產生大量、較容易辨識的活動。</p><aside>編輯觀察：此案的風險重點不是新漏洞本身，而是既有工具被自動化整合後，攻擊流程加速、人工介入減少。防守方需同時考量偵測速度與隔離能力，而不能只依賴固定的攻擊識別特徵。</aside><p><a href="https://the-decoder.com/microsoft-details-how-state-backed-hackers-use-the-artex-ai-framework-to-automate-cyberattacks/">The Decoder</a></p><ul></ul></article><article><h2>X新增青少年家長監護功能，保留私訊與搜尋紀錄隱私</h2><p>X新增青少年帳號的家長監護功能，讓家長與監護人設定使用時間、內容範圍及互動對象。公司表示，13至17歲使用者的帳號將預設採用保護模式，不顯示敏感內容，也不投放定向廣告；青少年仍保有帳號控制權，並可查看帳號受到哪些限制。

家長可查看孩子每週使用X的時間、設定每日使用上限，並要求新增追蹤者須經核准。內容管理選項包括將動態推薦與影片限制為已追蹤帳號、過濾特定字詞，以及關閉敏感媒體內容。家長也能指定哪些人可以傳送私訊給孩子，並查看孩子正在與誰傳訊。

不過，查看通訊對象不等於閱讀通訊內容。依X公布的功能設計，家長無法讀取青少年的私訊，也不能查看搜尋或瀏覽紀錄，或以孩子的身分發文。這套設計在擴大家長管理權限的同時，仍為青少年保留部分使用隱私；其實際保護效果則不能僅憑功能公布就下定論。</p><aside>編輯觀察：家長能管理使用時間與互動範圍，但不能讀取私訊。區分這兩種權限，有助家庭理解監護工具的用途與隱私界線。</aside><p><a href="https://techcrunch.com/2026/11/26/x-finally-gets-parental-controls-after-20-years/">TechCrunch</a></p><ul></ul></article><article><h2>Z.AI與Moonshot AI旗艦模型傳延後，另尋訓練資料與歐洲算力</h2><p>中國AI業者Z.AI與Moonshot AI的新一代旗艦模型傳出可能延後推出。消息人士指出，Z.AI原訂11月推出、約有3兆參數的GLM-5.5，可能延至2027年第一季；Moonshot AI若無法取得境外算力，開發週期可能從6個月拉長至12個月，使Kimi K4延至2027年年中。

在旗艦模型進度出現變數之際，Z.AI已先推出7500億參數的GLM-5.4作為銜接。公司宣稱，新設計讓這款模型能與2兆至3兆參數的系統競爭；這是業者對自家產品的說法，不能直接視為已獲獨立驗證的效能結論。

訓練資料與算力取得也出現調整。報導指出，OpenAI與Anthropic阻擋用於模型蒸餾的資料擷取後，Moonshot正轉向Google與Meta的最新模型取得訓練資料，並加強尋找歐洲的運算資源。上述開發週期與發布時間仍屬消息人士預估，不能視為已確定的推出日期。</p><aside>編輯觀察：這起進度變化涉及訓練資料與運算資源兩個環節。觀察重點不只是發布日期是否延後，也包括替代資料與算力能否支撐後續開發；目前證據尚不足以判定結果。</aside><p><a href="https://the-decoder.com/after-openai-and-anthropic-shut-the-door-on-their-data-a-chinese-ai-developer-is-turning-to-google-and-meta-instead/">The Decoder</a></p><ul></ul></article><article><h2>OpenAI修正計費折扣錯誤，Astra與Sol用戶將更快達使用上限</h2><p>OpenAI修正GPT-6.2推出期間的計費折扣錯誤後，使用Astra與Sol的用戶將比前一週更快觸及使用上限。OpenAI Codex工程師Thibault Sottiaux表示，先前錯誤讓多數用戶取得不正確的折扣；修正後，Astra觸及上限的速度將加快40%，Sol則加快25%。

依Sottiaux的說明，修正後的配額仍應比使用GPT-6 Astra與GPT-6.1 Sol時更耐用，其他模型則未受這次錯誤影響。OpenAI也不會追溯收取先前的差額。這次變化涉及折扣計算與配額消耗，不能直接解讀為模型效能下降，或所有訂閱方案一律漲價。

補償方面，Go、Plus、Pro及Business訂閱用戶將額外獲得一次可保留的配額重設機會；Business用戶另可免費使用Fast Mode至年底。對付費用戶而言，最直接的變化是相較前一週更快用盡配額，而非被追討先前因錯誤折扣產生的費用。</p><aside>編輯觀察：判讀這次調整時，須區分觸及配額上限的速度、訂閱價格與模型能力，避免將計費修正誤認為全面漲價或效能變動。</aside><p><a href="https://the-decoder.com/gpt-6-2-astra-users-now-hit-limits-40-faster-after-openai-patched-a-pricing-error/">The Decoder</a></p><ul></ul></article><article><h2>泥炭地排水改變碳排放　新研究追溯土地利用的氣候影響</h2><p>泥炭地被排水、轉作農業或其他用途後，原本儲存在土壤中的碳會如何影響氣候？由MIT的Jevan Yu帶領的新研究，運用泥炭地氣體排放資料建立全球模型，追溯歷史排水造成的水位變化，分析二氧化碳與甲烷排放如何隨之改變。

研究人員指出，全球泥炭儲存約6,000億噸碳，比全球活體植被含有的碳還多。這類環境長期積水，水中氧氣很快耗盡，有機物主要由分解速度較慢、且無法完全分解有機物的厭氧細菌處理，因此大量碳得以留存在泥炭中，但仍有部分以甲烷形式逸散。

排水會改變這個平衡。開挖溝渠使水位下降後，暴露的泥炭接觸氧氣，好氧細菌活動增加；甲烷排放雖然減少，二氧化碳排放卻大幅增加。研究團隊利用近期排放量測研究建立模型，再結合歷史水位重建資料，從1800年起模擬這些變化。兩種氣體對水位下降的反應並不相同，二氧化碳的反應也存在地區差異。

研究另將模型推算至2100年，顯示即使水位維持在2020年的狀態，過去排水所啟動的碳釋放仍會持續，氣候影響可能進一步擴大。依研究的情境分析，恢復部分泥炭地水位可減緩影響增加的速度，更積極的復育則可能使影響略低於2020年水準；這些是模型條件下的推估，而非已經發生的復育成果。</p><aside>編輯觀察：這項研究凸顯，評估土地利用的氣候影響，不能只看排水當下，也須考慮泥炭後續持續分解，以及二氧化碳與甲烷排放的不同變化。</aside><p><a href="https://arstechnica.com/science/2026/11/draining-peatlands-is-responsible-for-a-few-percent-of-our-global-warming/">Ars Technica</a></p><ul></ul></article><article><h2>台股27日早盤漲逾200點後回到平盤震盪　衛星題材股走強</h2><p>台股11月27日開高，早盤一度上漲逾200點，隨後回到平盤附近震盪。台積電上漲15元至2,160元，台達電、鴻海與聯發科則在平盤或小跌之間，權值股走勢並未同步向上。

個股表現方面，國巨一度勁揚逾4%後壓回，衛星題材股則相對強勢，華通、萬泰科、萊德光電漲停，燿華、元晶、兆赫、穩懋及昇達科等也上揚。這些均為早盤行情，並非當日收盤結果。

前一交易日，市場對美國301調查關稅的疑慮緩解，台股26日上漲956.38點，收在39,151.81點，成交值為新台幣8,174.67億元。不過，法人操作方向分歧：外資及陸資賣超491.81億元、連續第9個交易日賣超；自營商買超128.65億元，終止連8賣，投信則買超230.51億元、連3買。

美股因感恩節休市，台指期盤後指數收平盤39,492點，台積電期貨上漲9元至2,168元。盤前投顧分析認為，台股若要由區間整理轉為緩步墊高，仍須觀察法人調節力道是否趨緩，以及權值股能否回穩；法人也提醒，假期前賣壓與選舉不確定性可能使盤勢震盪。</p><aside>編輯觀察：前一日指數大漲與外資持續賣超同時存在，27日早盤又出現權值股與題材股表現分歧，不能僅憑開盤漲幅判定整體買盤已全面轉強。</aside><p><a href="https://www.cna.com.tw/news/afe/202611270029.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611270018.aspx">中央社財經</a></li></ul></article><article><h2>台北市長選前活動分流　沈伯洋改採直播、蔣萬安規劃凱道造勢</h2><p>台北市長選戰進入最後階段，兩名候選人的11月27日選前活動採取不同安排。民進黨候選人沈伯洋取消原訂仁愛路的實體晚會，改為白天走訪台北各處與市民聊天、晚間線上直播；尋求連任的台北市長蔣萬安則預定在凱達格蘭大道舉辦造勢活動，晚間7時開始。

沈伯洋團隊原規劃在仁愛路4段、靠近國父紀念館一側舉辦選前之夜，考量交通影響等因素，決定拆除已架設的舞台設備。沈伯洋26日晚間與前總統蔡英文直播時宣布，27日將在不同時間出現在台北各處，相關資訊另以圖卡公布；晚間活動改為直播，也規劃提供民眾登記揪團觀看地點的系統。

蔣萬安競選辦公室公布，凱道活動晚間6時開放入場，預定由立法院長韓國瑜、新北市長侯友宜、前台北市長郝龍斌等人助講，蔣萬安於晚間9時20分進場，發表約15分鐘演講。競辦將活動命名為「勝選之夜」，這是選前活動名稱，並非選舉結果。警方表示，配合活動，自26日晚間10時起至28日上午實施交通疏導管制。

沈伯洋也在26日公布競選影片「講下去，台北才會更好」，由楊力州執導、吳念真聲音演出，沈伯洋女兒小麻糬獻聲。競辦影片以掃街、傾聽市民與互動為敘事主軸，屬陣營呈現候選人形象的競選內容。

在26日的直播對談中，蔡英文以「雞婆」形容沈伯洋，認為他願意幫助別人的性格適合擔任市長。沈伯洋則在直播最後宣稱，最高有27萬人同時收看。這項收視數字來自候選人公布，不能直接視為支持度或投票結果。</p><aside>編輯觀察：兩方活動安排直接影響市民參與方式與周邊交通；現場造勢、線上收視及競選影片各有不同功能，不宜將活動聲量等同選情判斷。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611260295.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611260319.aspx">中央社政治</a></li><li><a href="https://www.cna.com.tw/news/aipl/202611260287.aspx">中央社政治</a></li><li><a href="https://www.cna.com.tw/news/aipl/202611260286.aspx">中央社政治</a></li></ul></article><article><h2>新北選戰衝刺：朱立倫、侯友宜接力助李四川　蘇巧慧車掃提建設主張</h2><p>新北市長選戰進入最後掃街階段，國民黨候選人李四川11月26日由前市長朱立倫、市長侯友宜接力陪同拜票；民進黨候選人蘇巧慧則從淡水出發，下午前往三重、蘆洲，以全天車隊掃街爭取支持。

朱立倫下午陪同李四川行經鶯歌、三峽、土城及板橋，由各選區國民黨籍市議員候選人接力參與；侯友宜晚間則與立委林德福、新北市議會副議長陳鴻源，陪同李四川走訪永和樂華夜市。李四川以市政延續為訴求，表示捷運三鶯線、新北市美術館及新北市立土城醫院，是從朱立倫到侯友宜一棒接一棒完成的建設，承諾未來在此基礎上接棒。

蘇巧慧在三重、蘆洲與立委林淑芬、李坤城及多名市議員共同車掃。她表示，位於三重的新北市第二行政中心即將啟用，未來將透過「三重2.0」計畫，加速推動三重聯醫第三醫療大樓、銀新未來城、市立圖書館第二總館及三重第二運動中心等建設；另承諾加速蘆洲南北側都市計畫，並重申反對三重果菜市場遷往蘆洲。

蘇巧慧也預告，11月27日上午將由高雄市長陳其邁陪同，前往板橋接雲寺參香及車掃；當晚選前之夜則預定由總統賴清德、前總統蔡英文到場助選。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260303.aspx">中央社政治</a></p><ul></ul></article><article><h2>賴清德赴中壢挺黃世杰　桃園建設與產業布局成造勢訴求</h2><p>民進黨桃園市長候選人黃世杰11月26日晚間在中壢舉辦「南桃園大團杰造勢晚會」，總統兼民進黨主席賴清德到場助選，主張由黃世杰為桃園尋找新的發展動力。黃世杰則提出產業、交通與居住政策，並批評現任市長張善政任內的投資推動情況。

賴清德將地方治理能力作為助選主軸，認為張善政的專長在中央事務與決策，地方首長則須處理民眾日常面對的問題；他批評桃園過去4年建設推展不順、不符期待，並稱黃世杰獲提名後全力投入、走遍各行政區，呼籲支持者出門投票。內政部長劉世芳、民進黨前主席許信良等人也出席晚會。

黃世杰在會中指控，張善政讓台積電一度放棄進駐龍科三期，延宕桃園發展；他也將美光投資疑慮及群聯放棄在桃園設置研發據點的計畫，列為批評現任市政的事例。上述企業投資變化及其與市政之間的因果關係，均屬黃世杰在競選場合提出的說法。

政策方面，黃世杰表示，要以高科技業與未來趨勢帶動桃園產業布局，並改善大眾運輸、推動社會住宅及婚育宅。他列出的施政方向還包括特色公園、寵物照顧、運動發展、藝文展演、特色醫療與醫護安居。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260305.aspx">中央社政治</a></p><ul></ul></article><article><h2>黃國昌、鄭麗文同台挺張啓楷　王美惠規劃嘉義市選前車隊活動</h2><p>嘉義市長選戰進入最後衝刺，民眾黨候選人張啓楷11月26日晚間在中央廣場舉辦造勢大會，民眾黨主席黃國昌與國民黨主席鄭麗文共同站台。民進黨候選人王美惠同日持續與同黨市議員候選人車隊掃街，並邀市民參與隔天的選前之夜活動。

張啓楷的造勢晚會另有嘉義市長黃敏惠、前內政部長李鴻源、資深媒體人趙少康，以及民眾黨、國民黨立法院黨團部分立委和市議員候選人出席。黃國昌肯定黃敏惠任內的經濟與市政表現，主張由張啓楷接棒延續；鄭麗文則以藍白合作為訴求，呼籲支持者催票、拉票。兩人的助講都將市政延續列為支持張啓楷的理由。

王美惠則以車隊穿梭嘉義市街道，向沿途民眾拜票。她透過新聞稿表示，連日掃街感受到鄉親的熱情與鼓勵；競選團隊也將車掃畫面剪輯成影片，發布於網路社群平台。

依王美惠競選團隊規劃，11月27日選前之夜將於晚間6時30分從公明路競選總部前出發，以車隊繞行嘉義市區，最後抵達中山路中央噴水池圓環北側，邀請民眾一同參與。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260308.aspx">中央社政治</a></p><ul></ul></article><article><h2>花蓮縣長選戰掃街密集　游淑貞、魏嘉賢27日晚間路線重疊</h2><p>花蓮縣長選戰進入密集掃街階段，無黨籍候選人張峻11月26日在花蓮市區舉行遊行，行政院政務委員季連成、和碩集團董事長童子賢陪同。國民黨候選人游淑貞與無黨籍候選人魏嘉賢則預告，27日晚間都將在市區金三角一帶遊行，部分路線重疊。

張峻陣營規劃連續兩晚活動，26日從石來運轉集結，步行至和平路後折返福町路、重慶路口；27日晚間預計從競選總部出發，在吉安鄉掃街。張峻表示，金三角商圈多間店面出租，希望推動花蓮經濟與觀光復甦。季連成表示，特別請假兩天支持張峻，希望翻轉花蓮政治生態。

游淑貞26日由立法院國民黨團總召傅崐萁、花蓮縣長徐榛蔚陪同，前往豐濱鄉及吉安鄉車隊掃街。她的陣營預告，27日晚間6時將從東大門夜市前的六期重劃區出發，繞行中山、中正及中華路，並以「拒絕污染性光電、拒絕黑金」作為活動訴求。

魏嘉賢26日在前衛生局長朱家祥陪同下，走訪光復、萬榮、壽豐、鳳林及吉安。27日晚間將與爭取花蓮市長連任的胞弟魏嘉彥共同掃街，預定6時30分從東大門夜市前福町路出發，行經路段與游淑貞陣營部分重疊。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260294.aspx">中央社政治</a></p><ul></ul></article><article><h2>鄭麗文、黃國昌同台助選謝龍介　主打烏山頭水庫光電議題</h2><p>國民黨台南市長候選人謝龍介11月26日晚間在競選總部前舉行「選前之夜」，國民黨主席鄭麗文、民眾黨主席黃國昌到場助選，以跨黨同台營造合作氣勢，並將烏山頭水庫光電案列為主要攻防議題。

前立法院長王金平、前立委趙少康等人也出席並陸續發言。鄭麗文將烏山頭與翡翠水庫相提並論，表示台北市長蔣萬安阻擋中央在翡翠水庫設置光電板，行政院長卓榮泰也保證不會設置，並據此質疑兩座水庫的政策處理方式為何不同。

鄭麗文進一步將討論延伸至核能與供電政策，宣稱核三廠發電量相當於1,000座烏山頭水庫的光電發電量，並質疑現行能源安排能否解決她所稱的缺電問題。這項發電量比較與供電判斷，均為她在助選場合提出的說法。

黃國昌則表示，烏山頭水庫第一期光電板鋪設後，政府於2023年核准第二期籌設許可；他並主張，若非在野黨立委揭露並阻擋，第二期光電板已經鋪設。黃國昌以此呼籲選民，透過投票選擇台南未來的生活與施政方向。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260291.aspx">中央社政治</a></p><ul></ul></article><article><h2>沈伯洋告傅崐萁名譽求償一審敗訴　稱已上訴、雙方對判決解讀分歧</h2><p>民進黨台北市長候選人沈伯洋因國民黨立委傅崐萁指控他收受索羅斯旗下資金，提起名譽損害訴訟、求償新台幣100萬元，台北法院一審判沈伯洋敗訴、傅崐萁免賠。沈伯洋11月26日表示，案件已上訴至第二審；雙方同日對一審判決理由提出不同解讀。

沈伯洋在聯訪時表示，法官認定他確有研究及申請經費，但傅崐萁延伸指稱他拿錢是為了顛覆國家，法官認為說法過於離譜，一般人不會相信。沈伯洋不同意這項判斷，認為社會上仍有不少人相信相關說法，並稱謠言已流傳3年。

傅崐萁則在國民黨花蓮縣黨部記者會反駁，主張判決認定其資金相關指控屬實且經過查證，他是在具體事實上作延伸評論，而不是因為「沒有人相信」才獲判免賠。他並要求沈伯洋說明資金流向、用途及成果。

這起訴訟目前可確認的進展，是一審求償未獲支持，以及沈伯洋表示已提起上訴。至於法院如何區分資金相關陳述、延伸評論與名譽損害，雙方說法存在歧異，不能將任何一方的解讀直接視為法院判決理由的完整結論。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260283.aspx">中央社政治</a></p><ul></ul></article></main></noscript>
