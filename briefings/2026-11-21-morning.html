  <noscript><main><h1>人工智慧代理與雲端工具更新，科技產業面臨資安與資金考驗</h1><p>2026-11-21 科技早報</p><article><h2>Gemini Mac版加入Computer Use，可在背景跨應用程式執行任務</h2><p>Google為Gemini Mac應用程式加入Computer Use功能，讓使用者以自然語言描述目標後，由人工智慧跨本機檔案、桌面應用程式與網站執行多步驟工作。這項功能於11月20日起在美國以英語推出。

依Google公布的設計，Gemini可透過螢幕截圖辨識畫面，並進行點擊、輸入、捲動與選單操作。任務在獨立的背景視窗執行，聊天介面則提供即時預覽，不占用使用者正在操作的螢幕與游標，讓人能繼續使用Mac處理其他工作。

授權範圍仍由使用者決定：Gemini只能存取獲准使用的應用程式，使用者可觀看執行過程、隨時暫停，關鍵操作也須事先確認。這些控制機制是功能設計的一部分，並不代表所有任務都能無人介入完成。

Google列出的使用示例，包括整理本機資料夾內的衣物照片、查詢價格、記錄商品資訊，再準備eBay上架內容；也包括填寫本機PDF寄件表單、製作簡報，以及將鉛筆草圖轉成3D模型。這些是公司展示的應用情境，不能視為各類工作均已獲得相同成果或效率保證。</p><aside>編輯觀察：這次更新將Gemini的用途從回答問題延伸到實際操作桌面工作。評估價值時，除了能否完成任務，也應關注授權是否清楚、執行過程是否可見，以及使用者能否及時中止操作。</aside><p><a href="https://www.engadget.com/2322728/google-boosts-geminis-ability-to-do-repetitive-tasks-on-its-mac-app/">Engadget</a></p><ul><li><a href="https://the-decoder.com/googles-gemini-can-now-run-mac-apps-and-finish-desktop-chores-in-the-background-while-you-keep-working/">The Decoder</a></li></ul></article><article><h2>Google桌面搜尋首頁改版：移除搜尋按鈕，新增AI入口與對話側欄</h2><p>Google開始推出新版桌面搜尋首頁，在搜尋欄下方加入圖片生成、檔案分析及與Gemini腦力激盪等人工智慧功能入口，並移除原有的獨立搜尋按鈕。「好手氣」按鈕仍保留，使用者也仍可透過Enter鍵送出搜尋，並非取消傳統搜尋功能。

另一項變化是將近期AI Mode對話帶到首頁。登入Google帳號後，使用者可在左側展開側欄，重新開啟先前的人工智慧搜尋對話；這個側欄也會出現在搜尋結果頁。Google正向全球推出這項介面更新，讓搜尋不只從新問題開始，也能接續既有研究脈絡。

Google搜尋副總裁Robby Stein表示，使用者愈來愈常提出單次查詢無法回答的問題，側欄在測試中有助於接續先前進度、繼續查找資料。這是Google對測試成效的描述，不能據此認定所有使用者的搜尋效率都會提升。

Google也在全球推出AI Mode臨時對話。依Stein說明，這類搜尋不使用先前對話脈絡、不存入歷史紀錄，也不影響未來推薦，關閉後便會消失。新版首頁因此同時提供兩種使用方式：保留對話以便持續查找，或以臨時對話處理不希望延續脈絡的查詢。</p><aside>編輯觀察：改版的重點不只是少了一個按鈕，而是人工智慧工具與對話紀錄取得更醒目的位置。不過，介面優先順序的改變，仍不等於傳統搜尋已被移除。</aside><p><a href="https://arstechnica.com/ai/2026/11/googles-latest-search-page-redesign-drops-the-search-button-adds-ai-sidebar/">Ars Technica</a></p><ul><li><a href="https://the-decoder.com/googles-latest-homepage-update-pushes-its-search-engine-further-toward-an-ai-answer-engine/">The Decoder</a></li></ul></article><article><h2>Signal加強阻擋AI讀取聊天畫面，通知與macOS防護仍有缺口</h2><p>Signal針對人工智慧助理讀取聊天畫面加強防護，在iOS 27預設封鎖螢幕截圖，並在支援的Android版本上，於AI助理嘗試存取畫面時啟動保護。Signal警告，即使訊息採端對端加密，解密後顯示在螢幕上的內容，仍可能被助理擷取並送往外部處理。

兩個平台採取的方式不同：iPhone新增預設開啟的「Block Siri AI」設定；Android則利用既有的「Screen security」選項。當系統偵測到截圖或AI助理讀取畫面時，Signal會顯示可關閉防護的提示，使用者仍能選擇放行。

Signal的疑慮也涵蓋第三方代理程式。報導指出，Meta的Muse曾透過設定時取得的權限，讀取Android通知中的Signal訊息，並在macOS使用輔助使用等權限取得內容。Meta則表示，相關存取只在使用者明確授權後才會發生。

不過，封鎖畫面擷取並不能涵蓋所有管道。第三方代理仍可能讀取通知或檔案，macOS上的截圖也無法可靠阻擋；即使自己開啟保護，只要對話另一端關閉防護，訊息仍可能在對方裝置上被AI讀取。Signal先前已阻擋Windows上的Recall擷取聊天畫面，但承認整體防線仍不完整。

Signal希望作業系統提供標準機制，讓應用程式能阻止AI代理存取內容，而不必大幅犧牲原有使用體驗。公司表示正與Apple及Google討論。這次調整處理的是訊息解密後的存取風險，不是端對端加密本身遭到破解。</p><aside>編輯觀察：端對端加密與裝置上的內容存取是不同層次的防護。當AI能透過畫面、通知或輔助使用權限讀取訊息，隱私便不只取決於自己的設定，也受對話對象的授權選擇影響。</aside><p><a href="https://www.engadget.com/2323574/signal-now-blocks-screenshots-by-default-to-stymie-ai-agents/">Engadget</a></p><ul><li><a href="https://the-decoder.com/signal-blocks-screenshots-on-ios-27-and-android-to-stop-ai-agents-from-reading-private-chats/">The Decoder</a></li></ul></article><article><h2>Apple布局裝置操作代理，第三方取得Mac控制權步驟增至14項</h2><p>Apple正投入可操作裝置的人工智慧代理開發，同時提高第三方代理取得Mac控制權的操作門檻。The Decoder報導，Apple的徵才資訊顯示，公司正在招募資深工程師領導相關專案，加入Meta、OpenAI、Anthropic與Google等業者已投入的代理競爭。

這項代理仍處於開發早期，報導提及最快可能在2027年底推出，但並非已確定的發布時程。隱私預期將是開發重點，涉及權限模型與沙盒機制；目前資訊尚不足以判斷最終產品的功能範圍與使用方式。

另一方面，macOS 27.3已將使用者授權ChatGPT等第三方代理控制Mac的流程，從4個步驟增加至14個。Apple表示，這項變更是為了保護使用者；部分人工智慧公司與使用者則認為，此舉意在拖慢競爭對手。代理產品尚未推出，平台對外部代理設定的授權流程，已先成為競爭爭點。</p><aside>編輯觀察：裝置代理的競爭不只取決於功能，也涉及平台如何設定控制權與授權流程。操作步驟增加是具體變化，但僅憑目前資料，仍不能判定其對安全或市場競爭的實際效果。</aside><p><a href="https://the-decoder.com/apple-joins-the-race-for-ai-agents-that-control-your-device-while-raising-new-barriers-for-competitors/">The Decoder</a></p><ul></ul></article><article><h2>ChatGPT Space擴大開放Plus訂戶，Dot代理仍限少數測試</h2><p>OpenAI將ChatGPT Space協作空間擴大提供給每月20美元的Plus訂戶，使用者自11月20日起可建立自己的Space。這項功能於9月的Dev Day活動亮相，最初提供給Pro、Business與Enterprise方案，這次將協作空間的使用範圍延伸至Plus。

使用者可從左側導覽列的Space入口建立空間，選擇範本，或加入頁面、簡報、試算表、圖片與網站連結，並邀請其他人共同處理專案。Space也能搭配ChatGPT更新後的Scheduled Tasks排程工作功能。OpenAI表示，其中的Pages文件適合用於寫作、視覺化、研究與程式開發，也可透過已連結的工具自動更新內容。

不過，開放Space並不等於同步開放Dot代理。一般Plus訂戶目前仍不能在Space或其他地方使用Dot；OpenAI是在11月19日才開始讓少數Plus訂戶測試代理。協作空間的擴大提供與代理的小規模測試，是兩個不同的開放階段，目前沒有足以確認Dot全面開放時間的資訊。</p><aside>編輯觀察：Plus訂戶新增的是多人協作與資料整理空間，並非完整的代理使用權。區分兩者，有助於避免把方案功能擴充誤認為Dot已全面上線。</aside><p><a href="https://www.engadget.com/2323016/openai-brings-its-collaborative-space-hubs-to-plus-users/">Engadget</a></p><ul></ul></article><article><h2>OpenAI強化模型內部推理防護，稱既有請求擷取攻擊成功率降至0.2%</h2><p>OpenAI強化GPT-6.2 Astra與GPT-6.2 Sol的防護，降低攻擊者擷取受保護內部推理內容的機會。依公司公布的內部自動化測試，針對先前請求擷取推理內容的攻擊，成功率從GPT-6 Astra的54.0%，降至GPT-6.2 Astra的0.2%；針對進行中請求的攻擊，成功率則從22.9%降至0.9%。

防護措施分為單次請求與協同攻擊兩個層次。針對單次請求，OpenAI結合特定訓練、訊息與工具呼叫的輸入及輸出過濾，並透過API限制，阻止較舊模型讀取受保護的推理內容。公司也正將部分改善措施導入GPT-6 Astra。

對於協同進行的攻擊活動，OpenAI表示，每週會封鎖數千至數萬個帳號。這些措施顯示，防護不只涵蓋模型回應，也包括介面存取與帳號處置。不過，攻擊成功率下降是公司內部測試的結果，不能據此認定所有推理擷取方式均已受到有效阻擋。</p><aside>編輯觀察：這次公布的指標針對內部推理內容遭擷取的風險，不是模型整體安全性的總分。評估防護效果時，仍須區分攻擊類型、測試條件與實際部署情境。</aside><p><a href="https://the-decoder.com/openai-makes-it-much-harder-for-attackers-to-extract-how-its-latest-ai-models-think/">The Decoder</a></p><ul></ul></article><article><h2>近200萬則提示詞追蹤實驗，揭人工智慧轉售鏈資料外洩風險</h2><p>研究者將可追蹤的數位誘餌放入近200萬則人工智慧提示詞，觀察資料經過服務供應鏈後是否遭到取用。資安公司Dragos研究主管HD Moore表示，實驗發現至少三家供應商遭入侵的跡象，也觀察到轉售商留存提示詞、憑證遭他人使用，以及部分服務未遵守零資料保留等隱私設定的情況。

這項測試使用AWS存取金鑰、連結空白帳號的有效憑證、SSH密碼，以及獨特網址、網域名稱與私人程式碼儲存庫參照。每項誘餌先前都未使用過，而且只放進一則送往單一供應商的提示詞；接收後續連線的基礎設施也由Moore掌控，藉此追查哪些服務環節可能讓資料流出。

風險涉及人工智慧服務背後的多層轉交機制。應用程式可透過路由服務，依價格或任務需求挑選推論供應商，請求也可能再經其他路由或代管業者處理。提示詞即使在傳輸途中加密，仍會在各處理節點解密，讓中間業者接觸明文內容；使用者面對的因此不只是最終模型，而是一整條資料處理鏈。

Moore指出，其中一家遭入侵供應商收到的部分請求，在模型執行前便遭供應商拒絕，但其中的金鑰仍遭竊取。他據此判斷，攻擊者是在供應商入口複製請求，而非在推論流程更深處取得內容。其他案例則包含標記零資料保留的請求。他也透過同一模型、不同轉售商的交叉測試，辨識憑證遭使用與特定轉售路徑的關聯。這些是研究者對追蹤結果的判讀，不能視為對所有人工智慧服務的普遍結論。

對無法自行架設模型的使用者，Moore建議直接向第一層供應商取得服務，並自行選擇上游業者，而非接受預設轉售商組合。他同時提醒，縮短供應鏈只能降低風險，並不保證資料絕不外洩。</p><aside>編輯觀察：評估人工智慧服務的隱私風險，不能只看模型品牌或傳輸加密，也須釐清提示詞經過哪些業者、各方能否接觸明文，以及保留政策如何落實。</aside><p><a href="https://arstechnica.com/security/2026/11/a-leaky-ai-supply-chain-is-exposing-secret-user-data-at-an-alarming-rate/">Ars Technica</a></p><ul></ul></article><article><h2>Tigerfish雲端儲存未設存取保護，客戶逐字稿與原始影音暴露</h2><p>逐字稿服務商Tigerfish的雲端儲存空間曾開放外界直接存取，暴露客戶逐字稿、原始影音與發票。公司已在接獲TechCrunch聯繫後封鎖公開存取，但是否已通知受影響客戶，仍不清楚。

發現問題的資安研究者Anurag Sen指出，檔案存放在Amazon代管的S3雲端儲存空間，外界可透過容易猜到的網址列出內容，讀取時也不需要密碼。暴露資料包含警方訪談逐字稿、隨身攝影機影像，以及客戶提供的原始音訊和影片；發票涉及的客戶則包括警察機關與檢察機關。

Sen在10月發現資料暴露後曾通知Tigerfish，但未收到回覆，之後將細節交給TechCrunch，協助促成修復。TechCrunch表示，已核對外洩來源與資料並聯絡公司。Tigerfish總裁Adam Goldberg回覆，已封鎖該儲存空間的所有公開存取，包括目錄清單與個別檔案，並稱已確認其他S3儲存空間也不允許公開存取。

Tigerfish表示，Sen最初的通報郵件被垃圾郵件過濾器攔下，公司仍持續檢視及強化儲存安全。對客戶通知情況的後續詢問，公司未再回覆。現有資訊確認的是資料曾可由網路公開取得，尚不能據此判定是否有其他人下載、散布或濫用這些檔案。</p><aside>編輯觀察：這起事件的關鍵是雲端存取控制失守，而非已證實的入侵手法。封鎖公開存取處理了暴露入口，但客戶通知與暴露期間的存取情況，仍是評估後續影響的重要缺口。</aside><p><a href="https://techcrunch.com/2026/11/20/a-transcription-firm-used-by-police-prosecutors-and-tech-giants-exposed-customer-data-online/">TechCrunch</a></p><ul></ul></article><article><h2>路由器故障引發美國全國停飛，FAA根本原因調查待公布</h2><p>美國航空通訊網路的路由器故障引發全國性暫停起飛後，政府預告將公布根本原因。FAA局長Bryan Bedford表示，調查人員已接近釐清問題，運輸部長Sean Duffy計畫最快於11月20日說明結果；截至報導發布時，調查結論仍未公布。

11月13日的暫停起飛措施持續超過四小時，影響逾百萬名旅客，當天超過1萬2,000架次航班取消。FAA在11月15日的說明中指出，其電信基礎設施網路當時每四至五秒湧入1,000次連線嘗試。這套網路負責傳遞重要飛航資料，以及航管中心使用的語音與視訊通訊。

大量連線造成全美22座航路交通管制中心中的17座出現飛機通訊與雷達資料不穩，部分終端雷達進場管制設施也受影響。FAA初步調查將過量資料來源指向德州Amarillo的雷達站，以及阿肯色州El Dorado的無線電通訊站；網路服務商L3Harris當時正在後者安裝新路由器，近期也曾在德州站點安裝類似設備。

El Dorado的工程原本要以Juniper Networks設備替換使用25年的Cisco路由器。事件發生後，FAA暫停安裝新路由器，關閉已裝設的設備並改回舊機。代表FAA技術人員的PASS工會則表示，所屬技術人員未參與這次升級；這是工會對作業流程的說法，不能取代尚待公布的技術調查。

曾任FAA技術人員的顧問Philip Mann接受Ars Technica訪問時認為，網路升級應依連線拓樸評估故障可能擴及的範圍，並安排低流量時段施工與復原準備。他也明言，尚不清楚這次是否涉及設定錯誤或測試不足。現有資料說明了網路異常與設備更換的時序，尚不足以確定完整故障機制，更不能直接認定為網路攻擊。</p><aside>編輯觀察：關鍵基礎設施汰換設備時，風險不只取決於單一站點的大小，也取決於它在網路中的連結範圍。後續調查須釐清故障機制與升級監督流程，才能判斷哪些改善措施真正對症。</aside><p><a href="https://arstechnica.com/gadgets/2026/11/how-faa-can-modernize-us-national-airspace-system-without-emergency-ground-stops/">Ars Technica</a></p><ul></ul></article><article><h2>FCC准許州與地方監所干擾手機訊號，CTIA警告恐波及緊急通話</h2><p>美國聯邦通訊委員會（FCC）表決通過，准許州與地方監所使用干擾技術，阻斷違禁手機通訊。FCC主席Brendan Carr主張，技術已能精準控制地理範圍；無線通訊產業團體CTIA則提出測試結果，指干擾設備不但可能阻斷監所外的合法通訊，對目標手機的封鎖也有缺口。

CTIA表示，與Virginia Tech Applied Research Corporation及南卡羅來納州矯正部門合作的試驗，即使限制微型干擾器的數量、頻段與功率，仍阻斷911緊急通話、干擾公共安全等通訊，並影響最遠達2.5英里外的無線網路基礎設施。同一試驗在戶外受刑人活動區測試時，目標手機仍有二分之一至三分之二的撥號嘗試成功接通。

Carr表示，監所並非必須採用這項技術；有意部署者須向FCC申請、說明配置方式，並透過測試證明干擾侷限於指定區域，不影響圍牆外的合法通訊。附近社區也須在設備啟用前獲得通知。這次決議為州與地方矯正設施開出例外，改變FCC先前禁止非聯邦機構在監所使用干擾技術的解釋。

FCC委員Anna Gomez在加入防護措施後支持准許部署，但仍警告干擾設備可能影響消防、警察與緊急醫療通訊。AT&amp;T也反對主管機關對技術能力的判斷，認為干擾器無法區分同一受影響頻段上的違禁裝置與合法裝置。主管機關要求的地理隔離，能否在實際部署中成立，仍是雙方爭議核心。</p><aside>編輯觀察：封鎖違禁手機與保護周邊合法通訊，是必須同時達成的技術要求；不能只以干擾設備已獲准使用，就認定其精準度與公共安全風險已獲解決。</aside><p><a href="https://arstechnica.com/tech-policy/2026/11/prisons-get-ok-to-jam-contraband-phones-ctia-says-nearby-phones-will-be-jammed-too/">Ars Technica</a></p><ul></ul></article><article><h2>AWS推出HyperPod跨區推論閘道，以單一端點分派多叢集請求</h2><p>AWS推出SageMaker HyperPod Global Inference Gateway，讓使用者透過單一受管端點，將模型推論請求分派至同一區域或不同區域的已登錄叢集。依官方說明，新閘道負責選擇叢集，既有Inference Gateway則繼續處理叢集內的模型Pod路由，形成兩層分派架構。

這項更新針對多叢集部署的容量分散問題：部分叢集可能已經塞車，其他叢集的GPU卻仍有餘裕。AWS表示，全球閘道會依KV快取剩餘容量、佇列深度、區域鄰近程度與錯誤率評分，將請求送往合適的健康叢集；使用者可調整各項權重。叢集故障時，系統會自動轉移流量，不必修改用戶端設定。

在連線與權限方面，官方說明要求請求使用SigV4簽章，並經IAM授權，之後透過AWS PrivateLink送達叢集。服務會在請求進入叢集前檢查簽章、權限與流量限制。使用者仍須決定哪些叢集開放路由、如何分組，以及如何設定權重；AWS則負責路由服務、私有連線與健康檢查等運作。

AWS宣稱，這種架構可利用既有閒置GPU，並減少自行維護跨區網路與容錯機制的工作，但未提供可獨立核對的效益測量。官方也提醒，跨區承接尖峰流量仍須預留容量；已開放路由卻未加入任何閘道的叢集，即使收不到流量，其負載平衡器仍會持續計費。對只有單一叢集的使用者，AWS建議繼續使用原有叢集端點。</p><aside>編輯觀察：這項更新把流量分派從單一叢集擴展至多叢集與跨區域，但統一入口不等於自動增加算力；可否承接尖峰，仍取決於其他叢集是否保有可用容量。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/introducing-amazon-sagemaker-hyperpod-global-inference-gateway-one-endpoint-across-regions-and-clusters/">AWS Machine Learning</a></p><ul></ul></article><article><h2>HyperPod強化訓練可觀測性，整合GPU異常與網路診斷</h2><p>AWS宣布強化SageMaker HyperPod的基礎設施可觀測性，整合GPU比較、硬體錯誤與網路效能診斷，支援由Amazon EKS及Slurm協調的訓練工作。這次更新著重訓練問題的定位：當效能下降時，協助團隊辨識異常來自哪個工作、節點或加速器。

依官方說明，診斷摘要透過CloudWatch的DetectGroupOutliers介面，比較同一訓練工作內各GPU的使用率、記憶體、溫度、功耗與SM時脈，標示偏離同儕的裝置。另一套靜態規則則辨識已知故障模式，包括GPU的XID與ECC記憶體錯誤、EFA網路吞吐量下降、封包遺失與重傳，以及降頻或過熱等問題。

指標儲存新增以CloudWatch為預設選項，也保留Amazon Managed Service for Prometheus。管理介面則提供硬體、工作負載與網路等檢視，讓團隊追查裝置狀態及訓練資源使用情形。AWS表示，新功能已在提供HyperPod的所有AWS區域推出；至於能縮短多少除錯時間，現有資料未提供可核對的量化結果。</p><aside>編輯觀察：更新重點是把異常裝置比較與已知故障規則放進同一診斷流程，而非只顯示整體使用率。團隊仍須在診斷細度、遙測資料量與儲存費用之間取捨。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/introducing-enhanced-observability-in-amazon-sagemaker-hyperpod-to-diagnose-gpu-training-issues/">AWS Machine Learning</a></p><ul></ul></article><article><h2>Amazon Textract Insights正式開放，以自然語言指定文件擷取欄位</h2><p>AWS宣布正式開放Amazon Textract Insights，讓使用者以自然語言描述要擷取的文件欄位，取得附有信心分數與來源頁面依據的結構化結果。依AWS說明，這項生成式人工智慧功能透過新的API提供，可處理單份文件或混合文件包，不需要另外訓練模型。

使用者先建立以JSON Schema定義的「藍圖」，描述各欄位要找的資訊，並指定內容應直接讀取或根據文件推論。處理混合文件時，可在同一專案加入不同文件類型的藍圖，再從Amazon S3提交最多3,000頁的單一檔案；系統會拆分文件、配對適用藍圖並擷取欄位。

AWS表示，直接讀取與推論產生的欄位，都會附上信心分數、來源頁面及座標，供審查人員回查原件。其建議做法是用企業自身具代表性的文件樣本調整信心門檻，讓符合門檻的值進入自動化流程，其餘交由人工審查。這些追溯資訊提供的是核對途徑，不代表每個答案必然正確。

服務支援PDF、PNG、JPEG及TIFF輸入，可處理英文、法文、德文、義大利文、葡萄牙文與西班牙文文件，採按頁計價而非按詞元計價，沒有最低用量承諾。AWS另宣布Textract Core擴增語言與區域支援，但明確區分：Core新增的東京與蘇黎世區域，目前尚未提供Insights。</p><aside>編輯觀察：文件自動化的關鍵不只是擷取欄位，也在於結果能否回查與分流審核。企業評估時，應分別檢視來源依據是否正確、信心門檻是否適用，以及人工覆核如何接入流程。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/announcing-amazon-textract-insights-verifiable-generative-ai-for-documents/">AWS Machine Learning</a></p><ul></ul></article><article><h2>Standard Bank Group導入人工智慧風險自動評估，核准權仍由委員會掌握</h2><p>Standard Bank Group與AWS Professional Services合作部署生成式人工智慧風險自動評估，將文件蒐集、應用測試及政策比對接入既有核准流程。依雙方共同撰寫的案例說明，系統已在銀行正式環境運作，用於評估上線前的應用；審查與核准責任仍由風險委員會承擔。

流程先由代理掃描程式碼儲存庫與文件，替約40道風險問題預填答案及證據連結，再由開發團隊修正錯誤、補齊資料。接著，系統檢查技術文件、政策、原始碼及系統提示詞，並直接呼叫應用，測試一般問題、越獄嘗試與離題問題，也以重複及改寫提示檢查回答的一致性。

評估採用Amazon Bedrock上的基礎模型作為判斷者，針對特定控制要求回答是或否；納入銀行內部規範後，檢查問題超過300道。結果會轉為風險分數、改善清單、技術報告及儀表板，判斷與證據一併留存。為檢查評估本身的穩定性，流程會重複執行，並將不一致結果標示給審查人員。

對Bending Spoons而言，Mailchimp延續其收購成熟網路服務、長期持有的布局。過去一年，公司也收購了AOL、Eventbrite、Airtable與Miro。報導指出，其既有做法是將收購產品納入集中化的工程與營收系統；Mailchimp後續如何整合，仍須與這筆交易本身分開看待。</p><aside>編輯觀察：這不只是出售一項服務，也是資產配置的調整。評估Intuit實際取得多少現金、又保留何種投資曝險，必須把同步認購買方股權的安排一起計算。</aside><p><a href="https://techcrunch.com/2026/11/20/bending-spoons-buys-mailchimp-for-3-68-billion/">TechCrunch</a></p><ul></ul></article><article><h2>太空資料中心面臨抵押品難題，SpaceX晶片融資傳遭貸方要求限制用途</h2><p>太空資料中心除了工程與運輸挑戰，也面臨晶片融資問題。SpaceX一筆400億美元晶片融資案的貸方，據報曾要求購入的晶片不得用於該公司的軌道資料中心計畫；目前尚不清楚SpaceX是否接受這項條件，不能將其視為已確定的用途限制。

問題在於抵押品能否取回。資料中心業者通常透過借款擴建，再以營收償還貸款，晶片本身則可作為擔保。若借款人違約，貸方可以接收並轉售晶片，這項保障有助降低融資成本；但晶片一旦安裝在軌道上的衛星，貸方就難以沿用地面設備的回收方式。

SpaceX目前也在擴建地面運算設施。報導提到，執行長Elon Musk已調派火箭團隊工程師協助加速建置；另一方面，土地與電力取得仍有不確定性。地面與太空各有成本限制，而此次貸方要求凸顯的是：即使晶片能在太空運作，支撐採購的融資條件也未必能直接搬上軌道。</p><aside>編輯觀察：太空資料中心的成本比較不能只算發射與運作費用，還須考慮資產能否作為有效擔保。抵押品難以回收，可能改變貸方願意提供的條件，但目前資料不足以量化其成本差距。</aside><p><a href="https://techcrunch.com/2026/11/20/chips-can-survive-the-space-environment-can-their-financing/">TechCrunch AI</a></p><ul></ul></article><article><h2>Google將支付逾5億美元採購Quaise地熱電力，超高溫岩層技術推進商業化</h2><p>Google將支付逾5億美元，向Quaise Energy位於美國奧勒岡州中部的地熱計畫取得50百萬瓦電力。Quaise表示已取得Google這個客戶，該計畫將開發地下約3英里深處的熱能，讓超高溫岩層地熱朝商業化再前進一步，但這不代表相關供電能力已經實現。

這類地熱技術鎖定更深、更熱的岩層。當地下溫度與壓力達到足夠高的程度，水會成為能攜帶大量能量的超臨界流體。報導估計，單一超高溫岩層地熱井可能提供15百萬瓦以上的發電能力；這是技術潛力，不是此次計畫已達成的發電成果。

Quaise規劃在鑽至約2.5英里深後，將傳統鑽頭換成由迴旋管驅動的設備，以毫米波作用於岩石。其目標是克服金屬鑽頭在高溫環境下耗損加快的問題，讓深層鑽探更具成本效益，實際經濟性仍待驗證。

另一家業者Mazama Energy則採取不同路線，主張透過冷卻讓傳統鑽頭繼續工作。其新技術Carbon Chill以二氧化碳取代水性鑽井泥漿，利用流體膨脹降溫，並將鑽屑帶回地表。公司執行長表示，二氧化碳冷卻技術使鑽探時間再縮短20%；這項數字屬公司說法。

Google此次採購延續其提早支持潛在能源供應商的策略，公司也曾投資Fervo並成為早期客戶。對資料中心供電而言，長期採購承諾有助推動新技術開發，但能否穩定供電、降低每口井的建置成本，仍是超高溫岩層地熱必須證明的商業化條件。</p><aside>編輯觀察：這筆採購顯示，科技公司正透過提前承諾購電，參與新型能源的商業化。判斷成果時，應區分客戶承諾、鑽探進展與實際供電，不能把三者視為同一個里程碑。</aside><p><a href="https://techcrunch.com/2026/11/20/super-hot-rock-geothermal-could-end-data-center-energy-woes/">TechCrunch</a></p><ul></ul></article><article><h2>Meta重估2030年淨零時程，指AI基礎設施需求改變營運環境</h2><p>Meta正在重新評估原訂2030年達成淨零排放的時程。公司在2026年11月19日發布的永續報告中表示，長期目標並未改變，但營運環境已經不同；人工智慧基礎設施需求的成長速度超過幾乎所有人的預測，因此必須重新檢視執行順序、階段性里程碑與近期排放強度目標。這項表態是重估達標時程，並非宣布取消淨零承諾。

依Meta報告揭露，公司總排放量由2024年的1,560萬公噸二氧化碳當量，增至2025年的逾2,170萬公噸，年增近四成。Meta將排放增加的一大部分歸因於資料中心伺服器等資本財，顯示基礎設施擴張帶來的環境負擔，不只涉及設施運轉時的用電。

Meta原有的淨零做法包括開發再生能源專案，以及運用碳移除技術，但公司揭露，即使將相關措施納入計算，2025年淨排放量仍增加45%。公司表示，調整時程是為了讓執行方式符合當前營運現實，同時維持逐年進展的透明度；目前揭露的內容尚未提出取代2030年的新達標日期。</p><p><a href="https://arstechnica.com/ai/2026/11/meta-reconsiders-2030-net-zero-goal-amid-record-emissions-from-ai-data-centers/">Ars Technica</a></p><ul></ul></article><article><h2>輝達傳接近以至少5億美元收購Inception，布局擴散式語言模型</h2><p>輝達傳出接近達成收購人工智慧新創Inception的協議，交易金額至少5億美元。三名熟悉洽談的人士透露，交易安排還包括給予這家新創逾30名員工的績效獎金。目前仍屬消息人士揭露的洽談進展，並非已完成收購；兩家公司起初均未置評。

Inception成立約兩年，位於舊金山灣區，開發採用擴散流程的語言模型，近期推出的產品為Mercury 3。這類模型不是像傳統語言模型逐一產生詞元，而是對整份回應逐步修整。生成流程的差異是其技術特色，但不能直接視為速度、成本或回答品質已優於其他模型的證明。

報導指出，這項收購的目的在於強化輝達的開源Nemotron模型，以及供機器人使用的物理模型。Inception共同創辦人Stefano Ermon、Aditya Grover與Volodymyr Kuleshov預計全職加入輝達；這項人員安排同樣仍是洽談中的規畫，不能視為已落實。</p><p><a href="https://the-decoder.com/nvidia-bets-at-least-500-million-on-inceptions-diffusion-models-to-strengthen-its-open-source-nemotron-lineup/">The Decoder</a></p><ul></ul></article><article><h2>知情人士稱SEC檢視輝達會計作業，具體調查問題尚未確認</h2><p>兩名知情人士透露，美國證券管理委員會（SEC）正在調查輝達的會計作業，執法人員正檢視可能存在的會計問題。知情人士因涉及機密議題而要求匿名。

SEC發言人不願評論，輝達發言人則未立即回應置評請求。目前無法確認SEC何時啟動調查，也無法確定正在檢視哪些潛在會計問題。

接受調查不代表已有不法行為，許多調查最終結案時也未採取執法行動。</p><aside>編輯觀察：這項消息涉及輝達的財務與法遵風險，但應區分調查消息與違規認定，不能僅憑接受調查便推論公司已有會計違規。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611210010.aspx">中央社財經</a></p><ul></ul></article><article><h2>黃仁勳同意赴美參院公開作證，晶片出口疑問受關注</h2><p>輝達前執行長黃仁勳同意出席美國參議院公開聽證會。共和黨聯邦參議員史考特的幕僚11月20日透過聲明確認此事，但辦公室尚未公布聽證會日期。

國會議員正調查黃仁勳與一名遭指控為中國間諜女性之間的關係，相關爭議也引發對輝達先進人工智慧晶片出口中國的疑問。間諜身分仍屬指控，不能將調查本身視為已證實違法出口。

若聽證會依計畫舉行，將是黃仁勳11月12日卸下輝達執行長職務後，首次公開赴國會作證。史考特原先要求他12月3日出席，但這並非已確認的聽證日期；另有一場美國眾議院3個委員會的閉門訪談，預定12月1日舉行，黃仁勳已同意接受訪談。他的發言人拒絕評論。</p><p><a href="https://www.cna.com.tw/news/aopl/202611210012.aspx">中央社國際</a></p><ul></ul></article><article><h2>川普稱僅希望對中出售舊款晶片，並籲輝達讓黃仁勳回任</h2><p>美國總統川普11月20日在白宮記者會表示，美國只希望向中國出售較舊款晶片，並稱政府正與中國討論一項「非常全面的協議」，但沒有公布細節。同場記者會上，他也呼籲輝達接受黃仁勳道歉，讓這名前執行長重返工作崗位。

川普是在被問及與中國國家主席習近平會面後，是否考慮放寬對中晶片出口禁令時，提出上述說法。他表示，即使不出售晶片也不介意，並以中國本身會製造晶片，說明對中銷售的考量。美國政府在他11月16日出訪前，曾表示將進一步限制中國取得輝達等企業的先進人工智慧晶片；這次談話尚未交代具體出口規則將如何調整。

談到產品界線，川普表示，不希望中國或其他國家取得Blackwell，並稱其為最新晶片。他對黃仁勳則表達支持，希望黃仁勳鄭重道歉後回任。這是川普對出口政策與企業人事的主張，不代表輝達已作出相應決策。

黃仁勳11月17日曾發布聲明，表示若董事會提出要求，願意回歸擔任執行長，並承認自己犯下「嚴重錯誤」。不過，輝達董事會主席瓊斯隨後表示，董事會無意恢復其執行長職務，與川普公開呼籲的方向不同。</p><p><a href="https://www.cna.com.tw/news/aopl/202611210008.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611210011.aspx">中央社國際</a></li></ul></article><article><h2>人工智慧股賣壓延續，那指收跌5.28%、比特幣盤中跌破6萬美元</h2><p>人工智慧相關股票賣壓持續，美股11月20日全面收低，科技股與半導體股跌勢尤其明顯。那斯達克指數收跌5.28%，費城半導體指數重挫10.73%；同日較早的加密貨幣報價顯示，比特幣跌破6萬美元，為今年7月以來首見。

美股收盤數據顯示，那斯達克指數下跌1261.47點，收22617.73點；費城半導體指數下跌1011.133點，收8408.590點。道瓊工業指數下跌949.73點、跌幅1.93%，收48147.33點；標準普爾500指數下跌265.44點、跌幅3.70%，收6910.39點。

加密貨幣方面，較早盤中報價顯示，比特幣下跌3.45%，報59381美元；以太幣下跌5.23%，報1648.91美元。這些是盤中價格，與美股終場數據的時間點不同，不宜視為同步收盤表現。

市場壓力不只來自單一消息。相關報導指出，投資人連續數週質疑人工智慧基礎建設的龐大投資能否帶來足夠獲利，資產估值疑慮也在加深；借貸成本攀升、美國期中選舉後的監管風險，以及黃仁勳離職等因素，同樣影響風險資產表現，不能將當日跌勢全數歸因於單一公司事件。</p><p><a href="https://www.cna.com.tw/news/afe/202611210015.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611210009.aspx">中央社財經</a></li></ul></article><article><h2>Anthropic上市次日早盤跌9.5%，股價仍高於發行價</h2><p>人工智慧公司Anthropic上市第二天股價回落，11月20日美股開盤後不久下跌9.5%，來到約88美元，低於前一天的97.17美元收盤價，但仍高於首次公開發行（IPO）每股83美元的發行價。

Anthropic宣布，透過前一天的IPO取得約916億美元資金。這筆募資與上市次日的股價變動，是此次上市進展的兩個不同面向；上述跌幅為早盤行情，並非當日收盤結果。</p><p><a href="https://www.cna.com.tw/news/afe/202611200350.aspx">中央社財經</a></p><ul></ul></article><article><h2>Valve稱Steam Machine成本持續上升，2TB版供應受限、售價可能調整</h2><p>Valve表示，Steam Machine仍在持續生產，但記憶體與儲存成本不斷上升，接下來能生產多少台、以什麼價格供應，都還無法確定，其中2TB版本的供應將尤其受限。這是可能調整售價的預告，並非已公布新的價格。

Steam Machine於6月開始出貨時，Valve就曾表示，由於難以用合理成本取得短缺的記憶體與儲存零組件，實際產量低於原先規畫，售價也比原先規畫高。如今首批預約訂單陸續獲得處理，公司仍預期供應與成本問題會持續一段時間。

預約進度方面，Valve表示512GB版本已沒有候補名單，剩餘的2TB版本預約者也已收到購買邀請。這代表公司已達成7月提出、讓預約名單內所有人在年底前獲得購買機會的目標，但不代表後續供貨數量與價格已經確定。

Valve計畫在1月進一步更新Steam Machine的供應資訊。對等待購買的消費者而言，目前需要區分的是既有預約的處理進度，以及後續新一批產品的供貨條件；前者已有進展，後者仍受零組件成本牽動。</p><p><a href="https://arstechnica.com/gaming/2026/11/valve-says-it-might-have-to-raise-the-price-of-supply-limited-steam-machines/">Ars Technica</a></p><ul></ul></article><article><h2>Nothing預告12月8日發表人工智慧原生裝置，主打不新增螢幕</h2><p>Nothing宣布，將於12月8日正式發表一款定位為「人工智慧原生」的新裝置。公司預告，產品不會新增一面螢幕，並宣稱它提供的體驗無法只透過應用程式打造。

這次預告確立了發表日期與產品定位，但具體用途、操作方式及售價，仍無法從目前公布的資訊判定。「無法只透過應用程式打造」是Nothing對產品體驗的主張，尚不能視為已獲驗證的功能或優勢。</p><p><a href="https://www.engadget.com/2323187/nothings-ai-device-debuts-december-8-and-it-looks-like-two-vapes-stuck-together/">Engadget</a></p><ul></ul></article><article><h2>Rockstar估《GTA 6》首日零售額達37.9億美元，員工仍憂就業保障</h2><p>Rockstar Games公布公司估計，《Grand Theft Auto 6》（GTA 6）上市首日零售額達37.9億美元，上市前已售出3,250萬套。預售數量高於部分分析師原先預期的2,000萬套，但這些銷售數字屬公司估算，不能直接視為公司的獲利。

相較之下，2013年推出的前作《Grand Theft Auto 5》首日全球銷量約1,100萬套，零售額超過8億美元。兩款遊戲的起售價格也不同：《GTA 6》為80美元，前作則為60美元，因此比較首日銷售表現時，須同時考量售價與套數，而非只看零售額。

亮眼銷售之外，員工對工作保障仍有疑慮。一名Rockstar North開發人員在評論文章中表示，工作室員工擔心，即使遊戲帶來大量收入，仍可能遭到裁員。這是員工對就業前景的擔憂，並不代表公司已公布新的裁員計畫。

Rockstar員工也於11月12日至26日投票，決定是否承認其所屬的Independent Workers Union of Great Britain工會分會。遊戲的商業成績與員工的勞動保障，是工作室同時面對的兩項議題；目前資訊尚不足以判定高銷售將如何影響人事安排。</p><p><a href="https://www.engadget.com/2323671/gta-6-made-dollar379-billion-in-its-first-day-but-rockstars-workers-still-lack-job-security/">Engadget</a></p><ul></ul></article><article><h2>WhatsApp群組上限逐步提高至1,500人，Android與iOS分批開放</h2><p>WhatsApp開始將單一群組的人數上限，從1,024人提高至1,500人。新容量將在Android與iOS應用程式推出，但採分批開放，部分使用者仍須等待，並非所有帳號都已能建立或加入達到新上限的群組。

這項調整可望減少大型群組因人數限制而拆分的需求。以學校或地方社群為例，管理員過去若要容納超過1,024人的成員，可能必須另外建立群組；提高上限後，規模落在新容量內的社群便有機會集中交流，但仍取決於相關帳號是否已取得功能。

除了擴充人數，WhatsApp近期也推出其他群組功能，包括延長訊息置頂時間，以及依提及與回覆篩選對話。既有成員還可向管理員新增的成員分享訊息紀錄，讓新加入者取得先前的討論內容。

群組人數增加，不代表所有功能都已確認支援相同規模。目前仍不清楚，達1,500人的群組能否在新上限開放之初使用「audio hangouts」語音功能；文字群組容量與語音功能的支援情況，仍須分開看待。</p><p><a href="https://www.engadget.com/2322717/whatsapps-group-chats-can-now-have-up-to-1500-members/">Engadget</a></p><ul></ul></article></main></noscript>
