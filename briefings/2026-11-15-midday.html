  <noscript><main><h1>國際外交、公共衛生與產業變動：本期時事選題</h1><p>2026-11-15 時事焦點</p><article><h2>美中俄領袖預定19日在深圳首度三方會談　核武議題成焦點</h2><p>美國總統川普、中國國家主席習近平與俄羅斯總統普丁，預定11月19日在深圳亞太經濟合作會議（APEC）期間舉行首次三方領袖會談。白宮已確認川普出席，並表示會談將聚焦核武擴散問題；美國官員則說，美國與以色列對伊朗的戰爭也將列入討論。

核武談判的背景，是限制美俄戰略核武庫規模的「新戰略武器裁減條約」已於2月失效。俄羅斯曾提議延長效期，川普拒絕，轉而要求達成納入中國的新協議。不過，中國外交部上月表明，要求中國現階段加入三方核裁軍談判「既不公平，也不合理，也不現實」。一名川普政府高階官員表示，對話將以核武議題開場，但不預期達成協議。

伊朗戰爭則牽動三方不同利益。全面攻擊雖已停止，衝突仍陷僵局，荷莫茲海峽的通航限制、船舶遇襲與水雷威脅，持續影響能源運輸。戰前，中國三分之一的原油供應經由這條海峽運送；俄羅斯則因能源價格上漲，以及華府近期放寬制裁而受惠。

至於烏克蘭戰爭是否列入議程，各方公開說法仍有落差。美國官員表示川普不會提及，理由包括中國並未真正參與華府推動的俄烏和談；克里姆林宮官員先前則暗示可能討論。俄方發言人培斯科夫也表示，三方會談極為重要，但任何協議都不能強加於其他國家。</p><p><a href="https://www.cna.com.tw/news/aopl/202611150003.aspx">中央社國際</a></p><ul></ul></article><article><h2>伊朗宣稱3艘油輪在荷莫茲海峽觸雷起火　持續限制通航</h2><p>伊朗海軍宣稱，11月14日有3艘油輪在荷莫茲海峽觸碰水雷後起火，其中1艘上午在海峽東部觸雷，另外2艘則在當天稍晚發生事故。

伊朗革命衛隊海軍聲稱，晚間觸雷的兩艘油輪試圖通過荷莫茲海峽的禁航航道，隨後爆炸起火，並將兩船稱為「違規油輪」。伊朗目前仍限制船隻通過荷莫茲海峽，並攻擊其所稱違反限制的船隻，藉此宣示對這條戰略水道的控制權，向美國施壓。</p><aside>編輯觀察：此事的公共關注重點在於荷莫茲海峽的船舶通行安全，以及伊朗以通航限制施壓的動向。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611150016.aspx">中央社國際</a></p><ul></ul></article><article><h2>以軍空襲汗尤尼斯　哈瑪斯證實高階指揮官阿布尤尼斯身亡</h2><p>以色列軍方11月15日表示，已空襲哈瑪斯武裝部門一名高階指揮官。哈瑪斯隨後證實，阿布尤尼斯在加薩走廊南部的汗尤尼斯身亡，並表示當天下午將在當地為他舉行葬禮。

醫護人員表示，阿布尤尼斯是在汗尤尼斯馬瓦希地區的街道上遭空襲身亡，另有多人受傷。53歲的阿布尤尼斯曾任哈瑪斯武裝部門拉法旅指揮官，自1991年起就是卡薩姆旅成員，並曾在拉法擔任多項高階作戰職務。

這次空襲發生在2025年10月達成停火協議之後。協議雖使大規模戰鬥停止，但以色列仍持續發動攻擊，哈瑪斯也未解除武裝。加薩衛生當局表示，自停火生效以來，至少已有1600名巴勒斯坦人喪生。</p><p><a href="https://www.cna.com.tw/news/aopl/202611150018.aspx">中央社國際</a></p><ul></ul></article><article><h2>美國今年麻疹逾5400例　傳麻疹消除認定遭撤銷</h2><p>美國麻疹疫情持續升溫，2026年已通報超過5400例，11月至今有5人死亡。知情人士表示，泛美衛生組織已撤銷美國的麻疹消除認定；美國若要重新取得資格，必須讓麻疹停止持續傳播至少12個月。

美國在2000年取得麻疹消除認定，過去30年疫情大致受到控制，每年往往僅有數十例。但近兩年，猶他州、德州、南卡羅來納州及賓州等地陸續出現大規模疫情。今年11月以來的5起死亡病例，分布於賓州、紐約州及威斯康辛州等地，相關疫情彼此沒有關聯。

接種率下滑是公衛專家關注的核心問題。美國疾病管制暨預防中心資料顯示，截至今年6月結束的學年，幼兒園學童的麻疹、腮腺炎、德國麻疹混合疫苗接種率，從6年前的95.2%降至92.4%；部分近期疫情最嚴重社區的接種率更低。防止麻疹傳播所需的接種率至少為95%，也有助於保護嬰兒及因健康因素無法接種的人。

美國一個獨立委員會主席布魯爾將疫情失控及可避免的死亡歸因於接種率偏低。與此同時，衛生部長小羅勃甘迺迪推動減少兒童疫苗接種劑次，並刪減部分疫苗研究經費；疾病管制暨預防中心也不再維持部分長年採行的接種建議。</p><p><a href="https://www.cna.com.tw/news/aopl/202611150007.aspx">中央社國際</a></p><ul></ul></article><article><h2>巴西今年首起M痘死亡病例出現於里約　官方加強監測、採購疫苗</h2><p>巴西2026年出現首起M痘死亡病例，地點在里約熱內盧。隸屬衛生部的克魯斯基金會通報，全國今年已記錄1009例確診；政府已加強監測並採購2萬5000劑新型疫苗，但目前尚未將病例增加情況視為疫情爆發。

里約熱內盧近期病例明顯增加，9月至11月的陽性病例數，是今年其餘時間所記錄病例數的兩倍。巴西今年的病例多數集中在聖保羅及里約熱內盧，兩地也是全國人口最多的三個州之中的兩個。

克魯斯基金會表示，目前病例數仍遠低於2022年的歷史高峰，因此尚未認定為疫情爆發。這項判斷與加強監測、採購疫苗的措施同時進行，官方並未因尚未認定疫情爆發而停止防疫應對。

M痘可能引起發燒、肌肉痠痛及類似大型膿包的皮膚病灶，嚴重時可能致命。病毒可由動物傳給人類，也可經密切身體接觸在人與人之間傳播。世界衛生組織曾於2022年及2024年，因M痘在部分國家迅速傳播，宣布構成「國際關注公共衛生緊急事件」。</p><p><a href="https://www.cna.com.tw/news/aopl/202611150012.aspx">中央社國際</a></p><ul></ul></article><article><h2>民主黨期中選舉勝出後議施政　降低生活成本有共識、對川普策略分歧</h2><p>美國民主黨在期中選舉大勝後，本週於丹佛舉行「下一步」大會，討論如何將勝選轉化為施政成果。降低食品、醫療與住房等生活開支，是與會者的共同優先目標；但政策應更向進步派靠攏，或採中間路線，以及應與總統川普合作還是對抗，黨內仍有明顯分歧。

11月3日選舉後，民主黨預估將在聯邦眾議院取得至少255席，仍有十多席尚未分出勝負；參議院則至少取得55席，阿拉斯加州計票結果可能再增加一席。不過，川普仍握有總統否決權，民主黨即使擴大國會席次，如何推動法案仍是會議焦點。

進步派加州聯邦眾議員肯納主張停止追逐中間路線，提出全民醫療、財富稅及將聯邦最低時薪提高至25美元等政策。賓州州長夏皮洛則主張，民主黨應跳脫意識形態立場檢驗，重點是拿出政績。預計接任眾議院議長的傑佛瑞斯發言時，也遭要求支持民粹進步派議程的抗議者打斷。

如何與川普互動，同樣引發爭論。新當選德州聯邦參議員的塔拉里格呼籲合作，讓川普任期最後兩年有所建樹；眾議員拉斯金與前司法部長霍爾德則大致否定妥協路線。紐澤西州州長薛瑞爾提醒，若川普願意合作，民主黨應先列出議程並要求他簽字。

前運輸部長布塔朱吉主張，民主黨應及早準備，接連提出降低生活成本的法案，而非滿足於勝選。亞利桑那州聯邦參議員加勒戈則將選民支持形容為必須持續償還的「短期貸款」，提醒黨內不要把這次勝利視為長期授權。</p><p><a href="https://www.cna.com.tw/news/aopl/202611150014.aspx">中央社國際</a></p><ul></ul></article><article><h2>黃仁勳辭職後輝達面臨接班考驗　復職連署、國會追查同步升溫</h2><p>黃仁勳11月12日辭去輝達總裁、執行長等職務後，財務長克瑞斯出任臨時執行長，公司同時面臨交易延續與財務風險管理的考驗。《華爾街日報》引述知情人士報導，輝達正洽談提供數十億美元財務擔保，協助客戶購買晶片；克瑞斯先前曾追問交易篩選、擔保估值及投資報酬率。這些安排尚不能等同已完成的融資承諾，卻是接班後必須處理的治理課題。

要求黃仁勳回任的連署也持續擴大。連署網站自報，截至14日下午已有逾11萬5000人簽署，訴求是在獨立調查釐清事實期間讓他復職，並質疑離任程序是否充分。馬斯克已公開表示加入連署，另宣稱輝達部分供應鏈交易靠的是與黃仁勳握手，而非書面合約，因此預測公司將失去部分關鍵交易；目前提供的資料並未證實交易已流失。

美國國會則持續追查國安與出口管制問題。眾院三個委員會的共和黨籍主席要求黃仁勳12月1日接受閉門紀錄訪談，參院銀行委員會也要求他與商務部長盧特尼克作證。黃仁勳承認與黃樂有婚外情，但黃樂涉及中國間諜的說法仍屬指控；她曾任職的Megaspeed，則因涉嫌將受管制輝達晶片轉運中國，正接受美國司法部調查。

中國外交部否認黃樂是間諜的指控，稱其毫無根據。新加坡內政部對另一項伺服器採購申報調查說明，今年2月未找到足夠證據，認定黃樂涉及疑似不實申報的相關犯罪；但她明知而提供不正確職務資訊，因此遭警告並禁止再入境。該部表示，針對Megaspeed及另外六人的調查仍在進行，不能將個別調查結果視為所有疑點均已排除。

亞洲合作計畫目前則有延續訊號。南韓科學主管機關表示，輝達已重申供應26萬顆先進GPU及持續合作AI計畫的承諾；台北市政府表示，輝達海外總部計畫仍按進度推動，公司迄今履行合約義務。日本政府則表示將密切觀察，現階段評估全球AI產業所受影響仍嫌過早。</p><aside>編輯觀察：這場接班考驗須分開觀察公司治理、合約履行與國安調查。支持者連署及馬斯克對交易的預測，不能取代董事會調查結果；政府重申合作計畫，也不代表所有商業承諾都已確認不受影響。</aside><p><a href="https://techcrunch.com/2026/11/14/elon-musk-other-tech-execs-sign-petition-calling-on-nvidia-to-reinstate-jensen-huang/">TechCrunch</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611150021.aspx">中央社國際</a></li><li><a href="https://techcrunch.com/2026/11/14/asian-governments-react-to-nvidia-ceo-jensen-huangs-exit/">TechCrunch AI</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611140227.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611140102.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611140189.aspx">中央社財經</a></li></ul></article><article><h2>美國全國航班暫停起飛後續效應延燒　通訊設備升級原因待查</h2><p>美國全國航班暫停起飛的衝擊延續至11月14日。航空資料業者Cirium統計，13日晚間逾8200班航班取消，解除暫停起飛措施後，14日仍至少再有3000班取消。運輸部長Sean Duffy表示，事件發生在一處偏遠地點進行例行通訊設備維護之後，當局仍在釐清是操作、安裝失誤，還是路由器本身故障。

Duffy說，聯邦航空總署長期承包商L3Harris將銅線升級為光纖後，一台路由器使關鍵通訊系統負荷過重。航空總署代理技術長Rebecca Guy表示，網路出現不穩時，團隊發現兩處來源以極高頻率連接網路，每四至五秒約有1000次連線；停用這兩處來源後，網路已恢復穩定，目前正進行根本原因分析。

維護作業的安排時段也受到追問。對於為何選在週五下午3時進行，Duffy表示，大型機場的系統切換會排在深夜，但偏遠地點通常於白天作業；主管機關將重新評估施工時間。他也再次要求國會增加航空設備升級經費。

事發前一天，航空總署才宣布推出供航管人員使用的AI工具，但目前沒有證據可將兩者連結。署長Bryan Bedford表示，未發現惡意行為或與AI有關的證據，現階段正釐清設備問題。設備升級與網路異常的先後關係已有官方說明，但最終故障原因及責任歸屬仍待調查。</p><aside>編輯觀察：網路恢復穩定不等於航班運作立即恢復。後續調查除了確認故障設備與責任，也需檢視維護時段安排，才能評估如何降低例行升級對公共運輸的衝擊。</aside><p><a href="https://techcrunch.com/2026/11/14/transportation-secretary-blames-routine-equipment-upgrade-for-grounding-flights-nationwide/">TechCrunch</a></p><ul></ul></article><article><h2>泰國第三季實際投資年增28%　明年調高整車進口電動車消費稅</h2><p>泰國副總理兼財政部長艾尼提11月14日表示，第三季實際投資額年增28%，達2600億泰銖，約新台幣2522億元。政府希望透過人才培育、供應鏈在地化與產業升級，將投資轉化為就業及國內產業附加價值，而不只追求投資金額增加。

艾尼提在泰國供應鏈網絡舉辦的商業夥伴大會上，引述泰國投資委員會數據公布上述成長。他認為，地緣政治分化使企業選擇生產基地時，除了成本與效率，也更重視安全和穩定；泰國與多國維持良好關係，有機會吸引投資。這是他對供應鏈變化的政策判斷，不能直接視為本季投資成長的已證實原因。

汽車產業是推動在地生產的政策重點。泰國將從明年起，把整車進口電動車的消費稅由10%提高至35%；政府也將依車廠在泰國的投資、生產及採用當地零組件情況，提供不同貨物稅率。艾尼提表示，企業不能只將汽車進口銷售，也應讓泰國零組件與供應鏈業者參與生產。

他並要求投資企業協助培育泰國人才、引進技術及提升勞工技能，強調政府與民間必須合作。對於AI改變企業營運與生產方式，他主張推動技能提升，讓中小企業與更多民眾也能從新技術發展中受益。</p><aside>編輯觀察：泰國政策著眼於把投資金額轉化為在地生產與技能累積。後續成效應分別觀察投資落實、當地零組件採用及人才培育，不能只以單季投資成長判定產業升級已經實現。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611140180.aspx">中央社財經</a></p><ul></ul></article><article><h2>Anthropic擬上市籌資，執行長坦言提前採購算力難估回報</h2><p>Anthropic規劃於11月19日首次公開募股（IPO）前，執行長Dario Amodei在紐約一場投資人活動表示，算力是公司面臨最深層的經營兩難：人工智慧技術快速進步，能轉化多少經濟價值仍不明朗，企業卻必須提前一至兩年購買運算資源。

Amodei指出，採購不足會使公司無法滿足客戶及新技術的需求，影響營收；買得太多，則可能讓財務承擔超出負荷。他形容，明年會發生什麼事仍有高度不確定性，資源配置必須在供應不足與支出過度之間取得平衡。

The Decoder報導，Anthropic已承諾的支出接近9,010億美元，大部分用於算力與晶片，其中約710億美元將於2027年9月前到期。同一報導指出，公司計畫透過IPO籌集最多644億美元，另以私募籌集260億美元；這些仍是募資計畫，並非已完成的交易。

面對龐大支出，Amodei表示，公司以毛利與帳上現金作為緩衝，並稱目前毛利表現良好。採購策略則是先購買相對較少的算力，若業務成長優於預期，再到現貨市場追加容量。他將這種作法比喻為購買保險，並表示，增加現金正是上市的重要理由，能擴大公司在算力需求判斷失準時的承受空間。</p><aside>編輯觀察：這場募資的觀察重點不只是規模，而是新增現金能否支撐提前採購的長期承諾。營收成長與算力付款的時間能否配合，是評估財務風險的重要切入點。</aside><p><a href="https://the-decoder.com/anthropic-ceo-amodei-admits-theres-a-huge-uncertainty-in-whats-going-to-happen-next-year-days-before-a-record-ipo/">The Decoder</a></p><ul></ul></article><article><h2>廢除非核家園公投交鋒：重啟時程、低碳供電與核安程序成焦點</h2><p>「廢除非核家園」公投將於11月28日與九合一選舉同日投開票。中選會11月14日舉辦第2場意見發表會，正方代表、中經院綠色經濟研究中心副研究員陳中舜主張，重啟核電可為低碳供電、財政與電價提供緩衝；反方代表、經濟部次長賴建信則強調，核電不是振興經濟的萬靈丹，應依循法治與專業程序處理。

陳中舜認為，台灣能源組合已失衡，重啟核電是能源風險管理的一環。他估計重啟約需1.5年至3年，可銜接人工智慧發展帶來的需求，並為再生能源發展爭取時間。針對核廢料，他將問題歸於相關專法、選址處置制度及合理補償尚未完成，主張政府應推動立法。

賴建信則以經濟與出口數據反駁核電是成長必要條件的說法。他指出，台灣在核三廠2號機停機後，去年經濟成長率仍達8.76%，今年預估可望突破11%，10月出口也創新高。這些是他支持反方立場所提出的論據，並不能單憑數據同步變化，就判定核電對經濟的因果效果。

在程序面，賴建信表示，台電已依法提出「核三廠再運轉計畫」，內容包括人員組設、品質管制與流程，並於9月24日經核安會完成審查；他認為依法應辦的事項，無須再以公投處理。他並提出「核安無虞、核廢有解、社會共識」三項原則。雙方爭點因此不只涉及是否使用核電，也涵蓋重啟所需時間、核廢處置責任，以及公投與法定程序的關係。</p><aside>編輯觀察：評估公投主張時，宜分開檢視能源政策選擇、重啟時程估算與安全審查程序，避免把經濟表現直接當成支持或反對核電的因果證明。</aside><p><a href="https://www.cna.com.tw/news/afe/202611140223.aspx">中央社財經</a></p><ul></ul></article><article><h2>COP31元首峰會，5友邦支持台灣參與全球氣候治理</h2><p>聯合國氣候變化綱要公約第31屆締約方大會（COP31）在土耳其安塔利亞舉行，11月11日及12日召開元首峰會。外交部14日表示，馬紹爾群島、帛琉、史瓦帝尼、吐瓦魯及聖克里斯多福及尼維斯5個友邦的代表，分別在峰會發言支持台灣參與全球氣候治理。

依外交部公布的發言內容，馬紹爾群島總統海妮強調，包括台灣在內的聲音都應被聽見，並肯定台灣推動經濟成長與碳排放脫鉤、公正轉型及氣候韌性的努力。帛琉總統惠恕仁則將台灣形容為重要夥伴，指出台灣在災害韌性、能源轉型及糧食安全等領域的角色，支持台灣參與相關國際會議。

其他友邦的倡議也聚焦實務經驗。史瓦帝尼總理戴羅素支持台灣有意義參與國際氣候進程，並提到台灣及日本在韌性基礎設施、早期預警與防災整備方面的經驗值得借鏡。吐瓦魯總理戴斐立表示，氣候變遷與氣候行動不應受政治邊界限制，不應遺漏願意合作的夥伴；聖克里斯多福及尼維斯副總理韓利則肯定台灣在環境治理、循環經濟、綠色能源及能力建構等領域的重要性。

外交部長林佳龍感謝5國支持台灣參與全球氣候治理機制。外交部並表示，台灣將持續與友邦及理念相近夥伴合作，為因應氣候變遷做出貢獻。</p><aside>編輯觀察：這些發言將台灣參與氣候治理的訴求，連結到防災、能源轉型與環境治理等具體領域；觀察重點是公開支持如何轉化為後續合作與參與安排。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611140126.aspx">中央社政治</a></p><ul></ul></article><article><h2>捷克跨國兵推模擬台海封鎖與波羅的海危機，檢視歐美嚇阻選項</h2><p>捷克智庫「歐洲價值安全政策中心」近期在布拉格舉行跨國兵棋推演，將中國封鎖台灣、俄羅斯威脅波羅的海國家，以及歐洲對中國供應鏈的依賴，納入同一場危機模擬。約30名安全專家、前軍事將領與政治人物參與，分別扮演各國及國際組織決策者，研擬外交、經濟與軍事對策。

演習把時間設定在2027年3月：中國以經濟報復警告歐亞民主國家不得介入台灣問題，俄羅斯則疑似在波羅的海民用航線附近布設水雷。北約、歐盟與亞洲夥伴須在模擬的3週期限內提出應對方案。整場推演歷時一天，參與者在主持人介紹情境後，先獲得70分鐘研擬對策。

推演中，參與者同意啟動「北大西洋公約」第4條共同磋商，增加北約軍艦在波羅的海的活動；扮演歐盟決策者的一方同意加強監控平台假訊息，卻未能就新增對俄制裁達成共識。後續情境另加入俄羅斯以20年優惠能源合約，換取歐洲國家終止制裁的提議，考驗各方能否維持共同立場。

台海部分則模擬中國實施海上封鎖，並以擊沉前往支援台灣的美國軍艦作結，未再推演全面戰爭後的軍事發展。這些封鎖、攻擊及政策決定均屬演習內容，並非實際發生的事件。

中心執行長楊雅嚳認為，這次模擬中的嚇阻策略未能奏效；若歐美更早施加經濟壓力，並採取更明確的軍事嚇阻，或有機會避免升高。他也指出，演習納入稀土、工業原料及重要設施對中國技術的依賴，意在檢視供應鏈受限時的應變弱點。上述判斷是智庫對演習的解讀，不代表危機必然依此發展。</p><p><a href="https://www.cna.com.tw/news/aipl/202611140205.aspx">中央社政治</a></p><ul></ul></article><article><h2>教宗良十四世重訪秘魯偏遠山城，主持彌撒與地方信眾相聚</h2><p>天主教教宗良十四世在為期12天的南美洲出訪期間，重返秘魯西部安地斯山區的聖克魯斯德蘇查班巴，探訪這座居民不到6000人的小鎮，並在教區附近空地主持彌撒。梵蒂岡估計，現場約有2萬人參與。

這座山城位於太平洋沿岸以東約100公里，距離良十四世過去擔任主教的奇克拉約約4小時車程。他在2015年至2023年擔任奇克拉約主教期間，每年會數度前往當地，為鄉村居民提供牧靈服務，因此這次參與活動的民眾中，有不少是他的舊識。

與過去沿蜿蜒山路行車不同，良十四世此次搭乘直升機抵達。當地樂團在人群前演唱迎接，鎮中心多座西班牙殖民時期風格的建築外牆，也繪上他當年在秘魯擔任主教時的壁畫。

秘魯是這趟3國行程的最後一站。良十四世曾在秘魯擔任傳教士約20年，擁有美國與秘魯雙重國籍。此次探訪的山城所屬卡哈麥卡大區，依秘魯國家統計局資料，是全國最貧困的地區之一，貧困人口占比最高達40%。宗教活動之外，這次行程也讓這個偏遠地區的生活處境受到關注。</p><p><a href="https://www.cna.com.tw/news/aopl/202611150027.aspx">中央社國際</a></p><ul></ul></article><article><h2>中油11月16日至22日汽柴油凍漲，95無鉛每公升32.7元</h2><p>台灣中油公司11月14日宣布，11月16日凌晨零時起至22日結束，汽、柴油價格維持不調整。各式油品參考零售價格為92無鉛汽油每公升31.2元、95無鉛汽油32.7元、98無鉛汽油34.7元，超級柴油29.9元。

中油表示，中東地區原油供應與運輸風險仍高，國際油價處於高檔震盪。為平穩國內物價，政府擴大貨物稅減徵，汽、柴油分別吸收3.7元及2.1元，並持續執行美伊戰爭專案平穩機制。

依中油說明，11月16日至22日公司再針對汽、柴油加碼吸收2.3元及3.7元，合計各吸收6.0元及5.8元，使這一週的國內售價維持不變。中油並公布，2月28日至11月15日執行專案平穩各項措施期間，汽、柴油合計擴大吸收約新台幣353.6億元。

中油表示，後續將持續掌握國際政經情勢及油品市場供需變化，配合政府穩定物價政策滾動檢討。本次公告的價格適用至11月22日，未提供之後的調價方向。</p><p><a href="https://www.cna.com.tw/news/ahel/202611140163.aspx">中央社財經</a></p><ul></ul></article><article><h2>Tesla開放部分客戶預訂個人用Cybercab，售價近3萬美元另收月費</h2><p>Tesla開放部分客戶預訂個人使用的自駕車Cybercab，售價為29,990美元，使用車輛另須每月支付299美元。這次預訂附帶交車與行駛地區限制，並非買車後即可在全美各地使用。

科技評論者Marques Brownlee公布的訂購頁資訊顯示，買家必須在指定的幾個德州城市之一交車，車輛也只能在設有地理圍欄的區域內運作。頁面列出的預估交車時間為2026年12月，仍屬預估日期。

Tesla的Ashok Elluswamy進一步表示，個人用Cybercab可在與Robotaxi服務相同的地理範圍內，以無人監督方式運作，服務車主自身需求。這項說明界定了目前的使用條件，並不代表車輛已獲准在所有道路行駛。

執行長馬斯克則表示，取得監管核准後，Cybercab將在全美推出。他也認為299美元月費「太高」，希望比照其他車款的Full Self-Driving與連線服務費用，約為每月115美元。不過，這是他對費率的表態，不能視為訂購價格已經調降。</p><aside>編輯觀察：對買家而言，能否在日常活動範圍內使用，以及購車後持續支付的月費，都是評估Cybercab實用性的重要條件；全美開放與降價表態不能取代現行訂購條件。</aside><p><a href="https://techcrunch.com/2026/11/14/tesla-opens-cybercab-pre-orders-for-personal-use-with-geo-restrictions-and-a-299-monthly-fee/">TechCrunch</a></p><ul></ul></article><article><h2>OpenAI調整機器人團隊歸屬，通用模型控制能力仍待檢驗</h2><p>OpenAI重整機器人團隊，將研究人員併入研究長Mark Chen領導的主要研究團隊，應用機器人與硬體團隊則轉入Greg Brockman的應用部門。這次調整並非放棄機器人研發，而是將相關工作整合至其他團隊。

The Decoder報導指出，OpenAI可能認為GPT-6 Astra等通用模型已能直接控制機器人，可降低對專用機器人模型的需求。不過，目前列出的測試涵蓋不同環境與評分方式，尚不能據此判定專用模型已無必要。

在Nvidia的一項研究中，搭載Astra的代理系統於模擬機器人任務取得74.8%成功率，對照的最佳專用模型為51%。這項測試使用模擬DROID機器人，並非實體機器人，結果不能直接當成真實環境的操作成功率。

另一項StationeryBench測試使用雙臂YAM機器人，針對桌面物品設計五類任務。Astra在100次嘗試中完整完成7次，對照的MolmoAct2則未完整完成任何一次；兩者平均進度分數分別為46與12。這顯示部分操作能力有所差距，但完整完成任務仍是明顯限制。

報導也指出，各模型訓練時使用多少機器人資料仍不清楚；專用模型在成本、可靠性、速度及能源消耗上，仍可能具有優勢。組織調整與個別測試進展，尚不足以證明通用模型已全面取代專用研發路線。</p><aside>編輯觀察：判斷機器人模型是否能投入實用，不能只比較單一成功率，還必須區分模擬與實體測試、任務進度與完整完成，以及執行成本和可靠性。</aside><p><a href="https://the-decoder.com/openai-reassigns-robotics-researchers-to-other-teams-as-general-purpose-models-might-make-specialized-robotics-ai-unnecessary/">The Decoder</a></p><ul></ul></article><article><h2>Runway公開Praxis-1權重與程式碼，可商用但仍須適配機器人</h2><p>Runway公開機器人控制模型Praxis-1的權重與原始碼，採允許商業使用的Apache 2.0授權。這款模型先前僅提供特定合作夥伴使用，如今開放下載，但基礎模型要用於新的機器人系統，仍須額外訓練。

Praxis-1接收攝影機影像、文字指令與機器人位置資訊，預測環境變化並計算相應動作，再隨新影像持續調整控制。Runway以學習物體運動及互動的影片模型為基礎，再加入人類動作影片與機器人資料微調；這條路線能否比其他方法減少整體機器人資料需求，目前仍無定論。

Runway自行執行的RoboLab-120測試顯示，Praxis-1在120項模擬任務中的成功率為46.2%，同條件下FLUX 3 Action為42.9%。在實體Franka機械臂測試中，兩款模型各針對十項任務嘗試十次，Praxis-1成功88次，FLUX 3 Action成功80次。上述結果尚未經獨立驗證。

部署門檻也尚未消失。標準版本需要配備80 GB記憶體的GPU；Runway估計壓縮版可在具32 GB顯示記憶體的RTX 5090上執行，但實際尖峰記憶體用量尚未量測。

依Runway研究報告，模型有時會混淆外觀相似的物品，也難以處理模糊指令。較長的任務仍須逐步交代，尚無法可靠地自行規劃複雜動作序列。Runway目前主要將它定位為快速執行機器人動作的系統，而非能獨立完成所有規劃的通用控制工具。</p><aside>編輯觀察：開放權重與可商用授權，讓外部開發者有機會評估及改作模型；但能否實際部署，仍取決於機器人適配、運算資源與複雜任務下的可靠性。</aside><p><a href="https://the-decoder.com/runways-open-source-praxis-1-turns-video-ai-into-a-robot-controller/">The Decoder</a></p><ul></ul></article><article><h2>Gemini 4 Carbon登上MathArena榜首，測試成本約為GPT-6.1 Sol的15倍</h2><p>Google的Gemini 4 Carbon在數學評測MathArena登上榜首，取代GPT-6.1 Sol原先的領先位置，Claude Fable 5.2則排名第二。The Decoder報導，這項成績伴隨較高的推論成本：在該次測試採用的推理設定下，Carbon的成本約為GPT-6.1 Sol的15倍，Fable 5.2則約為40倍。

測試也呈現Carbon在執行時間上的問題。報導指出，超過時間限制是它最常見的失敗情形，而且模型幾乎不會放棄任務；其中一次啟動的指令碼持續執行超過11小時，期間未檢查執行進度。

這次比較呈現的是特定數學評測中的排名、成本與執行行為，而非模型所有用途的整體優劣。對使用者而言，較高的解題表現與較高的資源代價必須一起衡量，成本倍數也應連同該次測試的推理設定解讀。</p><aside>編輯觀察：數學評測排名與實際使用成本是不同指標；這項比較提醒使用者，不能只看名次，也須評估執行時間與資源負擔。</aside><p><a href="https://the-decoder.com/gemini-4-carbon-takes-the-matharena-crown-but-costs-15-times-more-than-gpt-6-1-sol/">The Decoder</a></p><ul></ul></article><article><h2>張峻競總就爭議文宣赴花蓮地檢署告發，游淑貞、吳建志否認發放</h2><p>無黨籍花蓮縣長參選人張峻的競選團隊11月14日前往花蓮地檢署告發，指有民眾收到夾帶攻擊張峻內容的競選文宣，要求檢方追查印製與散播來源。團隊主張內容不實，涉嫌違反選罷法意圖使人不當選；被詢及的國民黨花蓮縣長參選人游淑貞及縣議員吳建志，均否認發放並表示不知情。

張峻競選總部主任胡慧君表示，13日接獲鳳林鎮民眾通報，游淑貞的宣傳文宣中夾有兩張針對張峻的傳單，內容涉及政治立場與土地使用等指控，並署名吳建志。競總14日帶同受僱發放文宣者及收件住戶兩名證人，提出文宣、監視器影像等證物。

受僱發放文宣的民眾表示，自己是有償協助發送，委託單位提供什麼就發什麼，並不清楚內容。陪同律師則要求檢方調查，文宣是否冒用吳建志名義製作，以及與游淑貞文宣一同發放的經過和動機。

吳建志另表示，不清楚文宣來源，也否認印製；但他認為，文宣內容確實是自己過去對張峻提出的質疑，並主張內容屬實、不是抹黑，要求張峻公開說明。雙方對內容真實性的說法相反，文宣製作者、委託發送者及相關法律責任，仍是此次告發要求釐清的事項。</p><aside>編輯觀察：告發是要求司法調查，不等同違法成立。此案應分別檢視文宣內容是否屬實、由誰製作與委託發送，不能僅憑署名或夾帶方式認定責任。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611140181.aspx">中央社政治</a></p><ul></ul></article><article><h2>蔣萬安安心大遊行兩路會師，國民黨要角與民眾黨人士站台</h2><p>爭取連任的台北市長蔣萬安11月14日舉辦「安心大遊行」，隊伍分南北兩路前往台北市政府前的市府路會師。新北市長侯友宜、台中市長盧秀燕、立法院長韓國瑜到場支持，民眾黨秘書長周榆修也率黨籍市議員參選人登台，呈現跨黨支持的選舉動員。

北路線在南京東路三段的蔣萬安競選總部周邊集結，由蔣萬安與盧秀燕領軍；南路線從大安森林公園集結，由韓國瑜及蔣萬安妻子石舫亘率隊。兩路隊伍下午2時30分許出發，下午陸續抵達主會場。現場雖有細雨，仍有支持者攜帶國旗、綁著安心飄帶參與；活動主持人下午4時50分許宣布，參與人數突破5萬人，這是活動方公布的數字。

蔣萬安在遊行前受訪時，把交通、居住及各項政策建設列為城市治理重點，表示希望讓台北更安全、宜居與幸福。他在會師後致詞說，市長應以具體努力、制度化方法及持續研擬對策解決大小問題，讓每個家庭減少擔心。

站台者也把訴求延伸至雙北合作。國民黨新北市長候選人李四川提出讓雙北從一日生活圈走向30分鐘生活圈，侯友宜則呼籲兩地相互催票。周榆修率六名民眾黨台北市議員參選人上台，表明支持蔣萬安繼續服務市民。</p><aside>編輯觀察：這場活動結合城市治理訴求、雙北合作與跨黨站台；現場動員規模及政治人物表態，仍不能直接等同選票結果。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611140199.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611140130.aspx">中央社政治</a></li></ul></article><article><h2>李四川中和造勢承諾：若當選，中央未補助老人健保費將由新北負擔</h2><p>國民黨籍新北市長候選人李四川11月14日晚間在中和區造勢，提出老人健保費補助承諾，表示若當選，而中央政府未提供補助，將由新北市補助。他也呼籲選民踴躍投票，強調選票關係新北未來及孩子的成長環境。

這場「團結之夜」由國民黨新北市議員金瑞龍、游輝宂、陳錦錠、邱烽堯等人共同舉辦，新北市長侯友宜、台中市長盧秀燕及立法院長韓國瑜到場助講，黨主席鄭麗文、前台北縣長周錫瑋等人也出席，爭取中和選民支持。

市政延續是助講重點之一。侯友宜表示，任內尚未完成的建設將交棒給李四川，並呼籲支持者在中和催出選票。韓國瑜則以行政經驗為由推薦李四川，認為他若當選即可投入市政、推動建設；盧秀燕也以李四川經手的道路與橋梁建設作為支持理由。這些能力評價與施政期待，均為站台者的競選論述。</p><p><a href="https://www.cna.com.tw/news/aipl/202611140224.aspx">中央社政治</a></p><ul></ul></article><article><h2>蘇巧慧新莊造勢　賴清德、蔡英文站台談市政與中央地方合作</h2><p>民進黨新北市長候選人蘇巧慧11月14日晚間在新莊陽光草坪舉辦造勢晚會，總統賴清德、前總統蔡英文及高雄市長陳其邁到場助講。現場飄著小雨，主辦單位估計約有1萬5千人參加；台北市長候選人沈伯洋則透過影片表達支持。

中央與地方如何共同推動建設，是蔡英文助講的重點。她提到，蘇巧慧近期與新北市長侯友宜共同出席、見證新北重要建設，認為立委參與地方公共事務相當自然，交通、醫療等建設不應因選舉就被視為某個政黨的功勞，中央與地方合作才能讓市民受惠。

賴清德則呼籲支持者在選戰最後階段協助催票，支持蘇巧慧成為新北市首位女性市長。他以新北幅員廣、人口多及市政事務複雜，說明自己對市長應變能力與韌性的期待。蔡英文也表態，認為蘇巧慧具備延續好政策所需的經驗、能力與實力。

蘇巧慧在晚會與神將同台表演時發生碰撞，口部受傷、牙齒缺角，完成演唱後下台處理。她稍後戴著口罩再度登台，向現場民眾表示沒有大礙，請各界放心。</p><p><a href="https://www.cna.com.tw/news/aipl/202611140225.aspx">中央社政治</a></p><ul></ul></article><article><h2>陳品安苑裡造勢　提出托育加倍、母語保存與老屋維護方向</h2><p>民進黨苗栗縣長參選人陳品安11月14日在苑裡鎮舉辦造勢活動，前總統蔡英文、行政院長卓榮泰到場支持。公共托育、地方文化保存與財政紀律成為活動中的政策焦點，蔡英文也呼籲選民支持陳品安成為苗栗首位女性縣長。

活動在苑裡慈和宮停車場舉行，並為百工百業後援會授旗。擔任陳品安競選總部榮譽主委的蔡英文介紹，陳品安提出4年內公共托育名額加倍，增加夜間及臨時托育服務；文化政策則包括制定母語自治條例、保存全縣18鄉鎮市的地方故事，以及建立老屋巡查和小額修繕制度。這些均為競選提出的政策方向。

蔡英文也以陳品安過去擔任公益律師、協助苑裡居民爭取權益，以及當選縣議員後關心環境、勞工與弱勢族群的經歷，作為推薦理由。她主張，評估縣長參選人應看其做過的事與處理問題的方式，而非出生地。

卓榮泰則強調，地方建設與民眾福利必須兼顧財政紀律。他表示，期待陳品安運用法律及財務金融管理專長，並與中央、議會合作；同時認為苗栗具有承接高科技研發製造與傳統產業升級的區位優勢。</p><p><a href="https://www.cna.com.tw/news/aipl/202611140198.aspx">中央社政治</a></p><ul></ul></article></main></noscript>
