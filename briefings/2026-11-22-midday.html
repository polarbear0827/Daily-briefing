  <noscript><main><h1>國際安全、金融市場變動與台灣選情焦點</h1><p>2026-11-22 時事焦點</p><article><h2>美國會預算處憂售澳潛艦縮減美軍艦隊　澳防長駁斥</h2><p>澳英美三方安全夥伴關係（AUKUS）的潛艦供應規劃出現評估分歧。美國國會預算處在11月報告中指出，向澳洲出售維吉尼亞級潛艦，可能使美國海軍攻擊潛艦部隊的規模在2060年之前縮減。澳洲國防部長馬勒斯11月22日駁斥這項判斷，強調計畫正在推進，並稱美國的生產速度確實提升。

依既有規劃，美軍指揮的維吉尼亞級潛艦預定2027年起部署澳洲；美國將在2030年前後向澳洲出售多艘同級潛艦，英國與澳洲也將建造AUKUS新型核動力潛艦。馬勒斯10月曾表示，澳洲仍按計畫於2030年代初期取得首批美製核動力潛艦。

AUKUS是澳洲歷來最大的國防計畫，澳洲承諾在30年內投入3680億澳元，其中包括向英美生產基地投資數十億澳元。國會預算處對美軍艦隊規模的疑慮，與馬勒斯對產能提升的信心，呈現雙方對供應能力的不同判斷；目前所提供資料並未顯示既定交付規劃已經調整。</p><p><a href="https://www.cna.com.tw/news/aopl/202611220027.aspx">中央社國際</a></p><ul></ul></article><article><h2>伊朗宣布輪流停電　依地區每兩天約兩小時或每天最多兩小時</h2><p>伊朗將自11月22日起實施輪流停電。伊朗國家電力公司負責人阿拉達德21日宣布，因國內燃料供應狀況，電力部門必須限制供電；各地安排不同，部分地區每兩天停電約兩小時，另一些地區則每天最多停電兩小時。

伊朗總統裴澤斯基安同日稍早表示，美國與以色列對伊朗能源基礎設施的攻擊，使入冬前的能源問題更加惡化。他並指稱，天然氣基礎設施遇襲讓情況加劇，預期今年冬天將面臨困境。

伊朗近年已因發電廠燃料短缺實施過類似措施。儘管擁有龐大的石油與天然氣蘊藏量，伊朗長期難以滿足國內能源需求，老舊電網也在多年制裁下投資不足。過去在極端天候與燃料短缺期間，當局曾關閉公家機關並縮減服務；此次宣布的新措施則是分區輪流限制供電。</p><aside>編輯觀察：輪流停電顯示燃料供應壓力已影響日常供電。不同地區採取的停電頻率與時數限制並不相同，評估民生與營運影響時，必須區分「每兩天約兩小時」與「每天最多兩小時」，不能視為相同安排。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611220011.aspx">中央社國際</a></p><ul></ul></article><article><h2>巴林稱民用工業設施遭伊朗攻擊起火　初步未傳傷亡</h2><p>巴林當局11月21日表示，一處民用工業設施遭伊朗攻擊，引發火災並造成財物損壞，初步未傳出人員傷亡。巴林當局稱，這是該國本週遭遇的最新一起攻擊事件。

巴林內政部在社群平台X發布消息時表示，民防單位正設法控制火勢，但未公布遇襲設施的地點。財物損壞與未傳人員受傷的資訊均屬初步通報。

另有兩名居民表示，看見巴林東岸錫特拉島上空升起濃煙。島上有多處工業設施，包括由巴林石油公司營運的一座煉油廠。</p><aside>編輯觀察：工業設施起火的影響仍須依受損設施身分與後續通報判斷。居民目擊濃煙的位置不足以確認受襲設施，不能僅因島上設有煉油廠，就認定煉油廠遭到攻擊。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611220005.aspx">中央社國際</a></p><ul></ul></article><article><h2>皮尤完成荷莫茲海峽部分水域長泳，籲停戰、重啟航道並清理污染</h2><p>英國耐力泳將皮尤在荷莫茲海峽靠近阿曼海岸的水域完成15公里長泳，呼籲停止戰鬥、重新開放海峽並清理污染。他希望藉這場行動，讓外界關注戰爭對海洋環境的影響，而不只聚焦航運中斷。

現年56歲、擔任聯合國環境規劃署「海洋贊助人」的皮尤，過去一週花了3天進行這項挑戰。他從阿曼穆桑達姆半島出發，繞行同屬阿曼的荷莫茲角部分海域，並非橫越整條海峽。11月16日，他下水約半小時後，幾公里外便有一艘油輪遇襲；長泳期間另有船隻遭攻擊並起火。

荷莫茲海峽最窄處僅39公里寬。報導指出，今年2月美國與以色列發動空襲引爆衝突後，伊朗開始封鎖水道，並攻擊區域船隻。皮尤表示，這片水域也是海豚、海龜與儒艮的棲地。他在個人網站警告，戰爭的環境後果可能延續數個世代；這是他的倡議與判斷，並非獨立科學評估的結論。</p><p><a href="https://www.cna.com.tw/news/aopl/202611220013.aspx">中央社國際</a></p><ul></ul></article><article><h2>Signal將截圖限制擴及手機，回應作業系統AI代理隱私疑慮</h2><p>Signal宣布將截圖限制擴及Android與iOS，試圖降低作業系統層級AI代理擷取對話畫面的風險。這款通訊應用程式先前已在Windows版本預設封鎖截圖，如今把類似措施帶到行動平台；使用者仍可自行關閉這項設定。

Signal總裁Meredith Whittaker表示，Windows、Android及macOS／iOS讓AI代理掃描螢幕資訊的能力，正削弱Signal獨立保障隱私的能力。她主張，敏感資料一旦被擷取，就可能被儲存到作業系統AI代理當下使用的本機資料庫或遠端伺服器，而這些處理已超出Signal的控制範圍，也會影響同一段對話的其他參與者。

不過，截圖限制並不等於全面阻止AI存取資料。Whittaker承認，這仍是不完整的解法，無法處理AI代理可能透過其他更隱蔽方式取得應用程式資料的情況。她也警告，使用者若關閉限制，將破壞Signal所提供的隱私保障。這些風險判斷與保障範圍均為Signal方面的說法。</p><p><a href="https://techcrunch.com/2026/11/21/signal-restricts-mobile-screenshots-as-it-confronts-existential-threat-of-ai-surveillance/">TechCrunch</a></p><ul></ul></article><article><h2>美國執法共用資料庫NCIC傳疑遭入侵，川普稱情況不佳</h2><p>美國執法機關共用的NCIC資料庫傳出疑似遭駭，FBI正調查相關事件。這套線上資料庫供聯邦與地方執法機關交換令狀、背景查核等資訊，目前疑似入侵的範圍仍不清楚，尚不能確認哪些資料受到影響。

這起事件的疑慮不只在於敏感資訊是否外洩。一名前FBI官員表示，另一項關切是駭客是否可能破壞執法人員所依賴資訊的正確性。不過，這是對潛在風險的提醒，並不代表已發現資料遭到竄改，也不能據此認定執法作業已受影響。

美國總統川普在接受Fox News訪問時回應，才剛得知相關消息，並形容情況「不好」。另有報導指出，FBI曾在9月告知探員與支援人員，他們的個人資料在一次網路攻擊中遭竊；目前取得的資訊未說明該案與這次NCIC疑似入侵事件是否有關。</p><p><a href="https://techcrunch.com/2026/11/21/trump-says-reported-fbi-database-hack-is-not-good/">TechCrunch</a></p><ul></ul></article><article><h2>菲律賓布局六大科技節點　新克拉克市先進製造園區分期開發</h2><p>菲律賓參與美國主導的「矽盛世」倡議，規劃以六大科技產業節點串聯半導體、人工智慧與關鍵礦物供應鏈。其中，新克拉克市將設置約1620公頃的先進製造園區，目前仍在整體合作框架規劃階段，菲方正爭取台灣廠商投資。

菲律賓軍事基地改建發展局副總裁裴拉塔11月21日向台商參訪團說明，六大節點各有分工：新克拉克市發展先進製造，大馬尼拉地區定位為IC設計中心，八打雁省設置AI運算中心，奧羅拉省作為數位連結門戶，布拉坎省發展晶圓製造，民答那峨島則作為關鍵礦物走廊。

依裴拉塔說明，先進製造園區整體開發預計需要20至25年，未來五年將先處理土地整備、公用設施管線與道路，再逐步興建廠房。他並表示，新克拉克市的科技園區目前已有三家國際企業進駐，業務涉及電動車電池與儲能、電子設備及衛星相關設備；這項進駐說法與先進製造園區的長期開發規劃，仍須分開看待。

水電供應是台商關注的條件。菲律賓台商總會副總會長簡良達表示，當地電力與水資源成本相對較高，未來電力需求估計達2000兆瓦，目前政府已引進近200兆瓦可用電力。現有水井供應量足以應付目前需求，相關單位另規劃海水淡化及地表蓄水，因應後續發展。

菲律賓政府的半導體與電子產業發展路線圖，設定2030年培育12萬8000名技術人才、將相關產品出口額提高至1100億美元的目標，並朝先進封裝、IC設計與高附加價值製造發展。這些仍是政策目標，與園區目前的基礎建設進度有所區別。</p><aside>編輯觀察：對潛在投資者而言，產業節點定位只是起點；分期開發時程、水電成本與供應能力，才是評估設廠條件時必須對照的具體資訊。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611210199.aspx">中央社科技</a></p><ul></ul></article><article><h2>美科技股遭拋售　那斯達克100單週跌10.4%、進入熊市</h2><p>美國科技股11月20日大幅下挫，投資人對人工智慧投資回報、企業融資成本與股票估值的疑慮持續升高。那斯達克綜合指數當天下跌5.3%，單週跌幅達10%；另一項科技股指標那斯達克100指數則單日下跌5.6%、單週下跌10.4%，兩者不能混為同一指數。

那斯達克綜合指數較近期高點回落近20%，處於熊市邊緣，成分股市值一週蒸發超過4兆美元。那斯達克100指數則較10月高點下跌20%，進入熊市區間。兩項指數均出現疫情危機以來最差的單週表現，顯示賣壓並非集中在少數個股。

晶片類股是重災區。輝達20日下跌14%，美國半導體指數下跌10.7%，記憶體與晶片業者普遍承壓。跌勢也擴散至大盤，標普500指數當天下跌3.7%、單週下跌8.6%，較10月高點回落超過10%，進入修正區間；道瓊工業指數單週下跌8%。

市場重新檢視AI基礎建設支出能否轉化為獲利。聯博投資組合經理魯索表示，團隊今夏已開始減持半導體及其他受惠AI基建支出的股票，理由包括先進AI企業獲利前景不明、融資成本攀升，以及公眾反彈阻礙資料中心興建；他並預期AI支出成長將持續放緩，這是投資判斷，並非已確定的產業結果。

資金同時轉向防禦型類股。沃爾瑪20日逆勢上漲逾1%，好市多、嬌生與寶僑也各有約1%漲幅。不過，通膨壓力與後續升息預期仍牽動公債殖利率及企業借貸成本，市場期待貨幣政策緩解賣壓，仍面臨限制。</p><aside>編輯觀察：這波調整同時涉及AI投資回報與資金成本，不能只用單一公司消息解釋。辨明指數差異，也有助避免將部分科技股的熊市狀態誤套到整體市場。</aside><p><a href="https://www.cna.com.tw/news/afe/202611210053.aspx">中央社財經</a></p><ul><li><a href="https://the-decoder.com/us-technology-stocks-suffer-their-worst-weekly-loss-since-the-pandemic-as-ai-doubts-pile-up/">The Decoder</a></li></ul></article><article><h2>比特幣觸及兩年低點後反彈逾8%　回升至近6萬美元</h2><p>比特幣11月21日一度跌至5萬5251.60美元、創兩年低點，隨後反彈逾8%，回升至約5萬9952美元。美東標準時間當天上午8時30分左右，價格曾短暫突破6萬美元，呈現急跌後回升的劇烈震盪。

前一則行情報導記錄，比特幣在美東時間20日晚間11時13分下跌5.10%，報5萬5830美元，當時已是2024年9月以來低點。較新的報導顯示，價格其後再探低，才出現反彈；因此，近6萬美元是後續回升價位，並非這波跌勢的最低點。

這波加密貨幣震盪與其他風險資產承壓同時發生。市場疑慮包括AI基礎建設巨額支出能否帶來獲利、借貸成本上升，以及美國期中選舉後的監管風險。美元走強、實質殖利率上升與市場波動加劇，也被報導列為加密貨幣面臨的壓力；這些是多重市場因素，不能據此認定單一原因主導價格。

比特幣走勢日益與股市同步之際，美股20日也延續跌勢，標普500指數與道瓊工業指數確認進入修正區間。比特幣雖已從低點反彈，現有行情資訊仍不足以判定這波風險資產賣壓已經結束。</p><aside>編輯觀察：急跌後反彈與跌勢結束是不同判斷。觀察加密貨幣風險時，仍須同時留意股市、美元及融資環境，而非只看單次反彈幅度。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611220017.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611210188.aspx">中央社財經</a></li></ul></article><article><h2>台股重挫後擴大禁空　11月23日起全面限制平盤下放空</h2><p>台股單週重挫7641點後，金管會11月21日宣布加碼5項穩市措施，自11月23日起，上市櫃股票及台灣存託憑證全面實施平盤下禁空。國安基金同日表示，已依11月6日臨時委員會議授權進場護盤，後續將視市場情況採取必要措施。

新制要求投資人融券或借券賣出時，價格不得低於前一營業日收盤價；證券商、期貨商因業務避險需求進行的融券及借券賣出則不受限制。這項規定針對放空交易，並非禁止持有股票的投資人自行決定賣價。金管會另將最低融券保證金成數由130%提高至150%，並暫停受理證券商申請發行認售權證上市櫃案件。

其餘措施包括鼓勵上市櫃公司適時實施庫藏股，若於今年第4季至明年第1季期間屆滿或執行完畢，可納入今年ESG評鑑指標得分；也鼓勵金融機構等出借人暫停對外出借股票，已出借部分則依契約提前召回或到期不續借。

這是金管會本月再度擴大放空限制。11月20日起實施的規定，原本針對當日收盤跌幅達3.5%以上的個股，限制下一交易日平盤下放空；新措施不再以個股跌幅為條件。市場去槓桿壓力仍大，集中市場與櫃買市場週五融資合計單日減少新台幣637億元，費城半導體指數也重挫10.73%。

對於後市，台新投顧策略長黃文清認為，限縮放空工具有助穩定信心，融資大減後有機會逐步落底；第一金投顧董事長黃詣庭則認為，台股本波跌幅近3成，投資價值已浮現。這些屬法人對走勢的判斷，並非市場已止跌的確定訊號。</p><aside>編輯觀察：此次政策變化是從依個股跌幅啟動的條件式禁空，擴大為全市場限制。投資人須區分放空交易限制、一般持股賣出與業務避險例外，也不宜把穩市措施或法人看法視為落底保證。</aside><p><a href="https://www.cna.com.tw/news/afe/202611210127.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611210177.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/afe/202611210132.aspx">中央社財經</a></li></ul></article><article><h2>美擴大第三國遠端算力管制　輝達停供中國Hopper晶片</h2><p>美國擴大先進AI晶片出口管制，將向中國客戶提供雲端算力的第三國資料中心納入規範。輝達代理執行長克瑞斯則在財報電話會議表示，公司不再向中國出貨Hopper資料中心晶片。在黃仁勳辭去公司要職後，出口合規與董事會監督成為輝達治理調整的重點。

美國商務部新規的管制對象，除了輸往中國的AI晶片、伺服器，以及中國企業在海外設立的子公司資料中心，也涵蓋透過第三國向中國客戶提供算力服務的資料中心，以防止中國客戶藉遠端存取使用先進AI晶片。新加坡、泰國、馬來西亞、印尼及巴西企業若要取得最先進晶片，也須申請美國出口許可。

公司治理方面，輝達11月17日成立國家安全與出口管制監督委員會，在董事會層級監督國安政策、出口管制遵循及全球貿易風險管理。對於黃仁勳是否回任，公司目前表示沒有相關計畫；這項立場與外界要求他回歸的聲浪有所區別。

克瑞斯也表示，輝達將重新審視融資對象，規劃把土地、電力及資料中心建築主體列為優先重要項目，並讓融資基金扮演更重要角色，同時持續與具實力的現有客戶合作。這些說明呈現融資優先順序的調整，但目前取得資料未界定完整融資範圍，不能據此認定其他項目已被排除。</p><aside>編輯觀察：管制焦點不再只是晶片實體運往何處，也包括第三國資料中心向誰提供算力。判讀對輝達業務的影響，須分開看待政府管制範圍、公司停供決定與治理安排，不能將三者混為單一禁令。</aside><p><a href="https://www.cna.com.tw/news/afe/202611220026.aspx">中央社財經</a></p><ul><li><a href="https://techcrunch.com/2026/11/21/a-tale-of-two-nvidias/">TechCrunch</a></li></ul></article><article><h2>輝達擴大與六家台廠合作　以現金投資、長約增加製造產能</h2><p>輝達11月18日宣布擴大與台積電、鴻海、矽品、京元電、景碩及欣興等6家台廠合作，透過增加現金投資、簽訂多年期合約等方式，在台灣擴大載板、先進封裝、晶圓及委託製造產能，支援AI基礎設施建置。這項布局發生在黃仁勳辭任執行長後，合作能否延續也成為市場關注焦點。

輝達表示，將以既有製造基礎擴大零組件、先進封裝及系統生產能力，提升目前與下一代加速運算平台的生產規模。供應鏈廠商則指出，確保先進封裝產能是為了降低瓶頸影響，相關限制已延誤產業的AI系統交付速度。

台灣經濟研究院產經資料庫總監劉佩真分析，AI算力需求仍大於供給，長約與擴產計畫有助台廠銜接輝達新一代Vera Rubin晶片平台製造，提升未來數年先進製程、先進封裝及載板的訂單能見度。她認為，既有訂單排程與長期合約，加上代理執行長克瑞斯強調持續合作，使台灣半導體及AI供應鏈短期訂單不致因高層異動受到影響。

不過，劉佩真也指出，輝達正式執行長的全球遴選結果尚未確定，新任領導者能否維持技術遠見、供應鏈議價力及生態系凝聚力，仍有變數。中長期應觀察新領導團隊對產品藍圖與供應鏈合作的規劃，以及美國對中管制是否影響台廠出貨的合規成本；短期訂單穩定的判斷，不等於長期合作條件已經確定。</p><aside>編輯觀察：現金投資與多年長約是可具體辨識的合作措施，但未來訂單、競爭優勢及接班影響仍涉及預測。評估這項布局，應區分已宣布的產能合作與尚待驗證的營運成果。</aside><p><a href="https://www.cna.com.tw/news/afe/202611220025.aspx">中央社財經</a></p><ul></ul></article><article><h2>亞馬遜據報洽購Decart約75億美元，談判進入後期仍可能破局</h2><p>亞馬遜據報正洽談以約75億美元、約新台幣2470億元收購AI新創公司Decart，雙方協商已進入後期。報導引述消息人士指出，交易最快下週初可望達成，但仍有破局可能，目前並非已完成的收購案。

這項潛在交易的重點是AI運算效率。Decart的主力軟體可讓AI模型更有效率地運行，釋出晶片運算容量；公司也是亞馬遜Trainium3晶片的早期採用者，已用這款晶片驅動旗下產品。亞馬遜在2025年底推出Trainium3，與輝達的GPU競爭，收購若成案，可望強化其雲端部門的AI能力。

Decart由3名以色列工程師於2023年創辦，今年5月募得3億美元後，估值達40億美元，早期投資人包括Radical Ventures、紅杉資本、Benchmark及輝達。此次傳出的收購金額高於該輪募資後估值，但仍須等待協商結果。

Decart的美國總部位於舊金山，也是Lucy及Oasis的開發者，產品具備即時編輯影片及生成互動式虛擬世界的能力。對於收購消息，亞馬遜未回應置評請求，Decart則拒絕置評，交易條件與最終結果尚未獲雙方證實。</p><aside>編輯觀察：這項潛在交易顯示，AI算力競爭不只涉及晶片供給，也涉及提高既有運算資源效率的軟體能力；但在交易確認前，不能將預期效益視為已實現成果。</aside><p><a href="https://www.cna.com.tw/news/afe/202611220015.aspx">中央社財經</a></p><ul></ul></article><article><h2>有國銀前10月偵測2170萬次異常探測及攻擊，銀行強化供應商控管</h2><p>國內銀行面臨的外部異常探測與攻擊增加，有一家未具名國銀今年前10月累計偵測約2170萬次。這是單一銀行的偵測數據，並非全體國銀合計，也不代表成功入侵次數。多家銀行表示，正透過多層次防禦、委外供應商管理及AI輔助分析應對威脅。

合庫銀行表示，截至10月底，月均攻擊量約為去年的2倍，主要鎖定官網、網路銀行、企業金融及電子帳單等對外服務網站，均已成功防禦。第一銀行則統計，前10月網站應用程式防火牆累計攔阻約220萬次攻擊，第3季起探測活動明顯增加；台灣銀行觀察到的攻擊，以自動化掃描、弱點探測為主。

攻擊自動化程度提高，仍不等於已證實由AI自主發動。合庫與一銀均表示，目前尚未發現可明確認定為AI自主發動的攻擊；台銀則指出，實務上難以明確區分是否涉及AI技術。

在第三方服務管理上，台銀表示，系統上線前須通過原始碼掃描、安全設定檢核、弱點掃描及滲透測試。一銀落實供應商風險評估、權限控管與異常監控；合庫則透過網路隔離、滲透測試及持續監督強化防護。銀行也藉攻防演練找出流量清洗、應用程式安全與帳號權限管理的改善空間。

AI防禦工具與AI代理的導入進度則有所不同。一銀已使用具AI分析能力的網路及端點偵測應變系統，台銀部分工具也有AI輔助功能，合庫仍在測試驗證相關技術。對AI代理，各銀行持續評估資料、權限及資安風險，涉及重要判斷或處置仍保留人工審核。</p><aside>編輯觀察：判讀金融資安風險，必須區分異常探測、遭攔阻攻擊與成功入侵。除了攻擊數量，供應商管理、演練後的改善及重要決策是否有人員把關，也是觀察防禦能力的重點。</aside><p><a href="https://www.cna.com.tw/news/afe/202611220031.aspx">中央社財經</a></p><ul></ul></article><article><h2>TeamT5稱應變案件增至婉拒新客戶，籲危急漏洞評估暫時下線</h2><p>資安事件應變需求增加，TeamT5杜浦數位安全執行長蔡松廷表示，公司近期案件量暴增，連分析師都投入支援，成立9年多來首次因案件過多而婉拒新客戶，目前仍持續調度人力，希望承接更多需求。這是單一業者揭露的服務量能狀況，尚不能據此推算整體市場規模。

蔡松廷觀察，這波攻擊自9月出現、10月起明顯增加，受害企業跨越不同行業。他認為，AI讓攻擊速度、規模及精密程度提高，也降低發動攻擊的門檻；相較過去固定模式的自動化攻擊，AI可依目標系統設定與環境調整手法。這些屬於他的趨勢判斷，不能據此認定所有近期事件均由AI自主發動。

漏洞修補同時牽涉營運風險。蔡松廷指出，企業為避免更新影響服務，通常先在非核心設備測試，再逐步部署至重要系統，期間仍可能暴露於攻擊。他建議投入更多資源掌握漏洞、評估影響並建立應變能力，同時盤點重要資產，依系統重要性決定修補順序；若漏洞危急又無法立即修補，可將系統暫時下線納入選項。

對於以AI防禦AI的做法，蔡松廷提醒，防守方還須處理誤判、系統權限及失敗代價，實務上難以直接授權AI全自動防禦，仍需人員判斷與決策。莒光科技顧問陳嘉宏則建議，主動以AI模擬攻擊、找出漏洞，並將AI代理攻擊納入平時演練，檢驗防禦與應變流程。

個人防護方面，蔡松廷建議即時更新手機作業系統、APP與瀏覽器，從官方管道安裝軟體，避免不明連結，並勿重複使用密碼。陳嘉宏提醒，若發現網銀異常轉帳，應先保留截圖、向銀行反映並報警。</p><aside>編輯觀察：這起業者揭露凸顯，資安防禦除了工具能力，也涉及應變人力與營運取捨。高風險系統是否暫時下線，應結合漏洞危急程度、修補可行性及服務中斷影響判斷，而非一律交由自動化工具處理。</aside><p><a href="https://www.cna.com.tw/news/afe/202611220029.aspx">中央社財經</a></p><ul></ul></article><article><h2>Thinking Machines發布Inkling 2 Mini，以循環架構延長內部運算</h2><p>Thinking Machines發布開放模型Inkling 2 Mini，採用循環式Transformer架構，在處理每個詞元時重複執行部分模型層。公司表示，這種設計能讓模型在內部進行較長時間的推理，不必同步產生更多文字，以較少詞元找到答案。

模型共有24層，其中12層會連續執行三次。依公司公布的規格，Inkling 2 Mini採混合專家架構，總參數量為264億；計入循環運算後，每個詞元啟用54億參數。模型可處理文字與影像，上下文視窗為100萬詞元，採Apache 2.0授權。

在外部評測方面，Artificial Analysis給予Inkling 2 Mini的智慧指數20分，與Qwen3.8 27B相同；該評測的比較顯示，其成本約為後者六分之一、速度約為四倍。這些數字屬特定評測結果，不代表所有使用情境都會有相同比例的差距。

取得方式包含從Hugging Face下載模型權重，以及可調整循環次數的研究版本，也能透過Tinker Playground試用。本機執行條件包括至少具備32 GB記憶體的Mac，或Nvidia的DGX Spark，讓開發者可在雲端試用之外評估本機部署。</p><aside>編輯觀察：這次發布值得觀察的不只是評測分數，也包括以重複運算取代更多文字輸出的架構選擇，以及開放權重、本機執行條件是否適合實際需求。</aside><p><a href="https://the-decoder.com/new-open-model-inkling-2-mini-thinks-in-loops-to-solve-problems-with-fewer-words-and-still-runs-on-a-laptop/">The Decoder</a></p><ul></ul></article><article><h2>Anthropic數學家宣稱與Claude找到黎曼猜想證明，另一份人類草稿也待檢驗</h2><p>Anthropic數學家Levent Alpöge宣稱，他與Claude合作找到黎曼猜想的證明，並已在個人網站公布論文及配套程式碼。他也主張，方法涵蓋廣義黎曼猜想。不過，提出證明主張不等於猜想已獲解決，相關內容仍須接受數學界檢驗。

依Alpöge的說法，合作初期由他設定研究方向，先在簡化模型上結合兩種方法，再推進至實際問題。他將關鍵構想歸功於Claude：透過串接特殊數學變換，模擬類似微分的作用，並找出變換次數與數列長度平方根之間的關係。

Alpöge表示，若將完整論證印出，篇幅將超過25萬頁，因此以Lean程式語言、分成14個資料套件發布。Lean可逐步檢查邏輯推導是否符合規則，但若最初把數學命題轉寫成程式時出錯，仍可能驗證了不同於原問題的內容。他計畫在未來幾個月撰寫人類可閱讀的版本。

另一條證明路線也在同日公開。史丹佛大學數學教授Ravi Vakil分享Alessandro Masullo撰寫的廣義黎曼猜想獨立證明草稿，強調該研究未使用AI。Vakil表示，Brian Conrad已審閱數月並提供意見；原本預計再花一年修訂，但Alpöge的宣布促使團隊提前公開目前版本。

約八小時後，Vakil更新文章，表示已有多人回報Masullo草稿中的問題，部分問題是在不同AI模型協助下發現。他強調，所有疑點都必須解決到數學界滿意，證明才能獲得接受，並未保證其策略正確。黎曼猜想涉及ζ函數非平凡零點的位置與質數分布；目前應區分兩份證明主張、形式化檢查與最終學術認可，不能逕稱這項難題已被破解。</p><aside>編輯觀察：這起事件的科學重點是證明能否通過檢驗，而非人類與AI誰先宣布成功。形式化工具能協助核查推導，但命題轉寫是否正確、草稿疑點是否排除，仍是判斷主張成立與否的關鍵。</aside><p><a href="https://the-decoder.com/hours-after-anthropic-claims-a-claude-proof-of-the-riemann-hypothesis-stanford-releases-an-all-human-competing-draft/">The Decoder</a></p><ul></ul></article><article><h2>Shortical以演員授權臉孔製作全AI短劇，報酬與平台模式仍待釐清</h2><p>短劇新創Shortical推出全AI製作的《Inevitable》，使用演員Aki Avni授權的臉孔建立數位分身。作品上週在洛杉磯首映，劇情也圍繞Avni飾演自己、將臉孔授權給片商後發生的驚悚事件，讓授權安排同時成為製作方式與故事題材。

這是Shortical首次使用真人肖像製作內容。公司說明，與Avni的合作是直接簽訂協議，並非透過網站的臉孔授權招募機制；該招募服務仍在早期階段，尚未促成任何簽約。網站目前讓有意者提交社群帳號，再由公司決定是否提出載明使用條件的合約。

報酬仍有不少未公開之處。Shortical未透露Avni的合約金額，僅表示他以專案合作夥伴身分參與，報酬符合可比較的非AI演出行情。至於其他授權者能否獲得類似電視重播分潤的持續報酬，執行長Guy Shimoni表示將逐案處理，不能將Avni的安排視為所有人的共同條件。

Shortical主要靠訂閱營收，通常先免費提供一部短劇的前7至10集，再以月費開放全站內容。Shimoni主張，AI能讓較小團隊製作過去受預算限制的奇幻場景；但短劇顧問Jennifer Cooper對需求持保留態度，認為部分AI內容雖有觀看量，供給推動的力道可能大於觀眾主動需求。授權作品已經推出，是否能形成穩定的創作者收入與觀眾市場，仍不能由單一案例判定。</p><aside>編輯觀察：取得肖像同意與建立合理報酬是不同問題。這個案例提供了真人授權製作AI影像的具體做法，但尚未公開的合約條件與逐案報酬安排，不足以證明一般參與者能獲得相同保障。</aside><p><a href="https://techcrunch.com/2026/11/21/is-selling-an-ai-version-of-your-face-to-this-microdrama-startup-the-future-of-hollywood/">TechCrunch AI</a></p><ul></ul></article><article><h2>GG Technologies在印度控告Apple侵權，要求限制NameDrop並求償150億盧比</h2><p>美國新創公司GG Technologies在印度控告Apple，指其讓裝置靠近即可交換聯絡資訊的NameDrop功能侵犯專利，要求賠償150億盧比，並聲請禁制令。原告也要求法院限制搭載NameDrop的iPhone與Apple Watch在印度銷售或進口；案件尚未排定開庭，這些要求並非已生效的禁售裁定。

GG Technologies是聯絡資訊交換應用程式StayTouch的開發商。依TechCrunch檢視的孟買高等法院訴訟文件，公司指控NameDrop侵犯其印度專利，涉及讓手機不必手動配對，就能與附近裝置交換聯絡資訊的技術。GG Technologies表示，雙方4月啟動調解、9月未能達成協議，因此於10月提告。

相關產品與專利申請的時序，也是這起爭議的背景。GG Technologies於2019年推出StayTouch，同年在美國尋求專利保護，2021年提出印度專利申請，並於2024年7月取得專利。Apple則於2023年6月隨iOS 17介紹NameDrop，同年在iPhone推出，之後透過watchOS 10.1支援相容的Apple Watch。

爭議也延伸至美國。GG Technologies於4月就相關專利主張提告，美國國際貿易委員會則於8月依該公司申訴展開調查；公司尋求限制涉嫌侵權裝置的進口與銷售。侵權目前仍是原告主張，TechCrunch報導刊出時，Apple未回應其置評請求。</p><p><a href="https://techcrunch.com/2026/11/20/startup-sues-apple-in-india-over-tap-to-share-contacts-feature/">TechCrunch</a></p><ul></ul></article><article><h2>宜蘭縣長政見會交鋒投資爭議，吳宗憲、林國漳各提縣政方案</h2><p>宜蘭縣長選舉第2場公辦政見會11月21日登場，國民黨候選人吳宗憲與民進黨候選人林國漳互相質疑投資涉及中國的爭議。兩人也分別提出縣府法律支援、行政效率、環境、觀光與社福政策，說明當選後的施政方向。

吳宗憲表示，合法的兩岸生意往來並無問題，但質疑林國漳投資並擔任監察人的艾特先進半導體與中國有業務往來，要求說明是否涉及他所稱的「賺紅錢」，以及未來如何迴避。林國漳回應，當年是受高中同學邀請，基於情誼提供法律協助並投資，認為公司業績成長、拓展中國市場也是實力展現；他並反問，吳宗憲持有的股票也涉及中國投資，是否應以同樣標準看待。上述投資爭議均為雙方在政見會上的說法。

行政效率方面，兩人都主張加強公務員法律支援。林國漳承諾運用30年法律專業，對依法執行職務卻遭提告的公務員提供協助，並以數位系統減少重複公文。吳宗憲則提出設置「宜蘭縣府公職律師」，保障第一線公務員權益，讓公務員安心任事。

環境政策上，吳宗憲主張加強水質控管，以AI稽查各地排放水，並減少家庭、賣場及學校的剩食浪費；山坡地開發則應依法嚴格審查，維護生態。

林國漳提出「觀光立縣2.0」，主張結合海洋與山脈資源，吸引遊客全年到訪、住宿與消費；農業方面承諾提高保險補助、倍增有機農地。他也提出智慧敬老卡、興建勞工活動中心，以及透過縣府採購引導企業加薪等措施。這些內容均屬候選人的競選承諾，尚非已執行的政策成果。</p><p><a href="https://www.cna.com.tw/news/aipl/202611210227.aspx">中央社政治</a></p><ul></ul></article><article><h2>蘇巧慧、沈伯洋三重聯合造勢，賴清德倡雙北合作與區域共榮</h2><p>民進黨新北市長候選人蘇巧慧與台北市長候選人沈伯洋11月21日在新北市三重區三和國中聯合造勢，兼任民進黨主席的總統賴清德到場助選。這場以「洋流慧聚」為號召的活動，將雙北生活圈、城市分工與區域合作列為主要訴求。

沈伯洋表示，面對AI、資訊爆炸與全球化等挑戰，城市需要了解世界趨勢及台灣、雙北定位的人承擔治理責任。他主張台北與新北除了分工合作，也要維持良性競爭、與世界接軌，並呼籲支持者在11月28日投票，以選票決定城市未來。

賴清德則表示，雙北屬於同一生活圈，城市關係應從競爭走向競爭與合作並存。他提及沈伯洋對雙城論壇的構想，認為交流對象不應只有台北與上海，也可擴及東京、紐約、巴黎及倫敦，而台北更應優先與新北舉行論壇交流。賴清德將當晚活動形容為開啟雙北交流的象徵，並主張城市治理應進一步走向區域共榮。

蘇巧慧表示，自己已接受新北市民3次檢驗，期盼從新北連結台北，進一步牽起基隆、桃園。賴清德也以蘇巧慧的「新皇冠計畫」、「鑽石山城計畫」及各行政區政見為例，表達對其觀光發展構想的支持。相關內容是候選人及助選者提出的治理願景，並不代表雙北已建立新的合作機制或取得施政成果。</p><p><a href="https://www.cna.com.tw/news/aipl/202611210224.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611210218.aspx">中央社政治</a></li></ul></article><article><h2>柯文哲、蔣萬安同台民眾黨造勢　強調財政紀律與延續市政</h2><p>民眾黨11月21日晚間在台北市政府前廣場舉辦選前造勢，邀請台北市長蔣萬安出席。創黨主席柯文哲與蔣萬安同台，表達支持並勉勵他穩紮穩打；蔣萬安則感謝柯文哲過去8年為台北市政打下基礎，期盼建設持續推進。

蔣萬安以財政紀律與社會住宅說明市政延續，表示柯文哲交接時曾提醒他重視財政、持續興建社宅。他並稱，柯文哲任內清償城市債務新台幣570億元，自己接任後清償430億元，兩人任內合計還債1000億元；這些數字是蔣萬安在造勢場合提出的說法。

談及選舉合作，蔣萬安感謝民眾黨與國民黨並肩作戰，表示若要達成2028年勝選目標，2026年就必須勝選，呼籲支持者團結。柯文哲則表示，民眾黨即使力量仍小，也會堅持做對的事、投入地方服務，並呼籲支持者11月28日出門投票。</p><p><a href="https://www.cna.com.tw/news/aipl/202611210217.aspx">中央社政治</a></p><ul></ul></article><article><h2>柯志恩鳳山造勢承諾拆既有光電板　主張水庫不設光電</h2><p>國民黨高雄市長候選人柯志恩11月21日晚間在鳳山造勢，將能源政策列為競選訴求，承諾若當選，將拆除既有光電板，並不讓水庫設置太陽光電。立法院長韓國瑜、前立法院長王金平等人到場助選。

活動在高雄捷運鳳山西站旁空地舉行。柯志恩批評，高雄環境受到錯誤能源政策影響，並以此提出拆除光電板的承諾。她也表示自己沒有派系、可以獨立做主，若當選將著手改革，呼籲選民支持政黨輪替。上述內容是候選人的競選主張，並非已實施的政策。

助選者也分別提出教育、投資與能源訴求。韓國瑜期盼透過雙語教育讓下一代走向世界，並藉招商引資讓企業投資高雄、減少年輕人外流。王金平則表示，高雄需要培育高科技人才、改善投資環境，發展高科技等產業也須重視水電供應，並呼籲選民重視此次公投、支持恢復核能發電。</p><p><a href="https://www.cna.com.tw/news/aipl/202611210222.aspx">中央社政治</a></p><ul></ul></article><article><h2>張國威邀李文良掃街、造勢　陳玉珍持續走訪金門基層</h2><p>金門縣長選戰出現競選合作進展。無黨籍候選人張國威先前在政見發表會表態支持同為無黨籍候選人的李文良，11月21日進一步邀他參加車隊掃街與造勢晚會，兩人在台上攜手高喊李文良當選。國民黨候選人陳玉珍則持續走訪市場、社區與地方活動拜票。

李文良表示，當天從上午開始掃街，行程由金沙、金湖，接續下午的金寧、烈嶼，最後集結金城，希望將支持從口號轉為具體同台行動。他感謝張國威支持，並表示後續除了各自原本規劃的競選行程，也會有部分行程相互配合。張國威則說，晚會原已安排、如期舉行，接下來也規劃與李文良一起掃街，向不同族群爭取認同。

陳玉珍採取持續接觸基層的方式，與地方社區及協會民眾交流在地議題。她表示，自己參選多年來很少舉辦大型造勢活動，主要靠平時經營累積支持；近日也持續走訪社區與協會，民眾若有議題或建議、希望面對面交流，可主動聯繫服務處。</p><p><a href="https://www.cna.com.tw/news/aipl/202611210207.aspx">中央社政治</a></p><ul></ul></article><article><h2>宋楚瑜籲跨黨派支持童子瑋　侯友宜陪謝國樑基隆掃街</h2><p>基隆市長選戰進入選前黃金週末，親民黨主席宋楚瑜11月21日公開呼籲支持民進黨候選人童子瑋；新北市長侯友宜則陪同尋求連任的國民黨候選人謝國樑掃街拜票。

宋楚瑜上午到基隆為親民黨提名的市議員候選人站台時表示，2000年參選總統期間，童子瑋的祖父童永曾無條件提供場地，讓他舉辦造勢活動，因此欠童永一份人情。他也說，童子瑋當初以無黨籍參選市議員時，自己就曾前往加油，呼籲基隆市民不分黨派、族群支持童子瑋。

童子瑋下午在市區車隊掃街，行政院政務委員季連成到場陪同。童子瑋表示，希望借重季連成的防災經驗，讓基隆面對各類災害時，具備更完整的事前準備與應變能力；若當選市長，將把防災列為城市治理的重要工作，強調安全是觀光、產業與建設發展的基本前提。

侯友宜上午陪謝國樑沿街向選民問候，受訪時表達對謝國樑選情的信心。謝國樑則表示，市府團隊過去幾年持續將市民需求落實為具體建設，呼籲選民繼續支持他及國民黨提名的市議員候選人，讓後續推動建設的力量更完整。</p><aside>編輯觀察：宋楚瑜的跨黨派表態與侯友宜的陪同掃街，呈現選前爭取支持的不同方式；童子瑋提出防災主張，謝國樑則訴求延續建設，政策內容與施政表現也是檢視這場選戰的重要面向。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611210189.aspx">中央社政治</a></p><ul></ul></article><article><h2>台東縣長選戰各自造勢　陳瑩提透明施政、吳秀華承諾用人唯才</h2><p>台東縣長選戰進入選前黃金週，民進黨候選人陳瑩與國民黨候選人吳秀華11月21日分別舉辦造勢活動。陳瑩承諾擔任全民縣長，以公開透明、依法行政及家庭支持政策爭取選票；吳秀華則提出青年在地就業、育兒與長者照顧願景，並承諾堅守財政紀律、用人唯才。

陳瑩下午在台東市四維路頭與黨提名的各級候選人舉辦團結造勢大會，前總統蔡英文等人到場助講。陳瑩表示，未來施政將以台東民眾為優先，保證清廉守法，家人不享特權，也不會圖利自身家族，並承諾依法行政，不讓公務人員陷入司法案件風險。

在具體政見上，陳瑩提出長者假牙、助聽器及智慧手環補助不排富；透過「青年夢想基金」支持創業、進修與成家，並補助青年租屋、購屋。育兒方面，她主張擴大公共托育與親子友善空間，讓父母能彈性上下班；教育方面則提出支持基層教師，運用新科技縮短城鄉資源差距。

吳秀華同日下午在台東市南京路舉辦最後一場大型造勢，由台東縣長饒慶鈴領軍，國民黨公職人員與提名人到場支持。吳秀華表示，希望讓想留在台東的青年有工作、有收入，想返鄉的人有機會與舞台；也主張從懷孕、生產、托育到教育提供更多支持，並在長者需要醫療及照顧時，由政府提供協助。

吳秀華另提出，希望農漁業、商家及觀光有更好的發展，讓台東的山水與多元文化創造更多機會。她承諾以財政紀律與用人唯才落實政策。兩人的訴求都涵蓋青年與家庭照顧，但陳瑩較著重補助及服務項目，吳秀華此次發言則以就業、照顧與地方發展願景為主。</p><p><a href="https://www.cna.com.tw/news/aipl/202611210197.aspx">中央社政治</a></p><ul></ul></article></main></noscript>
