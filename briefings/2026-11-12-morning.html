  <noscript><main><p>原定08:00 · 完成08:52 · 實際補刊09:03</p><h1>補刊 · 人工智慧模型更新、算力融資與平台治理動態</h1><p>2026-11-12 科技早報</p><article><h2>Google推出Gemini Decisions API，以專用模型支援多模態決策</h2><p>Google推出Gemini Decisions API，由Gemini Decision模型驅動，將多模態決策能力透過API提供給開發者。

Google將「快速」與「經校準」列為這項服務的特色。不過，目前取得的發布資訊未提供具體效能數據、比較基準或應用案例，這些描述仍屬公司對產品的定位，不能視為已經獨立驗證的效能結論。</p><p><a href="https://blog.google/innovation-and-ai/technology/developers-tools/gemini-decisions-api/">Google AI</a></p><ul></ul></article><article><h2>Google DeepMind公開基因活動分析與預測模型後續版本</h2><p>Google DeepMind公開用於分析與預測基因活動的模型後續版本，延續以人工智慧處理基因資訊的研究方向。

這項模型的用途聚焦基因活動分析與預測，而非一般對話助理。目前取得的資訊不足以比較新舊版本的能力差異，也無法判定其預測準確率、研究成果或臨床應用效益。</p><p><a href="https://www.yna.co.kr/view/AKR20261112013300091">Yonhap Korean</a></p><ul></ul></article><article><h2>CoreWeave轉向客戶預付款與合約融資，另規劃至少40億美元貸款</h2><p>人工智慧算力供應商CoreWeave正調整擴張資金來源，增加客戶預付款、以特定客戶合約支持的借款，並爭取價格較高的短期交易。公司第三季營收達36.6億美元、年增168%，但仍淨損7.09億美元，單季利息費用達8.46億美元，營收快速成長，但仍面臨虧損與高額利息支出。

CoreWeave表示，預期未來三個月可取得約90億美元的客戶預付款與訂金，其中逾30億美元來自已建置算力的新客戶合約，不必另行添購硬體。公司並計畫依需求動用合約支持的貸款，支應尚待建置的基礎設施，以履行總額1,325億美元的待履約訂單。

融資安排包含已完成與仍在規劃的交易。公司8月已完成一筆26億美元貸款，專為較短期客戶合約設計，可按資金需求分批借款；另據Bloomberg報導，CoreWeave在上調全年營收預測後，計畫透過投資等級貸款籌措至少40億美元，這筆資金尚不能視為已到位。

短約讓公司更頻繁調整價格，但也帶來取捨。CoreWeave表示，部分短期算力交易的每百萬瓦年收入超過4,000萬美元，新建基礎設施的四至五年期合約則為2,000萬至2,500萬美元。TechCrunch分析，貸款方較重視長約帶來的可預測現金流；短約策略能否持續奏效，仍取決於需求、續約及定價能力。

財報公布後，美股市場對AI投資的情緒回暖，標普與那斯達克指數均漲逾1%，輝達在連續兩個交易日大跌後止穩，那斯達克並收復前一週失土。不過，股票市場反應不代表債務風險解除：CoreWeave部分債券殖利率前一個月曾超過15%，顯示投資人仍關注資料中心投資回收前的資金壓力。</p><aside>編輯觀察：這起事件的關鍵不只在營收成長，而是AI算力擴張如何取得資金。預付款可減輕眼前借款需求，短約則提高調價彈性；但兩者都不能取代對履約能力、現金流與債務成本的檢視。</aside><p><a href="https://techcrunch.com/2026/11/11/coreweave-turns-to-customer-prepayments-shorter-contracts-to-fund-ai-growth/">TechCrunch</a></p><ul><li><a href="https://www.bloomberg.com/news/articles/2026-11-11/coreweave-plans-to-raise-at-least-4-billion-in-high-grade-loan">Bloomberg Technology</a></li><li><a href="https://www.cna.com.tw/news/afe/202611120010.aspx">中央社財經</a></li><li><a href="https://www.ft.com/content/639de881-6017-454f-abfa-cfb191d1e7cd?syn-25a6b1a6=1">FT Markets</a></li></ul></article><article><h2>OpenAI單季營收據報首破100億美元，較第二季增近五成</h2><p>OpenAI單季營收據報首次突破100億美元。TechCrunch報導，這項營收數字較公司第二季的67億美元增加近五成，顯示其營收規模進一步擴大。</p><aside>編輯觀察：這項數據提供觀察人工智慧商業化規模的具體指標，但營收成長不等於已實現獲利，兩者仍須分開判讀。</aside><p><a href="https://techcrunch.com/2026/11/11/openais-quarterly-revenue-reportedly-crosses-10b-for-the-first-time/">TechCrunch</a></p><ul></ul></article><article><h2>Anthropic預計11月19日掛牌，研調估首日散戶買超達2.5億美元</h2><p>Anthropic預計11月19日在美國那斯達克市場開始交易，首次公開募股（IPO）目標估值為1兆4000億美元。掛牌前的認購需求與散戶參與程度受到關注，但目前的超額認購消息與買盤預估，都不是上市後的實際交易結果。

金融市場研究公司Vanda Research預估，Anthropic上市首日的散戶買超金額將達約2億5000萬美元，是其所列SpaceX首次公開募股時1億1800萬美元的兩倍多，可能創下單日散戶買超紀錄。該公司並指出，自2024年以來，只有6檔股票曾出現單日散戶買超超過2億5000萬美元的情況。

這項估算參考歷來股票上市首日的散戶交易紀錄，以及Anthropic在Hyperliquid平台的IPO前永續期貨交易量。這類無到期日的衍生性商品讓投資人押注未上市公司的估值，與股票掛牌後的買賣不同，因此交易熱度仍不能直接視為未來買盤。

彭博另引述消息人士指出，Anthropic的IPO已獲數倍超額認購。彭博也將此次上市視為觀察人工智慧投資熱度的重要窗口，報導華爾街期待它帶動下一波人工智慧相關股票行情；這些期待能否實現，仍有待掛牌後的交易表現。</p><aside>編輯觀察：認購需求、衍生性商品交易量與掛牌後的股票買超是不同指標。分開觀察，才能避免把上市前的市場熱度誤當成已實現的資金流入。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120007.aspx">中央社國際</a></p><ul><li><a href="https://www.bloomberg.com/news/articles/2026-11-11/anthropic-ipo-is-jenga-block-holding-up-next-leg-of-ai-trade">Bloomberg Markets</a></li><li><a href="https://www.bloomberg.com/news/videos/2026-11-11/bloomberg-tech-11-10-2026-video">Bloomberg Technology</a></li></ul></article><article><h2>OpenAI據報以1.4兆美元估值洽談募資，部分投資人認為條件過高</h2><p>OpenAI據報為新一輪募資提出至少300億美元的新資金需求，估值條件為1兆4000億美元。彭博引述知情人士指出，部分投資人認為條件過高；這些數字仍是募資洽談條件，並非已完成交易的結果。

報導指出，OpenAI於9月下旬展開這一輪募資討論，在與表達興趣的潛在出資者初步接觸後提出條件。部分投資人的反應顯示，即使先前有參與意願，也不代表接受公司提出的估值與募資要求。</p><aside>編輯觀察：募資條件反映公司的資金需求與估值期待，投資人是否接受則是另一回事。部分投資人的疑慮值得關注，但不足以推論整輪募資受挫或市場全面轉向。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-11/openai-anthropic-valuations-fuel-vc-fears-of-startup-correction">Bloomberg Technology</a></p><ul></ul></article><article><h2>輝達董事會委任律師調查黃仁勳，國會要求出席閉門說明</h2><p>輝達董事會已委任律師事務所，調查執行長黃仁勳與一名被指涉嫌為中國從事間諜活動的女子之關係。《衛報》報導，董事會聘請紐約律師事務所 Wachtell, Lipton, Rosen &amp; Katz，由合夥人 Joon Kim 主導調查；相關情報活動指控尚不能視為已獲證實。

調查之外，黃仁勳的職務前景也受到關注。《紐約時報》報導，董事會預計開會討論他的去留；彭博所載消息則指，董事會正準備撤換黃仁勳。這些消息仍屬會議預期及人事變動報導，不能據此認定他已遭撤職。輝達股價在11月11日盤後交易下跌，彭博將市場反應與投資人評估黃仁勳可能離任的影響連結。

美國國會方面，眾議員 Brian Mast、John Moolenaar 與 Rick Crawford 已致函黃仁勳，要求他就與 Megaspeed 人員 Alice Huang 的關係，向相關委員會進行聯合閉門簡報。Moolenaar 表示，若黃仁勳未同意出席，可能遭到傳喚；Mast 也表示，其委員會正準備在未獲回應時發出傳票。這與已正式發出傳票仍有區別。

另一名眾議員 Raja Krishnamoorthi 也要求黃仁勳說明，並主張檢視輝達對中國的出口許可、加強防止先進美國晶片流向受限制中國實體的管制。相關要求已從個人關係爭議延伸至公司治理與出口合規，但目前仍是議員提出的主張，並非已公布的新管制措施。</p><aside>編輯觀察：董事會調查、管理階層去留與出口合規要求是不同層次的風險。判讀後續發展時，應分別確認正式調查結果、人事決議與監管措施，不能把市場反應或議員要求當成既定結論。</aside><p><a href="https://www.theguardian.com/technology/2026/nov/11/nvidia-hires-leading-us-law-firm-to-investigate-jensen-huang-relationship">The Guardian</a></p><ul><li><a href="https://www.nytimes.com/2026/11/11/technology/nvidia-jensen-huang.html">NYT</a></li><li><a href="https://www.bloomberg.com/news/articles/2026-11-11/nvidia-ceo-had-an-affair-with-health-executive-at-firm-nyt-says">Bloomberg Technology</a></li><li><a href="https://techcrunch.com/2026/11/11/congress-to-call-jensen-huang-in-to-answer-for-alleged-chinese-spy-affair/">TechCrunch</a></li><li><a href="https://www.bloomberg.com/news/videos/2026-11-11/nvidia-china-scandal-demands-answers-says-congressman-video">Bloomberg Technology</a></li><li><a href="https://www.bloomberg.com/news/articles/2026-11-11/nvidia-tumbles-as-investors-consider-future-without-ceo-huang">Bloomberg Markets</a></li></ul></article><article><h2>Megaspeed列管爭議升溫，泰國專家憂晶片監管收緊衝擊資料中心</h2><p>輝達客戶 Megaspeed 涉嫌將美國晶片轉運至中國，引發美國政府內部對出口管制執行的爭議。知情人士表示，美國財長貝森特曾在白宮戰情室會議中，當面質問商務部長盧特尼克，為何尚未將 Megaspeed 列入商務部實體清單；盧特尼克回應會了解此事。相關交涉來自知情人士說法，並非已公布的列管決定。

依這些人士的說法，盧特尼克過去一年曾阻擋其他官員追究 Megaspeed 責任的行動，顧慮是可能使美中貿易戰升高；商務部次長凱斯勒也曾多次接獲相關警告，但表示應由部長決定。Megaspeed 非法轉運晶片的說法目前仍屬指控。

這場爭議也讓東南亞人工智慧供應鏈面臨更多不確定性。泰國 IMC Institute 執行董事塔納猜向中央社表示，美國可能更密切監控泰國及其他東南亞國家的繪圖處理器流向，尤其關注是否有企業透過第三地將運算能力輸往中國。他認為，泰國資料中心取得晶片原已不易，若管制進一步收緊，短期發展可能受影響，但不至於改變人工智慧產業的長期趨勢。

另一方面，泰國內閣已批准將資料中心分為七個等級的新監管架構，既有計畫須遵守統一營運及監督標準，新案與尚未獲准的項目則將接受更嚴格審查，涵蓋選址、電力、供水、社區影響及經濟效益。這是泰國本地監管制度的調整，不等同美國已對泰國實施新的晶片限制；晶片取得難度可能增加，仍是專家的條件式預測。</p><aside>編輯觀察：人工智慧基礎設施投資同時受到晶片流向審查與當地設置規範影響。對業者而言，是否正式列管、出口許可如何變動，以及資料中心審查標準，應分開評估，避免將政策爭論誤認為已生效的供應限制。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120008.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611110321.aspx">中央社財經</a></li></ul></article><article><h2>英國Fractile獲7.2億美元融資，投入人工智慧專用晶片競爭</h2><p>英國 Fractile 取得7.2億美元融資，持續投入人工智慧專用晶片領域。TechCrunch 報導指出，這筆融資使 Fractile 成為該領域募資規模居前的業者之一。

這項消息呈現資金持續投入人工智慧專用晶片的動向，但募資規模本身不能證明產品效能或商業進展，也不能據此判定 Fractile 已在晶片市場取得領先地位。</p><p><a href="https://techcrunch.com/2026/11/11/with-720m-round-britains-fractile-gets-a-leg-up-in-the-race-for-ai-chips/">TechCrunch</a></p><ul></ul></article><article><h2>Microsoft提出資料中心供電目標：不靠政府補貼、不推高其他用戶成本</h2><p>Microsoft提出資料中心供電目標，希望找到不依賴政府補貼、也不增加其他電力用戶成本的供電方式，將算力建設的電力成本分攤問題納入公司承諾。

這是Microsoft提出的方向，並非已完成的供電或費率安排。目前取得的資訊未交代具體執行方案、適用地區與時程，也不足以確認公司已取得所需電力或落實上述目標。</p><aside>編輯觀察：這項承諾把資料中心用電需求與成本由誰承擔連在一起；後續判斷重點應是具體供電及費率安排，而非將目標視為已落實的成果。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-11/microsoft-vows-to-pay-its-own-way-to-power-data-centers">Bloomberg Technology</a></p><ul></ul></article><article><h2>資料中心擴張遇地方反對與供電競爭，宣布計畫未必落地</h2><p>資料中心建設熱潮正遭遇地方反對、許可延誤與電力資源競爭。TechCrunch的影音與節目內容指出，這些現實障礙拖慢建設，而更基本的問題是，許多已宣布的專案可能根本不會興建。

這項判斷涉及人工智慧基礎建設從宣布到落地的落差，但目前取得的內容未列出個別取消案、未落地比例或相關投資損失，不能據此推算整體建設規模將縮減多少。</p><aside>編輯觀察：評估人工智慧基礎建設供給時，應區分宣布計畫與實際落地；地方接受度、許可與供電條件，都是不能由投資宣示取代的檢視項目。</aside><p><a href="https://techcrunch.com/video/why-the-data-center-you-dread-might-never-even-be-built/">TechCrunch</a></p><ul><li><a href="https://techcrunch.com/podcast/how-backlash-and-red-tape-continue-to-slow-data-centers-post-blue-wave/">TechCrunch AI</a></li></ul></article><article><h2>國科會預告增修核心關鍵技術清單，納高階AI晶片載板與低軌衛星通訊</h2><p>國科會11月11日預告修正國家核心關鍵技術項目，擬新增4項、變更6項，清單總數預計由42項增至46項。新增範圍涵蓋高階AI晶片載板、無人機與低軌衛星通訊等領域，目前仍在預告階段，尚未完成審認及公告程序。

新增技術包括國科會主管的「低軌道衛星通訊酬載軟體定義無線通信及波束合成控制技術」，以及經濟部主管的「IC封測－高階AI晶片載板技術」、「無人機姿態穩定之虛擬化雙作業系統飛控技術」。另一項為衛福部主管的「腸病毒A71型（EV-A71）疫苗製造技術」。

既有項目也將調整名稱與涵蓋內容。例如，「網路主動防禦技術」擬改為「AI網路主動防禦技術」；量子位元項目則由設計與製程，調整為設計、製作、量測與操控。衛星操控與太空規格影像感測器相關項目也列入名稱變更。

國科會表示，此次修正旨在強化核心關鍵技術營業秘密保護，草案已經各部會盤點、評估並徵詢各界意見。預告期間仍將蒐集建議，交由技術主管機關研議，預定年底前召開審議會進行技術項目審認，再送行政院公告；最終清單與保護範疇仍須以後續程序結果為準。</p><aside>編輯觀察：此次草案不僅新增技術，也調整既有項目的名稱與範圍。相關業者檢視技術保護要求時，應同時留意新增項目及既有項目的修正，而非只看清單總數。</aside><p><a href="https://www.cna.com.tw/news/afe/202611110311.aspx">中央社財經</a></p><ul></ul></article><article><h2>上櫃公司10月營收年增47%，AI伺服器與記憶體需求帶動電子產業</h2><p>上櫃公司10月合計營收達新台幣3678億元，較去年同期成長47%；前10月累計營收3兆2870億元，年增34%。櫃買中心11月11日公布統計，人工智慧伺服器液冷散熱、記憶體與雲端機房建置需求，是帶動相關電子產業營收成長的重要因素。

依櫃買中心說明，10月營收年增的主要產業包括半導體、電腦及周邊設備、電子通路。半導體業受惠於AI伺服器液冷散熱系統與記憶體需求；電腦及周邊設備業則因AI需求，帶動工業用記憶體與中央處理器出貨成長，電子通路業也受惠於AI雲端機房建置及記憶體產品需求。

累計前10月，營收成長的主要產業另包括其他電子業。櫃買中心指出，AI應用帶動先進封裝需求，加上貴金屬價格上漲，共同推升該產業累計營收，成長因素並非全數來自AI。

此次統計涵蓋897家上櫃公司，包括30家KY公司，均已於11月10日前完成申報。其中，10月營收年增者622家、衰退者272家、持平者3家；前10月累計營收則有654家成長、242家衰退、1家持平，整體營收增加並不代表所有公司同步受惠。</p><aside>編輯觀察：AI相關需求已反映在多個電子產業的營收，但總額增幅、產業成長因素與個別公司表現仍須分開判讀，不能將整體成長視為所有上櫃企業的共同趨勢。</aside><p><a href="https://www.cna.com.tw/news/afe/202611110310.aspx">中央社財經</a></p><ul></ul></article><article><h2>旺矽第三季營收、獲利創高，每股純益19.18元</h2><p>半導體探針卡與測試設備商旺矽第三季營收、獲利再創新高，合併營收新台幣59.04億元，季增13%、年增73%；歸屬母公司業主獲利約18.8億元，每股純益19.18元，連續三季單季每股純益超過10元。

累計前三季，旺矽合併營收150.7億元，年增58%；稅後獲利46.3億元，較去年同期倍增，每股純益47.26元。第三季合併毛利率接近62%，報導指出，主要反映產品組合變化與稼動率。

旺矽將業務成長連結至全球AI客戶持續擴建及AI雲端服務供應商加速資本支出，並表示公司在中高階測試介面的全球市占增加。產能方面，公司指出，垂直式探針卡與MEMS探針卡自2025年下半年起進入滿載，懸臂式探針卡也因客戶新晶片訂單而持續滿載。

後續布局上，旺矽表示，與客戶的開發合作計畫能見度已達2028年，預期今年營運維持強勁雙位數百分比成長、營收逐季向上；公司也正與國際客戶進行共同封裝光學（CPO）設備驗證及設計討論。這些展望與驗證進度均屬公司說法，開發合作計畫的能見度並不等同已確認至2028年的營收。</p><aside>編輯觀察：旺矽財報提供觀察半導體測試供應鏈的具體數字；評估後續成長時，應區分已公布業績、公司所述產能利用情況，以及仍在開發或驗證中的客戶計畫。</aside><p><a href="https://www.cna.com.tw/news/afe/202611110305.aspx">中央社財經</a></p><ul></ul></article><article><h2>雙鴻第三季營收增64.2%，淨利增幅落後、毛利率降至25.65%</h2><p>散熱廠雙鴻第三季營收明顯成長，獲利增幅卻未同步。公司11月11日公布財報，單季營收新台幣97.87億元，年增64.2%；歸屬母公司淨利10.8億元，季增11.5%、年增10.9%。每股純益11.59元，為歷史次高，僅低於今年第一季的12.61元。

第三季毛利率為25.65%，較去年同期下降4.12個百分點，也比第二季減少2.77個百分點。累計前三季，雙鴻歸屬母公司淨利32.13億元，年增95.6%，每股稅後純益34.59元，累計獲利仍較去年同期明顯增加。

展望後續出貨，董事長林育申先前表示，輝達Vera Rubin及AWS、Meta等ASIC的AI新品將於今年底開始出貨，並預期11、12月是公司今年營運高峰，動能可望延續至明年第一季。上述時程與營運走勢屬公司預測，仍須與後續實際業績分開看待。

林育申也提及第三季處於新舊產品轉換期，但現有資料並未明確交代毛利率下降的原因，不能直接將轉換期或特定AI產品訂單，視為本季利潤率變化的已確認解釋。</p><aside>編輯觀察：雙鴻本季數字顯示，營收擴張不必然帶來相同比例的獲利成長。觀察散熱供應商表現，除了出貨與營收，也需要同時追蹤毛利率及淨利變化。</aside><p><a href="https://www.cna.com.tw/news/afe/202611110343.aspx">中央社財經</a></p><ul></ul></article><article><h2>Google將Gemini加入Apple CarPlay，擴大駕駛的人工智慧助理選擇</h2><p>Google正將Gemini人工智慧應用加入Apple CarPlay系統，讓駕駛在車內使用助理時有更多選擇，也把Gemini的使用場景延伸至Apple的車用平台。

這項整合連結了Apple裝置與車內使用情境：對於可能已在Apple裝置上使用Gemini的駕駛，CarPlay將成為另一個接觸這項助理的入口。</p><aside>編輯觀察：這項整合的觀察重點是助理入口的跨平台延伸，而非尚未揭露的功能或效能差異。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-11/google-adds-gemini-voice-ai-assistant-to-apple-carplay">Bloomberg Technology</a></p><ul></ul></article><article><h2>IBM規劃2027年提供雙處理器量子系統存取，連結兩顆520量子位元晶片</h2><p>IBM計畫在2027年提供雙處理器量子系統的存取，並於該年結束前連結兩顆各具520量子位元的晶片。這是公司提出的量子運算平台規畫，並非系統已上線的消息。

這項計畫的具體方向是將兩顆量子晶片連結運作；目前資訊尚不足以判斷其實際運算表現，也不能據此認定已達成量子優勢或能為人工智慧運算帶來加速。</p><p><a href="https://arstechnica.com/science/2026/11/ibm-to-offer-access-to-a-dual-processor-quantum-system-in-2027/">Ars Technica</a></p><ul></ul></article><article><h2>Google Labs推出Tabletop群組協作實驗，開放候補登記</h2><p>Google Labs推出名為Tabletop的群組協作實驗，主打讓團隊共同製作互動式行程、投票與對戰表，目前已開放候補登記。

Google將這項實驗定位為供群組共同規畫與活動使用的協作空間，涵蓋行程安排、意見投票與賽事對戰安排等用途；目前提供的參與方式是加入候補名單。</p><p><a href="https://blog.google/innovation-and-ai/models-and-research/google-labs/tabletop/">Google AI</a></p><ul></ul></article><article><h2>Apple將關閉經營28年的線上社群論壇，已改為唯讀</h2><p>Apple將關閉經營28年的線上社群論壇，目前已將論壇設為唯讀，使用者無法繼續在其中新增討論內容。</p><p><a href="https://arstechnica.com/gadgets/2026/11/apple-is-shuttering-its-28-year-old-online-community-forum/">Ars Technica</a></p><ul></ul></article><article><h2>Meta公開Intelligent Delivery，以機器學習調配廣告排序運算資源</h2><p>Meta公開介紹廣告運算資源配置系統Intelligent Delivery，透過機器學習判斷不同廣告請求、模型與硬體能從額外運算中獲得多少效益，再動態分配資源。公司指出，廣告排序模型正朝大型語言模型規模成長，硬體供給卻難以同步擴張，因此必須在有限容量與嚴格延遲限制下，提高整體系統效率。

這套系統先以共享模型理解每筆請求，預測調整資源對排序結果、運算消耗與延遲的影響，再由不同層級的決策機制執行。配置範圍涵蓋將流量導向哪個資料中心區域、選擇何種硬體，以及單一主機內每筆請求能取得多少資源。Meta強調，不同工作負載適合的硬體不同，不能只以單一晶片的速度判斷配置優劣。

Meta也將人工智慧代理導入最佳化流程，讓代理閱讀程式碼、設計文件與歷年實驗紀錄，找出值得測試的調整，並設計、執行實驗；最終變更仍須由工程師審查核准後才會上線。公司表示，這種做法讓最佳化週期從數月縮短至數週。

成效方面，Meta宣稱，從2017年至2026年上半年，Intelligent Delivery在模型與系統既有進展之外，為主要服務的廣告排序效能帶來約10%的額外改善。後續研究方向包括將請求理解與配置決策整合進單一即時模型，以及針對GPU的固定資源區塊、批次處理與記憶體特性，重新設計資源調配機制。</p><aside>編輯觀察：這個案例的重點不只是擴大模型，而是將「每一份運算該分給誰」本身變成機器學習問題。評估其商業價值時，仍應區分公司宣稱的整體排序改善，與個別配置機制或人工智慧代理各自帶來的貢獻。</aside><p><a href="https://engineering.fb.com/2026/11/11/ml-applications/intelligent-delivery-serve-better-ads/">Meta Engineering</a></p><ul></ul></article><article><h2>Adobe與Disney簽訂多年合作，開發客製人工智慧模型與工具</h2><p>Adobe與Disney達成多年合作，將協助開發客製化人工智慧模型與工具，供Disney旗下主題樂園、影視製作與運動媒體業務使用。

合作範圍橫跨Disney多個業務領域，聚焦依企業需求開發模型及工具，而非僅限於單一內容製作環節。</p><p><a href="https://www.bloomberg.com/news/videos/2026-11-11/how-adobe-is-helping-disney-with-custom-ai-tools-video">Bloomberg Technology</a></p><ul></ul></article><article><h2>DXC以Bedrock打造多模型維運架構，將模型存取與代理權限分層治理</h2><p>DXC Technology在企業IT維運平台DXC OASIS中，將模型存取與代理執行工作拆成兩層：底層透過Amazon Bedrock連接多種模型，上層則由DXC負責工作協調、政策執行、人工核准與稽核。AWS與DXC共同發布的案例說明，這項設計不只處理模型選擇，也把代理能否修改正式環境的權限問題獨立出來。

依案例介紹，平台透過同一介面使用Anthropic Claude、Amazon Nova、Meta Llama及開放權重模型，並以Bedrock Guardrails處理內容過濾、個人識別資訊遮蔽及禁止主題政策。推論流量經AWS PrivateLink傳送，不經公開網際網路。不過，統一介面不代表模型行為一致；替換模型前，DXC仍須以自身任務測試組合評估，而非只調整路由。

在案例提供的虛構航空公司示範環境中，代理可診斷伺服器磁碟空間問題、提出處理計畫，但必須取得工程師明確核准，才能變更正式伺服器。執行了哪些指令、由誰核准及執行時間，則由上層系統留下紀錄，不依賴代理自行描述。DXC並表示，各類代理角色起初都只有唯讀權限，再逐步授予更大的操作範圍。

DXC表示，OASIS於2026年3月正式推出後，在56個已量測使用案例中，平均問題解決時間縮短95%。這是案例提供方公布的成效，不能視為獨立驗證結果；其架構上的重點，則是將模型輸出控管與實際操作授權分開，避免把內容防護直接等同於代理執行安全。</p><aside>編輯觀察：企業導入維運代理時，模型選擇與操作授權是不同問題。此案例的參考價值在於明確劃分兩者責任；成效數字則仍須與提供方的量測條件分開看待。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/how-dxc-technology-built-a-multi-model-ai-substrate-on-amazon-bedrock/">AWS Machine Learning</a></p><ul></ul></article><article><h2>Databricks執行長使用新版Genie代理，協助掌握公司內部問題</h2><p>Databricks執行長Ali Ghodsi使用公司新版Genie代理，協助了解組織內部出現的問題，呈現人工智慧代理支援管理決策的使用情境。

Ghodsi表示，Databricks已有1萬2,000名員工，他不可能認識所有人，員工也未必願意直接向他坦承哪些事情出了差錯，因此使用Genie協助掌握情況。這項用途反映管理者希望藉人工智慧補足資訊落差，但僅憑這段使用者自述，尚不能判斷代理回答的準確性，或是否已改善組織績效。</p><aside>編輯觀察：這個案例將代理的用途從執行任務延伸到管理資訊取得；評估價值時，仍須區分「能提供回答」與「回答足以支持決策」。</aside><p><a href="https://techcrunch.com/2026/11/11/databricks-new-ai-agent-tells-ceo-ali-ghodsi-the-unvarnished-truth/">TechCrunch AI</a></p><ul></ul></article><article><h2>AWS提出Agent Registry推送同步架構，MCP工具更新仍須經審核發布</h2><p>AWS提出事件驅動的Agent Registry更新架構，讓部署於Amazon Bedrock AgentCore的MCP伺服器變更後，自動將最新工具資訊同步至目錄。這套範例支援單一帳號及跨帳號環境，目的是減少工具已更新、目錄卻仍保留舊結構定義的落差。

流程由CloudTrail擷取UpdateAgentRuntime呼叫，再由EventBridge將事件送至Lambda。Lambda解析伺服器識別資訊，透過AgentCore Identity取得OAuth權杖，向MCP伺服器查詢目前的工具清單，再比對目錄中的名稱、描述及輸入結構；確認有變更後，才更新對應紀錄。跨帳號部署則將伺服器所在帳號的事件，轉送至集中管理目錄的帳號。

自動同步不等於自動對外發布。依AWS說明，紀錄更新後會回到草稿狀態，使用者仍看到先前核准的版本，必須由管理者或負責審核的人員再次核准，新工具資訊才可被搜尋及使用。範例也只會更新既有且已核准的紀錄，不會替新發現的MCP伺服器自動建立登錄資料。

這套設計亦非即時同步：AWS列出的CloudTrail事件傳遞延遲約為5至15分鐘。另一項已知限制是，若MCP伺服器處於冷啟動狀態並回傳零個工具，現有Lambda不會重試；AWS將指數退避重試及工具數為零時略過更新，列為可增補的可靠性措施。

對採用這套範例的團隊而言，目錄更新速度仍受事件傳遞、伺服器回應與人工審核影響。它提供的是把變更偵測、身分驗證及發布治理串接起來的參考流程，而非已排除所有同步與安全風險的完整保證。</p><aside>編輯觀察：代理工具目錄必須兼顧資訊新鮮度與變更審核。此設計把同步和發布拆開，有助於釐清自動化邊界，但團隊仍須處理延遲、冷啟動與核准等待造成的資訊落差。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/automating-aws-agent-registry-updates-with-push-based-architecture/">AWS Machine Learning</a></p><ul></ul></article><article><h2>AWS介紹UAEF代理評估框架，以統一執行紀錄比較版本表現</h2><p>AWS介紹人工智慧代理評估系統UAEF，透過轉接器將不同框架的執行紀錄轉成統一格式，再以7個面向、36項內建指標評分。系統定位是讓開發團隊更換提示詞、模型或工具後，仍能沿用一致的評估流程，檢查新版代理是否改善，或在特定能力上退步。

依AWS說明，UAEF會把訊息、工具呼叫及代理間的任務交接，轉為名為AgentTrace的共通紀錄。評估涵蓋工具呼叫、回應品質、負責任人工智慧、效能、多輪對話、多代理協作與推理；部分指標直接依紀錄和標準答案計算，另一些則交由Amazon Bedrock上的大型語言模型擔任評審。需要參考答案的指標，在資料未提供答案時會自動跳過。

評估結果可存入Amazon DynamoDB與Amazon S3，保留各版本的分數以供比較。系統可依設定門檻標示改善或退步，預設門檻為5%；開發者既可使用Python函式庫接入開發流程，也能透過低程式碼網頁介面操作，兩者共用評估引擎。AWS表示，電信、醫療與金融服務領域的12個組織已使用這套系統評估代理。

模型評審本身也有邊界。AWS指出，受評代理的輸出應視為不可信輸入，評審回覆必須附上可核對的原文證據，找不到對應內容的分數會遭拒收；但這些分數只是評估訊號，不是安全決策，不應用來決定安全控制是否放行。UAEF已採Apache 2.0授權開源，其指標是否適合個別任務，仍須由使用團隊檢視。</p><aside>編輯觀察：統一紀錄格式有助於把跨框架的評估流程與版本比較分開處理，但共用評分尺度不等於指標已獲驗證。導入時應先確認測試資料與指標是否對應實際任務，而非只追求整體分數提高。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/uaef-a-framework-agnostic-system-for-closed-loop-evaluation-of-ai-agents/">AWS Machine Learning</a></p><ul></ul></article><article><h2>SageMaker雙向串流新增用量計費支援，Deepgram為首發夥伴</h2><p>AWS宣布，Amazon SageMaker AI雙向串流推論新增用量回報機制，讓模型供應商能依即時工作階段中的實際用量，計算AWS Marketplace軟體費用。Deepgram是首發合作夥伴，支援語音轉文字與文字轉語音的用量計費；託管模型的SageMaker AI端點基礎設施費用仍須另外支付。

這項變更處理的是串流服務與一般請求回應不同的計費問題。依AWS說明，一般推論可在HTTP回應標頭提供計費數量，但雙向串流的用量會隨工作階段持續累積，直到結束才知道總量，因此不能只靠單次回應標頭回報。

新機制在推論資料連線旁，另開一條WebSocket中繼資料連線，由模型伺服器逐步傳送用量紀錄。AWS建議隨用量累積回報，以減少連線意外結束時尚未回報的數量。若計量連線中斷，預設仍會繼續推論；供應商也可設定停止推論，在服務持續可用與計量連續性之間作取捨。

對使用轉錄、客服中心、語音代理或字幕服務的企業而言，重點是看清楚產品如何定義計費單位。AWS舉例，若產品按音訊秒數收費，12分鐘的計量音訊對應720單位，但連線開啟12分鐘，不代表一定產生同等音訊用量。供應商仍須核對用量回報、Marketplace報表與買方帳單；資料成功傳送，也不等於已成功計費。</p><aside>編輯觀察：這是串流模型軟體費用的計量方式調整，不能直接解讀為整體成本降低。採購與開發團隊應同時確認音訊計量規則、端點費用，以及連線中斷時的回報與對帳方式。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/introducing-usage-based-pricing-for-amazon-sagemaker-ai-bidirectional-streaming/">AWS Machine Learning</a></p><ul></ul></article><article><h2>Google DeepMind完成Signal部分關鍵內容數學驗證，專案歷時四週</h2><p>Google DeepMind完成對Signal部分關鍵內容的數學驗證。Ars Technica報導，這項專案歷時四週，呈現人工智慧可能讓形式驗證更具實用性的研究方向。

這次進展的範圍是Signal的部分關鍵內容，不能擴大解讀為Signal整體安全已獲保證，也不足以推論其他軟體都能以相同時程完成驗證。</p><aside>編輯觀察：值得追蹤的是人工智慧能否降低形式驗證的實務門檻；四週專案本身仍不足以證明這種方法可廣泛套用，其意義須與實際驗證範圍一併判讀。</aside><p><a href="https://arstechnica.com/ai/2026/11/signals-encryption-just-passed-an-ai-powered-mathematical-checkup/">Ars Technica</a></p><ul></ul></article><article><h2>法國冷藏設備接連遭網攻，國民議會恢復審議基礎設施資安法案</h2><p>法國超市冷藏設備與血液中心冷藏系統近期接連遭到網路攻擊，讓連網設備的資安風險延伸至實體設施。法國國民議會已將強化基礎設施數位安全的法案重新列入議程，恢復審議；法案先前已於2025年獲參議院通過。

10月中旬，法國數百家家樂福、Monoprix等大型零售商的冷藏或冷凍設備控制系統遭到攻擊，設備溫度升高，業者因此丟棄大量商品。法國外交部長巴霍指控伊朗是幕後黑手，伊朗則否認。另一起發生於11月稍早的攻擊涉及法國血液中心冷藏庫，庫內存放血液樣本及供輸血、製藥使用的血漿袋，但未造成影響或損失，巴黎檢方正調查此案。

恢復審議的法案旨在將歐盟3項指令轉為法國法律，包括2022年通過的NIS 2。這項指令要求重要或關鍵實體落實最低限度的資安規則，例如定期更新系統、提高員工對網路釣魚的警覺，以及制定安全政策。

法案也將擴大納管範圍，涵蓋公共行政、郵政、廢棄物管理與食品等領域，違規者可能面臨高額罰款，企業高階主管也可能被追究個人責任。法國國家資訊系統安全局的工業系統指南則提醒，因設備運作正常而不調整設定，或以合約禁止修改系統、連資安措施也不能實施，都可能使連網設備暴露於風險。</p><aside>編輯觀察：兩起事件的實際後果不同，不能將超市商品損失套用到血液中心。共同的政策焦點，是如何讓連網實體設備落實基本資安規範，而不只關注資料是否外洩。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611110340.aspx">中央社國際</a></p><ul></ul></article><article><h2>United Airlines著手阻擋第三方人工智慧代理訂票與存取帳號</h2><p>United Airlines正著手阻擋第三方人工智慧代理代訂機票及存取顧客帳號，時間點落在假期旅遊旺季之前。隨著航空業使用人工智慧的情形增加，相關隱私疑慮也受到關注；這次限制同時涉及訂票操作與顧客帳號存取兩個環節。</p><aside>編輯觀察：這項措施凸顯人工智慧代理代辦服務的權限界線：能否替使用者操作，不只取決於代理能力，也取決於平台是否允許其存取帳號與執行交易。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-11/united-blocks-ai-agents-from-booking-flights-ahead-of-holidays">Bloomberg Technology</a></p><ul></ul></article></main></noscript>
