  <noscript><main><h1>AI算力管制、平台安全與台灣科技產業展望</h1><p>2026-11-27 科技晚報</p><article><h2>美國收緊海外AI算力租用規範，東南亞資料中心面臨客戶調整</h2><p>美國將先進晶片管制延伸至海外算力租用。11月19日推出的新規要求，持有輝達硬體的海外企業，在向中國企業出租大量算力前，須取得美國商務部許可。規範也涵蓋既有業務：已出租大量受管制算力給中國客戶的業者，有90天調整期，須在2027年2月底前取得許可，否則就得放棄相關客戶。

未遵守規定的企業，可能面臨罰款、刑事指控或被列入貿易黑名單。新規設有適用於社群媒體及其他商業用途的豁免；美國官員表示，申請者須證明資料中心僅用於不威脅國家安全的商業活動，並由美方逐案審核。部分擁有中國客戶的東南亞資料中心業者預期，取得許可並不容易。

新加坡政府11月27日表示，正與本地企業協商，了解新措施對業務的影響。另有媒體引述消息人士稱，輝達已要求製造夥伴暫停向馬來西亞、新加坡、泰國及印尼買家出貨搭載其晶片的伺服器；但新加坡副總理顏金勇表示，無法證實這項消息，暫停出貨的範圍與持續時間也尚未獲確認。

客戶結構將是區域營運商接下來的調整重點。既有報導指出，馬來西亞及鄰國部分資料中心基礎設施是為中國科技企業打造，營運商正努力擴充美國客戶名單，業界人士並預期可能需要降價吸引新客戶。惠譽信評分析師則警告，先進晶片與算力取得限制，將使亞太資料中心投資放緩、投資選擇更審慎；這仍屬分析師預測，而非已確認的投資結果。</p><aside>編輯觀察：管制焦點從晶片出貨延伸至遠端算力存取，使資料中心不只要處理硬體供應，也必須重新檢視客戶資格、許可要求與既有合約的延續條件。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270096.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611270088.aspx">中央社國際</a></li></ul></article><article><h2>蘋果全球下架Talkie，AI陪伴服務未成年人防護受檢視</h2><p>蘋果本週將MiniMax旗下AI聊天應用程式Talkie自全球App Store下架。此前，美國廣播公司新聞網與英國非營利組織新聞調查局的調查報導指稱，應用程式中的虛擬角色曾向兒童傳送帶有性暗示、不當及辱罵性的訊息。MiniMax與蘋果均未立即回應置評請求。

Talkie於2023年推出，提供多種虛擬伴侶供使用者聊天，對話往往帶有戀愛色彩。這類AI陪伴服務與一般助理工具的定位不同，著重持續的情緒連結與擬人化互動，部分產品也透過故事情節讓使用者投入其中。

Talkie在App Store與Google Play Store均列為18歲以上分級，並依不同國家規定，標明未滿14歲或16歲的兒童不得註冊。不過，兒童安全倡議人士批評，其年齡驗證措施過於寬鬆，允許使用者自行通報年齡。平台標示的使用年齡，與實際能否阻擋兒童接觸不當互動，成為此次爭議的核心。

MiniMax另有中文版應用程式星野。Talkie與星野在2024年合計貢獻公司逾六成營收，MiniMax今年已不再單獨揭露聊天機器人的營收占比。此次下架涉及其既有重要產品，但目前取得的資料未交代重新上架條件，也不足以判定對營收的實際影響。</p><aside>編輯觀察：應用程式的年齡分級不等於有效的年齡驗證。對以持續情緒互動為特色的AI陪伴服務，內容防護與未成年人進入門檻需要一併檢視。</aside><p><a href="https://www.cna.com.tw/news/ait/202611270043.aspx">中央社科技</a></p><ul></ul></article><article><h2>愛沙尼亞評估14款AI與雲端工具，籲停用DeepSeek等三款服務</h2><p>愛沙尼亞司法暨數位事務部近日公布14款雲端及AI工具的安全評估，以紅、黃、綠燈分級。DeepSeek、通義千問與愛沙尼亞本土平台Botastico因資料安全疑慮被列為紅燈，部會呼籲政府機關、企業及家庭停止使用；其中，愛沙尼亞政府機關先前已禁止使用DeepSeek。

三款服務被列為紅燈的理由並不相同。司法暨數位事務部長帕科斯塔表示，DeepSeek的資料在中國境內處理，安全措施與資料次處理商資訊有限，也缺乏符合規範的獨立證據，另有中國法律適用、審查與影響風險等疑慮。通義千問的主要疑慮，則是用戶資料可能在中國境內處理，並被用來訓練模型；這些均為該次評估提出的判斷。

針對Botastico，評估人員指出，業者未能提出符合ISO/IEC 27001或愛沙尼亞資安標準的證明，也缺少保密條款，部分資料處理流程不夠透明。這項結論涉及業者提供的合規證據與資訊透明度，不能直接等同於已發生資料外洩。

Google Gemini、微軟Copilot與Mistral Vibe在此次評估獲得綠燈；Cursor、GitHub Copilot、Google翻譯及ChatGPT則獲綠燈或黃燈，報導未逐一列出對應結果。參與評估的Cybernetica資訊安全研究所所長波達諾夫提醒，綠燈不代表使用者可以免除自行查核責任，因為服務條款與安全功能可能隨時改變。</p><aside>編輯觀察：這次評估顯示，AI工具的採用決策不只涉及模型能力與價格，也涉及資料處理地點、次處理商、保密條款及可供查核的合規證據；評級仍須配合持續檢查，不能取代使用者自身的風險判斷。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270015.aspx">中央社科技</a></p><ul></ul></article><article><h2>Google將公開交易者身分開發者的電話與地址，2027年3月上路</h2><p>Google預計自2027年3月1日起，在應用程式頁面向全球使用者公開具交易者身分的Android開發者電話與地址。這項要求並非不分身分適用於所有開發者，但對以住家作為營業地址的小型開發者而言，將帶來個人聯絡資訊曝光的隱私疑慮。

開發者須在2027年2月1日前，依英國法律與歐盟《數位服務法》申報是否具有交易者身分。Google列出的判定條件包括打算經常透過應用程式獲利，以及已有持續交易紀錄；申報為交易者後，須提交商業身分、電話與地址。英國及歐洲經濟區使用者還會看到其商業資料與自我認證資訊。

未遵守要求可能影響應用程式營運。Google可能先阻止更新發布，最終也可能將應用程式從全球各地的Play商店移除，而不只限於歐洲市場。

部分在家工作的小型開發者已對公開地址表達不滿，有人選擇租用辦公室，避免揭露住址。Google不接受以郵政信箱作為地址，也使這些開發者必須在維持營運與保護個人資訊之間尋找其他安排。</p><p><a href="https://www.engadget.com/2329389/google-will-soon-share-android-developers-addresses-publicly/">Engadget</a></p><ul></ul></article><article><h2>SAP傳醞釀AI重整，彭博稱考慮裁減至少1萬個職位</h2><p>德國商業軟體公司思愛普（SAP）傳出準備大幅裁員。路透社11月27日引述兩名知情人士說法，其中一人表示，思愛普員工代表委員會尚未獲知這項計畫。

至於重整方向與規模，彭博前一晚另引述知情人士報導，思愛普正考慮進行人工智慧（AI）驅動的重整，至少裁減1萬個職位。大幅裁員與萬人規模分別來自兩家媒體的消息人士說法，仍是規劃中的消息，不能視為公司已正式公布或執行的裁員結果。</p><p><a href="https://www.cna.com.tw/news/aopl/202611270199.aspx">中央社財經</a></p><ul></ul></article><article><h2>AI設備需求仍強，主計總處估2027年出口突破1兆美元</h2><p>主計總處11月27日公布最新經濟預測，估台灣2027年商品出口將達1兆1135.49億美元，年增18.63%，創歷史新高。支撐這項展望的重要依據，是人工智慧（AI）相關基礎設施與設備需求仍高於供給。

主計總處同時預測，2026年海關出口值將達9386.43億美元，年增46.67%，增幅為50年來最高。依這次預測，即使2026年出口基期已高，2027年仍可維持雙位數成長；上述數字均為預測值，並非已實現的出口成果。

對AI供應鏈前景，主計總處指出，雲端服務業者、算力供應商及多國政府持續投入相關投資。不過，美國擴大AI出口管制，以及居民反對資料中心建置、地方政府可能加強監管等因素，都可能影響投資進程。

主計總處綜合統計處處長蔡鈺泰表示，融資成本上升對基礎設施建置的影響、AI應用發展進程，以及領導廠商推動硬體規格升級的步調，也都是變數。他說，出口估算已考量這些因素而略採保守看法，但目前掌握的資訊仍顯示市場供不應求。</p><p><a href="https://www.cna.com.tw/news/afe/202611270198.aspx">中央社財經</a></p><ul></ul></article><article><h2>國泰金看好AI帶動台灣供應鏈　銀行授信仍審慎觀察</h2><p>國泰金控11月27日舉行第3季法說會，AI供應鏈展望與企業融資需求成為焦點。總經理李長庚看好台灣持續受惠於AI發展；國泰世華銀行副總經理傅伯昇則表示，銀行對AI動能保持較審慎態度，但不認為這項趨勢會就此消退。

李長庚在會後表示，AI技術進步與迭代速度快，過程中供應鏈也會受到較大影響，但技術進步代表未來有更好的工具可用。他認為，只要AI持續發展，台灣整體供應鏈與經濟仍可獲得助力。

從銀行評估產業的角度，傅伯昇指出，觀察重點在於美國當地對建置資料中心的看法，以及美國對晶片出口的態度。相較於對長期趨勢的期待，銀行仍須審慎看待影響AI投資動能的條件。

授信方面，傅伯昇表示，國泰世華銀在AI產業授信上相對穩健，仍觀察到不少AI相關企業增加資本支出需求。他並稱，往來企業品質良好，近期市場波動對這些企業影響不大，因此預期企業金融放款仍可維持健康動能。</p><p><a href="https://www.cna.com.tw/news/afe/202611270220.aspx">中央社財經</a></p><ul></ul></article><article><h2>AI語音計票仍待情境驗證　FactLink提醒查核監票工具與影像脈絡</h2><p>九合一選舉投票前夕，數位素養實驗室（FactLink）11月27日針對民間監票工具提出提醒：使用前應查證開發者身分，分享影像須保留完整脈絡，電視報票與AI計票數字也不能直接視為實際開票結果。

針對AI語音辨識計票工具，FactLink指出，九合一選舉涉及多種公職，投開票所可能同時出現多組唱票聲，並受環境噪音與交談聲干擾。在準確度尚未經實際開票情境充分驗證前，民眾仍應以人工觀察與紀錄為主，不宜僅憑AI統計與官方結果的落差，就質疑選務舞弊。

工具本身的資料治理也是查核重點。FactLink建議，使用監票網站或App前，先檢視開發者介紹，或透過網址註冊資訊查詢工具確認背景；若聯絡資訊單薄、社群帳號新設，或網址近期註冊且刻意隱藏資訊，應提高警覺，不貿然上傳影像。開發團隊也應適度揭露可受公評的身分及資料保存機制。

對已拍攝的監票影片，FactLink建議分享時交代時間、地點、事件經過，以及現場選務人員如何處理與更正，並保留原始完整影像，降低片段遭剪輯或搭配誤導字幕的風險。</p><p><a href="https://www.cna.com.tw/news/aipl/202611270036.aspx">中央社政治</a></p><ul></ul></article><article><h2>金盾獎40隊決賽攻防　陽明交大BambooB33F奪大專冠軍</h2><p>第21屆資安技能金盾獎11月27日舉行決賽，國立陽明交通大學隊伍「BambooB33F」獲大專校院組冠軍；國高中職組則由國立陽明交通大學附屬竹北高中、國立鳳山高中及桃園市立陽明高中聯隊「LeGendBreakTea」奪冠。

資安署表示，本屆共有224支隊伍報名，40隊晉級決賽。決賽採搶旗攻防（CTF）模式，結合解謎與情境實作，並利用實體場域與設備打造擬真環境，讓參賽者在限時內分析線索、破解任務以爭取積分。

試題以貼近實務的資安事件為核心，涵蓋網通設備後門鑑識、封包與連線路徑分析，以及端點安全防護等領域。本屆也首度推動企業贊助夥伴計畫，由酷澎股份有限公司及戴夫寇爾股份有限公司贊助獎金，支持學生參賽。

資安署長蔡福隆致詞時表示，近期國內外企業與機關面臨AI代理攻擊帶來的衝擊，隨AI迅速發展，資安產業的重要性將持續提升。他並鼓勵年輕世代投入資安領域、與國際好手較量。資安署則表示，將持續深化人才培育，透過實作競賽鍛鍊問題分析、解決與團隊協作能力。</p><p><a href="https://www.cna.com.tw/news/afe/202611270216.aspx">中央社財經</a></p><ul></ul></article><article><h2>美擬對泰課18%關稅　電腦、硬碟等設備可能獲豁免</h2><p>美國擬對泰國商品課徵18%關稅，電腦、硬碟及資料儲存設備等AI與資料中心相關電子產品，可能列入豁免範圍。泰國商會主席普伊表示，18%目前仍是初步稅率，尚未正式生效，企業實際承受的衝擊仍待觀察。

普伊指出，依初步評估，擬獲豁免商品占泰國對美出口金額逾半，其中包括上述電子產品。他認為，實際影響可能沒有外界擔憂的嚴重。不過，這是業界對擬議措施的初步判斷，不能視為相關設備已確定免稅，也不能將列舉品項當成完整豁免清單。

泰國前財長高恩也表示，若18%關稅實施，部分電子產品及AI設備可能獲得豁免。他要求政府說明已與美方談妥的內容，以及尚未達成協議的事項。對科技硬體業者而言，稅率是否落實與哪些產品最終獲豁免，仍是兩項未定因素。

出口前景另受到AI投資變化牽動。泰華農民研究中心預估，泰國2027年出口成長率為7%至8%，並指出美國關稅及AI投資成長放緩可能影響出口。這項預測涵蓋泰國整體出口，並非對電腦、硬碟或資料儲存設備個別產品的成長預估。</p><aside>編輯觀察：科技硬體貿易的影響不能只看名目稅率，還須區分措施是否生效及產品是否確定獲豁免。目前資訊不足以判定個別設備的最終關稅負擔。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270138.aspx">中央社國際</a></p><ul></ul></article><article><h2>黃仁勳重返輝達執行長　代理接班引發治理與性別討論</h2><p>黃仁勳23日重返輝達執行長職位，財務長克瑞斯的代理執行長任期提前結束。這場短期內的人事轉折，也引發外界對科技公司創辦人權力，以及女性高階主管在危機中接班處境的討論。

輝達董事會12日任命克瑞斯出任代理執行長，同時尋找正式接任人選。董事長瓊斯17日仍表示，公司無意讓黃仁勳恢復執行長職務，但黃仁勳隨後復任。克瑞斯是否有意正式接掌執行長職位，目前不得而知；輝達對相關女性領導處境的議題不予置評。

克瑞斯代理期間，輝達於17日公布財報，她在當天的季度財報電話會議中向分析師與投資人強調，公司「一切如常」。輝達的晶片用於訓練及運行AI模型，使這次領導層更迭不只是單一高階主管的人事變動，也涉及AI企業如何維持治理與營運穩定的問題。

對於創辦人復任所獲得的支持，創投公司Cleo Capital董事總經理孔斯特向法新社表示，部分問題可能出在「英雄崇拜」。報導也援用澳洲國立大學教授萊恩提出的「玻璃懸崖」概念，討論女性或代表性不足群體在高失敗風險的危機期間受命領導的處境。這是對此次接班安排的分析框架，並不等於已證實董事會任命或結束代理安排的動機。</p><aside>編輯觀察：這次人事變化值得關注的，是董事會公開立場與最終接班安排之間的落差。創辦人影響力與女性危機接班的討論，仍須和可查證的人事決策分開，避免把評論直接當成決策原因。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270194.aspx">中央社財經</a></p><ul></ul></article></main></noscript>
