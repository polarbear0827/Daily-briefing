  <noscript><main><h1>氣候談判、金融市場震盪與人工智慧治理焦點</h1><p>2026-11-23 時事焦點</p><article><h2>COP31未達政治協議落幕　聯合國氣候談判面臨改革壓力</h2><p>在土耳其安塔利亞舉行的COP31氣候峰會，22日在未達成政治協議的情況下落幕。接連數屆會議成果疲弱，使聯合國氣候談判機制面臨改革壓力；對容易受到海平面上升與極端天氣衝擊的小型脆弱國家而言，這場年度會議仍是爭取國際關注與金援的重要場合。

秘魯外交部環境司司長桑傑士表示，整個談判進程的公信力正受到威脅，體系需要徹底改革。聯合國氣候變化綱要公約執行秘書斯帝爾則認為，共識決制度仍能運作，但必須改進；他已邀請外部知識領袖，就可能的改革方向提供建議。

大國參與程度也是與會代表關切的問題。這是川普退出聯合國氣候進程後的第2屆氣候大會，中國雖出席，態度則力求低調。率領加勒比海共同體代表團的佛萊徹指出，目前缺少有足夠影響力、能讓立場分歧各方凝聚共識的力量。

另一方面，部分與會代表認為，再生能源的經濟吸引力提高，正降低能源轉型對多邊協議的依賴。資產管理公司Impax共同主管杜德威也表示，相較過往，氣候大會決議對投資訊號的影響已減弱，經濟效益正成為推動轉型的主力。這些看法與脆弱國家仍仰賴會議爭取援助的需求，呈現出氣候談判面臨的不同期待。</p><aside>編輯觀察：改革的關鍵不只在於能否達成共同聲明，也在於如何兼顧能源投資轉向與脆弱國家爭取資源的需求；兩者對氣候大會的依賴程度並不相同。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611230026.aspx">中央社國際</a></p><ul></ul></article><article><h2>川普稱美伊若無協議　傾向新年後再對伊朗動武</h2><p>美國總統川普22日表示，若美國與伊朗無法達成協議，他傾向在新年過後下令發動新一輪軍事打擊。這是他在訪談中提出的附帶條件表態，並非已宣布執行的軍事行動。

川普接受福斯新聞訪問時，指控伊朗談判代表採取拖延戰術，並稱伊朗在美國期中選舉後變得更加咄咄逼人。他將目前的外交談判斥為毫無意義，但這些對伊朗談判策略與行動的描述，屬於川普的指控。

美國目前持續對伊朗港口實施海上封鎖，荷莫茲海峽周邊衝突也持續擴大。川普預測，雙方仍可能繼續相互報復，並公開表示希望伊朗嘗試突破封鎖，揚言將擊沉挑戰封鎖的伊朗艦艇。

伊朗多個城市同時再度出現反政府示威。川普被問及相關局勢時，向示威者喊話，要求他們繼續抗議。</p><aside>編輯觀察：外交談判與海上封鎖同時持續，使後續軍事行動的條件與時點成為重要觀察焦點；川普的威脅仍須與實際下令及執行區分。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611230016.aspx">中央社國際</a></p><ul></ul></article><article><h2>輝達晶片流向遭追查　美財長要求釐清法遵責任</h2><p>輝達晶片經東南亞供應網流向中國的疑雲持續延燒。美國財政部長貝森特22日表示，仍在等待輝達說明，調查重點應是公司法遵文化或個人缺失，以及哪些層級的人員知情，而非圍繞前執行長黃仁勳的私人關係。他也強調，先前對公司可能存在違規文化的質疑，指的是「可能有」，並非已作成認定。

貝森特表示，輝達臨時管理層與律師已聯繫行政部門，他期待公司調查委員會提出完整答案。對於部分交易可能缺少書面合約的問題，他認為仍可透過帳單與資金流動追查，並應釐清法務部門及法務長辦公室的責任。

前白宮國安顧問蘇利文同日則表示，事件看來更像大規模規避晶片出口管制。他質疑相關操作可能違反規定精神，甚至文字要求，但認為法律風險仍難判斷，理由是輝達高層與美國商務部聯繫密切。他預測，公司可能主張已向政府充分說明，因此也須檢視政府內部決策；這是他的分析，並非輝達已提出的答辯。

供應網方面，金融時報調查指稱，與新加坡雲端運算業者Megaspeed前高階主管黃樂有關的企業網絡，串聯晶片分銷、客戶及地下運輸與資金管道。報導引述知情人士稱，太子集團的胡小偉至少參與部分關鍵環節。太子集團則否認胡小偉曾在公司任職，並稱美方相關指控毫無根據。

紐約時報另引述多國現任及前任官員指稱，中國國家安全部協助中企取得先進AI晶片、蒐集供應鏈情報的祕密行動已持續至少兩年，並有專責小組推動。美國官員也指稱中國情報機構曾與黃樂合作；中方駁斥間諜指控純屬捏造。蘇利文同樣表示，黃樂與中國情報機構的關係尚未確定，不能將相關指控視為已證實的事實。</p><aside>編輯觀察：這起事件涉及公司內部法遵、跨境供應網及政府出口管制決策三個層次。釐清交易對象、最終用途與各方知情程度，比以個人關係推定違法責任更能回應監管問題。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611230008.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611230014.aspx">中央社國際</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611220161.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611220182.aspx">中央社國際</a></li></ul></article><article><h2>韓股盤中跌破4700點　當局準備啟動穩定基金、放寬庫藏股</h2><p>韓國股市11月23日開盤下跌約3%，之後跌勢擴大。上午9時38分，韓國綜合股價指數（KOSPI）下跌3.52%，報4698.63點，失守4700點，接近今年1月13日收盤的4692.64點，回落至年初水準。

三星電子與SK海力士分別下跌4.48%及3.59%。兩家公司合計占韓國有價證券市場市值逾47%，股價走弱拖累大盤。兩家企業生產支撐人工智慧（AI）基礎設施運作所需的先進記憶體晶片；隨著市場對AI熱潮能否延續的疑慮升高，相關股票近幾週承受賣壓。

韓國金融當局已於22日召開緊急會議，決定檢視股市穩定基金的啟動機制、研究提高功效，仍屬啟動前準備。當局另決定放寬上市公司每日買回自家股票的數量上限，為期3個月，並加強查緝非法放空、強制平倉事前通知，以及監看融資借款、未交割交易與強制平倉動向。

對後續走勢，券商看法仍有差異。Kiwoom證券預估，最壞情況下指數可能下探4200點區間，新韓證券則認為可能觸及4500點；另一方面，多家券商認為市場已進入超賣區間，呼籲避免恐慌性拋售。這些均屬投資機構的判斷，並非已發生的市場結果。</p><p><a href="https://www.cna.com.tw/news/afe/202611230042.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611230025.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611220194.aspx">中央社財經</a></li></ul></article><article><h2>台股早盤震盪逾1200點一度翻紅　平盤下禁空上路</h2><p>台股11月23日早盤開低後一度翻紅，加權指數以35899.48點開出，最低跌至35442.41點、下跌590.88點，隨後最高來到36655.48點，高低差達1213.07點。截至上午9時23分發布的盤勢報導，指數報36065.26點，上漲31.97點，尚非當日收盤結果。

權值股提供部分支撐，台積電早盤最高上漲45元至2045元，聯發科也上漲；不過，金融類股指數下跌約1%，代表中小型股票的櫃買指數下跌2.48%。大盤一度回升之際，不同類股表現仍有落差。此前，台股20日下跌2393.60點、跌幅6.23%，同日美股費城半導體指數重挫10.73%。

金管會23日起實施全面禁止平盤以下放空等穩市措施，投資人融券及借券賣出上市櫃股票、台灣存託憑證的價格，不得低於前一營業日收盤價；另將最低融券保證金成數由130%提高至150%，並暫停受理證券商申請發行認售權證上市櫃案件。國安基金21日表示，11月6日獲授權執行市場安定任務後，已進場護盤，後續將視市場情況採取必要措施。

行政院長卓榮泰23日表示，景氣燈號已連續10個月亮紅燈，出口連續21個月正成長，並以這些數據說明他對整體景氣維持穩定、樂觀的判斷，呼籲投資人理性看待經濟情勢。他預定當天下午3時邀集金融業、科技及工商產業公協會代表會面。投顧則提醒，政策能否穩定信心、融資賣壓是否紓緩，仍是後續觀察重點。</p><p><a href="https://www.cna.com.tw/news/afe/202611230027.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611230039.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/aipl/202611220203.aspx">中央社政治</a></li><li><a href="https://www.cna.com.tw/news/afe/202611230015.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/afe/202611220085.aspx">中央社財經</a></li></ul></article><article><h2>美國多項關鍵服務接連故障　情報總監稱系統升級期間恐再中斷</h2><p>美國本月接連發生科技故障，影響航空、電子郵件、銀行及政府內部網路。國家情報總監克雷頓11月22日表示，企業與政府機關正在汰換老舊系統，民眾應預期升級期間仍會出現當機、服務空窗與中斷。

已報導的事件包括全美航班一度停飛、微軟當機導致電子郵件服務中斷、多家大型銀行受技術故障影響，以及國家安全局內部網路暫時中斷。這些事件涉及不同服務與系統，所取得資料未提供各案的詳細調查結果。

克雷頓接受多個新聞節目訪問時說，科技進步已使老舊系統不堪負荷，為提升效能與網路安全，必須進行升級。他並將近期當機歸因於技術升級，否認是有組織的協同行動或國家級勢力操縱；總統川普也提出相同歸因。這是官員的公開說法，不能視為各起故障均已完成獨立調查的結論。

另有報導指聯邦調查局與美國農業部遭到網路攻擊。克雷頓未透露細節，只表示預期調查人員會在適當時候提出答案；目前資訊不足以確認這些攻擊報導與前述服務中斷之間是否存在關聯。</p><p><a href="https://www.cna.com.tw/news/ait/202611230019.aspx">中央社科技</a></p><ul></ul></article><article><h2>美國港口強化資安與人工備援　聖體城港稱每日遭數百至數千次試探</h2><p>美國港口與航運系統面臨密集網路攻擊，部分港口正增聘資安人員、加強演練，並準備在系統失效時改用人工指揮。德州聖體城港執行長布里頓表示，港方每天遭遇數百次甚至數千次入侵試探，攻擊者不斷尋找漏洞，也試圖誘騙員工交出存取權限；他未點名具體攻擊者。

聖體城港每天出口約230萬桶原油，系統安全牽動能源運輸。不同港口公布的攻擊數據各有範圍：洛杉磯港表示，今年8月擋下1.2億次攻擊，幾乎是2023年單月平均的兩倍，手法包括自動化入侵、竊取密碼與安裝惡意程式。這些數字是港方所稱的攻擊或試探次數，不代表成功入侵件數，也不能視為全美各港的共同情況。

實際作業中斷已有案例。北卡羅來納州港務局8月表示，資訊系統遭外部行為者攻擊，雖然一天後控制住局勢，港口閘口開放仍被迫延後，並改採人工作業。美國海岸防衛隊與聯邦調查局也在今年8月聯手調查兩艘赴美油輪遭駭事件，調查人員尚未公布嫌犯身分。

因應威脅，維吉尼亞港投入資安團隊，安排員工每月受訓，並與海岸防衛隊聯合演練。聖體城港則即將聘請第四名資安專員，另備有非數位化應變計畫：必要時由拖船護送船隻通過部分航道，港務人員以無線電、望遠鏡、紙本紀錄及手勢指揮交通。</p><aside>編輯觀察：港口資安不只是阻擋入侵，也涉及系統失效後能否維持船舶與貨物流動；人工備援與演練，是觀察營運韌性的重要面向。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611230033.aspx">中央社國際</a></p><ul></ul></article><article><h2>OpenAI首席科學家提議以困惑度設AI開發門檻　阿特曼表態支持</h2><p>OpenAI首席科學家帕喬基提出，人工智慧開發業者應以「困惑度」及其他衡量指標訂定共同能力門檻，在理解、監控模型行為與安全機制達到具體標準之前，承諾不跨越限制。OpenAI執行長阿特曼已表態支持，但目前取得資料呈現的是治理提案，並非業界已達成的協議。

這項提議首先處理如何衡量AI進展的問題。帕喬基認為，針對模型個別應用能力設計的評測，會隨技術進步迅速過時；相較之下，困惑度仍具有參考價值。這項指標衡量模型平均預測下一個詞元的表現，數值越低，代表預測越準確。他主張以此作為衡量整體智慧的共同基準之一。

在實施構想上，業者不只需要同意能力限制，也必須界定跨越限制前應達成哪些監控與安全標準。阿特曼在X平台支持尋求共同限制的共識，並認為這類限制有助於維持AI的安全與控制。

帕喬基另預測，最快在2027年，利用AI協助訓練AI的方法可能出現根本性突破，進展速度可能超越監控與安全能力。這是他提出開發門檻的風險判斷，並非已確定的技術時程；提案的核心，是讓能力提升與安全要求建立明確連動。</p><aside>編輯觀察：共同指標能讓開發限制更具體，但模型預測表現與安全條件仍是不同問題。這項提案是否可行，關鍵不只在選定指標，也在如何界定跨越門檻前必須具備的監控能力。</aside><p><a href="https://www.cna.com.tw/news/ait/202611230017.aspx">中央社科技</a></p><ul><li><a href="https://techcrunch.com/2026/11/22/openais-chief-scientist-has-thoughts-on-how-to-limit-ai-development/">TechCrunch AI</a></li></ul></article><article><h2>METR警告AI研究能力快速提升　現有評測難排除研發加速風險</h2><p>AI研究組織METR警告，模型執行AI研究任務的能力正在快速提升，也變得更難衡量。該組織認為，目前公開資料不足以排除未來幾年AI研究急遽加速的可能；若進展過快，人類可能來不及充分理解、評估並回應新系統帶來的災難性風險。

METR發現，在定義清楚、能獲得直接回饋的程式設計與運算任務中，模型多數時候已勝過有經驗的人類專業工作者，但尚未超越由頂尖專家組成的大型團隊。以人類完成任務所需時間衡量，模型能處理的任務長度約每3.6個月翻倍。

對這組數據作簡單外推，會得到模型在2027年7月對最長、需人類耗時200小時的任務達到五成成功率的推估。這是趨勢外推，並非已觀察到的能力，也不是確定會實現的時程。

能力成長仍有明顯限制。METR指出，模型對缺乏即時回饋、需要實質判斷的開放式問題，以及難以在訓練中重現的情境，仍然表現吃力。該組織也提醒，常見且容易執行的測試，可能因開發者使用高度相似的環境訓練模型，而高估實際應用表現。</p><aside>編輯觀察：評測成績提升不等於已證明模型能可靠處理真實世界任務。判讀AI研究能力時，應同時檢視任務是否有明確回饋、測試與訓練環境是否相近，以及預測是否只是趨勢外推。</aside><p><a href="https://the-decoder.com/ai-is-getting-better-faster-than-experts-can-reliably-test-whether-new-systems-are-safe-metr-warns/">The Decoder</a></p><ul></ul></article><article><h2>Dragos測試揭AI推論服務資料外洩風險，OpenRouter移除三家供應商</h2><p>資安研究機構Dragos表示，研究團隊向AI服務供應商送出約200萬筆含假憑證的請求，發現至少三家供應商遭入侵，攻擊者正在竊取使用者資料。OpenRouter隨後移除三家供應商，並撤銷125個服務端點的「零資料保留」（ZDR）認可；這些措施部分回應研究發現，部分則出於預防考量。

測試於2026年7月至11月進行。Dragos指出，遭入侵的三家供應商直到接獲通知才知情；規模最大的一起事件中，攻擊者蒐集數百組AWS金鑰，連供應商尚未處理便已拒絕的請求也受影響。部分金鑰在數小時內遭測試，攻擊者還搜尋S3儲存空間，並嘗試建立持續存取權限。

研究也指向中介服務本身的資料存取問題。Dragos表示，部分轉售業者不必利用漏洞，只需以低價吸引流量並開啟紀錄，就能讀取客戶請求。團隊另觀察到，標示零資料保留的服務仍有秘密測試網址被存取，甚至有測試連結在請求送出24天後出現在內部聊天中。

OpenRouter已向受影響使用者寄送通知，警告傳送至MiniMax模型的請求可能被第三方讀取。Dragos建議，企業應掌握AI請求的轉送路徑、檢查隱私設定，並避免將憑證交給中介服務。這些發現涉及研究涵蓋的供應商與路徑，不能據此認定所有低價AI服務都有相同問題。</p><aside>編輯觀察：選擇AI服務不只是選模型，也涉及誰能接觸請求內容。企業評估成本時，應將轉送路徑與資料保留承諾是否可驗證一併納入。</aside><p><a href="https://the-decoder.com/security-researchers-show-how-cheap-ai-inference-providers-steal-keys-and-snoop-on-users/">The Decoder</a></p><ul></ul></article><article><h2>AI伺服器傳簽約後加價25%至45%，合約調價條款仍待釐清</h2><p>AI伺服器採購傳出簽約數月後、即將出貨時仍被要求加價。《金融時報》報導引述知情人士說法，部分供應商要求的漲幅達25%至45%，反映算力需求與零組件成本對採購價格的壓力。不過，買方是否事先同意出貨前調價，仍未獲確認。

報導提及的供應商包括戴爾、慧與科技公司、聯想及美超微，其伺服器採用輝達或超微的處理器。業界人士稱，市場仍是需求大於供應，急需設備的客戶因此難以拒絕加價。算力買家除大型資料中心營運商與科技公司，也包括大型金融及交易業者；部分業者將自行持有資料中心視為研究與維持競爭優勢的重要條件。

成本端的壓力主要來自記憶體。摩根大通研究指出，伺服器供應商喊漲的主要因素是轉嫁記憶體採購成本，而這項成本自2024年初以來已上漲超過400%。另有消息人士形容，合約價格如今可能只是參考，但這仍是匿名人士對交易現況的描述，不能視為已獲確認的通行規則。

伺服器採購方並未向《金融時報》證實，合約是否納入允許出貨階段調價的條款；被點名的業者則未回應評論請求，或婉拒評論。因此，現有資訊尚不足以判斷個別加價要求是否符合原合約，也無法確定這類做法的普遍程度。</p><aside>編輯觀察：若設備價格直到出貨前仍可能變動，採購預算與算力建置成本就更難掌握。關鍵不只在漲幅，也在合約如何分配零組件成本上升的風險。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611230029.aspx">中央社國際</a></p><ul></ul></article><article><h2>Anthropic上市募資813億美元，Notable投資帳面報酬約15倍</h2><p>Anthropic透過首次公開募股募得813億美元，股票開始交易前的完全稀釋估值約為1.5兆美元。TechCrunch報導，上市讓先前參與E輪融資的Notable Capital取得約15倍帳面報酬；這是投資價值的帳面變化，不等於已出售持股並實現獲利。

Notable當初將旗下規模逾10億美元基金中、美國投資部位約一成的資金投入Anthropic。該輪融資對Anthropic的估值為615億美元，是這家以早期投資為主的創投在25年歷史中，投資時估值最高的公司，也使不少有限合夥人對這筆集中押注感到疑惑。

投資團隊的判斷核心是開發者使用趨勢。Notable團隊表示，其分析顯示，開發者在Claude與ChatGPT之間的使用選擇已轉向Claude，使用Claude的比例達七成，與前一年情況相反。共同創辦人Hans Tung認為，開發者是AI的早期採用者，因此值得關注；這些數據與推論屬於投資方說明自身決策的依據，並非對整體市場占有率的獨立認定。

從投資到上市不到兩年，Notable原先受到質疑的大額配置，已轉為可觀的帳面增值。不過，上市估值、投資帳面報酬與最終出售所得是不同概念，不能直接將約15倍報酬解讀為已落袋的現金收益。</p><aside>編輯觀察：這筆投資呈現創投集中押注與上市估值之間的關係，但衡量投資成果時，仍須區分帳面增值與已實現獲利。</aside><p><a href="https://techcrunch.com/2026/11/22/how-notable-capital-gic-and-baillie-gifford-bet-big-on-anthropic-before-its-ipo/">TechCrunch</a></p><ul></ul></article><article><h2>Perplexity推出Monitor API，讓應用程式定期追蹤網頁變化</h2><p>Perplexity推出Monitor API，將單次網路搜尋延伸為定期監測服務，透過Webhook向應用程式與代理程式傳送更新。依公司介紹，開發者可用自然語言設定追蹤目標，讓系統篩選符合條件的新資訊，而不必每次自行發動搜尋。

服務分為兩種模式：網路監測會定期執行網頁與新聞搜尋，追蹤特定主題的新進展；頁面監測則可追蹤最多10個頁面，例如價格表、更新紀錄或政策內容。頁面監測首次執行時會保存基準版本，之後回傳文字差異，供應用程式掌握內容變動。

Perplexity表示，系統會以自家決策模型，依開發者設定的目標評估結果。搜尋結果須通過相關性、來源可信度、新穎性與時效性檢查；頁面變更則會判斷是否與目標有關。各項門檻均達標後，服務才會發出附帶信心分數的通知，開發者也能調整門檻或修改追蹤目標。

排程可從每15分鐘一次到每週一次，也可自行設定。公司稱，服務會排除重複結果，Webhook具簽章機制，暫時性傳送失敗時會自動重試。網路監測每成功執行1,000次收費1美元，頁面監測則每擷取1,000個網址收費1美元，目前已可透過API與控制台使用。</p><aside>編輯觀察：這項產品把搜尋、變更判讀與通知整合為持續運作的流程。對開發者而言，關鍵不只是能否找到更新，也包括篩選門檻是否造成漏報或過多通知；功能說明本身尚不能證明監測準確性或維護效益。</aside><p><a href="https://the-decoder.com/perplexitys-new-monitor-api-turns-web-search-from-a-one-off-query-into-a-nonstop-watchdog/">The Decoder</a></p><ul></ul></article><article><h2>AI溝通風格評測：Astra、Sol回答縮短，承認不確定性相對分數下滑</h2><p>Artificial Analysis的評測顯示，OpenAI的GPT-6.2 Astra與Sol相較前代，回答更短，也更傾向直接切入問題；但在「承認不確定性」特徵上的相對分數同步下降。這項評測呈現的是溝通風格差異，不能直接解讀為模型答對率或整體安全性排名。

Astra平均回答長度由352個英文單字降至210個，減少40%；Sol則由337個降至223個，減少34%。兩者使用的標題與破折號也變少。在衡量是否立即回應實際問題的「先給答案」特徵上，Astra分數由49升至89，Sol由64升至87。

另一方面，Astra的「承認不確定性」分數由96降至24，Sol由98降至51。這些人格特徵分數採1至100的相對排名，反映模型在所有受測模型中的位置，不是行為出現的比例；24分並不代表只有24%的回答承認不確定性。

The Decoder另依評測資料比較模型的綜合指標：Claude Fable 5.2與Opus 5.5的透明度指數分別為81與90，高於Astra的41及Sol的57。該指數納入承認不確定性、說明假設、提示細節差異等五項特徵，並對迎合傾向採反向計分。

評測使用900道英文題目，模型在沒有系統提示的情況下作答，再由三個AI模型組成的評審群比較匿名答案。人格特徵評分與平均字數等直接計數項目分開計算；透明度分數較低，也不必然代表回答更常出錯。</p><aside>編輯觀察：簡潔、直接與充分揭露不確定性是不同的評估面向。使用者不宜把俐落的語氣當成正確性的保證，也不宜把風格指標的相對分數誤讀成錯誤率。</aside><p><a href="https://the-decoder.com/gpt-6-2-astra-and-sol-get-to-the-point-faster-but-score-lower-on-transparency-than-claude/">The Decoder</a></p><ul></ul></article><article><h2>資料中心擴建如何牽動社區？《Hyperscale》作者談水電與噪音爭議</h2><p>資料中心擴建帶來的水電需求與噪音，正成為科技產業與地方社區關係的爭點。記者Paris Marx在新書《Hyperscale》中探討資料中心及生成式AI的影響，並在TechCrunch訪談中主張，應把設施規模、資源需求與居民實際獲益放在一起檢視，而不只關注產業投資。

Marx認為，資料中心之所以容易成為反對科技產業的具體目標，是因為它不像手機裡的服務那樣抽象。設施一旦進入社區，居民可能從電費、水資源取得及冷卻設備噪音感受到影響。他將這些生活層面的疑慮，視為不同政治立場者可能共同關切的問題。

談到研究起點，他提及智利聖地牙哥周邊居民對資料中心用水的擔憂，以及愛爾蘭資料中心用電與電網承載的爭議。Marx強調，用水不能只看全國總量：部分地區水源充足，另一些地區卻已承受供水壓力，因此全國性的產業比較，未必能回答個別社區的問題。

對業者改採冷卻技術的做法，Marx也提出取捨問題。他表示，封閉循環系統可以減少持續補水的需求，但維持水溫需要更多電力；評估替代方案時，不應只談節水而忽略用電。這是他對技術與環境成本的分析，並非針對所有設施提出一致的量化結論。

Marx說，他反對的並非資料中心本身，而是超大規模設施在數量與體積上加速擴張的路徑。他認為，討論核心應包括這些設施服務什麼用途，以及公共利益是否足以支持其資源需求；他對擴建模式「難以永續」的判斷，屬於作者的評價與主張。</p><aside>編輯觀察：這場討論將資料中心從投資與算力議題，拉回地方資源如何分配的公共選擇。作者提出的視角有助區分全國產業總量與個別社區負擔，但具體建案仍須以當地資料檢驗。</aside><p><a href="https://techcrunch.com/2026/11/22/why-data-centers-are-at-the-center-of-the-big-tech-backlash/">TechCrunch AI</a></p><ul></ul></article><article><h2>Zoox加入拉斯維加斯Uber叫車服務，乘客暫不能直接指定</h2><p>Zoox機器人計程車已加入Uber在拉斯維加斯的叫車服務，但乘客目前仍不能直接指定搭乘。現行安排是由平台在有車可用時進行配對；乘客可以提高獲配Zoox的機會，也可以拒絕搭乘機器人計程車。

這使得「能透過Uber搭到自駕車」與「主動選擇自駕車」仍有差別。目前乘客雖有拒絕的權利，能否搭上Zoox仍取決於車輛供應與平台配對，而非直接選取一個獨立的叫車選項。

Uber表示，未來計畫在應用程式加入專門的自駕車選項。執行長Dara Khosrowshahi在11月第三季財報電話會議上說，這項安排將隨車輛可用性與服務可靠度改善而推出；目前已加入平台的Zoox服務，尚不等於這項選擇功能已經上線。</p><aside>編輯觀察：自駕車進入既有叫車平台後，乘客能否明確選擇服務類型，是與車輛能否提供服務不同的問題。觀察後續進展，應區分現行配對機制與Uber尚未推出的專用選項。</aside><p><a href="https://techcrunch.com/2026/11/22/techcrunch-mobility-a-b-testing-robots-vs-humans/">TechCrunch</a></p><ul></ul></article><article><h2>紀錄片《You Can See Everything》全球票房破億美元，美國市場占大宗</h2><p>紀錄片《You Can See Everything》全球累計票房達1億240萬美元，跨過1億美元門檻。這部由Nathan Fielder與Lance Oppenheim執導、以Theranos創辦人Elizabeth Holmes為主題的作品，成為少數全球票房突破億美元的紀錄片之一。

目前票房主要來自美國市場，累計收入為9340萬美元。作品由獨立製片公司A24推出，報導所列製作預算約700萬美元；不過，製作預算與票房收入並非同一會計基礎，不能直接將兩者差額視為片商獲利。

影片接下來數月將陸續在更多國家上映，包括於11月25日、26日在墨西哥、巴西與阿根廷推出。後續發行將擴大其海外上映範圍，但新增市場能帶來多少票房，以及最終能否超越其他紀錄片的票房紀錄，仍有待上映表現確認。</p><aside>編輯觀察：目前成績顯示，這部紀錄片的商業表現高度集中於美國。隨海外上映範圍擴大，後續值得觀察的是其他市場的實際反應，而非將票房紀錄的可能性提前當成結果。</aside><p><a href="https://techcrunch.com/2026/11/22/you-can-see-everything-has-made-more-than-100m-worldwide/">TechCrunch</a></p><ul></ul></article><article><h2>APEC晚宴以〈浮水雲〉迎蘇林，越南官媒與部分網友解讀分歧</h2><p>中國深圳18日晚間舉行APEC領導人非正式會議歡迎晚宴，越共中央總書記兼國家主席蘇林與夫人入場時，中方樂團演奏越南民歌〈浮水雲〉。這項迎賓安排獲越南官方媒體正面報導，卻也引起部分越南網友質疑，認為歌詞可能帶有外交上的影射。

〈浮水雲〉是越南北方傳統民歌，以隨水漂流的布袋蓮、隨風飄動的雲朵等意象，襯托女子等待遠方戀人的思念與忠貞。越南主流媒體將選曲視為東道主展現禮遇與文化尊重，也有越南人表達感動與自豪。

不同的解讀則出現在社群平台。部分留言把漂泊不定的意象連結到越南在大國之間維持獨立自主、靈活平衡的「竹子外交」，懷疑中方藉此暗諷越南立場隨外力變動。一名越南頻道創作者討論選曲的41秒YouTube短片，在兩天內獲得41萬次觀看、近500則留言。

相關討論也出現在Threads、Facebook與Reddit，但反應並不一致：有人認為在高度政治化的場合選用這首歌值得質疑，也有人強調歌曲本身優美，聽到熟悉民謠令人產生文化自豪感。</p><aside>編輯觀察：外交場合的文化安排可能因歌詞意象與政治脈絡而產生不同解讀，但社群質疑不能直接證明主辦方意圖，網路留言也不能代表越南整體民意。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611230013.aspx">中央社國際</a></p><ul></ul></article><article><h2>普發2萬元條例三讀後續受關注　藍憂不副署、綠籲守財政紀律</h2><p>立法院會11月20日三讀通過「全民共享經濟成果及穩定民生特別條例」，涉及普發現金新台幣2萬元。條例通過後，行政院如何因應成為爭點；行政院表示，條例具有高度違憲疑慮及財政風險，將審慎評估合法、合憲的因應作為。

國民黨立法院黨團書記長許宇甄22日表示，三讀通過只是第一步，接下來要防止行政院以不副署阻擋。她主張，普發2萬元可減輕家庭負擔、刺激內需，並將此次表決結果視為國民黨團兌現還稅於民的承諾。

民進黨團幹事長莊瑞雄則表示，行政院原先提出普發1萬元，是以歲入歲出平衡、實質零舉債為前提；國民黨加碼至2萬元，不能只提出支出要求，再由行政院負責承擔。

莊瑞雄並援引憲法第70條對立法院增加預算支出提議的限制，主張副署與否應依憲法及相關法律審慎判斷，不應由選舉輸贏決定。行政院與兩黨對財政及合憲性的立場仍有分歧，條例三讀通過並不等同現金已進入發放階段。</p><aside>編輯觀察：後續觀察重點是行政院採取何種法律與財政處理方式。政黨對普發金額的主張、條例通過與實際執行，應分開檢視，不能以政治表態取代發放安排。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611220122.aspx">中央社政治</a></p><ul></ul></article><article><h2>卓榮泰保證翡翠水庫不設光電　批蔣萬安競選團隊抹黑</h2><p>行政院長卓榮泰11月22日傍晚公開表示，翡翠水庫目前沒有光電板，並保證未來也不會設置。他強調，施政將以國人健康為重。

卓榮泰是在新北高工操場出席民進黨新北市長候選人蘇巧慧的造勢活動時作出上述表態。他質疑，為何翡翠水庫光電議題在選舉期間被提出，並指控台北市長蔣萬安競選團隊藉此抹黑，要求外界不要再散布相關說法。

這項發言同時包含不設置光電的政策承諾，以及對競選對手的政治指控；其中「抹黑」是卓榮泰的判斷，不能與不設置光電的承諾混為一談。</p><aside>編輯觀察：翡翠水庫不設光電的承諾可作為後續檢視政策的依據，但不能延伸為對其他水庫光電安全性的判斷。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611220158.aspx">中央社政治</a></p><ul></ul></article><article><h2>蘇清泉承諾客務經費10億元起跳　民進黨指應納跨局處支出比較</h2><p>國民黨籍屏東縣長候選人蘇清泉11月22日在竹田鄉舉辦六堆客家團結大會，承諾若當選，將給予客家事務處新台幣10億元起跳的經費。民眾黨主席黃國昌到場支持，客家事務預算與人事安排成為活動中的政策訴求。

蘇清泉表示，屏東客家人口占全縣近四分之一，但客家事務處一年預算僅1億元，並批評縣府漠視客家鄉親權利。他另承諾，若擔任縣長，兩名副縣長與一名秘書長之中，至少安排一名客家籍人士，並投入客家文化傳承教育。

民進黨屏東縣黨部主委徐富癸回應，縣府已設置一級單位客家事務處，專責統籌客家文化與政策；但六堆鄉鎮的道路、治水防洪，以及活動、社福與長照服務，原本就由各專業局處負責，相關經費也分別編列，不能只看單一處室。

徐富癸以剛動工的「客家總圖書館」為例，指出總工程經費3.28億元編列在文化處；他並表示，現任副縣長黃國榮、副秘書長江國豐都是客家籍。雙方對預算比較範圍及人事安排各有說法，蘇清泉提出的10億元則仍屬競選承諾，並非已核定支出。</p><aside>編輯觀察：政策比較須先釐清預算口徑：單一處室預算不等於所有客家相關支出。若要判斷加碼幅度與可行性，仍需對照支出期間、跨局處項目及財源安排。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611220190.aspx">中央社政治</a></p><ul></ul></article><article><h2>鄭朝方爭取高中職增班增額　主張評估竹北等生活圈設完全中學</h2><p>民進黨新竹縣長候選人鄭朝方11月22日提出「高中五方案2.0」，主張擴增高中職招生名額，並優先評估在竹北、竹東及新豐湖口生活圈增設完全中學，希望減輕學生跨區通學與家長接送負擔。

這次提出的競選主張，與縣府既有招生規劃有所區別。鄭朝方表示，116學年度適逢龍年出生學生升上高中，依縣府現行高中五大方案，預計比112學年度增加逾1,000個高中職招生名額，涵蓋六家高中、湖口高中、文興高中、自強高工及縣立竹北實驗高中等校。

至於後續調整方向，鄭朝方主張依人口移入、國中畢業生人數及跨區就學需求，逐年調整招生名額與校舍規劃，同步爭取師資、課程及教學設備資源；評估增設完全中學時，也將納入公車接駁及通學時間。競選團隊表示，他日前曾與教育部長鄭英耀討論相關需求；團隊轉述，鄭英耀表示教育部已盤點高中教育量能，將持續挹注資源支持地方教育發展。</p><aside>編輯觀察：這項競選主張將招生量能與通學負擔一併納入考量。後續值得關注的是，招生名額、校舍、師資與交通接駁能否配合規劃；評估增設學校與爭取資源，仍須和已確定執行的措施區分。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611220140.aspx">中央社政治</a></p><ul></ul></article><article><h2>從車掃到開票　梁啟智與飛地書店策劃台灣觀選指南</h2><p>九合一選舉將於11月28日投票，移居台灣的香港學者梁啟智與台北飛地書店共同策劃「台灣觀選指南2026」，協助海外旅客理解選舉活動。指南不以推薦支持對象為目的，而是鼓勵讀者帶著好奇心走入街頭，觀察選舉如何融入日常生活。

指南分為五部分，從台灣選舉基本知識、六種觀選體驗，到如何見證投票與開票，並介紹民主歷史景點及持續學習民主的方式。六種體驗包括競選總部、車掃、市場拜票、造勢大會、街頭看板與網路宣傳，每項都搭配觀察重點及小任務。例如觀看車掃時，可留意街頭動員、行經路線及候選人與選民互動；走訪競選總部，則可比較選舉小物呈現的形象。

梁啟智表示，自己約十年前曾帶領香港大學生來台觀選，今年選舉期間則未察覺類似活動，但他不想猜測原因。他認為，看選舉需要方法，因此希望把親身經驗整理成旅客可使用的指引。指南也推薦二二八紀念館、景美人權文化園區等地，將觀選行程延伸至台灣民主發展歷程。

這份指南可在飛地書店索取，採自由定價。梁啟智另表示，之後也會將指南上傳網路。</p><p><a href="https://www.cna.com.tw/news/aipl/202611220117.aspx">中央社政治</a></p><ul></ul></article><article><h2>黃世杰北桃園造勢　交通整合、龍科三期與產業轉型成政策訴求</h2><p>民進黨桃園市長候選人黃世杰11月22日晚間在桃園區朝陽森林公園舉辦「北桃園大團杰」造勢晚會，交通建設與產業轉型成為政策訴求。總統賴清德、前總統蔡英文、行政院長卓榮泰及勞動部長洪申翰均到場助選。

賴清德在致詞時表示，黃世杰未來將整合捷運、鐵路及公路資源，推動桃園鐵路地下化與龍科三期，並導入人工智慧，協助中小企業進行數位及淨零轉型，以及打造無人機產業測試中心。這些內容是造勢場合提出的未來政策方向，而非本次活動公布的建設核定結果。

黃世杰則主張，桃園應加速補足建設，推動產業、交通、醫療及生活層面的改革。卓榮泰在助選時表示，黃世杰曾向行政院提出加速龍科三期及航空城拆遷補償方案；他並以桃竹苗大矽谷為發展契機，倡議串聯台北、新北與桃園生活圈。</p><p><a href="https://www.cna.com.tw/news/aipl/202611220183.aspx">中央社政治</a></p><ul></ul></article></main></noscript>
