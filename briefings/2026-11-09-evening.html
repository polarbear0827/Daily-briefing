  <noscript><main><h1>氣候峰會、區域安全與市場動向：本期新聞選輯</h1><p>2026-11-09 科技晚報</p><article><h2>輝達稱啟動獨立調查，釐清黃仁勳疑遭外國情報鎖定報導</h2><p>據《衛報》RSS摘要，輝達表示，因報導指執行長黃仁勳疑遭外國情報行動鎖定，將啟動獨立調查。《紐約時報》摘要稱，美國高層官員關切他與一名被指涉及中國情報活動女子的關係；中央社摘要則報導輝達盤後股價下跌。中央社另報導，川普稱黃仁勳「為人正直」，但尚未與他談過涉及中國女間諜的指控。</p><p><a href="https://www.theguardian.com/us-news/2026/nov/08/nvidia-jensen-huang-investigation">The Guardian</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611090152.aspx">中央社國際</a></li><li><a href="https://www.nytimes.com/2026/11/08/us/politics/rubio-nvidia-ceo-chinese-spy.html">NYT</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611090014.aspx">中央社科技</a></li></ul></article><article><h2>COP31土耳其召開，聯合國秘書長警告極端氣候成常態</h2><p>據中央社RSS摘要，聯合國秘書長警告，世界已進入極端氣候成為常態的新局面，呼籲出席土耳其COP31的各國領袖認真應對。德國之聲摘要指出，主辦國土耳其雖試圖推動全球轉向潔淨能源，仍高度依賴化石燃料。</p><p><a href="https://www.cna.com.tw/news/aopl/202611090188.aspx">中央社國際</a></p><ul><li><a href="https://www.dw.com/en/turkey-pushes-for-transition-at-cop31-as-coal-burns/a-79871687?maca=en-rss-en-all-1573-rdf">Deutsche Welle</a></li></ul></article><article><h2>波蘭克拉科夫槍擊案嫌犯傷重死亡，當局續查動機</h2><p>據德國之聲RSS摘要，波蘭當局表示，克拉科夫槍擊案嫌犯因與警方交火受傷，於醫院死亡。BBC摘要稱槍擊造成至少6死，另在嫌犯家中發現3名家人遺體；FOX摘要報導槍擊造成6死15傷。彭博摘要指出，當局仍在追查犯案動機。</p><p><a href="https://www.dw.com/en/krakow-mass-shooting-suspect-has-died-in-hospital-police-in-poland-say/a-79895626?maca=en-rss-en-world-4025-xml-mrss">DW World</a></p><ul><li><a href="https://www.bbc.co.uk/news/articles/c6y434dw8319o?at_medium=RSS&amp;at_campaign=rss">BBC World</a></li><li><a href="https://www.bloomberg.com/news/articles/2026-11-09/krakow-mass-shooter-dies-in-the-hospital-polish-police-says">Bloomberg Markets</a></li><li><a href="https://www.foxnews.com/world/poland-krakow-square-shooting-gunman-dies">FOX World</a></li></ul></article><article><h2>中國4艘海警船航入金門限制水域　海巡耗時2小時驅離</h2><p>中央社RSS摘要指出，東北季風增強、海象惡劣之際，中國4艘海警船編隊航入金門限制水域。海巡署調派巡防艇，以中、英文廣播，耗時2小時將4船全數驅離。</p><aside>編輯觀察：此事件涉及金門限制水域的海巡執法，以及惡劣海象下的驅離作業。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611090216.aspx">中央社政治</a></p><ul></ul></article><article><h2>台股收漲1960.06點　外資仍連8個交易日賣超</h2><p>中央社RSS摘要指出，台股收漲1960.06點，外資仍連續8個交易日賣超。摘要引述投顧分析，台股是否真正落底，仍須觀察美股走勢與外資後續動向。</p><aside>編輯觀察：台股大漲與外資持續賣超同時出現；摘要引述的投顧分析仍將美股及外資後續動向列為觀察重點。</aside><p><a href="https://www.cna.com.tw/news/afe/202611090237.aspx">中央社財經</a></p><ul></ul></article><article><h2>財政部估全年出口值突破9000億美元　規模將超越日本</h2><p>中央社RSS摘要引述財政部預估，今年全年出口值可望突破9000億美元、創歷史新高，並超越日本。財政部也預期，台灣出口世界排名可望由去年的第12名升至第8名，並有望挑戰第7名。</p><aside>編輯觀察：財政部預估涉及全年出口值新高及世界排名提升，但仍屬預估，並非全年實績。</aside><p><a href="https://www.cna.com.tw/news/afe/202611090234.aspx">中央社財經</a></p><ul></ul></article><article><h2>中國將對美額外24%關稅等報復措施暫停期限再延兩個月</h2><p>Bloomberg Economics的RSS摘要指出，中國將對美國商品加徵24%關稅等報復措施的暫停期限再延長兩個月。此舉將兩國領導人延長貿易休戰至明年1月的決定正式化。</p><p><a href="https://www.bloomberg.com/news/articles/2026-11-09/china-extends-pause-on-24-us-tariffs-to-january-keeps-10-rate">Bloomberg Economics</a></p><ul></ul></article><article><h2>美國主導俄烏和平談判本週於阿布達比恢復　停火不列議程</h2><p>NYT World的RSS摘要指出，美國主導、旨在結束俄烏戰爭的談判將於本週在阿布達比恢復。停火不在此次談判議程內。</p><p><a href="https://www.nytimes.com/2026/11/09/world/europe/ukraine-russia-peace-talks.html">NYT World</a></p><ul></ul></article><article><h2>Google宣布Gemini中文版購物功能在台推出</h2><p>中央社RSS摘要報導，Google宣布在台灣推出Gemini中文版購物功能。Google表示，使用者可用日常口語描述需求與預算，由Gemini產生商品圖卡，列出價格、評價、庫存、購買管道及規格比較表。</p><p><a href="https://www.cna.com.tw/news/ait/202611090093.aspx">中央社科技</a></p><ul></ul></article><article><h2>挪威將暫停為資料中心新增預留電力連接　評估電網負擔</h2><p>據Bloomberg Markets的RSS摘要，挪威將暫停為資料中心進一步預留電力連接，同時評估如何因應資料中心對電網造成的負擔。</p><p><a href="https://www.bloomberg.com/news/articles/2026-11-09/norway-halts-power-connections-for-new-data-centers">Bloomberg Markets</a></p><ul></ul></article><article><h2>韓國主管機關指酷澎濫用餐飲外送市場地位　裁罰3009億韓元</h2><p>中央社RSS摘要報導，韓國公平交易委員會以酷澎濫用餐飲外送市場主導地位為由，裁罰3009億韓元（約2億2059萬美元）。</p><p><a href="https://www.cna.com.tw/news/aopl/202611090208.aspx">中央社國際</a></p><ul></ul></article><article><h2>生醫語言模型配對研究：微調後適當不作答表現可能下降</h2><p>arXiv研究摘要指出，研究以11個對應基礎模型檢查點，配對稽核25個生醫領域微調大型語言模型。在MedAbstain基準，適當不作答比例的中位數由8.3%降至4.2%，25組中有21組下降；各配對的變化幅度與方向不一。</p><p><a href="https://arxiv.org/abs/2611.08780">arXiv NLP</a></p><ul></ul></article></main></noscript>
