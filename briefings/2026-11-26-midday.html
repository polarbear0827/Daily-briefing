  <noscript><main><h1>國際時事焦點：美國關稅提案、經濟情勢與科技監管</h1><p>2026-11-26 時事焦點</p><article><h2>美301調查建議對台課15%不疊加關稅　仍待法定程序定案</h2><p>美國貿易代表署11月25日公布製造業結構性產能過剩301調查報告，提議對14個經濟體加徵關稅，對台灣的建議稅率為15%，不疊加最惠國（MFN）關稅及既有強迫勞動301關稅。這仍是建議措施，並非已生效的新稅率。

行政院26日表示，台灣與日本、韓國、歐盟及瑞士同屬最低建議稅率級別。不過，台美經貿工作小組也指出，若美國貿易代表對後續諮商及相關承諾不滿意，報告另列較高稅率的替代方案，台灣為25%、扣除既有301關稅。政府表示，依雙方溝通情形，有信心維持先前議定的15%不疊加待遇，但這是對最終結果的預期。

依美方程序，公眾意見徵詢期限為2027年1月5日，並將自1月25日起舉行公聽會，完成法定程序後才會定案。行政院強調，在此之前，台灣輸美的傳統工業及農業產品仍適用強迫勞動301關稅，也就是10%不疊加MFN，不能將此次15%的建議視為立即調升。

擬議措施也設有產品豁免。美方預先發布的公告列入目前適用232條款關稅的鋁、鋼鐵與銅製品，以及部分車輛和零組件、木製品、專利藥品與半導體產品等。行政院副院長鄭麗君表示，此次豁免項目達2232項，蝴蝶蘭、茶葉、咖啡及鳳梨酥均在其中，比台美對等貿易協定的豁免項目更多。

這次調查是美國在對等關稅法源失效後，重建關稅法律基礎的一環。台美今年初已簽署對等貿易協定及投資合作備忘錄；鄭麗君表示，政府將爭取最終待遇回歸原有談判結果，預估明年初才會確認。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260002.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611260034.aspx">中央社政治</a></li><li><a href="https://www.cna.com.tw/news/aipl/202611260005.aspx">中央社政治</a></li><li><a href="https://www.cna.com.tw/news/aipl/202611260015.aspx">中央社政治</a></li></ul></article><article><h2>聯準會褐皮書：美經濟溫和成長　成本壓力推動消費轉向低價</h2><p>美國聯準會11月25日公布褐皮書，顯示近幾週多數地區經濟以輕微至溫和速度成長，就業水準上升，但企業仍承受成本壓力，消費者也更重視價格。12個聯準會行政區中，8區回報經濟成長，4區經濟活動沒有變化，反映各地景氣步調不一。

企業受訪者普遍提到能源、運輸、醫療保健、保險及關稅相關支出帶來壓力，投入成本的上升速度仍高於售價漲幅。報告指出，競爭與顧客對價格的敏感度，限制企業將成本完全轉嫁，利潤率因此受到擠壓；受訪者預期，未來幾個月支出與價格仍將上揚。

需求面則呈現投資與消費分歧。人工智慧熱潮帶動企業投資維持強勁，但家庭財務壓力加重，消費者轉向較便宜的商品，整體消費支出持平。克里夫蘭聯邦準備銀行並指出，資料中心需求強勁，使微晶片與電力元件供應吃緊、交貨時間拉長，部分客戶因而提前下單。

同日公布的10月個人消費支出物價指數（PCE）年增3.8%，排除食品與能源的核心PCE年增率升至3.3%，高於市場預期，並創3年高點。聯準會目前政策利率區間為3.75%至4.00%，下次會議訂於12月8日至9日。市場普遍預期至少升息1碼，但股市大跌後，升息預期已有降溫；這些預期不代表聯準會已作成決定。

本期褐皮書納入截至11月16日的訪談資料，以企業等受訪者提供的質化資訊，補充經濟統計。報告呈現的成長、成本與消費變化，將提供官員評估景氣及通膨的參考，而非利率決策本身。</p><p><a href="https://www.cna.com.tw/news/aopl/202611260027.aspx">中央社國際</a></p><ul></ul></article><article><h2>北韓中央通信社稱金正恩視察核設施　主張多領域部署戰術核武</h2><p>北韓中央通信社11月26日報導，北韓領導人金正恩視察核材料生產及武器研究設施，並表示北韓應著重在多個領域部署戰術核武。

金正恩表示，北韓正有系統地擴大核材料生產能力。他並宣稱，儘管外界呼籲北韓實現無核化，北韓作為核武國家的地位仍絕對不容侵犯。相關產能擴張及部署方向均為北韓方面的說法。</p><aside>編輯觀察：金正恩將核材料產能擴張與戰術核武部署方向並列，顯示其強調的重點不只在擁核地位，也包含生產能力與部署安排；但這些表態不能視為相關能力或部署進度已獲證實。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611260014.aspx">中央社國際</a></p><ul></ul></article><article><h2>華為竊密與規避伊朗制裁案遭美陪審團裁定有罪　公司擬上訴</h2><p>美國陪審團裁定，華為竊取美國科技公司商業機密並規避對伊朗制裁的相關罪名成立。獲判有罪的罪名包括銀行詐欺、共謀詐欺美國政府、共謀洗錢，以及違反《國際緊急經濟權力法》。華為否認不法，律師表示將提出上訴。

美國司法部表示，華為為維持取得美元及參與全球市場的管道，多次向銀行隱瞞伊朗業務，實際上透過Skycom名義在當地營運。司法部並稱，華為提供伊朗網路骨幹及行動網路相關服務，也協助監控、審查網路使用者，提供用於監控抗議活動的攝影機。

竊密部分，司法部列出的受害企業包括T-Mobile、Cisco、半導體儲存公司CNEX及天線製造商Quintel，涉及路由器原始碼、使用手冊、天線與機器人測試技術。司法部指出，華為取得T-Mobile觸控螢幕測試機器人Tappy的照片及技術資訊後，還有員工將機器人零件放進背包，帶離受管制的實驗室。

華為律師則強調，陪審團並未就敲詐勒索及共謀妨礙司法罪名定罪，主張技術竊取案例屬個別員工的不當行為，不足以支持美方對整家公司的描述。中國外交部也反對美方藉裁決打壓華為。

依司法部說明，這項裁決可能帶來刑事罰金、沒收及賠償，但目前提供的資料尚無量刑結果，不能將可能處罰視為已確定的財務負擔。</p><p><a href="https://arstechnica.com/tech-policy/2026/11/jury-convicts-huawei-of-stealing-us-trade-secrets-evading-iran-sanctions/">Ars Technica</a></p><ul></ul></article><article><h2>黃仁勳復任後輝達治理受檢視　標普列降級觀察、穆迪維持評等</h2><p>黃仁勳因婚外情風波於11月12日辭去輝達執行長、23日復任後，公司治理與政府介入問題持續受到檢視。標普全球評級25日將輝達列入可能降級的觀察名單；穆迪則維持評等與穩定展望，兩家機構對領導層迅速復原的風險判斷出現分歧。

標普目前給予輝達AA評等，認為這次人事反覆暴露董事會監督弱點，部分董事任期過長可能影響獨立性，治理制度也可能未跟上公司成長。標普表示，可能在90天內調降評等，預期幅度為一級，除非後續調查或揭露進一步傷害聲譽與業務前景。穆迪維持Aa1評等，認為黃仁勳回任降低短期執行及更換領導人的風險，但治理與監管不確定性仍在。

政府如何促成復任，也有待釐清。匿名知情人士稱，五角大廈高層曾討論援引《國防生產法》，藉要求更多產能轉向軍事項目，對輝達董事會施壓。不過，目前不清楚官員實際傳達了什麼，或討論是否呈報川普與副總統范斯；五角大廈否認相關對話曾發生，輝達婉拒置評。法律及國防採購專家也質疑，該法能否作為干預執行長人選的依據。

范斯25日表示，未見黃仁勳犯罪的證據，並稱司法部及國安機構官員告訴他，黃仁勳未受調查。這與客戶的出口管制案件須分開看待：美方自2024年調查Megaspeed晶片採購，關切原供馬來西亞資料中心使用的晶片是否流向中國，並曾向輝達索取資料；Megaspeed否認不法。輝達董事會對黃仁勳的內部調查也尚未結束。

輝達表示，將聘任首位法遵主管，並成立專責出口管制的董事會委員會。國會仍要求公司說明出口管制遵循及政府介入復任的過程，參議院銀行委員會預定12月3日舉行公開聽證。復任解決了領導人選問題，卻尚未為治理與晶片流向爭議畫下句點。</p><p><a href="https://www.cna.com.tw/news/aopl/202611260040.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611260016.aspx">中央社國際</a></li><li><a href="https://www.cna.com.tw/news/afe/202611260022.aspx">中央社財經</a></li><li><a href="https://techcrunch.com/2026/11/25/the-questions-jensen-huang-and-nvidia-will-still-have-to-answer-about-megaspeed/">TechCrunch AI</a></li></ul></article><article><h2>美FCC有條件批准SpaceX百萬顆資料中心衛星計畫　退役處置仍待審</h2><p>美國聯邦傳播委員會（FCC）25日有條件批准SpaceX部署及營運最多100萬顆Starmind衛星，用於建置軌道資料中心、處理供地球使用的資料。這項許可跨過重要監管門檻，但不代表太空資料中心的技術與經濟可行性已獲證實，也不代表SpaceX必然部署全部核准數量。

許可給予相當長的建置時間：SpaceX須在七年內將首顆可運作衛星送入軌道，2035年11月前部署10萬顆，整體星系的部署期限則為2040年11月。Starmind規劃主要透過雷射與其他衛星連線，包括Starlink；此次核准也允許在主要通訊系統失效時，以無線電頻率維持地面聯繫及控制。

退役衛星如何處置，仍是未解的核准條件。SpaceX希望部分在600公里以上運作的衛星，任務結束後可移往其他地球軌道，甚至繞太陽運行，而非重返大氣層。FCC認為資料不足，尚未批准這項豁免；不打算以重返大氣層方式處置的衛星，部署前仍須取得許可。

Amazon、Viasat及American Astronomical Society等對計畫提出反對或疑慮，涉及軌道壅塞、碎片、無線電干擾與天文觀測影響。FCC認為部分問題超出審查權限，對衛星重返大氣層造成污染的疑慮，則認為現有紀錄不足以支持，未對整體星系進行全面環境評估。

SpaceX宣稱，利用近乎持續的太陽能可降低成本與地面資料中心的環境衝擊；但衛星製造與發射成本、處理器散熱，以及送往軌道的晶片如何取得融資，仍是待克服的障礙。監管許可提供了部署空間，實際規模與商業效益仍待驗證。</p><p><a href="https://techcrunch.com/2026/11/25/fcc-approves-spacex-plan-to-put-ai-data-centers-in-space/">TechCrunch</a></p><ul><li><a href="https://www.cna.com.tw/news/ait/202611260012.aspx">中央社科技</a></li><li><a href="https://arstechnica.com/space/2026/11/the-fcc-has-authorized-spacex-to-deploy-1-million-satellites/">Ars Technica</a></li></ul></article><article><h2>共和黨多名眾議員勸進盧比歐角逐2028年總統</h2><p>美國共和黨期中選舉失利後，多名共和黨籍聯邦眾議員公開支持國務卿盧比歐考慮投入2028年總統大選。不過，盧比歐已公開否認有關其未來政治規畫的說法，目前議員的勸進與支持表態，並不代表他已決定參選。

紐約州眾議員瑪里歐塔基斯稱許盧比歐沉著、熟悉議題且善於表達，並表示她認為黨內有不少人希望他考慮參選。印第安納州眾議員史塔茲曼則在選舉之夜表態全力支持盧比歐，認為他有能力凝聚各方；史塔茲曼也將選後重點放在加強溝通，稱共和黨失去國會多數席次後，已無法推動政策。

佛州眾議員西門內斯表示，有同僚主動向他表達，如果盧比歐參選便願意支持，而且不只是少數人的想法。同州眾議員哈里多波洛斯也說，自己已連續兩個月公開支持盧比歐，從與各方交談的回應來看，支持聲浪熱烈。

這些議員的表態，顯示共和黨部分人士已將選後路線調整與2028年人選相連結。不過，所謂支持規模仍是議員各自對黨內聲音的描述，不能據此視為共和黨已形成提名共識。</p><p><a href="https://www.cna.com.tw/news/aopl/202611260008.aspx">中央社國際</a></p><ul></ul></article><article><h2>美國FinCEN部分系統遭未授權存取　預防性下線恐延遲服務</h2><p>美國財政部金融犯罪防制網（FinCEN）發現部分系統遭未授權存取，已預防性將部分系統下線並展開調查。該機關表示，受存取的是有限部分的系統，但尚未公布事件的具體範圍與原因。

FinCEN負責防制洗錢、恐怖主義融資等非法金融活動，也管理供執法使用的金融交易資料，並依《銀行保密法》收取銀行提交的可疑活動報告。此次事件涉及這個金融資訊與執法支援機關的系統安全，但現有資訊尚不足以判定哪些資料受到影響。

服務並未全面中斷。FinCEN表示，銀行仍可透過線上管道提交可疑活動報告，供金融機構使用的電話專線也未受影響，不過部分服務可能出現延遲。現階段須區分已確認的未授權存取、預防性下線措施，以及仍持續運作的申報管道，不能將事件概括為所有金融申報服務停擺。</p><p><a href="https://the-decoder.com/back-to-back-cyber-incidents-at-us-financial-investigators-and-spy-agencies-follow-a-string-of-federal-hacks-and-outages/">The Decoder</a></p><ul></ul></article><article><h2>Character.ai擬拍賣私人對話資料　美42州檢察長介入反對</h2><p>美國42州檢察長組成聯盟，介入聊天機器人業者Character.ai的破產程序，試圖阻止公司出售包含私人對話的敏感使用者資料。拍賣預定12月1日舉行，目前仍是擬議出售計畫，並非已完成交易。

各州檢察長發布的聲明指出，相關資料集包含超過2,100萬個美國帳號的聊天紀錄，其中逾210萬個帳號屬於未成年人；擬出售的內容還包括IP位址等個人資料。Character.ai於10月聲請《破產法》第11章保護。檢察長指出，公司先前曾向消費者承諾不會出售個人資訊；公司則曾在部落格表示，使用者資訊仍會受到其隱私權政策保護。

加州檢察長Rob Bonta指出，Character.ai已選定Smirks and Pangs Acquisition LLC作為拍賣的基準出價方。這家公司於2026年11月13日在德拉瓦州成立，隔天即獲選；買方打算如何使用聊天資料，目前仍不清楚。

這場活動原訂27日晚間6時，在台北市仁愛路四段、靠近國父紀念館一側舉行。警方先前公布的交通措施，自25日上午9時30分起，管制仁愛路逸仙路至光復路間的公車道、快車道及北側慢車道，以及逸仙路松高路至仁愛路間全線等路段，引發外界議論。

沈伯洋在晚間發布的影片中表示，凱達格蘭大道、市府路與北平東路已被借用，市府廣場則無法借用，因此最後選在仁愛路四段。他說，團隊曾與台北市政府多次開會並提出交通措施，但當晚交通仍不順暢，因此決定以市民交通為優先，取消活動並拆除舞台。這些場地選擇與協調經過，均為沈伯洋的說明。

總統賴清德隨後在臉書支持取消決定，稱這是「最睿智且最勇敢的決定」，並呼籲支持者保持冷靜與信心。前總統蔡英文也表示，將於26日晚間參加沈伯洋的直播。原定市民之夜取消後，團隊尚未在報導中提出新的活動方案。</p><aside>編輯觀察：事件核心在於選舉活動使用道路與市民通行權益之間的取捨。取消活動是處置決定，實際交通影響是否解除，仍須有道路恢復與現場作業完成的資訊才能判定。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611250340.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611250341.aspx">中央社政治</a></li></ul></article><article><h2>九合一選舉、公投28日投票　游盈隆估午夜前完成計票</h2><p>九合一選舉與「廢除非核家園」公投將於11月28日投、開票。中選會主委游盈隆25日視察台北市選務整備時表示，有信心在投票日午夜12時前完成開票計票，並以提前完成為目標；這是選前預估，並非已完成的結果。

中選會公布，游盈隆依序走訪信義、南港及北投區選務作業中心，也勘查志願服務推廣中心、九如區民活動中心、稻香區民活動中心及桃源國中等投開票所設置地點。他表示，從核對選舉人名冊、引導領票與投票，到開票計票，各環節都攸關選舉公信力。

對於完成計票的時間，游盈隆以民國111年地方公職人員選舉併辦投票案為參考，指出當時於晚間11時40分完成開票，預估這次不會晚於當時。他表示，選務團隊將憑藉過往經驗與連日整備，在兼顧正確與迅速的前提下完成作業。</p><p><a href="https://www.cna.com.tw/news/aipl/202611250307.aspx">中央社政治</a></p><ul></ul></article><article><h2>施振榮APEC期間會晤美國務次卿　討論科技與安全供應鏈</h2><p>台灣APEC領袖代表施振榮在中國深圳出席經濟領袖會議期間，與美國國務院政治事務次卿胡克爾會面。外交部表示，雙方探討共同利益，重申台美長期以來的科技夥伴關係，並強調新興科技、安全供應鏈與共享經濟繁榮的機會。

2026年APEC經濟領袖會議於11月18、19日在深圳舉行，施振榮代表總統賴清德出席。外交部於25日在社群平台X公布這場會面，說明雙方討論的合作方向。</p><p><a href="https://www.cna.com.tw/news/aipl/202611260031.aspx">中央社政治</a></p><ul></ul></article><article><h2>台股重挫後早盤反彈逾900點　重返39000點</h2><p>台股11月26日開高反彈，早盤最高來到39176點，上漲逾900點，電子、金融與傳產類股同步走揚。前一交易日指數收盤大跌1926.92點，收在38195.43點、跌破年線，隔日早盤收復39000點關卡，但尚非收盤結果。

個別電子權值股表現分歧。台積電開平後震盪走低，早盤低點為2135元，跌幅約0.7%；台達電上漲逾6%，最高1130元，大立光則攻上漲停價4425元。

關稅消息也是市場關注焦點。行政院26日表示，美國對台灣的建議稅率為15%，不疊加最惠國關稅，且不再疊加強迫勞動301關稅，與日本、韓國、歐盟、瑞士等同屬最低稅率級別。這項說明涉及美方301條款調查提出的建議稅率，並非已實施的新稅率。

資金面則呈現法人買賣分歧。25日三大法人合計賣超829.55億元，其中外資及陸資賣超1236.54億元，已連續8個交易日賣超；自營商賣超128.33億元，同樣連8賣。投信則逆勢買超535.32億元，連續兩個交易日買超。</p><p><a href="https://www.cna.com.tw/news/afe/202611260033.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611260021.aspx">中央社財經</a></li></ul></article><article><h2>Etsy釐清AI條款：不以仿製商品為目的訓練模型，仍有創作者計畫離開</h2><p>Etsy修改人工智慧相關服務條款引發賣家反彈後，執行長Kruti Patel Goyal出面澄清，公司不會以製作賣家商品仿製品為目的訓練AI模型。她也承認，團隊原本應更充分說明條款更新對創作內容的意義。

爭議源於11月提出的新條款，內容授權Etsy及其第三方合作夥伴、供應商，使用使用者內容開發、訓練、測試與改善AI及機器學習技術，包括改善服務或維護安全，並受隱私政策所列適用退出權利約束。Goyal表示，更新是為了反映平台用來改善賣家工具與社群體驗的技術；這項說明並不等同全面排除內容用於AI訓練。

澄清仍未消除部分創作者疑慮。專業插畫家、Etsy賣家Aaron Meshon向Ars Technica表示，平台雖稍微收斂AI相關措辭，對他而言仍只是表面修飾。他計畫於12月1日關閉經營15年的商店，並估計因此損失約兩成年度收入，相當於數期房貸支出。

Meshon也批評公告時機，認為年底假期前是許多零售商的重要營收期，不宜在此時推動引發疑慮的變更。這是個別賣家的回應，不能據此推定所有創作者都將退出平台。</p><aside>編輯觀察：平台承諾不以仿製商品為目的訓練模型，與全面禁止內容用於AI訓練，是不同範圍的承諾。創作者評估授權與收入風險時，仍須區分公司說明與條款實際涵蓋的用途。</aside><p><a href="https://arstechnica.com/tech-policy/2026/11/etsy-clarifies-ai-terms-after-seller-backlash/">Ars Technica</a></p><ul></ul></article><article><h2>Flipkart執行長將於12月4日離任，產品與技術主管暫代</h2><p>印度電商Flipkart執行長Kalyan Krishnamurthy即將離任。Walmart發言人向TechCrunch確認，他在公司的最後工作日為12月4日；Flipkart表示，將於未來幾週公布接班人，在此之前由產品與技術長Balaji Thiagarajan暫時領導公司。

Krishnamurthy於2015年從Flipkart早期投資者之一Tiger Global加入公司，2017年出任執行長。2018年Walmart以160億美元取得Flipkart控制性股權後，他繼續掌舵，至今在公司任職超過11年。Flipkart表示，在他領導期間，公司業務規模增至原先五倍以上。

Flipkart目前擁有逾5億名註冊使用者，以及包含低價購物平台Shopsy在內的逾140萬名賣家，提供超過80類、逾1.5億項商品。公司近來也透過Flipkart Minutes拓展即時配送，並以Eat-in by Minutes進入餐飲外送業務。

接手過渡期營運的Thiagarajan於去年9月加入Flipkart，負責產品與技術團隊。Walmart對於Krishnamurthy離職原因，以及這次領導層異動是否影響上市計畫，未在既有公告之外進一步說明；目前已公布的是暫代安排，正式接班人仍待揭曉。</p><aside>編輯觀察：這次交接發生在Flipkart持續拓展即時配送與餐飲外送之際。暫代主管已確定，但正式接班人與後續經營方向仍有待公司公布，不能將人事異動直接解讀為上市時程改變。</aside><p><a href="https://techcrunch.com/2026/11/25/flipkart-ceo-kalyan-krishnamurthy-to-step-down-next-week-amid-ipo-uncertainty/">TechCrunch</a></p><ul></ul></article><article><h2>中國AI業者據報受晶片存取與反蒸餾措施影響，多項專案延誤</h2><p>中國AI業者據報正受到境外先進晶片存取限制，以及OpenAI、Anthropic反蒸餾措施的雙重影響。The Decoder報導指出，Deepseek、Moonshot AI與Alibaba等業者自9月以來面臨壓力，多項進行中的專案出現延誤。

限制涉及中國企業遠端使用海外資料中心內的先進Nvidia晶片。報導稱，Moonshot AI已取消一筆涉及印尼Nvidia Blackwell晶片、價值1.5億美元的交易。另據報導，Deepseek研究人員10月曾在內部估計，若完全無法再進行蒸餾，其模型與美國頂尖模型的差距可能由三至六個月擴大至九個月；這是附帶條件的內部估計，不是已發生的結果。

報導也指出，部分中國企業正嘗試透過非中國第三方租用算力，MiniMax、Mihoyo與Alibaba等公司則提高對中國國產晶片的依賴，並增加對自身強化學習訓練資料的投入。這些替代做法是否足以彌補限制帶來的影響，現有資料尚無法判定。</p><aside>編輯觀察：這起事件呈現算力取得與模型訓練方式同時受限的壓力，但個別公司的條件式估計，不能當成整體中國AI產業已落後多少的衡量。</aside><p><a href="https://the-decoder.com/us-chip-access-curbs-and-anti-distillation-measures-are-reportedly-already-slowing-chinese-ai-labs/">The Decoder</a></p><ul></ul></article><article><h2>Anthropic執行長反對交由AI治理社會：任務自動化不等於政治授權</h2><p>Anthropic執行長Dario Amodei公開否認支持人類向AI交出自由意志，並主張政治決策應留在人類手中。他在X發文表示，AI必須接受具有正當性的民主程序治理，不能為了效率或安全犧牲自主決定權；將社會治理交給AI，是他明確反對的方向。

這場爭議涉及Axios的一項報導，指部分Anthropic員工相信，人類可以安全地將權力交給超級智慧系統，而且往往應該如此。這是對部分員工觀點的報導，不能直接視為公司的正式立場。Amodei則稱，把他描述成支持人類放棄自由意志，是荒謬的說法。

Amodei將政治授權與具體任務的自動化區分開來。他以駕車、開發癌症藥物及撰寫完整軟體為例，認為AI承擔這些工作可能有益，但不代表人類應放棄政治上的自主權。他也承認，端到端自動化可能衝擊就業，某些領域的風險未必值得承擔；即使AI表現更好，人們仍可能希望親自參與重視的活動。

另一條界線是AI在沒有人類協助下持續改進自身的能力。Amodei表示，這類過程可能需要限制，並稱在缺乏有意義的人類監督或理解下，不能預期讓Claude完全自主開發後續前沿模型是安全的。他同時批評競爭對手高喊人類控制權，卻仍持續推出自動化能力更強的產品；這是他的批評，並非已獲證實的產業共識。</p><aside>編輯觀察：爭議的核心不只是AI能完成多少工作，而是哪些決定可以委託、哪些權力必須由人類保留。執行長的公開立場，也需要與公司實際採用的監督及自動化方式分開檢視。</aside><p><a href="https://techcrunch.com/2026/11/25/anthropics-dario-amodei-calls-accusations-of-surrendering-human-control-to-ai-absurd/">TechCrunch AI</a></p><ul><li><a href="https://the-decoder.com/anthropic-ceo-dario-amodei-says-letting-ai-govern-society-would-be-a-bad-idea/">The Decoder</a></li></ul></article><article><h2>Anthropic企業研究：AI導入成效受人工審查與組織瓶頸牽制</h2><p>Anthropic一項企業訪談研究指出，AI導入工作的難關不只在工具能力，也在人工審查、員工阻力與既有流程。受訪者表示，研究涵蓋的部署案例中，55%提高了產出或品質，但19%仍未帶來商業價值，原因包括內部瓶頸、審查耗盡省下的時間，以及效果不明。

這項質性研究對58家美國公司進行66次面對面訪談，涵蓋近300項AI部署，產業包括法律、營建、金融、醫療與製造。所有參與企業都是Anthropic客戶，研究作者明言樣本不具代表性，因此不能把結果解讀成整體企業的AI採用率或普遍成效。

研究中，AI產出仍需人工檢查的負擔被提及49次，員工阻力與專家審查、測試需求也頻繁出現。部分案例顯示，單一環節加速不代表整體流程改善：一家工業設備商雖能用AI將產品介面翻成10種語言，卻因員工無法處理相應語言的客服需求，最後關閉該功能。

就業疑慮也影響配合意願。受訪企業中，約三分之二表示因AI而減少招募；研究並描述，專業員工被要求協助建立及審查可能取代自身工作的系統，因而產生公開或消極抵抗。這些是研究樣本中的經驗，不足以推估整體勞動市場的變化。

Anthropic研究指出，較大的組織調整與受訪者自述的較高AI價值有所關聯，例如讓小團隊負責完整流程、把人力轉向品質審查與客戶關係，以及建立共用且安全的資料基礎設施。不過，這種關聯不等於已證明因果，研究也承認，調整組織並不能保證避免職位流失。</p><aside>編輯觀察：評估AI投資時，不能只計算生成內容或完成單一步驟的速度，也要納入審查、維護及跨部門承接成本。這份研究提供的是企業客戶的具體經驗，而不是AI必然提升或降低生產力的普遍結論。</aside><p><a href="https://the-decoder.com/anthropic-study-shows-the-hardest-part-of-adopting-ai-at-work-has-little-to-do-with-learning-the-tools/">The Decoder</a></p><ul></ul></article><article><h2>Amazon與Meta據報協商開放Muse購物代理，廣告與搜尋呈現仍待談</h2><p>Amazon與Meta據報已進行多輪協商，討論讓Meta的AI購物代理Muse直接連接Amazon商店。雙方仍未敲定協議，搜尋結果如何呈現、廣告如何處理，是尚待解決的主要議題；任何協議還需要兩家公司執行長批准。

Amazon在9月封鎖Muse存取後，使用者曾遇到無法購買商品、結帳時出現錯誤訊息的情況。Fortune援引知情人士的報導指出，Amazon擔心第三方購物代理削弱平台與消費者的直接關係，並讓購物流程繞過廣告。談判因此不只是技術串接，也涉及商品搜尋入口與廣告利益的安排。

Amazon執行長Andy Jassy先前表示，透過第三方代理購物，尚未比直接向零售商購買更方便或更好，但並未排除開放存取。這項立場與正在進行的協商，仍不等於封鎖已解除。TechCrunch刊出報導時，Amazon與Meta尚未回覆其置評請求。</p><aside>編輯觀察：購物代理能否進入電商平台，牽涉的不只是替消費者完成訂單，也包括由誰呈現商品、安排廣告及維繫客戶關係。尚未敲定的條件，比單純宣布技術可以串接更具商業意義。</aside><p><a href="https://techcrunch.com/2026/11/25/amazon-and-meta-reportedly-in-talks-to-lift-blockade-on-ai-agent-muse/">TechCrunch AI</a></p><ul><li><a href="https://the-decoder.com/amazon-and-meta-are-in-talks-to-end-the-block-on-metas-ai-shopping-agent-muse-in-amazons-online-store/">The Decoder</a></li></ul></article><article><h2>中古電動車成交較快　Cybertruck在研究卡車類周轉居首</h2><p>中古電動車在2026年10月的美國市場呈現較快成交速度。汽車搜尋與研究平台iSeeCars分析逾110萬筆車齡一至五年的中古車交易，發現Tesla Cybertruck平均上架39.1天便售出，在研究涵蓋的中古卡車中最快，低於卡車整體平均的65.5天；第二、三名分別為Ford Maverick Hybrid與Rivian R1T。

這項研究依動力類型、車種及個別車型比較平均上架天數。純電動車平均為45.6天，比油電混合車的54.5天及汽油車的61天更短；成交速度最快的25款中古車中，有16款是純電動車，顯示較快的周轉並非只出現在Cybertruck。

不過，電動車之間的表現仍有明顯落差。Cadillac Escalade IQ平均上架134.3天，是研究中成交最慢的車款，上架時間超過整體汽車業平均的兩倍。因此，純電動車整體成交較快，不能直接套用到每一款車。

iSeeCars分析師Karl Brauer向TechCrunch表示，高油價改變了消費者購車選擇，促使更多人考慮電動車或油電混合車；他也將Cybertruck的需求歸因於中古市場供給相對稀少，以及二手價格低於原廠建議售價。這些是分析師提出的解釋。研究涵蓋的10月交易，早於馬斯克11月宣布Tesla將在2027年停止生產Cybertruck，不能將該月成交速度解讀為停產消息帶動的結果。</p><aside>編輯觀察：平均上架天數反映成交速度，不等於銷售總量、保值程度或獲利。這份單月研究可用來觀察中古車周轉差異，但不足以判定個別品牌的整體經營表現。</aside><p><a href="https://techcrunch.com/2026/11/25/the-canceled-tesla-cybertruck-is-the-fastest-selling-used-truck-in-america/">TechCrunch</a></p><ul></ul></article></main></noscript>
