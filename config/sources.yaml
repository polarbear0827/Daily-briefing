# =============================================================================
# DEDUPLICATION & RANKING
# =============================================================================

dedup_window_days: 3

credibility_weights:
  primary: 1.5
  secondary: 1.0
  tertiary: 0.5

# Per-category soft caps (raised to support 30+ article output)
soft_caps:
  ai-ml: 12
  ai-tools: 3
  research-papers: 4
  tech-product: 8
  dev: 4
  security: 3
  vc-business: 4
  science: 3
  world: 3
  taiwan: 4
