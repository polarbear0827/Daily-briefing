# Daily Briefing · News sources configuration
#
# Verified RSS feeds (all return entries successfully as of 2026-04-28).
# Excludes media from China / Russia / North Korea per user preference.
#
# Tier convention:
#   primary   = official source / authoritative publication
#   secondary = established media with editorial process
#   tertiary  = aggregator / community curation / individual blog

