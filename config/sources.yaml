# Daily Briefing · News sources configuration (MVP — verified feeds only)
#
# This file contains ~40 RSS feeds, all verified to successfully return entries
# in recent test runs. Feeds that had XML parse errors, 404s, or other
# persistent failures have been removed.
#
# Maintenance notes:
#   * Notable omissions (all lacked working RSS at last check):
#     - Anthropic News/Research — company has no official RSS
#     - Meta AI Blog — malformed feed
#     - The Batch (DeepLearning.AI) — malformed feed
#     - Reuters Business/World — feed format errors
#     - AP Top News, Bloomberg — feed format errors
#     - 中央社, INSIDE, 數位時代, 關鍵評論網 — malformed or blocked
#   * If you want to re-add these later, consider:
#     - Third-party aggregators (Olshansk/rss-feeds on GitHub) for Anthropic
#     - Using web search / Firecrawl as a fallback discovery mechanism
#
# Tier convention:
#   primary   = official/original source
#   secondary = established publication with editorial process
#   tertiary  = aggregator / community curation

rss_feeds:

  # ===========================================================================
  # AI / MACHINE LEARNING
  # 10 feeds (was 17 — removed Anthropic×2, Meta, The Batch)
  # ===========================================================================
  ai-ml:
    # --- Frontier lab blogs ---
    - name: OpenAI Blog
      url: https://openai.com/blog/rss.xml
      tier: primary
    - name: Google DeepMind Blog
      url: https://deepmind.google/blog/rss.xml
      tier: primary
    - name: Google Research Blog
      url: https://research.google/blog/rss/
      tier: primary
    - name: Microsoft Research Blog
      url: https://www.microsoft.com/en-us/research/feed/
      tier: primary
    - name: NVIDIA Developer Blog
      url: https://developer.nvidia.com/blog/feed/
      tier: primary
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
      tier: primary

    # --- AI Engineer / practitioner newsletters ---
    - name: Import AI (Jack Clark)
      url: https://jack-clark.net/feed/
      tier: secondary
      note: Weekly, research-heavy, by Anthropic co-founder
    - name: Latent Space (swyx & Alessio)
      url: https://www.latent.space/feed
      tier: secondary
      note: AI Engineer-focused, technical interviews
    - name: Simon Willison's Weblog
      url: https://simonwillison.net/atom/everything/
      tier: secondary
      note: Daily, hands-on LLM experimentation
    - name: Interconnects (Nathan Lambert)
      url: https://www.interconnects.ai/feed
      tier: secondary
      note: Post-training, RLHF, open models
    - name: Lilian Weng's Lil'Log
      url: https://lilianweng.github.io/index.xml
      tier: secondary
      note: Deep technical essays, infrequent but gold
    - name: Chip Huyen Blog
      url: https://huyenchip.com/feed.xml
      tier: secondary
      note: ML systems, MLOps

    # --- AI policy / analysis ---
    - name: AI Snake Oil (Arvind Narayanan)
      url: https://www.aisnakeoil.com/feed
      tier: secondary
      note: Princeton researchers, evidence-based AI critique
    - name: Marginal Revolution (AI-related)
      url: https://marginalrevolution.com/feed
      tier: tertiary
      note: Economist Tyler Cowen, selective AI commentary

  # ===========================================================================
  # TECH / PRODUCT
  # 6 feeds (was 7 — removed Hacker News hnrss.org)
  # ===========================================================================
  tech-product:
    - name: The Verge
      url: https://www.theverge.com/rss/index.xml
      tier: secondary
    - name: Ars Technica
      url: https://feeds.arstechnica.com/arstechnica/index
      tier: secondary
    - name: TechCrunch
      url: https://techcrunch.com/feed/
      tier: secondary
    - name: MIT Technology Review
      url: https://www.technologyreview.com/feed/
      tier: secondary
    - name: Wired
      url: https://www.wired.com/feed/rss
      tier: secondary
    - name: IEEE Spectrum
      url: https://spectrum.ieee.org/feeds/feed.rss
      tier: primary
      note: Engineering-focused, peer-adjacent

  # ===========================================================================
  # PROGRAM DEVELOPMENT
  # 7 feeds (unchanged)
  # ===========================================================================
  dev:
    - name: GitHub Blog
      url: https://github.blog/feed/
      tier: primary
    - name: Stack Overflow Blog
      url: https://stackoverflow.blog/feed/
      tier: secondary
    - name: Lobsters
      url: https://lobste.rs/rss
      tier: tertiary
      note: High signal community curation
    - name: Martin Fowler
      url: https://martinfowler.com/feed.atom
      tier: primary
    - name: Julia Evans
      url: https://jvns.ca/atom.xml
      tier: secondary
      note: Practical deep dives on systems/debugging
    - name: Dan Luu
      url: https://danluu.com/atom.xml
      tier: secondary
      note: Infrequent but exceptional systems essays
    - name: Increment (Stripe)
      url: https://increment.com/feed.xml
      tier: secondary

  # ===========================================================================
  # VC / BUSINESS
  # 3 feeds (was 5 — removed Reuters Business, Bloomberg)
  # ===========================================================================
  vc-business:
    - name: Crunchbase News
      url: https://news.crunchbase.com/feed/
      tier: secondary
    - name: Financial Times Technology
      url: https://www.ft.com/technology?format=rss
      tier: primary
      note: Paywall, but RSS gives headlines and teasers
    - name: SemiAnalysis
      url: https://www.semianalysis.com/feed
      tier: secondary
      note: Deep semiconductor/AI infra analysis

  # ===========================================================================
  # SCIENCE RESEARCH
  # 5 feeds (unchanged)
  # ===========================================================================
  science:
    - name: Nature News
      url: https://www.nature.com/nature.rss
      tier: primary
    - name: Science Magazine News
      url: https://www.science.org/rss/news_current.xml
      tier: primary
    - name: Quanta Magazine
      url: https://www.quantamagazine.org/feed/
      tier: primary
      note: Long-form, accessible, excellent math/physics coverage
    - name: Ars Technica Science
      url: https://feeds.arstechnica.com/arstechnica/science
      tier: secondary
    - name: New Scientist
      url: https://www.newscientist.com/feed/home/
      tier: secondary

  # ===========================================================================
  # WORLD NEWS
  # 3 feeds (was 5 — removed Reuters World, AP Top News)
  # ===========================================================================
  world:
    - name: BBC World
      url: http://feeds.bbci.co.uk/news/world/rss.xml
      tier: primary
    - name: The Guardian World
      url: https://www.theguardian.com/world/rss
      tier: secondary
    - name: Nikkei Asia
      url: https://asia.nikkei.com/rss/feed/nar
      tier: primary
      note: Strong Asia-Pacific coverage, relevant for Taiwan context

  # ===========================================================================
  # TAIWAN LOCAL
  # 2 feeds (was 6 — removed 中央社, INSIDE, 數位時代, 關鍵評論網)
  # WARNING: This category is now heavily under-sourced. Consider adding
  # alternative Taiwan sources as you find working ones.
  # ===========================================================================
  taiwan:
    - name: iThome
      url: https://www.ithome.com.tw/rss/news
      tier: secondary
    - name: 科技新報 TechNews
      url: https://technews.tw/feed/
      tier: secondary


# =============================================================================
# DEDUPLICATION & RANKING
# =============================================================================

# How many days back to check for duplicate URLs
dedup_window_days: 3

# Credibility scoring weights (applied during ranking in task prompt)
credibility_weights:
  primary: 1.5
  secondary: 1.0
  tertiary: 0.5

# Per-category soft caps
soft_caps:
  ai-ml: 8
  tech-product: 5
  dev: 4
  vc-business: 4
  science: 4
  world: 4
  taiwan: 5