# Daily Briefing · News sources configuration (AI Engineer deep edition)
#
# Total: ~45 RSS feeds + Firecrawl queries
#
# Tier convention:
#   primary   = official/original source, no intermediary
#   secondary = established publication with editorial process
#   tertiary  = aggregator / community curation (use sparingly)
#
# Validation notes:
#   * All URLs follow the standard RSS conventions for each platform
#     (Substack: /feed, WordPress: /feed, Medium: /feed, GitHub orgs: various)
#   * If any feed 404s on first run, delete that entry and move on
#   * Substack/Medium feeds are very stable; blog feeds depend on author
#     maintaining the site

rss_feeds:

  # ===========================================================================
  # AI / MACHINE LEARNING
  # Focus: frontier labs, research blogs, AI-engineering newsletters
  # ===========================================================================
  ai-ml:
    # --- Frontier lab blogs (primary sources) ---
    - name: Anthropic News
      url: https://www.anthropic.com/news/rss.xml
      tier: primary
    - name: Anthropic Research
      url: https://www.anthropic.com/research/rss.xml
      tier: primary
    - name: OpenAI Blog
      url: https://openai.com/blog/rss.xml
      tier: primary
    - name: Google DeepMind Blog
      url: https://deepmind.google/blog/rss.xml
      tier: primary
    - name: Google Research Blog
      url: https://research.google/blog/rss/
      tier: primary
    - name: Meta AI Blog
      url: https://ai.meta.com/blog/rss/
      tier: primary
    - name: Microsoft Research Blog
      url: https://www.microsoft.com/en-us/research/feed/
      tier: primary
    - name: NVIDIA Developer Blog
      url: https://developer.nvidia.com/blog/feed/
      tier: primary
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
      tier: primary

    # --- AI Engineer / practitioner newsletters ---
    - name: Import AI (Jack Clark)
      url: https://jack-clark.net/feed/
      tier: secondary
      note: Weekly, research-heavy, by Anthropic co-founder
    - name: The Batch (Andrew Ng / DeepLearning.AI)
      url: https://www.deeplearning.ai/the-batch/feed/
      tier: secondary
    - name: Latent Space (swyx & Alessio)
      url: https://www.latent.space/feed
      tier: secondary
      note: AI Engineer-focused, technical interviews
    - name: Simon Willison's Weblog
      url: https://simonwillison.net/atom/everything/
      tier: secondary
      note: Daily, hands-on LLM experimentation
    - name: Interconnects (Nathan Lambert)
      url: https://www.interconnects.ai/feed
      tier: secondary
      note: Post-training, RLHF, open models
    - name: Lilian Weng's Lil'Log
      url: https://lilianweng.github.io/index.xml
      tier: secondary
      note: Deep technical essays, infrequent but gold
    - name: Chip Huyen Blog
      url: https://huyenchip.com/feed.xml
      tier: secondary
      note: ML systems, MLOps

    # --- AI policy / analysis ---
    - name: AI Snake Oil (Arvind Narayanan)
      url: https://www.aisnakeoil.com/feed
      tier: secondary
      note: Princeton researchers, evidence-based AI critique
    - name: Marginal Revolution (AI-related)
      url: https://marginalrevolution.com/feed
      tier: tertiary
      note: Economist Tyler Cowen, selective AI commentary

  # ===========================================================================
  # TECH / PRODUCT
  # ===========================================================================
  tech-product:
    - name: The Verge
      url: https://www.theverge.com/rss/index.xml
      tier: secondary
    - name: Ars Technica
      url: https://feeds.arstechnica.com/arstechnica/index
      tier: secondary
    - name: TechCrunch
      url: https://techcrunch.com/feed/
      tier: secondary
    - name: Hacker News Top (200+ points)
      url: https://hnrss.org/frontpage?points=200
      tier: tertiary
    - name: MIT Technology Review
      url: https://www.technologyreview.com/feed/
      tier: secondary
    - name: Wired
      url: https://www.wired.com/feed/rss
      tier: secondary
    - name: IEEE Spectrum
      url: https://spectrum.ieee.org/feeds/feed.rss
      tier: primary
      note: Engineering-focused, peer-adjacent

  # ===========================================================================
  # PROGRAM DEVELOPMENT
  # ===========================================================================
  dev:
    - name: GitHub Blog
      url: https://github.blog/feed/
      tier: primary
    - name: Stack Overflow Blog
      url: https://stackoverflow.blog/feed/
      tier: secondary
    - name: Lobsters
      url: https://lobste.rs/rss
      tier: tertiary
      note: High signal community curation
    - name: Martin Fowler
      url: https://martinfowler.com/feed.atom
      tier: primary
    - name: Julia Evans
      url: https://jvns.ca/atom.xml
      tier: secondary
      note: Practical deep dives on systems/debugging
    - name: Dan Luu
      url: https://danluu.com/atom.xml
      tier: secondary
      note: Infrequent but exceptional systems essays
    - name: Increment (Stripe)
      url: https://increment.com/feed.xml
      tier: secondary

  # ===========================================================================
  # VC / BUSINESS
  # ===========================================================================
  vc-business:
    - name: Crunchbase News
      url: https://news.crunchbase.com/feed/
      tier: secondary
    - name: Reuters Business
      url: https://www.reutersagency.com/feed/?best-sectors=business-finance
      tier: primary
    - name: Financial Times Technology
      url: https://www.ft.com/technology?format=rss
      tier: primary
      note: Paywall, but RSS gives headlines and teasers
    - name: Bloomberg Technology
      url: https://www.bloomberg.com/feeds/podcasts/etf-report.xml
      tier: primary
      note: May require verification; Bloomberg RSS is often region-gated
    - name: SemiAnalysis
      url: https://www.semianalysis.com/feed
      tier: secondary
      note: Deep semiconductor/AI infra analysis

  # ===========================================================================
  # SCIENCE RESEARCH
  # ===========================================================================
  science:
    - name: Nature News
      url: https://www.nature.com/nature.rss
      tier: primary
    - name: Science Magazine News
      url: https://www.science.org/rss/news_current.xml
      tier: primary
    - name: Quanta Magazine
      url: https://www.quantamagazine.org/feed/
      tier: primary
      note: Long-form, accessible, excellent math/physics coverage
    - name: Ars Technica Science
      url: https://feeds.arstechnica.com/arstechnica/science
      tier: secondary
    - name: New Scientist
      url: https://www.newscientist.com/feed/home/
      tier: secondary

  # ===========================================================================
  # WORLD NEWS
  # ===========================================================================
  world:
    - name: Reuters World
      url: https://www.reutersagency.com/feed/?best-regions=world
      tier: primary
    - name: AP Top News
      url: https://apnews.com/index.rss
      tier: primary
    - name: BBC World
      url: http://feeds.bbci.co.uk/news/world/rss.xml
      tier: primary
    - name: The Guardian World
      url: https://www.theguardian.com/world/rss
      tier: secondary
    - name: Nikkei Asia
      url: https://asia.nikkei.com/rss/feed/nar
      tier: primary
      note: Strong Asia-Pacific coverage, relevant for Taiwan context

  # ===========================================================================
  # TAIWAN LOCAL
  # ===========================================================================
  taiwan:
    - name: 中央社即時新聞
      url: https://www.cna.com.tw/list/aall.aspx?rss=1
      tier: primary
    - name: iThome
      url: https://www.ithome.com.tw/rss/news
      tier: secondary
    - name: 科技新報 TechNews
      url: https://technews.tw/feed/
      tier: secondary
    - name: INSIDE 硬塞的網路趨勢觀察
      url: https://www.inside.com.tw/feed
      tier: secondary
    - name: 數位時代
      url: https://www.bnext.com.tw/rss
      tier: secondary
    - name: 關鍵評論網 科技
      url: https://www.thenewslens.com/rss/category/tech
      tier: tertiary


# =============================================================================
# FIRECRAWL SUPPLEMENTARY SEARCHES
# Used to discover stories from paywall sites or niches without good RSS
# =============================================================================
firecrawl_searches:

  ai-ml:
    - query: "arXiv cs.LG trending this week"
      time_filter: 24h
    - query: "LLM benchmark new release"
      time_filter: 24h
    - query: "AI safety alignment research paper"
      time_filter: 7d
      note: Use 7d because alignment work is slower-moving

  dev:
    - query: "open source developer tool release"
      time_filter: 24h
    - query: "programming language version release"
      time_filter: 24h

  vc-business:
    - query: "AI startup funding round Series"
      time_filter: 24h
    - query: "semiconductor industry earnings"
      time_filter: 24h

  taiwan:
    - query: "台灣 AI 產業 新聞"
      time_filter: 24h
      location: tw
    - query: "台積電 TSMC 最新"
      time_filter: 24h
      location: tw
    - query: "台灣 新創 募資"
      time_filter: 24h
      location: tw


# =============================================================================
# DEDUPLICATION & RANKING
# =============================================================================

# How many days back to check for duplicate URLs
dedup_window_days: 3

# Credibility scoring weights (applied during Step 4 ranking in task prompt)
credibility_weights:
  primary: 1.5
  secondary: 1.0
  tertiary: 0.5

# Per-category soft caps to prevent any single category from dominating
# (the task prompt can override these based on the day's news density)
soft_caps:
  ai-ml: 8
  tech-product: 5
  dev: 4
  vc-business: 4
  science: 4
  world: 4
  taiwan: 5