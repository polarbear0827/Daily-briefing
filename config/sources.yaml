  world: []

web_pages:
  ai-ml:
  - name: Anthropic News
    url: https://www.anthropic.com/news
    tier: primary
    limit: 8
    allow_path_regex: ^/(news|research|policy)
    require_text_regex: (Claude|Anthropic|AI|model|agent|safety|policy|research|Opus|Sonnet|Haiku)
  - name: Mistral News
    url: https://mistral.ai/news
    tier: primary
    limit: 8
    allow_path_regex: ^/news/
    require_text_regex: (Mistral|model|agent|Vibe|Voxtral|Codestral|Devstral|Magistral|OCR|AI|research)
  - name: Meta AI Blog
    url: https://ai.meta.com/blog/
    tier: primary
    limit: 6
    allow_path_regex: ^/blog/
    require_text_regex: (Meta|Llama|SAM|model|AI|research|superintelligence|MTIA)
  - name: xAI News
    url: https://x.ai/news
    tier: primary
    limit: 8
    allow_path_regex: ^/news/
    require_text_regex: (Grok|xAI|model|API|agent|voice|reasoning|AI)

dedup_window_days: 7
credibility_weights:
  primary: 2.0
  secondary: 1.1
  tertiary: 0.3
soft_caps:
  ai-ml: 22
  ai-tools: 4
  research-papers: 12
  tech-product: 18
  dev: 12
  security: 12
  vc-business: 12
  science: 4
  taiwan: 12
  enterprise-cases: 8
  world: 0
