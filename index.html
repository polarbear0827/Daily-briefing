  <noscript><main><h1>人工智慧商業布局、平台功能與雲端資安動態</h1><p>2026-11-28 科技早報</p><article><h2>上海資料中心出現Blackwell設備，出口許可與運送途徑仍待釐清</h2><p>上海一處資料中心被報導裝有Nvidia Blackwell設備，相關線索來自企業提交給中國監管機關的文件。這類系統輸往中國須取得美國出口許可，但目前仍無法確認設備如何運抵當地，以及是否取得所需許可。

報導披露的文件顯示，Shanghai Shuoyao以一座GB300 NVL72機櫃作為擔保，向Shanghai Innovation Bank取得人民幣9600萬元、約1400萬美元貸款；另一家公司Shanghai Kezhan的貸款文件，則列出位於同一地點的GB200伺服器。兩種設備均涉及受出口許可規範約束的Blackwell系統。

單座GB300 NVL72搭載72顆Blackwell Ultra GPU與36顆Nvidia Grace處理器。Bloomberg透過機櫃序號查詢公開保固資料庫，將其中一座GB300設備追溯至台灣製造商Gigabyte。不過，這項追查尚未交代設備後續的完整交易與運送路徑。

Gigabyte未透露最初購買該機櫃的公司或對象，並表示所有業務均遵循適用法規，交易也須符合內部合規要求及交易當時有效的相關規定。現有資訊仍不足以判定設備進入上海的完整過程，也不能據此認定Gigabyte或其他相關業者違反出口規範。</p><aside>編輯觀察：設備序號可以提供製造來源線索，但不足以單獨證明後續買家、轉運路徑與出口許可狀態。判斷合規責任，仍須補足這些交易環節的證據。</aside><p><a href="https://www.engadget.com/2329748/restricted-nvidia-chips-were-installed-at-a-chinese-data-center-linked-to-alice-huang/">Engadget</a></p><ul><li><a href="https://the-decoder.com/banned-nvidia-blackwell-chips-turn-up-in-a-shanghai-data-center-linked-to-alice-huang-bloomberg-reports/">The Decoder</a></li></ul></article><article><h2>美國空軍Cloud One傳遭入侵，應用遷移與更新受限</h2><p>美國空軍雲端平台Cloud One據報遭駭客入侵，事件在過去約一個月的系統升級期間被發現，並導致平台服務中斷。消息人士表示，部分應用程式遷移計畫已暫停，一些使用者的管理員權限也遭撤銷；攻擊者身分、完整受影響範圍及是否有資料遭竊，目前仍不明。

一名知情人士指出，攻擊者利用軟體漏洞進入平台的控制平面。該人士形容，這類存取權限可能讓人查看軍機運作狀態或備用零件流向，但尚不清楚攻擊者是否實際進行這些操作，不能將潛在可存取的資訊視為已遭讀取或外洩。

事件也影響平台維護。除了暫停將更多任務應用程式移入Cloud One，既有應用程式的更新亦被禁止，使工作人員無法套用部分修正。這些限制顯示，影響不只涉及資料保護，也已延伸至雲端應用的部署與維運。

Cloud One於2017年啟動，整合微軟、亞馬遜、甲骨文與Alphabet的雲端資源，支援人事、薪資、後勤及維修等應用，也承載防空雷達資料彙整與彈藥管理系統。不過，平台承載哪些系統，並不等於這些系統均已遭入侵。

美國空軍回應表示，不評論特定網路與系統的安全態勢、漏洞或運作狀態，並稱會持續採取措施保護資訊、系統及任務能力。消息人士另稱，調查人員已請網戰司令部評估損害；網戰司令部未回應置評請求。</p><aside>編輯觀察：此案的技術焦點是控制平面的存取風險，以及事件處置對應用更新、權限管理與遷移作業的連帶影響；實際資料損失仍須等待調查釐清。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270266.aspx">中央社國際</a></p><ul><li><a href="https://www.engadget.com/2329586/hackers-reportedly-infiltrated-the-air-force-cloud-systems/">Engadget</a></li><li><a href="https://the-decoder.com/hackers-breached-the-us-air-forces-flagship-cloud-one-platform-report-says/">The Decoder</a></li></ul></article><article><h2>芬蘭研究建議調整著作權保護，因應AI冒用聲音與影像</h2><p>芬蘭教育文化部公布深偽因應研究報告，建議調整既有著作權法的保護範圍，處理人工智慧冒用個人聲音與影像的問題。這是研究提出的修法方向，並非已生效的新規範；研究作者指出，現行著作權保障的是創作成果，個人的聲音與相貌並不在涵蓋範圍內。

冒用問題已涉及音樂與新聞內容。芬蘭國家廣播公司（Yle）揭露，TikTok出現以AI讓歌手演唱其他曲目或未發表歌曲的帳號，Spotify也有冒名發布的AI樂曲。Yle負責推動AI應用的主管米拉里表示，社群平台屢見冒充Yle記者的偽造影片，有些在媒體反應前便已擴散甚至消失，侵蝕新聞品牌累積的信任。她主張，使用他人聲音或影像應取得自願同意、限定使用範圍，並給予相稱酬勞。

報告建議，將著作權法的「名稱保護」條款擴及作者影像與聲音，避免AI複製品與本人混淆；另修改「經典保護」條款，禁止侵害文化利益的偽造內容，防止已故演員被AI安排新角色。不過，報告也認為，若賦予全民「外貌與聲音著作權」，將面臨表演者身分界定困難，以及電玩等創作無意間侵權的風險。

授權與執法仍有缺口。芬蘭演員工會主張，授權契約應有明確期限，並指出合約無法約束未經授權使用的第三方。芬蘭交通與通訊署代表則提醒，即使歐盟人工智慧法已要求揭露深偽內容，標示本身仍未判定內容真偽；平台與業者多在海外運作，也增加主管機關執法的難度。</p><aside>編輯觀察：這項研究凸顯，深偽治理不只是辨識內容真偽，也涉及個人授權、創作者收入與跨境執法；新增標示義務未必能同時解決這些問題。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611270286.aspx">中央社國際</a></p><ul></ul></article><article><h2>SAP傳規劃裁減至少一萬職位，配合人工智慧業務重整</h2><p>SAP傳出正準備配合人工智慧重整，裁減至少一萬個職位，約占全球逾11萬名員工的至少9%。The Decoder報導，這項規劃的人數尚未定案，仍可能在與員工代表協商後調整，不能視為已完成的裁員結果。

報導指出，各部門都被要求找出節省成本的空間，其中產品開發、工程與銷售受到的影響最大。德國約占SAP員工總數四分之一，當地就業保障則持續至2028年。這些條件意味著，裁員規劃仍須面對各地既有安排與協商程序，實際執行範圍尚待確認。

這波調整與SAP的產品方向相連：執行長Christian Klein希望將AI工具導入整體產品線，公司近期也宣布與Mistral AI合作，並收購數家新創。SAP在2024年已裁減約一萬個職位；對於這次可能的裁員，公司拒絕評論，僅表示會持續檢視組織架構。目前資訊支持的是重整與人力縮減規劃，並未證明同等數量的工作已由AI取代。</p><aside>編輯觀察：觀察這波重整，應區分企業投入AI、組織節省成本與職務實際被自動化三件事；目前披露的裁員規劃，還不足以建立三者之間的直接因果。</aside><p><a href="https://the-decoder.com/sap-plans-to-cut-at-least-10000-jobs-as-it-pivots-to-ai/">The Decoder</a></p><ul></ul></article><article><h2>OpenAI傳開發Athena資料平台，為企業AI代理統一指標與規則</h2><p>OpenAI據報正在開發代號「Athena」的資料管理平台，希望讓AI代理處理企業資料時更準確。平台方向近似「語意層」，為營收、客戶數等商業指標提供一致定義，讓代理取得必要脈絡，減少自行猜測。這仍是早期開發計畫，OpenAI尚未公布時程或價格。

The Decoder報導，至少一名客戶曾認為ChatGPT Work的資料分析代理不夠準確。Athena的構想是讓代理蒐集、記錄並更新商業規則，供其他代理使用，避免每次執行工作都從頭建立脈絡。提高準確度與減少猜測是這項計畫的目標，並非已獲驗證的產品成效。

企業資料的語意層並非全新方向，Snowflake與Databricks已提供各自的方案。報導分析，更換語意層供應商比更換AI模型困難，Athena可能因此成為OpenAI建立競爭優勢的一環。不過，目前尚無已公布的推出時間與定價，仍不能將這項開發計畫視為已上市、可供企業採用的工具。</p><aside>編輯觀察：這項計畫的重點不在推出另一個模型，而在讓不同代理沿用一致的企業資料定義與規則；能否改善分析品質，仍須等待實際產品與可驗證結果。</aside><p><a href="https://the-decoder.com/openai-is-building-athena-data-platform-to-cut-down-on-ai-agent-guesswork/">The Decoder</a></p><ul></ul></article><article><h2>洛杉磯聯合學區暫停校方裝置的 Google AI Overviews</h2><p>洛杉磯聯合學區已在校方配發的裝置上停用 Google AI Overviews，搜尋結果不再顯示這項人工智慧摘要。這個約有50萬名學生的學區表示，措施屬於暫時性調整，目的是維持適齡且安全的學生使用體驗。

學區並未正式發布公告，而是家長與學生先注意到搜尋摘要消失。地方倡議團體 Schools Beyond Screens LA 隨後向家長徵集影片佐證，並取得學區確認。變動發生在11月13日的學區人工智慧委員會會議之後，當天有多名該團體成員發言；數日後，校方裝置上的摘要便已不再出現。

這項調整也凸顯搜尋與人工智慧整合後的校園管理問題。Google 本月稍早已撤回對許多中小學生預設開啟 Gemini 聊天機器人的政策，改採選擇加入；但對搜尋服務，Google 教育主管 Chris Phillips 仍主張搜尋與人工智慧深度整合，並稱學區若封鎖人工智慧，學生也將無法使用搜尋。</p><aside>編輯觀察：學校需要管理的不只是能否使用人工智慧，也包括能否在保留搜尋功能的同時，分別控制生成式摘要。這次停用措施呈現了學區管理需求與平台整合政策之間的落差。</aside><p><a href="https://www.engadget.com/2329851/la-school-district-blocks-google-ai-search-features/">Engadget</a></p><ul></ul></article><article><h2>One UI 測試版浮現 Vision 模式線索，Samsung 相機可能整合 AI 提問</h2><p>One UI 9.5 Beta 1 的程式字串出現名為 Vision 的相機模式線索，顯示 Samsung 可能把場景摘要、文字擷取與人工智慧提問入口直接放進相機應用程式。這仍是程式碼分析揭露的未公布功能，並非已確認推出的產品規格。

分析所描述的操作，是將相機對準物體或場景後，由人工智慧提供畫面摘要，並顯示可點選的關鍵字、建議動作與文字擷取工具。其中，「Ask」按鈕會把場景交給 Gemini，「Translate」按鈕則連接 Samsung 的 AI Vision 應用程式。

Samsung 手機目前已能透過 Gemini Live，針對鏡頭所見內容進行即時對話。新線索的重點因此不只是辨識能力，而是可能把相關操作集中到相機模式中。不過，Samsung 尚未宣布 Vision 功能，測試版中的程式也可能不會進入正式版本；支援機型與推出時間仍未確認。</p><aside>編輯觀察：若功能正式推出，改變的將是使用入口：使用者可能不必先切換至獨立助理，就能從相機畫面進行提問或翻譯。程式碼線索尚不能用來判定實際辨識品質與操作體驗。</aside><p><a href="https://www.engadget.com/2329765/samsung-is-reportedly-giving-its-camera-app-an-ai-mode/">Engadget</a></p><ul></ul></article><article><h2>WhatsApp 將提供旅遊 eSIM 購買入口，部分國家即將推出</h2><p>WhatsApp 宣布將在應用程式內提供旅遊用 eSIM 購買服務，讓使用者直接購買旅行期間使用的行動數據連線。服務將於部分國家陸續推出，合作電信業者包括 Verizon 與 Jio。

這項 eSIM 提供的是數據服務。WhatsApp 表示，使用者不必更換原有的 WhatsApp 號碼，抵達目的地後仍可沿用同一號碼使用通訊功能；公司並將購買流程形容為如同傳送訊息般輕鬆。

這次擴張把旅遊連線方案的購買入口帶進通訊應用程式，不過服務尚未全面開放。具體適用國家、價格與收費模式仍未明，不能據此認定會採訂閱制，也無法判斷與其他旅遊連線方案相比是否更划算。</p><aside>編輯觀察：把數據方案購買入口整合進通訊工具，可能減少旅客在不同服務間切換的步驟；實際便利性與成本優勢，仍須等適用範圍、資費及使用條件明朗後才能判斷。</aside><p><a href="https://www.engadget.com/2329553/whatsapp-adds-support-for-travel-esims/">Engadget</a></p><ul></ul></article><article><h2>開發者借助AI推進《GTA 6》非官方電腦移植，尚無完整公開版本</h2><p>《GTA 6》主機版上市後，開發者與遊戲修改社群正以外流的Xbox版本為基礎，嘗試讓遊戲在Windows執行。The Decoder報導，相關專案運用逆向工程、相容層與重新編譯，並將部分移植工作交給包括Anthropic的Claude Code在內的AI程式工具，其中一組開發者還直播了過程。

一個追蹤平台在遊戲執行檔外流後不到四天，列出40個活躍專案，並稱其中近半數已能在電腦上啟動遊戲。依該平台自行訂定的評分尺度，進度最快的專案距離可遊玩的電腦版本已完成逾九成；這是平台對開發進度的判斷，不能等同完整版本已可交付。

部分專案也嘗試加入原生光線追蹤照明等功能。11月26日出現的非官方電腦多人模式影片，顯示多名玩家、車輛與語音聊天同時運作，畫面約每秒25至30格；追蹤平台營運者稱已驗證影片。官方目前推出的仍是單人遊戲，線上模式尚無發布日期。

目前仍沒有可供一般玩家使用的完整電腦版本，較穩定的版本也有內容不全、限於封閉群組流通，或需要相當技術能力等限制。Rockstar尚未公布官方電腦版日期；AI工具是否會實際改變其主機與電腦版分階段推出的策略，仍不能從這些早期專案確定。</p><aside>編輯觀察：這起事件值得觀察的是AI程式工具如何參與逆向工程與移植工作，而非把追蹤平台的完成度當成成品品質。能否啟動、能否穩定遊玩，以及能否供一般玩家使用，是不同的技術門檻。</aside><p><a href="https://the-decoder.com/rockstars-ai-dilemma-can-gta-6s-staggered-release-model-survive-coding-agents/">The Decoder</a></p><ul></ul></article><article><h2>《GTA 6》主機效能測試：解除30格限制後，平均約36格且動畫加速</h2><p>《GTA 6》在Xbox Series X上被玩家找到解除每秒30格限制的方法，但測試結果並未顯示這是可靠的效能改善途徑。Digital Foundry測試發現，解除限制後，一小時遊玩平均約每秒36格，車輛與動畫卻出現不正常加速，部分約達原本兩倍速度。

這項方法涉及切換主機的60Hz與120Hz輸出，再透過Quick Resume返回遊戲。Digital Foundry的測試中，只有駕駛飛機、畫面幾乎全是天空時達到每秒60格；車流較少的公路約40格，繁忙街道則僅略高於30格。測試團隊認為，現有硬體難以達到穩定60格，即使採用搭配可變更新率的40格模式，也未必明顯優於目前的30格上限。

不同主機的壓力測試也呈現差異。Engadget整理的結果顯示，PS5在多次爆炸的榴彈發射器測試中降至23格；PS5 Pro多數時間維持30格，大量車輛同時遭破壞時約降至24格。Series S多數時間介於25至30格，Kotaku的一段爆炸場景測試則短暫降至18或19格。

這些數據也須與個人遊玩觀察區分：Engadget作者表示，自己以原版PS5遊玩約60小時，除激烈破壞場景外，較少注意到明顯低於30格的情況。解除限制可能伴隨當機與錯誤，不能把較高的瞬間幀率視為整體體驗改善。</p><aside>編輯觀察：評估遊戲效能不能只看最高幀率；場景負載、長時間平均表現與動畫速度是否正常，都會影響結果的意義。這次測試尤其顯示，解除限制不等於取得可用的高幀率模式。</aside><p><a href="https://www.engadget.com/2329878/gta-6-performance-ways-make-sure-console-not-holding-back/">Engadget</a></p><ul></ul></article><article><h2>AI供應鏈帶動出口與投資，主計總處上修2027年成長預測至6.51%</h2><p>主計總處11月27日公布最新經濟預測，將2026年經濟成長率上修2.23個百分點至13.28%，並將2027年預測上修0.47個百分點至6.51%。主計總處指出，AI需求帶動出口與投資，是這波成長的重要動力。

在科技供應鏈方面，主計總處認為，代理式AI與推論應用持續深化，推升算力需求，全球主要雲端服務業者也積極擴充AI基礎設施。台灣受惠於供應鏈競爭優勢，加上記憶體、載板等關鍵零組件短缺推升價格，帶動電子資通產品出口金額增加。

結合傳統產業貨品出口回溫，主計總處將2026年商品及服務輸出成長率上修至23.96%，較前次預測增加2.68個百分點；民間投資實質成長率也上修3.32個百分點至14.9%。綜合統計處處長蔡鈺泰表示，先前對民間投資的估計較保守，目前廠商看到訂單、願意投資，是調高預測的依據。

對於AI監管等外部變數，蔡鈺泰表示，主計總處已納入考量，明年出口預測也相對保守；他的判斷是，已動工資料中心的訂單將持續推進，較長期則可能有所調整。至於美國擴大先進半導體出口管制，他指出，今年前十月台灣AI伺服器銷往東南亞四國的占比約18%，仍有一定影響，後續將密切關注。</p><aside>編輯觀察：這次上修同時反映AI需求、供應鏈投資與零組件價格對出口金額的影響，不能只解讀為出貨量增加。已簽訂單帶來的短期支撐，也應與監管及出口管制的較長期影響分開觀察。</aside><p><a href="https://www.cna.com.tw/news/afe/202611270234.aspx">中央社財經</a></p><ul></ul></article><article><h2>AI與晶片股帶動美股反彈　費半收漲4.69%</h2><p>美股11月27日在人工智慧（AI）與科技股帶動下收高，美光、超微及晟碟股價勁揚。經歷本週震盪後，晶片股與其他科技類股從早盤便走揚，收盤時主要指數全數上漲。

科技股與半導體類股的漲幅較為突出。那斯達克指數上漲543.70點、漲幅2.31%，收在24129.50點；費城半導體指數上漲411.845點、漲幅4.69%，收在9186.707點，漲幅高於那斯達克及其他主要指數。

大盤同步收紅，標準普爾500指數上漲114.71點、漲幅1.60%，收在7297.49點；道瓊工業指數上漲591.99點、漲幅1.18%，收在50774.94點。那斯達克與標普500指數的收盤漲幅，也都高於早盤報導所列的1.58%與1.23%。</p><aside>編輯觀察：這次行情呈現半導體類股相對大盤的強勢，但單日股價反彈不足以證明AI需求、企業獲利或估值已獲基本面支持。</aside><p><a href="https://www.cna.com.tw/news/afe/202611280006.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611270287.aspx">中央社財經</a></li></ul></article></main></noscript>
