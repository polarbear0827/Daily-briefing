  <noscript><main><h1>人工智慧代理擴大應用，平台治理、資安與產業投資同步受關注</h1><p>2026-11-25 科技早報</p><article><h2>ShellBench評測：頂尖AI模型處理日常代理任務，失敗率仍逾三分之一</h2><p>日常工作交給AI代理，完成任務與守住安全要求仍是兩道不同關卡。ShellBench評測顯示，受測的OpenAI、Anthropic與Meta頂尖模型，任務失敗率仍超過三分之一；所有受測模型的執行嘗試中，有15.7%至少違反一項安全要求。這些數字反映的是該評測條件下的表現，並非所有個人助理產品的通用成績。

ShellBench由The OpenClaw Foundation、Parsewave、Hugging Face、Red Hat及UC Berkeley的研究人員合作開發，以超過1,000萬筆匿名化的真實AI代理互動為基礎，檢視使用者實際委派的日常工作。測試關注代理如何在電子郵件、行事曆、試算表、收據與聊天紀錄交錯的環境中，辨識過時資訊、釣魚內容及隱私界線，完成多步驟任務。

評測也發現，單次成功不等於穩定可靠。在相同條件下將每項任務執行三次，總分最高的OpenAI GPT-6 Astra，三次全部成功的比例仍不到一半。另有約一成原本正確完成的嘗試，至少未通過一項安全標準；在發票付款任務中，代理建議重複或錯誤付款的比例為40.3%。

模型之外，負責管理資訊存取、工具使用與行動的代理執行框架，也會影響結果。研究發現，較強模型之間的表現更受框架選擇左右，甚至出現排名互換。不過，測試並未使用Muse、Dots或Claude Duet各自的原生執行框架，因此不能直接將結果視為這些消費產品的實際使用表現。</p><aside>編輯觀察：評估可自主執行工作的AI代理，不能只看單次任務成功率；重複執行的一致性、安全要求及部署框架，都應分開檢視。</aside><p><a href="https://techcrunch.com/2026/11/24/even-the-best-ai-agents-struggle-with-everyday-life/">TechCrunch</a></p><ul></ul></article><article><h2>Claude Artifacts開放桌面安裝測試，支援macOS與Windows</h2><p>Anthropic將Claude Artifacts延伸至桌面，推出可安裝為Mac或Windows應用程式的測試功能。使用者可在對話中建立Artifact，不必自行撰寫程式碼，再將它保留在Dock中使用；這項功能需要最新版Claude桌面應用程式。

安裝後的應用程式可使用作業系統API、連接器與Claude，功能包括新增選單列項目、建立透明視窗及傳送通知。已展示的範例涵蓋自訂終端機、檔案管理員與影片編輯器，讓對話生成的工具不再只停留於聊天介面。

使用條件仍須區分。Anthropic的Felix Rieseberg表示，目前一般安裝方式需要Claude帳號及Claude應用程式，免費帳號即可使用；若持有Apple Developer帳號，則還可讓Claude建置獨立應用程式。後者另有帳號條件，不能與一般Artifact桌面安裝視為相同功能。</p><aside>編輯觀察：這項更新把對話生成工具的使用範圍延伸到桌面介面；評估是否適合自身工作流程時，仍須分清測試功能、一般安裝與獨立應用程式建置的條件。</aside><p><a href="https://the-decoder.com/anthropic-turns-claude-artifacts-into-standalone-desktop-apps-for-macos-and-windows/">The Decoder</a></p><ul></ul></article><article><h2>MCP背景任務與追問功能正式提供，技能整合進入公開測試</h2><p>MCP擴充AI代理的工作流程能力，讓伺服器可在背景執行較長任務，也能在資訊不足時暫停並向使用者追問。Tasks與Elicitation兩項功能經過10月公開測試後，已正式提供；技能整合仍在公開測試，檔案上傳則尚待推出，並非所有新功能都已可用。

Tasks讓伺服器執行耗時工作，待結果就緒再回報；Elicitation則讓執行中的流程要求使用者補上特定資訊。兩者分別處理等待結果與補足資料的環節，目標是讓MCP伺服器更獨立地運作，同時保留向使用者確認的途徑。

公開測試中的Skills over MCP，可讓伺服器將工具與技能搭配，協助Claude執行較長、多步驟的任務。Anthropic表示，這些技能可包含最佳實務、逐步工作流程，以及針對特定帳號或組織的指示。至於預告中的檔案上傳，推出後將讓Claude直接把PDF、試算表與圖片等檔案傳給MCP伺服器；公司規劃在Claude與Claude Code向Pro、Max、Ultra訂閱者，以及符合資格的Team與Enterprise客戶提供。

部署端也有配套調整。Enterprise Managed Auth讓管理員一次核准支援的伺服器，供員工自動連接；MCP Apps則允許開發者在Claude內嵌入完整使用者介面。另一項Tool Search機制會等到需要時才載入個別工具說明，Anthropic宣稱，這可在多伺服器環境中減少逾85%的上下文用量。

Anthropic另公布，MCP開發工具套件每月下載量已超過7億次，Claude的MCP連接器超過1萬個。這些是公司公布的生態系規模數字，不等同於實際使用者人數，也不能直接代表代理完成工作的可靠程度。</p><aside>編輯觀察：對開發者而言，這次更新的重點不只是新增連接器，而是協定開始涵蓋長時間執行、資訊補問與工作步驟指引；導入時仍應依正式提供、公開測試與預告功能分別規劃。</aside><p><a href="https://the-decoder.com/anthropic-tops-700-million-monthly-mcp-sdk-downloads-and-expands-the-protocol-for-more-autonomous-ai-agents/">The Decoder</a></p><ul></ul></article><article><h2>Claude Ship推出測試版，串接程式碼審查、修正與政策式核准</h2><p>Anthropic推出Claude Ship測試版，將程式碼變更的審查、修正與合併核准串成一套流程。系統結合既有的Code Review，以及新增的PR Steward、Claude Approvals兩個人工智慧代理，依團隊設定的政策處理變更，而非讓所有程式碼一律跳過人工審核。

三者各有分工：Code Review負責分析程式碼；當測試失敗、變更發生衝突，或審查者留下修正意見時，PR Steward會修改草稿，並記錄處理步驟。完成後，Claude Approvals讀取專案目錄內的政策檔，判斷例行變更能否由人工智慧自行核准，或仍須由人員簽核。

The Decoder報導，在啟用GitHub自動合併、且政策設定允許的情況下，新程式碼可以不經人工介入完成合併。這項能力有明確的設定前提，不能視為無條件取代人工核准。

Claude Ship提供Team與Enterprise方案使用，但須依詞元用量另外計費。PR Steward預設沒有支出上限，團隊可自行設定預算控管成本；有特定資料隱私要求的組織則無法使用這項功能。</p><aside>編輯觀察：這項更新把自動化範圍從找出問題延伸至修正與核准。團隊導入時的關鍵，不只是程式碼分析能力，也包括政策檔如何劃定人工簽核邊界，以及用量預算如何設定。</aside><p><a href="https://the-decoder.com/anthropics-claude-ship-lets-ai-agents-review-fix-and-approve-pull-requests-on-their-own/">The Decoder</a></p><ul></ul></article><article><h2>Muse進駐Instagram私訊，新增收藏整理與行程、清單轉換功能</h2><p>Meta於11月24日宣布將人工智慧代理Muse整合進Instagram，讓使用者直接在私訊中對話，針對看到的貼文、地點或商品提出問題與任務，不必為了發出指令而切換至Muse應用程式。新功能須先連結Instagram與Muse帳號。

使用者可以將貼文傳給Muse，例如要求把咖啡店加入旅遊行程，或尋找鞋款的黑色星期五優惠。Meta表示，Muse也能協助掌握其他私訊中錯過的對話；在Instagram內與Muse的對話，會以側邊聊天形式出現在Muse主應用程式中。

另一部分更新針對已收藏的貼文與Reels短影音。使用者可要求Muse把內容整理成自訂收藏集，或將食譜影片轉成採買清單、旅遊內容轉成行程，並依收藏的穿搭影片提供搭配點子。Instagram也會在使用者儲存貼文時，顯示交由Muse整理的提示。私訊功能首波向美國、加拿大、墨西哥、日本與新加坡的iOS及Android使用者推出；收藏整理功能則先在美國與加拿大上線。

Muse並未取代Instagram原有的Meta AI聊天機器人。Instagram發言人表示，偏向一般問答的Meta AI仍會保留，Muse則著重助理式任務。Meta另表示，未經使用者同意，不會分享、發布或傳送內容，使用者也能要求Muse忘記資訊或撤銷操作。Engadget指出，Instagram內的Muse功能仍較獨立應用程式與網頁介面有限，查看任務後續處理情況可能仍須回到Muse。</p><aside>編輯觀察：這次整合把收藏與私訊變成可交辦任務的入口，重點不只在增加聊天功能，也在將使用者已儲存的內容轉為可執行的清單與行程。不過，入口整合尚不等於所有任務都能在Instagram內完成。</aside><p><a href="https://techcrunch.com/2026/11/24/meta-brings-its-muse-ai-assistant-directly-into-instagram-dms/">TechCrunch AI</a></p><ul><li><a href="https://www.engadget.com/2326663/meta-is-bringing-muse-to-instagram/">Engadget</a></li></ul></article><article><h2>Walmart攜手Muse提供人工智慧購物，可設支出上限與購買核准</h2><p>Walmart於11月24日宣布與Meta合作，讓消費者透過人工智慧代理Muse尋找黑色星期五優惠、比較商品並進行購買。這項合作將商品搜尋與購物車建立流程接入外部人工智慧助理，提供不同於自行瀏覽Walmart網站的購物入口。

使用者須先開啟Muse應用程式、登入Walmart帳號，再回到助理開始購物。當使用者提出尋找特定商品、比較選項或查找優惠等要求，Muse會將請求送至Walmart，由零售端回傳相關商品並協助建立購物車。

Walmart表示，這套體驗設有隱私保護，Muse不會取得顧客的Walmart購物紀錄或其他個人資訊。消費者也能設定支出上限、要求購買前取得核准，以及檢視代理下的訂單；若不想繼續使用，也可刪除代理設定檔。這些資料隔離與控制機制屬Walmart對服務設計的說明。

合作背後使用的是Walmart於10月推出的Agent Gateway，讓外部人工智慧助理直接連接其線上商店。Walmart計畫進一步開放給更多開發者與人工智慧平台。與此同時，Walmart也持續擴充自家購物助理Sparky，新增將手寫購物清單轉成購物車、透過照片與語音尋找商品，以及協助顧客在店內定位商品等功能。</p><aside>編輯觀察：Walmart同時發展自家購物助理與外部代理串接，顯示人工智慧購物不必只限於零售商自己的介面。實際使用時，支出上限、購買前核准及訂單檢視，都是消費者保留交易控制權的重要設定。</aside><p><a href="https://techcrunch.com/2026/11/24/walmart-teams-up-with-meta-to-bring-black-friday-deals-to-ai-agent-muse/">TechCrunch</a></p><ul></ul></article><article><h2>Tidal將於12月9日起移除全人工智慧生成音樂，仍接受輔助創作</h2><p>Tidal將從12月9日起移除完全由人工智慧生成的音樂，並禁止發行商繼續提交這類作品。這項政策把管理方式從標示、取消收益，推進到下架與阻擋新作品上架；使用人工智慧輔助、而非完全由人工智慧生成的歌曲，仍可留在平台。

新規也將用於審核送件內容：若歌曲的中繼資料註明作品完全以人工智慧製作，Tidal將拒絕收錄。平台表示，新制實施後，預計每天拒收約8萬至8萬5,000首歌曲，顯示政策不只處理既有曲庫，也針對持續湧入的上傳內容。

Tidal表示，過去90天上傳的歌曲中，約43%被辨識為人工智慧生成。平台先前已對完全由人工智慧生成的歌曲加上標示並取消收益，但負責人Robert Anderson認為，這些措施仍不足以遏止大量作品湧入。公司主張，這種規模的內容會讓訂戶想聆聽、探索的音樂與創作者更難被看見。

政策的界線並非創作過程能否使用人工智慧，而是成品是否完全由人工智慧生成。不過，Tidal尚未說明其辨識人工智慧音樂的方法；宣布禁止收錄，並不等於已證明能辨識所有相關作品，後續執行成效仍有待觀察。</p><aside>編輯觀察：Tidal把內容治理從告知聽眾、調整收益，轉為直接決定作品能否進入曲庫。政策效果除了取決於規則，也取決於平台能否可靠區分完全生成與人工智慧輔助創作。</aside><p><a href="https://techcrunch.com/2026/11/24/tidal-to-ban-and-remove-millions-of-ai-generated-tracks-as-ai-slop-inundates-music-streaming/">TechCrunch AI</a></p><ul><li><a href="https://www.engadget.com/2326812/tidal-is-banning-ai-generated-music-entirely/">Engadget</a></li><li><a href="https://arstechnica.com/ai/2026/11/tidal-will-ban-fully-ai-generated-music-on-december-9/">Ars Technica</a></li></ul></article><article><h2>Pinterest擴充家長控制，可調整青少年接觸人工智慧生成內容的程度</h2><p>Pinterest本週宣布擴充家長控制功能，新增調整青少年接觸人工智慧生成內容程度的設定。這項變化針對使用者日常瀏覽時看到的內容，而不只是限制能否開啟某個人工智慧工具或與聊天機器人互動。

這與其他平台常見的管理方式有所不同。Snap曾提供讓人工智慧聊天機器人停止回應青少年的家長設定；WhatsApp則讓家長調整青少年使用Meta AI創作內容、取得問題回覆的權限。Pinterest這次把控制範圍延伸到整體瀏覽體驗中的生成內容，處理的是動態消息與推薦內容的接觸程度。

不過，新增控制項不代表能完全排除人工智慧生成內容。Pinterest在2025年已推出限制人工智慧修改內容的設定，TechCrunch報導指出，即使啟用，相關內容仍會出現在使用者的動態消息中。因此，新功能應被理解為調整接觸程度的工具，而非保證所有生成內容都能被攔下。

同批更新也包括停止影片自動播放，以及調整推播、瀏覽器、應用程式內與電子郵件通知量。Pinterest並重新設計家長控制頁面，讓家長更容易找到及設定相關選項，也可調整個人化廣告設定。</p><aside>編輯觀察：人工智慧管理不只涉及青少年能否使用聊天機器人，也涉及推薦系統讓他們看見什麼。Pinterest新增設定，讓家長能介入後者，但控制選項的存在仍須與實際過濾能力分開看待。</aside><p><a href="https://techcrunch.com/2026/11/24/pinterest-will-now-let-parents-limit-the-ai-generated-content-their-teens-see/">TechCrunch AI</a></p><ul></ul></article><article><h2>Uber、Nuro啟動Lucid無安全駕駛路測，目標2027年首季商轉</h2><p>Uber與Nuro已開始在舊金山灣區公共道路測試沒有車內安全駕駛的Lucid Gravity休旅車。兩家公司接下來計畫提供員工無人駕駛試乘，並以2027年第一季推出商業自駕計程車服務為目標；目前進展仍屬測試，尚非對一般乘客開放營運。

Nuro先前已在灣區進行近一年的Lucid Gravity道路測試，當時由安全駕駛坐在駕駛座。加州車輛管理局於2026年5月核發無人駕駛測試許可，這次移除安全駕駛的路測，距離取得許可已超過六個月。

測試工作並未全面改為無人駕駛。Uber與Nuro在休士頓的公共道路測試仍配置安全駕駛；Nuro也利用封閉場地及模擬測試，在向公眾開放前驗證系統。隨著Lucid位於亞利桑那州的工廠開始製造首批量產版自駕計程車，今年稍早約有100輛車的聯合工程測試車隊也正擴編。

華為與3家關係企業面臨的指控，包括銀行詐欺、電信詐欺、違反制裁、共謀竊取商業機密及妨礙司法等。陪審團並未接受所有指控：共謀敲詐勒索及共謀妨礙司法兩項指控獲判無罪，因此不能將這次裁決概括為檢方所有主張均獲支持。

在舉證部分，檢方以華為銷售含有抄襲競爭對手程式碼的路由器，作為其竊取智慧財產與商業機密指控的證據；檢方也指控華為向伊朗及北韓銷售設備，並誤導銀行與官員以隱瞞相關業務。這些是檢方提出的指控與舉證說法，仍須與陪審團對各項罪名的裁決分開看待。

華為表示，歡迎共謀敲詐勒索指控獲判無罪，並主張其餘指控同樣缺乏法律或事實基礎，將檢視裁決並採取必要法律行動。這起案件也延續華為在美國面臨的合規壓力：美國政府於2019年將華為列入貿易黑名單，限制其取得美方技術。</p><aside>編輯觀察：案件的科技產業意義在於商業機密保護、跨境設備交易與制裁合規。刑事裁決不應被直接延伸為華為產品存在特定技術安全缺陷的證明。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611250010.aspx">中央社國際</a></p><ul><li><a href="https://www.engadget.com/2327450/huawei-is-guilty-of-conspiracy-to-steal-trade-secrets-us-jury-rules/">Engadget</a></li></ul></article><article><h2>美國將Megaspeed列入實體清單，美企出售人工智慧晶片須取得許可</h2><p>美國商務部已將新加坡公司Megaspeed列入實體清單。這項措施使包括NVIDIA在內的美國企業，向Megaspeed或其關係企業出售人工智慧晶片等技術前，必須取得美國聯邦政府許可。

美國商務部與司法部先前發布的聯合聲明指出，商務部於2024年開始調查Megaspeed；NVIDIA則已在2025年6月將這家雲端運算公司列入自身的禁止銷售名單。

此次新增的是聯邦政府層級的交易許可要求，與NVIDIA自行採取的禁售措施不同。就已揭露的限制而言，交易關鍵在於取得政府許可，不能直接解讀為所有相關交易一律禁止。</p><p><a href="https://www.engadget.com/2326638/commerce-department-adds-megaspeed-to-trade-blacklist/">Engadget</a></p><ul></ul></article><article><h2>淡海科學城更名智慧科技城，首階段預計民國118年完成</h2><p>行政院長卓榮泰11月24日宣布，淡海科學城經檢討後，重新定名為「AI新基地．淡海智慧科技城」，將分階段推動，第一階段預計於民國118年完成。

卓榮泰表示，第一階段完成後，預計迎接智慧製造、智慧物流、健康產業及海洋經濟相關供應鏈進駐。他在八里開台天后宮參香時說明，這項規畫源於蘇巧慧建議在淡海科學城設置人工智慧園區，並期待透過中央與地方合作帶動八里及新北發展。

這項淡海新計畫也被納入北北基宜的國家首都圈黃金廊帶規畫。卓榮泰提及，行政院編列新台幣9007億元推動首都圈初期整體規畫，涵蓋觀光、科技、產業及農業發展；這筆金額所指的是整體規畫，目前資料未交代淡海智慧科技城的專屬預算。</p><aside>編輯觀察：後續評估這項科技園區計畫，應區分更名、分期完工目標與實際進駐成果，也不能將首都圈整體規畫金額視為園區專屬投資。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611240294.aspx">中央社政治</a></p><ul></ul></article><article><h2>Novartis執行長預測：人工智慧可將藥物開發時程從12年縮至8年</h2><p>Novartis執行長Vas Narasimhan預測，未來十年內，人工智慧可望將平均藥物開發時間從12年縮短至8年，但他不認同人工智慧能在五至十年內治癒癌症的樂觀期待。這些數字是他對未來研發進展的估計，並非已達成的成果。

Narasimhan認為，人類對自身生物學的理解仍有限，因此耗時的動物試驗與人體試驗依然必要。在他預估可縮短的開發時間中，進入人體試驗前的早期階段，最多可貢獻兩年的縮減；他也預期臨床開發成功率可由8%提高至12%。

同時擔任Anthropic董事的Narasimhan，對人工智慧醫藥應用的時間表，比部分人工智慧業界人士審慎。Anthropic執行長Dario Amodei曾提出，多種重大疾病可能在不到十年內獲得治癒；Demis Hassabis也曾預測人工智慧可在十年內戰勝所有疾病。相較之下，Narasimhan將實際效益放在樂觀預測與製藥業懷疑態度之間，重點是加速研發，而非省略生物學驗證。</p><aside>編輯觀察：評估人工智慧製藥進展，應分開看待早期研發加速、臨床成功率與最終治療成果；縮短開發時程的預測，不等於已證明能治癒更多疾病。</aside><p><a href="https://the-decoder.com/novartis-ceo-says-ai-will-shave-four-years-off-drug-development-not-cure-all-disease/">The Decoder</a></p><ul></ul></article><article><h2>達姆施塔特40名研究人員倡議：資訊科學教育應轉向驗證與引導AI系統</h2><p>德國達姆施塔特工業大學資訊科學系40名研究人員發表共同立場文件，主張將資訊科學與人工智慧更深入整合。他們認為，AI正成為建構與使用電腦系統的核心技術，學科應朝「電腦與人工智慧科學」轉型，而非因程式開發自動化就降低基礎訓練的重要性。

文件將變化分為軟體開發門檻降低、研究加速與新運算典範形成三個面向。作者主張，開發者透過自然語言描述需求，可能把初版軟體的製作時間從數月縮短至數天，AI也能協助整合與測試。他們並認為，這可讓原本負擔不起開發成本的小型城鎮、中型製造商與專門研究計畫，有機會建立所需軟體；這些效益屬於作者的判斷，並非此次報導提供的實驗評測結果。

在人才培育上，研究團隊建議，課程重心應從單純撰寫程式，轉向驗證及引導AI生成的系統。這並不代表放棄基本功：他們也提議安排不得使用AI協助的作業，確保學生理解基礎原理。當安全與速度等目標衝突時，人仍須做價值判斷並承擔責任。

研究團隊進一步提出「生成式運算」的挑戰：若系統在執行時才依人類意圖動態產生行為與程式碼，安全、隱私及正確性要如何驗證與認證？他們認為，這對機器人與自駕車尤其重要，也呼籲以更有效率的演算法及硬體架構降低AI資源消耗。對研究工作，作者則提醒，速度提升不能取代理解；研究者仍須釐清AI解法為何有效，以及適用界限。</p><aside>編輯觀察：這份倡議的重點不只是讓學生更快寫出程式，而是將理解、驗證與責任判斷放在AI輔助開發的核心；它提出的是學科與課程改革方向，不能直接視為成效已獲證實的教學方案。</aside><p><a href="https://the-decoder.com/german-researchers-call-for-computer-science-to-reinvent-itself-as-computer-and-ai-science/">The Decoder</a></p><ul></ul></article><article><h2>Amazon Leo再添36枚衛星，提前安排SpaceX發射任務</h2><p>歐洲Ariane 6火箭將36枚Amazon Leo寬頻衛星送入軌道，使該星系的衛星數增至432枚。這次部署接續在11月15日ULA的Vulcan火箭任務失敗之後；該次事故造成40枚Amazon衛星損失，也使主要發射供應商的火箭停飛。

為填補發射運能缺口，Amazon正提前安排已向SpaceX購買的數次Falcon 9任務。Amazon表示，下一次任務已由原訂明年提前至12月，之後還規劃接連執行多次發射。這些仍是公司公布的時程安排，尚非已完成的部署。

Amazon最初向ULA、Arianespace與Blue Origin採購發射服務，多數合約仰賴當時仍在開發的新火箭，包括Vulcan、Ariane 6與New Glenn。隨著其他供應商進度延誤，Amazon增加採購Falcon 9任務；目前Amazon及合作夥伴已完成原先108次發射安排中的17次，其中一次失敗，原始部署目標為3,232枚低軌衛星。

Arianespace今年已為Amazon成功執行四次Ariane 6任務，Amazon也在9月追加預訂六次發射。另一方面，SpaceX既是發射服務供應商，也是旗下Starlink與Amazon Leo競爭的業者。Amazon加快部署的同時，仍須仰賴這家競爭對手提供部分運能，凸顯衛星寬頻布局與火箭供應進度之間的緊密關係。</p><aside>編輯觀察：對衛星寬頻業者而言，採購衛星與取得發射運能是兩個相互牽動的環節。這次調度顯示，多家發射供應商雖提供替代空間，實際部署速度仍取決於可用火箭與任務排程。</aside><p><a href="https://arstechnica.com/space/2026/11/amazon-surges-launches-with-rival-spacex-after-ula-fails-to-deliver/">Ars Technica</a></p><ul></ul></article><article><h2>《Grand Theft Auto 6》支援PS5與Portal雲端串流，須購買遊戲並訂閱Premium</h2><p>《Grand Theft Auto 6》新增PS5與PlayStation Portal雲端串流遊玩方式。使用者須購買遊戲，並具備PlayStation Plus Premium訂閱；這並不是只要訂閱，就能免費取得遊戲內容。

遊戲的PlayStation Store頁面已列出，PS5與PS Portal雲端串流僅支援Premium訂閱。透過這項方式遊玩，不必在主機預留安裝遊戲所需的212GB空間；若使用PlayStation Portal，也不一定需要擁有PS5，便可透過雲端執行遊戲。

雲端串流與遠端遊玩仍須區分。前者是這次新增的PS5與PlayStation Portal使用選項；後者則仍可從自己的主機把遊戲畫面傳到PC。報導對PlayStation使用者能否直接將已購遊戲透過雲端串流至PC，保留了不確定語氣，不能把現有的遠端遊玩能力視為PC也已獲得同樣的雲端支援。</p><aside>編輯觀察：這項支援把遊玩條件從本機安裝延伸至雲端，但購買遊戲、訂閱方案與支援裝置仍是不同門檻。對玩家而言，應先確認自己的裝置與訂閱是否符合要求，而非將雲端串流等同於任何裝置都能遊玩。</aside><p><a href="https://www.engadget.com/2326845/gta-6-cloud-streaming-comes-to-ps5-and-playstation-portal/">Engadget</a></p><ul></ul></article><article><h2>《Grand Theft Auto 6》非官方電腦移植展開，社群另試影格生成改善流暢度</h2><p>《Grand Theft Auto 6》的非官方電腦移植與提高影格率嘗試，正沿著不同技術路線推進。開發者嘗試透過重新編譯讓遊戲在電腦執行；另有玩家將主機畫面交由影像工具處理，改善每秒30影格限制下的視覺流暢度。這些進展並不代表官方電腦版已推出。

Engadget報導，Rockstar已下架Leonida專案的Discord伺服器，該專案據報曾成功啟動遊戲。追蹤多項重新編譯計畫的網站Port Watch VI則聲稱，已看到其中進度領先的專案載入遊戲，並讓玩家移動、與非玩家角色交談，但執行速度非常緩慢。這些仍是專案進度說法，不能視為已有可順暢遊玩的移植版本。

另一條路線不涉及移植，而是處理PS5輸出的影像。玩家透過4K擷取卡或Sony的Remote Play傳送遊戲畫面，再利用Veyra與NVIDIA的DLSS 5套用影格生成等處理，嘗試突破原有影格限制帶來的觀感。不過，報導也指出，影格生成、GPU影像處理與遠端串流都會增加延遲，畫面看起來更流暢，仍有操作反應上的代價。

Xbox端另有利用遊戲異常行為解鎖每秒40影格的做法，但能維持多久尚不清楚。非官方移植、外部影像處理與主機端異常行為各有不同限制，不能混同為官方效能更新，也無法據此判定電腦版的推出時間。</p><aside>編輯觀察：這些嘗試反映開發者社群對電腦執行與更高流暢度的需求，但判讀進度時，必須區分能否啟動、是否可順暢遊玩，以及影像處理後的視覺效果。</aside><p><a href="https://www.engadget.com/2327074/desperate-gamers-are-trying-bring-gta-6-to-pcs-and-break-free-of-its-30-fps-cap/">Engadget</a></p><ul></ul></article><article><h2>紐約州立法限制車用功能訂閱，預定2027年2月生效</h2><p>紐約州州長Kathy Hochul已簽署限制車用功能訂閱收費的法案，預定2027年2月27日生效。新法針對以預先安裝的零組件或硬體提供、且沒有持續成本的車輛功能，限制業者另設訂閱或購車後收費，並非全面禁止所有車載軟體與連網服務訂閱。

依Ars Technica報導，法案S.9348A/A.10411A的規範對象涵蓋汽車製造商、經銷商及第三方服務供應商。爭議核心在於，消費者買下已具備相關硬體的車輛後，是否還得持續付費才能使用功能。Hochul主張，本應隨車提供的功能不應要求車主再付費，並批評這類商業模式。

州政府新聞稿提到的項目包括加熱座椅，以及不會為經銷商和製造商帶來持續支出的進階導航、免手持駕駛與娛樂選項。不過，功能是否存在持續成本，將是理解限制範圍的重要條件，不能僅依功能名稱判定所有相關服務都不得收費。

Ars Technica分析，導航與免手持駕駛系統所用的地圖、資料庫需要更新，軟體更新也可能被業者主張為持續成本。因此，加熱座椅訂閱這類模式將受到限制，但部分連網服務仍可能保留定期收費空間。這是報導對條文的解讀，尚不能當作所有車用訂閱服務適用與否的確定結論。</p><aside>編輯觀察：這項立法觸及汽車軟體化後的收費界線：已購硬體的功能解鎖，與需要持續維護的服務，是否應採取不同收費規則。後續判讀重點是持續成本的認定，而非將新法概括為全面禁止車用訂閱。</aside><p><a href="https://arstechnica.com/cars/2026/11/new-york-says-no-more-subscriptions-for-in-car-features-or-does-it/">Ars Technica</a></p><ul></ul></article></main></noscript>
