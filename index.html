  <noscript><main><h1>機器人模型募資、人工智慧硬體競爭與半導體政策動向</h1><p>2026-11-28 科技晚報</p><article><h2>Embo募得1.1億美元種子資金，布局機器人世界模型</h2><p>機器人AI新創Embo取得1.1億美元種子資金，目標是開發能用於日常機器人的人工智慧模型。公司表示，這輪募資由Andreessen Horowitz領投，Khosla Ventures、DST Global與Nvidia參與投資。

Embo提出的開發路線，結合網路影片、模擬環境與實體機器人經驗。依公司說明，其統一模型先以大量網路影片進行預訓練，作為學習物體及物理互動方式的世界模型；接著在模擬情境中練習動作技能，再利用人形機器人群累積的經驗進行微調。

公司將機器人在陌生情境中容易失敗的問題，列為研發要處理的重點，並表示正透過強化學習從頭訓練模型。改善陌生環境中的應對能力，是Embo提出的開發目標，不能視為這套方法已經達成的效能成果。</p><p><a href="https://the-decoder.com/robotics-startup-embo-raises-110-million-in-seed-funding-to-build-world-model-ai-for-robots/">The Decoder</a></p><ul></ul></article><article><h2>OpenAI反訴蘋果竊取商業機密、阻礙供應商合作，蘋果否認</h2><p>OpenAI於11月27日向加州聯邦法院提出反訴，指控蘋果竊取商業機密，並勸阻硬體供應商參與其未來裝置的開發。蘋果否認透過重新聘僱員工取得OpenAI機密，也否認試圖打壓AI裝置製造領域的競爭。

OpenAI在法院文件中表示，正在開發具備人工智慧功能的個人電子裝置，並指控蘋果回聘一名曾在OpenAI任職6個月的前員工，以取得機密資訊。依OpenAI說法，該員工任職期間能接觸一款新裝置的具體資訊，以及未來硬體產品的開發藍圖；這些內容屬於OpenAI提出的指控，而非法院認定。

供應商合作也是反訴爭點。OpenAI提交的文件指稱，蘋果要求供應商列出為OpenAI執行的專案及負責員工名單，部分供應商因擔心失去蘋果生意，調整會議時間或地點。文件另稱，一家供應商把OpenAI的生產作業移至晚班，另一家則因蘋果的威脅而放棄合作，但未揭露這些供應商的名稱。

這起反訴延續雙方先前的人才與技術爭議。今年7月，蘋果控告OpenAI及兩名前蘋果員工，指控他們不當挪用商業機密，協助OpenAI進軍消費性硬體市場；OpenAI與相關員工均否認指控。針對此次反訴，蘋果表示，OpenAI意在轉移外界對蘋果原有訴訟內容的注意力。</p><p><a href="https://www.cna.com.tw/news/afe/202611280014.aspx">中央社財經</a></p><ul></ul></article><article><h2>荷蘭反對美國晶片設備管制法案，總理擬於G20與川普磋商</h2><p>荷蘭總理葉騰表示，計畫在12月於邁阿密舉行的20國集團峰會期間，與美國總統川普討論美國擬議中的「硬體技術多邊協調管制法案」（MATCH Act）。這項法案涉及對中國的晶片製造設備出口管制，目前仍在美國國會審議，尚不能視為已生效規定。

荷蘭是先進半導體微影設備供應商艾司摩爾總部所在，正遊說反對這項跨黨派法案。依報導所述，法案將要求荷蘭、日本等美國盟友對中國採取更嚴格的出口管制，否則將面臨華府壓力；相關措施也引發對歐洲產業可能受到衝擊的疑慮。

荷蘭先前曾配合美國，限制艾司摩爾設備出口，但此次基於主權理由反對MATCH法案。葉騰表示，他將親自與川普討論，尋求符合雙方利益的解決途徑。峰會預定於12月14日至15日舉行，這次會談目前仍是荷蘭方面提出的計畫。</p><p><a href="https://www.cna.com.tw/news/aopl/202611280055.aspx">中央社國際</a></p><ul></ul></article><article><h2>西班牙人民黨陣營承諾執政後廢除資料中心限制法令</h2><p>西班牙資料中心監管政策面臨選後變動的可能。人民黨黨魁費霍陣營承諾，一旦執政，將立即廢除限制資料中心能源消耗與數據主權條件的法令，藉此推動人工智慧所需的資料中心產業擴張。

這項法令由桑傑士政府先前推動通過，規範涉及資料中心的能源使用及數據主權條件。費霍陣營則主張撤除相關限制，兩者對資料中心產業的監管方向存在分歧；促進產業擴張是其提出廢法承諾的目標，並非已實現的結果。

西班牙將於11月29日提前改選。廢法目前仍是以取得執政權為前提的政治承諾，是否落實仍取決於選舉結果與後續政策行動，不能視為資料中心規範已經鬆綁。</p><aside>編輯觀察：這項政策分歧涉及人工智慧基礎設施的監管條件。觀察重點是選後是否實際推動廢法，以及具體調整哪些規範，而非僅憑競選承諾推定資料中心投資將增加。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611280053.aspx">中央社國際</a></p><ul></ul></article></main></noscript>
