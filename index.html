  <noscript><main><h1>科技早報：模型更新、企業人工智慧部署與晶片產業動態</h1><p>2026-11-10 科技早報</p><p>增補更新 2026-11-10T18:21:15.353914+08:00</p><article><h2>輝達董事會調查黃仁勳婚外情，國安疑慮牽動對中晶片業務</h2><p>輝達執行長黃仁勳承認婚外情後，公司董事會已由獨立董事組成委員會，並聘請外部法律顧問協助調查。由於女方遭美國情報機構懷疑與中國情報活動有關，事件已從公司治理問題延伸至國安審視；輝達11月9日開盤股價一度下跌逾8%。

美國總統川普表示，聯邦調查局正在調查此事，並說自己已與黃仁勳談過。美國國會兩黨議員也要求取得更多資訊，以評估潛在國安影響。輝達調查的問題之一，是中國情報單位是否透過這段關係鎖定執行長；目前取得的資料並未提供已證實洩密或違法的調查結論。

事件也使輝達爭取中國市場的立場受到檢視。TechCrunch報導，美國情報官員認為，女方可能受中國情報單位招募，目的包括蒐集黃仁勳的資訊，以及影響公司爭取放寬晶片出口限制的行動。這仍是情報方面的指控，不能據此認定黃仁勳過去的遊說受到操控。

中國市場對輝達仍具商業分量：截至7月26日的三個月，公司來自總部設於中國之客戶的營收為79億美元，約占總營收8%。黃仁勳持續主張美國應允許向中國銷售人工智慧晶片。TechCrunch分析，這次爭議可能增加輝達向華府說明對中業務及敏感技術流向控管的壓力，但尚不能將調查視為出口政策已經改變。</p><aside>編輯觀察：觀察重點在於董事會調查結果，以及國安疑慮是否影響輝達對中業務的政策說服力；私人關係、情報指控與實際違法行為必須分開判讀。</aside><p><a href="https://www.cna.com.tw/news/afe/202611090291.aspx">中央社財經</a></p><ul><li><a href="https://www.ft.com/content/fa3b0a35-1aa9-4f31-97b4-e4c599e3e654?syn-25a6b1a6=1">FT Markets</a></li><li><a href="https://www.bbc.co.uk/news/articles/cqg7x7dpvym8o?at_medium=RSS&amp;at_campaign=rss">BBC World</a></li><li><a href="https://www.bloomberg.com/news/articles/2026-11-09/us-lawmakers-demand-details-on-nvidia-amid-jensen-huang-scandal">Bloomberg Technology</a></li><li><a href="https://arstechnica.com/tech-policy/2026/11/ceo-jensen-huang-admits-affair-as-nvidia-probes-possible-chinese-espionage/">Ars Technica</a></li><li><a href="https://techcrunch.com/2026/11/09/jensen-huangs-affair-with-alleged-chinese-spy-puts-nvidias-china-ambitions-under-scrutiny/">TechCrunch AI</a></li></ul></article><article><h2>科技股反彈帶動美股收高，費半漲6.88%、輝達仍跌4.27%</h2><p>美國科技股在上週大跌後，11月9日出現強勁反彈，帶動美股主要指數全面收高。費城半導體指數上漲6.88%，那斯達克指數上揚2.84%；不過，正因執行長黃仁勳婚外情啟動調查的輝達仍收跌，呈現科技類股整體回升、個別公司承壓的分歧。

費城半導體指數當天上漲646.22點，收在10036.47點；那斯達克指數上漲697.55點，收在25276.97點。標普500指數上漲2.58%，收7567.25點；道瓊工業指數則上漲2.19%，收52409.01點。

輝達盤中一度重挫近9%，收盤跌幅縮小至4.27%，收在178.67美元。金融時報指出，油價下跌也支撐股市，協助主要指數抵銷輝達下跌的影響；彭博則報導，科技股上漲與油價回落，推動美股創下七個月來最佳單日表現。

美股反彈也帶來對亞洲股市跟進上漲的預期。不過，彭博所述是亞洲市場接下來可能的走勢，並非亞洲股市已經收高的結果。</p><aside>編輯觀察：半導體類股與輝達當天走勢不同，顯示產業整體行情和個別公司的治理風險不宜混為一談；單日反彈也不足以證明人工智慧投資風險已經解除。</aside><p><a href="https://www.cna.com.tw/news/afe/202611100009.aspx">中央社財經</a></p><ul><li><a href="https://www.ft.com/content/b8644327-86e7-4d1c-a71f-3fb1d552723b?syn-25a6b1a6=1">FT Markets</a></li><li><a href="https://www.bloomberg.com/news/articles/2026-11-09/stock-market-today-dow-s-p-live-updates">Bloomberg Markets</a></li></ul></article><article><h2>法國指控伊朗駭入工業冷藏系統，數百家超市食品腐壞</h2><p>法國政府指控伊朗對連網工業冷藏與冷凍設備發動網路攻擊，波及法國及歐洲其他地區數千台設備。數百家超市因冷藏、冷凍設備升溫，造成大量食品腐壞。法國外交部長已召見伊朗大使，並表示將推動針對攻擊責任人的歐洲制裁；攻擊歸屬目前是法國政府的指控。

攻擊涉及管理冷藏設備的網頁式控制器。TechCrunch報導，10月至11月間的兩波攻擊中，駭客遠端入侵控制系統，再調高溫度，導致食品與貨品損毀。衛報也報導，攻擊者控制數位溫控器，將溫度推升至攝氏50度以上，使原本維持低溫的設備成為破壞目標。

資安研究人員警告，相關網頁式控制器可能遭遠端入侵，部分受影響型號由丹麥公司Danfoss製造，已不再獲得安全修補。攻擊也觸及醫療血庫，但法國血液機構表示，相關攻擊在血液受損前已被阻止，不能將超市食品損失擴大解讀為血液也遭毀損。

法國外交部長將責任指向伊朗伊斯蘭革命衛隊，並表示案件已交由法國司法體系處理。伊朗方面未立即回應相關報導的置評要求。現有資料交代了法方歸責與設備遭操控的方式，但未提供可供獨立核對的完整技術鑑識資料。</p><aside>編輯觀察：這起事件凸顯連網控制系統的資安風險可直接轉化為實體貨品損失；設備是否仍有安全修補、遠端控制介面如何保護，都是冷鏈營運需要檢視的環節。</aside><p><a href="https://www.nytimes.com/2026/11/09/world/europe/france-iran-refrigerators-cyberattack.html">NYT World</a></p><ul><li><a href="https://www.bbc.co.uk/news/articles/cmg474vk6dyqo?at_medium=RSS&amp;at_campaign=rss">BBC World</a></li><li><a href="https://www.theguardian.com/world/2026/nov/09/france-blames-irans-revolutionary-guards-for-cyber-attacks-on-supermarket-fridges">The Guardian</a></li><li><a href="https://techcrunch.com/2026/11/09/france-blames-iran-for-mass-hacks-targeting-freezers-in-grocery-stores-and-blood-banks/">TechCrunch</a></li></ul></article><article><h2>Anthropic推出Fable 5.2與Mythos 5.2，降價並擴大AWS供應</h2><p>Anthropic於11月9日推出Claude Fable 5.2與Mythos 5.2，鎖定高難度技術工作。公司宣稱，新模型在程式設計、推理、視覺與溝通清晰度方面有所改善；AWS也宣布，兩款模型已可透過Amazon Bedrock及Claude Platform on AWS取得。

兩款模型共用模型基礎，但開放條件不同。Fable面向一般使用者，對部分資安與生物領域高風險任務設有限制；Mythos則須經Anthropic的資安或生命科學驗證計畫申請。Anthropic仍建議日常用途採用Opus 5.5，而非一律改用新模型。

Fable每百萬輸入詞元價格由10美元降至8美元，輸出價格由50美元降至40美元。Anthropic稱，新模型輸出速度最多提升30%；部分平台另提供加倍收費的快速模式。不過，單位詞元降價不等於每項任務都更便宜，實際支出仍取決於任務、設定與詞元消耗。

安全與能力評估仍有不確定性。Anthropic宣稱，模型在物理問題、數學形式化及作業系統設計上取得進展，也刻意限制最直接加速AI開發的部分能力。但公司同時指出，新模型更常表達自己可能正在受測的懷疑，增加推估真實使用行為的難度；這些能力與安全結論不宜視為全面保證。

企業部署還須留意資料條件。AWS說明，Fable 5.2預設須保留資料最多30天並接受人工安全審查；Enterprise Frontier Safeguards尚未開放前，符合資格的客戶可依條件採零資料保留。另在Bedrock上，遭拒的資安或生物請求若要改交其他模型，須由客戶程式處理，並非自動切換。</p><aside>編輯觀察：這次更新的採用門檻不只在模型能力，也在使用資格、每項任務成本與資料治理。企業評估升級時，應把這些條件與效能宣稱分開檢視。</aside><p><a href="https://techcrunch.com/2026/11/09/anthropic-releases-new-mythos-and-fable-models-amid-rsi-concerns/">TechCrunch AI</a></p><ul><li><a href="https://the-decoder.com/claude-fable-5-2-and-mythos-5-2-cement-anthropics-ai-lead-just-before-its-ipo/">The Decoder</a></li><li><a href="https://aws.amazon.com/blogs/machine-learning/introducing-claude-fable-5-2-on-aws/">AWS Machine Learning</a></li></ul></article><article><h2>Google擴充第8代TPU，分攻機密運算與大脈絡推論</h2><p>Google於11月9日宣布擴充第8代TPU晶片系統，新增主打安全與機密推論的TPU 8tx，以及面向龐大脈絡視窗與高單機櫃運算密度的TPU 8i Max。兩款產品分別處理敏感資料保護與記憶體需求，延續既有世代，而非推出全新一代晶片。

這次調整主要在系統配置。The Decoder報導，兩款產品沿用既有晶片，透過封裝、網路與記憶體配置形成不同版本。Google將此視為模組化設計，並表示這種方式可讓新硬體版本的推出週期從數年縮至數月。

TPU 8tx鎖定處理機密資料的企業與政府機構。Google宣稱，資料及模型權重在運算期間也能維持保護與隔離，並可在同一系統進行微調、模型蒸餾及AI代理強化學習，減少敏感資料在不同叢集間移動。這項訴求著重資料使用中的保護，而不只是儲存或傳輸時的加密。

TPU 8i Max則在單一封裝放入兩顆TPU 8i晶片。依報導所述，Google以此在相同機櫃形式下，提供兩倍運算量、記憶體容量與記憶體頻寬，回應大型程式碼庫、長影片等工作負載需求。Google也已開源TorchTPU，並支援vLLM與SGLang等推論框架，試圖降低外部客戶採用TPU的軟體門檻。</p><aside>編輯觀察：這次擴充呈現AI晶片競爭的另一個面向：不只提高運算量，也依資料機密性、記憶體需求與軟體相容性切分產品。對採購端而言，適合工作負載比單一效能數字更值得比較。</aside><p><a href="https://www.cna.com.tw/news/afe/202611090282.aspx">中央社財經</a></p><ul><li><a href="https://the-decoder.com/google-ships-four-tpu-variants-in-one-year-as-it-ramps-up-competition-with-nvidia/">The Decoder</a></li><li><a href="https://www.bloomberg.com/news/videos/2026-11-09/google-rolls-out-new-ai-chips-to-challenge-nvidia-video">Bloomberg Technology</a></li></ul></article><article><h2>Meta推出Muse Ember，以低成本模型承接AI代理重複工作</h2><p>Meta於11月9日推出Muse Ember，定位為處理AI代理日常重複工作的輕量模型，包括工具呼叫、程式設計子任務、請求路由、資料擷取與長文件解析。Meta將它描述為旗下最輕量、最具成本效益的模型，重點放在大量任務的執行成本，而非只追求最高能力。

Muse Ember已透過Meta Model API及Muse Code提供，每百萬輸入詞元收費0.10美元，輸出詞元收費0.50美元。模型可處理文字、圖片、音訊與影片，脈絡視窗最高達100萬詞元。Meta表示，代理可藉此讀取螢幕截圖、圖表、掃描文件及會議錄音等不同形式的內容。

Meta設想的分工，是由較大型的Muse Wonder規劃，再由Ember承接大量執行工作。例如客服情境中，可先由大型模型建立處理規則，再交給輕量模型套用到眾多案件。這是公司的應用設計方向，並不等同已有客戶部署成果。

成本效益比較也有適用範圍。Meta宣稱，Ember在各推理層級的單位成本能力優於Claude Haiku 5.5與GPT-6 Luna；The Decoder報導，其在Artificial Analysis測試中每項任務約花費0.14美元。不過，同一報導列出的FrontierCode 2.0-AA實際程式設計測試，Ember得分27.2%，低於Haiku的34.9%。低成本定位因此不能直接延伸為所有任務的能力領先。</p><aside>編輯觀察：Ember呈現以模型分工控制代理成本的路線：把規劃與大量執行拆開。是否划算仍應按實際任務的正確率與總成本評估，不能只看每百萬詞元報價或綜合分數。</aside><p><a href="https://the-decoder.com/meta-launches-muse-ember-a-small-ai-model-built-for-the-repetitive-work-agents-actually-do/">The Decoder</a></p><ul><li><a href="https://techcrunch.com/2026/11/09/meta-releases-muse-ember-a-new-lightweight-model-for-agent-execution/">TechCrunch AI</a></li></ul></article><article><h2>ChatGPT Enterprise上架AWS Marketplace，銜接既有採購與帳務流程</h2><p>OpenAI宣布，ChatGPT Enterprise已可透過AWS Marketplace購買。公司表示，組織可利用既有的AWS採購與帳務關係，簡化服務採購流程。這次公布的變化聚焦企業購買服務的管道，以及採購、付款關係的銜接。</p><p><a href="https://openai.com/index/chatgpt-enterprise-aws-marketplace">OpenAI</a></p><ul></ul></article><article><h2>OpenAI介紹Control Room，集中追蹤並停止模型工作負載</h2><p>OpenAI介紹名為Control Room的系統，用於追蹤其研究基礎設施中的模型工作負載。公司表示，當出現安全或資安疑慮時，系統可迅速停止相關工作，將工作負載追蹤與停止機制納入集中管理。</p><p><a href="https://openai.com/index/control-room">OpenAI</a></p><ul></ul></article><article><h2>Meta擴充LLDB加速器外掛架構，讓CPU與GPU在同一工作階段除錯</h2><p>Meta公布在lldb-server建立的加速器外掛架構，將共用除錯基礎設施與硬體專屬控制分開，讓橫跨CPU與GPU的應用程式能在同一個除錯工作階段中檢查。Meta表示，多數共用框架已併入LLVM上游，其餘部分仍待完成。

這項設計處理的是跨處理器除錯的差異：人工智慧工作負載可能在CPU原生程式碼與GPU核心程式之間往返，兩端卻有不同的指令集、暫存器、記憶體空間及執行模型。若強行整合成單一程序，讀取記憶體、設定中斷點或逐步執行時，都得判斷操作對象；相同位址也可能指向兩端不同的位置。

新架構將CPU與加速器表示為各自獨立的LLDB目標及除錯程序，分別維護執行狀態，再於同一個LLDB或開發環境工作階段呈現。硬體專屬後端負責把供應商的裝置除錯介面，轉換成LLDB既有的程序、執行緒、暫存器與記憶體等概念，讓共用客戶端不必綁定單一GPU供應商。

主機與裝置則透過外掛協調：外掛可要求在CPU程序設定內部中斷點，待執行到指定事件後初始化裝置除錯介面，再由LLDB建立加速器連線。Meta也建立不需專用硬體的模擬外掛，供LLVM測試套件檢查外掛探索、中斷點協調、連線建立及基本裝置狀態。

Meta表示，GPU除錯功能只會在應用程式使用受支援的GPU執行環境時啟動，純CPU應用仍走既有除錯路徑。後續計畫是完成其餘共用基礎設施的上游整合，並擴充供應商整合；目前的架構設計不代表所有GPU或平台均已獲得支援。</p><aside>編輯觀察：這項工程的重點是共用除錯能力與硬體差異如何分工，而非宣稱除錯速度提升。若供應商整合持續擴充，同一套工具可望承接更多跨CPU與GPU的除錯流程；實際適用範圍仍須依各後端與執行環境的支援情況判斷。</aside><p><a href="https://engineering.fb.com/2026/11/09/developer-tools/extending-lldb-to-debug-applications-that-span-cpus-and-gpus/">Meta Engineering</a></p><ul></ul></article><article><h2>AWS擴充知識庫檢索介面，同一API可選單次RAG或只取原文</h2><p>AWS宣布，Amazon Bedrock Managed Knowledge Base的AgenticRetrieveStream介面新增單次檢索增強生成（RAG）與僅檢索模式，與既有代理式檢索共用同一套API。開發者可透過maxAgentIteration參數，依每次請求選擇直接查找、查找後生成答案，或進行多輪規劃與搜尋，不必為簡單與複雜問題分別串接介面。

新參數範圍為0至5。設為1並開啟答案生成時，系統檢索一次，再呼叫基礎模型產生答案，不進行代理規劃或查詢改寫；設為0則只回傳來源段落，不呼叫語言模型，此時必須關閉答案生成，否則會收到錯誤回應。三種模式都支援多個知識庫，單次檢索並不代表只能搜尋一個知識庫。

數值2至5維持既有代理模式，模型可將問題拆成子問題、檢查證據是否足夠，再視需要追加搜尋。啟用答案生成時，設定值為n，最多可進行n減1輪規劃，最後一次模型呼叫用於生成答案。不過，模式必須由應用程式選擇，這項參數本身不會自動判斷問題難度並分流。

AWS以虛構的銀行內部政策助理示範：查詢開戶文件清單可用單次RAG，跨政策比較可採多輪檢索，員工需要核對原文時則只回傳段落。這是功能說明情境，不是銀行導入成果。AWS建議以自有文件與代表性問題比較各種設定，檢查答案正確性、證據支持程度、延遲與請求成本，再選擇符合工作需求的最低迭代上限。</p><aside>編輯觀察：這次更新的重點是讓應用程式按任務控制檢索投入，而非讓所有問題都經過多輪代理流程；是否適合減少迭代，仍須以自身文件與答案品質驗證。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/single-shot-and-agentic-retrieval-with-amazon-bedrock-managed-knowledge-base/">AWS Machine Learning</a></p><ul></ul></article><article><h2>Fervo合約收入總額增至119億美元，地熱電廠分期開發瞄準資料中心用電</h2><p>地熱公司Fervo在第三季財報公布，已簽約收入總額由前一季的72億美元增至119億美元。隨大型雲端業者尋找人工智慧資料中心電力來源，公司正在推進猶他州Cape Station開發，其中供應Google的396MW電廠預計於2028年底前完工。

Fervo今年稍早已將首座100MW電廠併網，兩項工程均位於Cape Station。該地熱資源被估計可發展至8.4GW，高於先前約4GW的估計，但這是資源發電潛力，並非已運轉容量。執行長Tim Latimer表示，名為Cape Google 400的Google專案也將併網；若Google尚未準備好使用電力，可以轉售給其他客戶，使電廠與潛在資料中心不必等待彼此完工。

分期建設是Fervo爭取大型用電客戶的方式之一。公司將數口井組成稱為GeoBlock的單元，首個完成單元發電功率為33MW，近期單元則達50MW；報導指出，這類單元的規模對應典型資料中心機房需求，可隨建設完成陸續投入運轉。

成本仍是商業化關鍵。Fervo表示，Cape Station首期每瓩容量建設成本為7,000美元，Google專案降至5,500美元，長期目標為3,000美元。TechCrunch分析，若達成長期目標，將有機會在價格上挑戰天然氣發電，但目前仍屬目標，而非已實現成本。

公司當季營業虧損4,370萬美元，季末持有現金及約當現金19億美元、長期債務3億160萬美元。合約金額成長顯示需求增加，但不等於相關收入已認列，也不能將全部合約都視為資料中心訂單；後續仍須觀察電廠交付與成本下降是否跟上。</p><aside>編輯觀察：Fervo的進展提供了觀察人工智慧電力供應的具體案例：除了可開發資源，分期交付能力與每瓩建設成本，才是判斷合約能否轉化為供電成果的關鍵。</aside><p><a href="https://techcrunch.com/2026/11/09/fervo-now-has-12b-in-orders-for-its-geothermal-power-tech/">TechCrunch</a></p><ul></ul></article><article><h2>Nemotron 3.5 Super VL登上SageMaker JumpStart，提供兩種版本部署</h2><p>AWS宣布，NVIDIA Nemotron 3.5 Super VL已在Amazon SageMaker JumpStart提供，開發者可透過SageMaker Studio或Python SDK部署。這款視覺語言模型接受文字、影像與影片輸入，輸出文字；JumpStart提供NVFP4與BF16兩種版本，供使用者選擇部署。

依AWS介紹，模型採用1,200億參數的混合式專家模型語言骨幹，每個詞元啟用120億參數，並搭配C-RADIO視覺編碼器。官方列出的應用方向包括文件文字辨識、圖表與表格理解、電腦操作代理的畫面理解，以及影片問答與多模態代理；這些是產品定位，並非已公布的客戶應用成效。

部署選項方面，NVFP4為從BF16經量化感知蒸餾產生的版本，在G7執行個體上提供；BF16參考權重則可部署於P5en執行個體。模型雖內建支援推測解碼的多詞元預測元件，JumpStart目前的服務設定並未啟用推測解碼，不能直接將模型架構具備的功能視為部署後全部可用。

上下文長度也須區分模型規格與實際服務設定。AWS列出的模型支援上限為100萬個詞元，但JumpStart預設generate設定僅提供2,275個詞元，summarize與modify設定分別為13,650與15,600個詞元；提示、輸出及影像或影片影格都會占用額度。

輸入格式另有操作限制：目前服務設定每次請求接受一張影像與一段影片，PDF須先將頁面轉成影像。由於端點採網路隔離，無法自行擷取網址內容，媒體必須以Base64資料隨請求傳入。開發者評估文件或影片工作流程時，需同時檢查上下文與請求大小限制，而不只看模型標示的最大能力。</p><aside>編輯觀察：模型上架降低了取得與部署的門檻，但文件和影片應用能否直接落地，仍取決於服務端實際開放的上下文、媒體格式與功能，而非模型規格表本身。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/nvidia-nemotron-3-5-super-vl-is-now-available-in-amazon-sagemaker-jumpstart/">AWS Machine Learning</a></p><ul></ul></article><article><h2>CrossnoKaye串接工廠資料與隔離運算，讓AI診斷附上可核對依據</h2><p>CrossnoKaye將工廠即時資料、設備控制邏輯與人工智慧分析整合，並透過Amazon Bedrock AgentCore執行Python計算。AWS介紹，這套架構以ATLAS自動化平台為基礎，讓AURA代理系統讀取設備關聯、感測紀錄與安全連鎖條件，再產出附有證據的工程分析，而非只靠語言模型直接回答數值問題。

依AWS說明，AURA會在隔離的沙箱中執行模型撰寫的程式。系統先驗證輸入資料契約，再檢查輸出表格是否具備必要欄位與資料型別；若程式出錯或缺少欄位，便將錯誤交回代理修正，重新計算後才發布結論。這些檢查能讓運算流程更容易核對，但不代表分析方法與診斷必然正確。

互動查詢與自動任務採用不同執行方式：工程師連續追查問題時，系統保留沙箱狀態，避免每次重新載入資料；排程任務與背景監測則每次建立乾淨環境，降低前次執行狀態干擾結果的風險。分析報告也會檢查引用是否連到已保存的感測資料、設定變更或運算產物。

在控制權限上，AWS表示，沙箱沒有通往工廠設備的網路路徑、憑證或介面，背景監測僅能讀取資料；互動操作若提出設定變更，仍須由人員明確核准。設備端另保留本地控制邊界與硬體保護。這項案例呈現的是可追查的診斷流程，不能據此認定AI已能安全自主控制工廠。</p><aside>編輯觀察：這個案例的重點不只是讓AI取得更多資料，而是把計算檢查、證據追溯與設備控制權限分開處理。可核對的輸出有助工程師審查，但仍不能取代對診斷正確性與現場安全的判斷。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/how-crossnokaye-grounds-physical-ai-with-amazon-bedrock-agentcore/">AWS Machine Learning</a></p><ul></ul></article><article><h2>AWS Quick推出首波品牌宣傳，強調跨資料與應用程式的工作空間</h2><p>AWS以AWS Quick名稱推出首波品牌宣傳，將產品定位為專供工作使用的人工智慧空間，讓團隊透過代理，跨既有資料與應用程式進行研究、分析及執行工作。宣傳涵蓋美國與英國的串流電視、線上影片、社群媒體及商業刊物；這次公布的重點是品牌與定位，並非宣告所有功能首次上線。

AWS主張，個人使用AI助理獲得的效率提升，未必能延伸成團隊共同成果，因此Quick著重串接既有工作流程與組織脈絡。依公司介紹，使用者可用自然語言描述需求，建立代理、應用程式與自動化流程；放在共享空間中的成果，則可成為團隊共同使用的資產。這些是官方對產品能力與用途的說明，不是獨立效能評估。

企業治理也是此次定位的一部分。AWS表示，Quick會沿用既有權限與檔案敏感度標籤，代理、知識庫等資產須經核准才能分享給其他團隊，並記錄核准或拒絕的決定。公司也強調Quick沒有消費者版本，AWS Quick這個名稱意在凸顯原有的企業安全與治理定位。</p><aside>編輯觀察：AWS把產品價值放在團隊共用與企業治理，而不只是個人問答效率。評估這類工作空間時，應區分品牌訴求、可用功能與實際導入成效，不能把宣傳活動視為功能全面更新。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/professional-work-deserves-professional-tools-meet-aws-quick/">AWS Machine Learning</a></p><ul></ul></article><article><h2>Seedream 5.5主打多輪影像編輯，字節跳動稱最多支援100輪</h2><p>字節跳動旗下Bytedance Seed推出影像生成模型Seedream 5.5，瞄準專業製作流程，主打多輪修改的穩定性。公司宣稱，模型最多可進行100輪編輯，未修改區域能維持像素層級的一致性，且不出現色偏；這些表現仍屬公司主張。

新模型也支援原生RGBA透明背景影像，讓生成元素可直接作為設計素材，減少手動去背需求。字節跳動另稱，模型在光線、材質、皮膚紋理與密集小字的呈現上有所改善，並宣稱文字結構與寫實表現領先GPT Image 2.5 Sunburst。現有資料未提供可供獨立核對的評測方法或比較結果。

Seedream 5.5正透過Jimeng、Doubao、Doubao Work與Volcengine Ark逐步推出，另規劃Pro版本。此次更新把重點放在反覆修改與素材輸出，而不只是單次生成；能否穩定滿足製作需求，仍須與公司的效能宣稱分開看待。</p><aside>編輯觀察：對需要反覆修稿的影像製作流程而言，保留未修改區域與輸出透明背景素材，比單次生成的視覺效果更貼近日常需求；但目前證據不足以確認其穩定程度或競品優勢。</aside><p><a href="https://the-decoder.com/bytedances-seedream-5-5-promises-pixel-stable-image-editing-across-100-rounds-without-color-drift/">The Decoder</a></p><ul></ul></article><article><h2>Disney與Adobe展開多年合作，打造品牌專用AI模型與製作工具</h2><p>Disney與Adobe宣布多年合作，將共同打造供Disney製作流程使用的客製人工智慧工具。合作在Adobe MAX大會公布，涵蓋主題樂園、郵輪業務及ESPN內容，Disney也將提前取得Adobe的新技術。

合作也將延伸至既有創作與研發工作。Disney的Imagineering研究部門已使用Firefly開發主題樂園，Adobe另將擴充Walt Disney Studios內部的創意工作流程。StudioLAB與ESPN的創新單位ESPN Edge同樣納入合作，預計探索以AI提升運動內容的粉絲互動，以及ESPN典藏內容的新用途。</p><aside>編輯觀察：這項合作的觀察重點，是品牌專用模型如何進入既有製作流程，而不只是能否生成內容；商用安全的定位仍須與實際授權及驗證結果分開看待。</aside><p><a href="https://the-decoder.com/disney-bets-on-adobes-firefly-to-create-brand-safe-ai-models-for-its-entertainment-empire/">The Decoder</a></p><ul></ul></article><article><h2>NVIDIA於CoRL推出機器人模型與模擬工具，瞄準接線與精密組裝</h2><p>機器人模擬訓練的範圍，正從行走、滾動與跳躍延伸至齒輪對位、纜線連接及小型零件組裝。NVIDIA在美國德州奧斯汀舉行的機器人學習會議CoRL介紹新模型、模擬工具與評測框架，將精細操作及多步驟任務列為重點。

其中，GR00T 2是建立於NVIDIA Cosmos之上的開放世界動作模型。NVIDIA表示，模型使用機器人與人類資料訓練，包含10萬小時的開源人類第一人稱視角資料。在公司公布的50項任務評估中，每項提供一次示範時，平均成功率為71%；增加至五次示範後為95%。這些數字屬公司公布的評測結果，並非獨立實測。

模擬端的更新則集中在Isaac Lab 3.0與物理引擎Newton的整合。依NVIDIA介紹，研究人員可利用代理建立訓練環境、切換物理解算器，並對基礎模型進行強化學習後訓練。Newton可模擬纜線、布料等可變形物體，以及具有多個互動關節的機械手，讓訓練涵蓋更複雜的操作條件。

評估工具也從單一任務擴展至條件變化。NVIDIA介紹的DexBench涵蓋零售、物流、製造及旅宿四類場景、共15項任務；UC Berkeley與NVIDIA合作的VABAR則涵蓋六項工業任務，設有標準化變化、難度層級及成功指標，用來找出機器人在不同情境下的失敗條件。

Morgan Stanley財富管理主管Jed Finn表示，過戶代理機構負責維護正式的股票所有權紀錄。他認為，將這項功能納入內部，有助於降低企業從私人持有走向公開上市過程中對外部服務商的依賴。這是主管對收購效益的預期，尚不能視為已完成技術整合或已實現成本節省。</p><aside>編輯觀察：這筆交易的技術焦點是股權紀錄基礎設施。將過戶代理功能內部化能否減少對外部供應商的依賴，仍有待後續整合結果檢驗。</aside><p><a href="https://www.bloomberg.com/news/videos/2026-11-09/morgan-stanley-wealth-mgmt-head-on-vinyl-equity-deal-video">Bloomberg Technology</a></p><ul></ul></article><article><h2>YouTube將於2027年恢復提供Billboard串流資料，免費收聽權重提高</h2><p>YouTube將於2027年恢復向Billboard提供串流資料，結束雙方對音樂串流榜單計算方式的分歧。這項安排是在Billboard調整公式、提高廣告支持串流的相對權重後宣布，目前仍是預定於明年恢復，並非資料已重新納入榜單。

雙方爭議始於2025年12月，當時YouTube宣布將停止分享串流資料，主張榜單過度偏重付費訂閱，未充分反映免費、觀看廣告的聽眾參與。YouTube全球音樂主管Lyor Cohen當時也批評，原有公式無法反映當代樂迷的收聽方式；這是平台對計算規則的立場。

依原本公式，計算專輯消費單位時，1,000次付費串流相當於2,500次廣告支持串流；新制則調整為1,000次付費串流相當於1,500次廣告支持串流。付費收聽的權重仍然較高，但兩者差距縮小。YouTube恢復資料合作後，平台上的相關收聽活動將可重新反映於榜單；個別藝人的排名會如何變動，仍不能由這次規則調整直接推定。</p><aside>編輯觀察：這次協議的關鍵不只是資料回流，也在於榜單如何衡量付費與免費收聽。新公式縮小兩者權重差距，但不代表兩種收聽已被等值計算。</aside><p><a href="https://techcrunch.com/2026/11/09/youtube-streaming-data-returns-to-billboard-charts-ending-major-disagreement/">TechCrunch</a></p><ul></ul></article></main></noscript>
