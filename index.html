  <noscript><main><h1>人工智慧商業布局、開發工具與技術風險動態</h1><p>2026-11-11 科技早報</p><article><h2>輝達董事會委任律師調查黃仁勳，晶片流向爭議延燒</h2><p>輝達董事會針對執行長黃仁勳展開的調查有新進展。彭博報導，獨立董事已聘請前美國聯邦檢察官協助調查；紐約時報則指出，調查由Wachtell Lipton合夥人Joon H. Kim主導。事件同時牽動市場信心與人工智慧晶片出口管制爭議，但相關情報身分及違規指控尚不能視為定論。

中央社報導，輝達11月10日在格林威治標準時間17時15分左右，股價下跌6.3%至167.35美元。自黃仁勳前一個週末承認婚外情後，公司市值已縮水超過4,000億美元，全球市值排名降至第三，落後蘋果與微軟；上述股價為盤中數字，並非收盤結果。

晶片流向方面，中央社轉述The Information的報導指稱，與黃仁勳有關係的女商人利用企業網絡及與輝達、經銷商的關係，協助約24萬顆H100、H200及部分A100晶片運入中國，涉及價值至少75億美元。報導並將上海世紀利通、Megaspeed及其馬來西亞子公司Speedmatrix列為相關企業網絡的一部分。這些內容仍屬媒體提出的指控，不能據此認定違反出口管制。

德國之聲報導，Megaspeed因涉嫌將輝達晶片走私至中國而在美國接受調查，公司否認走私指控。金融時報另報導，Megaspeed尚未被列入美國商務部的實體清單；調查與是否列入貿易限制名單，是不同的程序狀態。

中央社取得的報導也載明，路透社無法獨立查證The Information的內容，輝達未立即回應置評請求。董事會調查、晶片流向指控與市場價格變動應分開看待，目前不能將股價下跌當作違規情事成立的證據。</p><aside>編輯觀察：此案的科技產業焦點在於董事會監督與受管制晶片的供應鏈流向。判斷後續影響，應以調查結果及監管措施為依據，而非私人關係細節或短期股價反應。</aside><p><a href="https://www.nytimes.com/2026/11/10/business/nvidia-wachtell-lipton-jensen-huang.html">NYT</a></p><ul><li><a href="https://www.bloomberg.com/news/articles/2026-11-10/nvidia-board-members-tap-wachtell-lipton-to-probe-ceo-affair">Bloomberg Technology</a></li><li><a href="https://www.cna.com.tw/news/afe/202611110005.aspx">中央社財經</a></li><li><a href="https://www.dw.com/en/megaspeed-and-the-battle-to-go-high-end-nvidia-chips-into-china/a-79909129?maca=en-rss-en-all-1573-rdf">Deutsche Welle</a></li><li><a href="https://www.ft.com/content/afb6c960-a910-4d67-9588-73ba3bea5b06?syn-25a6b1a6=1">Financial Times</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611100372.aspx">中央社國際</a></li></ul></article><article><h2>Anthropic公布IPO價格區間，完全稀釋估值最高達1.404兆美元</h2><p>Anthropic公布首次公開募股（IPO）暫定價格區間，每股70至78美元，預計出售8億2,500萬股A類股，發售金額約577.5億至643.5億美元。依價格上限計算，完全稀釋估值可達1.404兆美元；這是發行計畫的估算，並非已完成募資或上市後市值。

估值口徑是理解這筆交易的關鍵。中央社報導，約1.4兆美元的數字納入股票選擇權、限制型股票等證券；若不計這些證券，以未稀釋股數計算，市值約為1兆美元。此次估值也低於先前市場曾預期的最高2兆美元，上市案將考驗投資人在人工智慧相關類股波動下，願意接受的價格。

公開發行之外，Anthropic表示已達成另一筆260億美元私募協議，將按IPO價格向Google、輝達、超微、博通、美光、微軟及台積電出售無投票權的N類股。TechCrunch報導，Google與輝達各擬投入100億美元；紐約時報也報導輝達的投資計畫。這些安排應與公開發行金額分開理解，不能直接當作已入帳資金。

七名共同創辦人各計畫出售337萬8,378股，若以區間中點74美元計算，每人售股金額約2.5億美元，實際所得仍取決於最終定價及交易完成情況。創辦人透過具特殊投票權的F類股維持多數表決權，一般A類股投資人的治理影響力有限。公司預計最多將兩成發售股份分配給散戶；彭博另報導，澳洲散戶也可參與此次IPO。

募資規模之外，申報文件揭露的營運數字同樣值得關注。據TechCrunch報導，公司第三季營收為170億美元，前九個月營收332億美元、淨損1,040億美元，運算與基礎設施承諾支出達9,009億美元。營收成長並不等於已實現獲利，投資人仍須衡量業務擴張與龐大資金承諾之間的關係。</p><aside>編輯觀察：這次發行同時涉及模型公司的資金需求、科技業投資人的持股布局與散戶參與。評估交易時，必須區分估值、發售金額、私募資金及創辦人售股所得，避免將不同口徑混為一談。</aside><p><a href="https://techcrunch.com/2026/11/10/anthropic-sets-ipo-price-range-of-70-to-78-per-share-to-reach-an-implied-valuation-of-1-404-trillion/">TechCrunch AI</a></p><ul><li><a href="https://www.ft.com/content/5654e210-4be3-4550-b975-129c9a2e7fe5?syn-25a6b1a6=1">FT Markets</a></li><li><a href="https://techcrunch.com/2026/11/10/all-7-anthropic-founders-will-each-cash-out-about-250m-in-ipo/">TechCrunch AI</a></li><li><a href="https://www.nytimes.com/2026/11/10/business/anthropic-ipo-nvidia.html">NYT</a></li><li><a href="https://www.bloomberg.com/news/articles/2026-11-10/anthropic-lodges-australian-prospectus-opening-ipo-to-retail">Bloomberg Markets</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611100361.aspx">中央社財經</a></li></ul></article><article><h2>彭博：OpenAI單季營收首度達100億美元</h2><p>OpenAI截至9月的三個月營收首度達到100億美元。彭博引述一名知情人士報導，成長動能來自市場對其最新人工智慧軟體的強勁需求。

這項數字反映OpenAI軟體業務的營收規模，但報導所提供的資訊未涉及成本或獲利，不能據此判定公司已實現獲利。</p><aside>編輯觀察：單季營收跨越100億美元，是觀察人工智慧軟體商業化規模的一項指標；要評估商業模式的可持續性，仍需成本與獲利等資訊。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/openai-third-quarter-revenue-soars-nearly-50-to-10-billion">Bloomberg Technology</a></p><ul></ul></article><article><h2>CoreWeave 季度業績優於預期、上調全年展望，後續籌資仍受關注</h2><p>人工智慧算力供應商 CoreWeave 季度業績優於分析師預期，並上調全年展望，緩解投資人對這家背負債務的公司可能面臨業務放緩的疑慮。

不過，業績改善與後續資金需求仍是兩個不同的觀察面向。D.A Davidson 科技研究主管 Gil Luria 在 Bloomberg 節目中肯定這次業績，並表示算力供給仍不足；但他也認為，CoreWeave 若要持續營運，進一步籌措資金將面臨困難。這項籌資判斷屬於分析師評論，並非公司已宣布的融資結果。</p><aside>編輯觀察：單季業績與上調展望提供營運面的正面訊號，但不能直接回答後續資金是否充足，也不足以推論整體人工智慧算力產業已排除放緩風險。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/coreweave-boosts-annual-forecast-easing-concerns-about-slowdown">Bloomberg Technology</a></p><ul><li><a href="https://www.bloomberg.com/news/videos/2026-11-10/coreweave-earnings-top-estimates-boosts-annual-forecast-video">Bloomberg Technology</a></li></ul></article><article><h2>紐約州開放大型 AI 開發商註冊，RAISE Act 將要求72小時內通報重大事件</h2><p>紐約州已開放大型前沿人工智慧開發商的註冊入口，為2027年初實施的 RAISE Act 建立執行機制。Anthropic、OpenAI 等受規範業者最遲須於2027年1月1日完成註冊，後續也將承擔安全措施與模型資訊的公開義務。

法規要求年營收超過5億美元的大型前沿人工智慧開發商，在網站公布安全框架、於重大安全事件發生後72小時內通報，並發布公開的模型透明度報告。監管要求因此不只涉及事前揭露，也涵蓋模型運作期間的事件通報。

新成立的 DIGIT 辦公室將負責執行 RAISE Act，並監督大型前沿人工智慧實驗室。單次違規最高可罰100萬美元，後續違規最高可罰300萬美元。州政府也能對未完成註冊的公司採取執法行動，但發言人未說明具體做法。

州長 Kathy Hochul 同時宣布成立設於 Binghamton University 的人工智慧責任與研究中心。該中心將獨立評估先進人工智慧系統的安全性、資安與運作情形，並與 DIGIT 合作審查企業的安全框架，使企業揭露、安全評估與政府監督形成相互連結的制度安排。</p><aside>編輯觀察：對適用業者而言，合規工作不只是完成註冊，還包括持續公開安全框架、準備透明度報告，以及建立能在72小時內處理重大安全事件的通報流程。</aside><p><a href="https://techcrunch.com/2026/11/10/openai-anthropic-face-new-oversight-as-new-yorks-ai-safety-law-takes-effect/">TechCrunch</a></p><ul></ul></article><article><h2>研究人員發現約3.5萬個 Grok Build 應用程式可被外部存取</h2><p>研究人員發現，約3.5萬個 Grok Build 應用程式處於對外開放狀態，任何找到這些應用程式的人都能存取，暴露出人工智慧開發工具的存取控制風險。</p><aside>編輯觀察：評估這類開發工具的風險，重點應放在存取控制與可能暴露的資料範圍，不能僅憑應用程式數量推定實際損害。</aside><p><a href="https://arstechnica.com/security/2026/11/grok-build-coding-agent-leaks-oodles-of-confidential-info-some-belonging-to-spacexsi/">Ars Technica</a></p><ul></ul></article><article><h2>N-able因零時差漏洞關閉雲端服務，籲自架N-Central客戶停用</h2><p>遠端存取服務商N-able在多項零時差漏洞遭公開後，關閉雲端託管的N-Central服務，並呼籲自行架設N-Central的客戶停用部署，以降低攻擊者利用已公開漏洞入侵企業網路的風險。

N-able表示，託管服務將在保護環境、執行必要修補期間維持離線，客戶在此期間無法使用N-Central。這項服務原本可讓企業遠端存取及管理同一網路內的其他裝置與系統，因此停服也直接影響客戶的遠端管理作業。

資安研究人員Ben Bales於週日在GitHub公開這批漏洞，並以Able2Shell稱呼。他表示，漏洞組合可被用來竊取憑證、建立新的管理員帳號，以及取得受影響系統的最高權限。這些是研究人員對漏洞能力的描述，不代表已確認有客戶遭到上述攻擊。

N-able表示，目前沒有證據顯示任何客戶環境遭成功利用漏洞入侵。不過，「沒有發現證據」並不等於已排除入侵；現有資訊也未釐清公司是否具備足夠紀錄，可完整查核客戶環境的利用情況。</p><aside>編輯觀察：這起事件同時涉及入侵風險與防護措施造成的服務中斷。對企業客戶而言，是否已遭攻擊，以及何時能安全恢復遠端管理，是兩個仍須分開確認的問題。</aside><p><a href="https://techcrunch.com/2026/11/10/n-able-takes-its-remote-access-service-offline-after-researcher-publishes-dozens-of-zero-day-bugs/">TechCrunch</a></p><ul></ul></article><article><h2>法國超市冷藏設備遭網攻、食品毀損，伊朗否認涉案指控</h2><p>法國超市冷藏設備遭網路攻擊，上月數百家超市的冷藏櫃與冷凍櫃溫度升高，導致數噸冷藏及冷凍食品毀損。事件顯示，網路攻擊的影響不只限於資料與資訊系統，也可能直接波及實體設備與食品保存。

法國指控IRGC涉案，並表示對回應措施不排除任何選項。伊朗則斷然否認，稱法方指控「毫無根據且片面」。目前取得的資料未交代具體入侵手法，也不足以獨立判定攻擊者身分，法方的責任歸屬說法仍須與設備受損、食品損失等事件資訊分開看待。</p><aside>編輯觀察：這起事件凸顯實體設備資安與營運損失的直接連結；但損失規模與攻擊歸屬是不同問題，不能以食品毀損的事實替代對攻擊者身分的證明。</aside><p><a href="https://www.dw.com/en/iran-denies-role-in-fridge-hack-france-summons-ambassador/a-79910206?maca=en-rss-en-world-4025-xml-mrss">DW World</a></p><ul><li><a href="https://www.bbc.co.uk/news/articles/cmg474vk6dyqo?at_medium=RSS&amp;at_campaign=rss">BBC World</a></li></ul></article><article><h2>DeepMind介紹AlphaProof Code，稱以300萬行證明驗證Signal核心加密</h2><p>Google DeepMind介紹AlphaProof Code，表示其人工智慧代理以Lean撰寫了300萬行證明，用於驗證Signal的核心加密。公司公布的工作聚焦於以證明驗證軟體，而非僅產生程式碼。

這項成果目前屬於DeepMind的自述。公布的驗證對象是Signal核心加密，不能據此推論Signal整體軟體均已通過安全稽核；300萬行則是公司宣稱的證明規模，並非獨立安全評測結果。</p><aside>編輯觀察：這項消息值得關注的方向，是人工智慧代理能否協助軟體驗證；判斷其實際價值，仍須區分證明的數量、涵蓋範圍與是否經過獨立檢驗。</aside><p><a href="https://deepmind.google/blog/introducing-alphaproof-code/">Google DeepMind</a></p><ul></ul></article><article><h2>PSI借助Anthropic模型提出量子運算難題解答，探索AI科研商業化</h2><p>新創研究實驗室Physical Superintelligence（PSI）借助提前取得的Anthropic Fable 5.2模型，提出一項懸而未決18年的量子運算問題解答。參與研究的David Turturean利用模型處理Aaronson-Ambainis猜想；這項進展也讓PSI以人工智慧解決科學問題的商業路線受到關注。

解答的可信度與人類能否理解，仍是不同層次的問題。提出猜想的研究者之一Scott Aaronson表示，自己尚未完全理解這份證明，但因證明已透過Lean語言自動形式化，加上PSI分享成果的研究團隊提供說明，他相信結果正確。這是研究者對成果的判斷，不能等同已完成獨立驗證或同儕審查。

PSI的做法不只依靠單一模型。執行長Matt Pines表示，研究系統還需要工具、記憶系統與模擬基礎設施，才能深入探索不同解法。公司目前的營收來自資料中心最佳化，透過工具模擬熱、電力、水與聲音等變數；長期目標則是把理論物理突破轉化為實際技術。

從計算結果走向現實應用，仍有另一道門檻。Pines指出，物理研究最終必須接受自然現象的檢驗，PSI正研究如何更有效率地以實驗驗證計算結果。團隊也曾在成果公開前與相關研究者交流，反映AI加速解題之際，成果說明、專家檢視與公開方式仍在摸索。</p><aside>編輯觀察：這起案例的觀察重點不只是模型能否提出解答，也包括研究者能否理解、驗證並轉化成果。PSI現有的資料中心業務與長期科研目標，呈現了AI科學探索走向商業應用的兩個不同階段。</aside><p><a href="https://techcrunch.com/2026/11/10/psi-is-trying-to-make-a-business-out-of-ai-driven-scientific-discovery/">TechCrunch AI</a></p><ul></ul></article><article><h2>DeepMind公布Gemini Robotics 2.5，同步推出開放安全評測</h2><p>DeepMind公布Gemini Robotics 2.5，以及名為ASIMOV-jailbreak的開放安全評測，將機器人模型更新與安全測試一併列為此次發布內容。

這次布局的主要差異，在於居家產品採飛行方式查看不同空間，企業產品則以地面巡邏及遠端互動為主。上述功能屬產品介紹，尚不能據此判定實際巡查涵蓋率、警報判讀品質或保全成效。</p><aside>編輯觀察：Ring把既有保全裝置與移動攝影設備結合，顯示其產品布局正從定點監看延伸至巡邏服務。移動能力能否帶來可靠的保全價值，仍需實際使用與測試結果支持。</aside><p><a href="https://techcrunch.com/2026/11/10/ring-known-for-its-doorbell-cameras-launches-a-home-security-drone-and-an-enterprise-security-robot/">TechCrunch AI</a></p><ul></ul></article><article><h2>Google新增兩款TPU，分攻機密模型運算與高記憶體需求</h2><p>Google擴充自家人工智慧晶片產品線，推出TPU 8tx與TPU 8i Max，分別面向機密模型訓練、推論，以及需要更大記憶體容量的工作負載。TechCrunch報導，兩款新品都是Google今年4月介紹的第八代TPU延伸版本，也反映其雲端業務降低對外部晶片供應商依賴的方向。

Google另稱，TPU 8tx具備客製化推論網路，可在訓練同時執行推理，支援即時蒸餾與訓練小型模型。公司提出的應用情境，是企業利用自有資料訓練模型時，不必在不同裝置間搬移資料；這是Google對產品用途的說明，並非獨立安全驗證結果。

介面頂端以一句話整理近期觀看活動，下方分成「有興趣」與「不感興趣」兩份清單。前者預先填入從過往活動推估的興趣，後者納入使用者明確拒絕、關閉或隱藏的主題；使用者可以新增、移動或刪除項目。兩個內容版位讀取同一份偏好儲存資料，使頁面顯示的設定與排序使用的設定一致。

對新增興趣，系統會主動尋找相關候選內容，再透過排序提高曝光機會；同時安排推薦間隔、限制各興趣每日占比，避免單一主題占滿畫面。對不感興趣的項目，則在多個階段採取過濾、降權及最終檢查。減少人工智慧生成內容等品質要求，會對應專門的降權訊號，而不是只比對主題。

大型語言模型在其中分擔不同任務，包括產生初始興趣與近期活動描述、檢查新增偏好是否合理及重複，以及在排序後移除符合排除條件的內容。Meta另設完整性與安全檢查元件，並非僅由語言模型判定。為處理設定變更前已備妥的推薦，系統也會額外擷取新內容，或在裝置端移除符合排除條件的快取項目。

上述透明度與回應能力的改善，仍屬Meta對系統的說明。公司也承認，如何解讀模糊輸入、讓推薦更精確回應要求，仍有改善空間。</p><aside>編輯觀察：推薦控制的關鍵不只在於能否輸入偏好，也在於設定是否真正進入排序流程，以及能否清除已排定的內容。這套設計提供了檢視使用者控制權的具體切入點，但不能直接等同於完整掌控推薦結果。</aside><p><a href="https://engineering.fb.com/2026/11/10/ml-applications/your-algorithm-giving-people-more-ways-to-personalize-facebook-recommendations/">Meta Engineering</a></p><ul></ul></article><article><h2>AWS整理AgentCore代理評估方法，從任務完成到個資外洩分項檢查</h2><p>AWS發布Amazon Bedrock AgentCore代理評估技術指南，說明如何搭配內建評估器、DeepEval與AutoEval，檢查代理是否完成任務、在多輪對話中遺漏要求，或洩漏個人資料。指南的重點不是選出單一最高分，而是先定義業務目標，再把目標拆成可觀察、可分別評估的行為。

依AWS介紹，內建評估器涵蓋回答品質、任務完成、工具與技能使用，以及安全性；DeepEval提供對話完整性、知識保留與個資外洩等檢查；AutoEval則提供惡意輸出、錯判任務無法完成等訊號。開發團隊也能以既有評估器為基礎，更換評判模型、提示或評分規則。

對於可能各自出錯的條件，指南建議不要只看混合總分。例如客服回答即使解決問題，仍可能違反資料政策。自訂多維度評估器可在同一次模型判讀中，分別回傳各項結果；但若指標需要不同模型、不同評估層級，或只有部分項目需要標準答案，就應拆開處理。

執行方式包括開發除錯時的隨選評估、抽樣正式流量的線上評估，以及針對固定資料集的批次評估。需要標準答案或預期工具路徑的檢查，則限於批次模式。AWS建議先選兩、三項最能反映業務成果的行為，再依實際發現的失敗情境增加指標，而非一開始就堆滿評分項目。</p><aside>編輯觀察：這份指南的實務價值在於把「代理能運作」與「代理符合業務要求」分開，也提醒團隊不能用任務完成率掩蓋個資或合規問題；評估器本身的效果仍須另行驗證。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/the-agent-evaluation-playbook-built-in-deepeval-and-autoeval-on-agentcore/">AWS Machine Learning</a></p><ul></ul></article><article><h2>TCS以多代理串接金融業測試流程，內部基準測試稱工時減少88%</h2><p>TCS以Amazon Bedrock AgentCore建立測試協調系統，將金融服務與保險客戶的需求文件轉成測試情境、程式碼及執行報告。TCS表示，系統已用於客戶正式環境；在約100個測試情境的受控內部比較中，工程投入由約200小時降至約24小時，減少88%。這項數字僅代表該次比較，實際結果會隨工作負載、應用複雜度與團隊而異。

平台可接收Jira需求、業務需求文件、Swagger規格及GitLab原始碼等輸入，產生Gherkin功能檔與可執行的Java或Python測試。工作由專責代理分工，涵蓋情境生成、對話修訂、需求轉換、增量更新與測試執行，而不是交給單一大型提示一次完成。

為避免不同客戶的資料混用，架構採共享運算、隔離資料與身分的方式，每個租戶配置自己的使用者集區、金鑰、儲存空間、資料表與知識庫。代理檢索專案內容前，也會依租戶、專案與工作階段篩選。API測試與瀏覽器介面測試則分流到不同執行環境。

自動修正流程設有固定步驟與重試上限。只有判定為程式錯誤、且符合重試政策的失敗，才會交給修正代理；連線或驗證等環境問題不會送去改碼，安全檢查也會拒絕空白檔案、非預期新增檔案或檔案大小劇烈變動。TCS將品質工程師的角色定位為審查及治理AI產出，保留風險分析、探索式測試與發布決策工作。</p><aside>編輯觀察：此案例值得關注的是需求、生成、執行與修正之間的控制設計，而不只是節省工時的百分比。租戶隔離、有限重試及錯誤分類，都是判斷類似系統能否納入受管制測試流程的重要檢查點。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/how-tcs-built-an-agentic-test-orchestrator-with-amazon-bedrock-agentcore/">AWS Machine Learning</a></p><ul></ul></article><article><h2>Trovata將AI代理嵌入企業資金管理，以角色權限限制操作範圍</h2><p>Trovata以Amazon Bedrock與Amazon Bedrock AgentCore建立企業資金管理代理，將自然語言查詢、現金流預測與異常監控整合進既有平台。依Trovata與AWS介紹，這套設計不只提供問答，而是讓代理依排程、觸發事件或規則持續監看資料、解釋差異並傳送更新。

爭議焦點是連接資料中心伺服器、路由器與交換器的光纖收發器，部分資料中心需要數以百萬計的這類零件。限制構想涉及對資料竊取、惡意軟體及服務中斷的安全疑慮；業界則主張，供應受阻可能拖慢資料中心建置。兩名消息人士表示，微軟曾於9月與白宮科技政策辦公室及國家安全會議官員會面，示警供應鏈挑戰。

替代供應能力是另一項爭點。Counterpoint Research估計，中國企業占全球光纖收發器市場約三分之二；美國創新基金會的報告則指出，Coherent與Lumentum雖有可競爭的技術，產能規模仍不足以取代中國供應商。這些資料呈現業者對供應中斷的擔憂，但不代表禁令必然造成建置停擺。

Diraq創辦人祖拉克認為，新世代AI面對的部分問題更適合交由量子運算處理，並預期量子運算可在5年內為資料中心分擔負荷。他也提出分子行為計算、製藥、電池及化學工業等潛在用途；這些都是對技術應用的預期，並非此次實地測試已交付的成果。

Diraq也是全球六家進入美國國防先進研究計畫局「量子基準測試計畫」第3階段的企業之一。該計畫尋求量子電腦能在2033年底前，以符合成本效益的方式解決實際問題。相較於進入測試階段，能否在具體工作上同時達成實用性與成本效益，仍是後續需要驗證的關鍵。</p><aside>編輯觀察：單一系統的功率數字，尚不足以證明量子運算比現有AI運算更節能；是否能完成可比較的實際工作，以及整體成本效益，才是判斷應用價值的重點。</aside><p><a href="https://www.cna.com.tw/news/ait/202611100352.aspx">中央社科技</a></p><ul></ul></article><article><h2>網攻考驗開放AI平台，Hugging Face主管警告參與門檻恐提高</h2><p>開放人工智慧平台如何在防堵攻擊時維持社群參與，正成為資安治理難題。Hugging Face政策長暨策略資深副總裁Irene Solaiman警告，讓業餘開發者也能自由貢獻的開放機制，加上平台持有的大量資料，同時使這些平台成為攻擊目標；安全壓力可能讓開源生態走向更嚴格的存取限制。

近期事件顯示，風險不只存在於開放社群。10月針對OpenCode的攻擊鎖定使用者的第三方API金鑰，並造成財務損失。AI基礎設施新創Fireworks也揭露，攻擊者取得部分客戶的模型權重、資料集及帳務資訊，公司在調查期間暫停部分自助式資料集功能。不過，這起事件不能直接歸因於平台的開放程度。

Solaiman表示，Hugging Face目前仍設法避免以限縮參與來換取安全，已加強監控與預防措施、更頻繁輪替管理員存取權杖，並採取更嚴格的網路控管。她也指出，持續維護監控工具需要成本，並非所有平台都能負擔。限制誰能上傳模型、加強身分驗證或事先審核開發者，則是可能出現的收緊方向，不代表Hugging Face已宣布實施。

安全與開放也不必然只能二選一。GitHub負責軟體供應鏈安全的工程師Zach Steindler認為，平台可以修補原有的不安全機制，並投資異常行為偵測與事件控制能力，而不必從根本上限制參與。兩人的觀點共同凸顯，防護措施如何設計，將影響獨立研究者與業餘開發者能否繼續參與開放社群。</p><aside>編輯觀察：值得觀察的不只是驗證門檻是否提高，而是平台能否以權限管理、異常偵測與事件控制降低風險，避免將防護成本轉化為社群參與障礙。</aside><p><a href="https://techcrunch.com/2026/11/10/cyberattacks-threaten-to-make-open-source-ai-a-little-less-open-hugging-face-exec-warns/">TechCrunch AI</a></p><ul></ul></article><article><h2>Proximal Ventures首支基金募得2,750萬美元，鎖定AI藥物開發服務</h2><p>Proximal Ventures為首支基金募集2,750萬美元，將投資以人工智慧改造藥物開發工具、基礎設施與服務的新創。創辦人Sahir Raoof曾任SignalFire投資人，這次以個人主導的創投基金切入製藥產業服務市場。

基金計畫投資種子前輪與種子輪公司，單筆投資規模為50萬至150萬美元，目前已投資七家新創。其中包括ChronicleBio，由前OpenAI主管Fidji Simo共同創辦，運用AI分析生物與醫療資料，目標是增進對慢性疾病的理解，並辨識潛在治療方式。

Raoof的投資論點不是只押注新藥本身，而是藥物開發過程中可由AI改造的外包工作。製藥公司長期向專業服務商採購化合物合成、量產製程規劃及臨床試驗資料分析等服務。他認為，AI可將其中許多工作自動化，讓新創以較低成本、更短時間提供服務；這仍是他的商業判斷，不能視為已證實的降本或研發成效。

Proximal的出資者包括SignalFire、Kleiner Perkins及Bertelsmann Healthcare Investments等機構。Raoof也曾在臨床試驗招募新創Iterative Health負責業務開發，並在腫瘤資料公司Flatiron Health主管合作業務。他將協助新創建立早期客戶關係，視為投資之外的重要工作，反映這支基金同時著重技術應用與商業銷售能力。</p><aside>編輯觀察：這筆募資呈現一條不同於直接押注新藥的AI投資路徑：從製藥公司既有的服務採購需求切入。後續應觀察的是新創取得客戶與交付服務的能力，而非僅以募資金額判斷技術成效。</aside><p><a href="https://techcrunch.com/2026/11/10/proximal-ventures-raises-debut-fund-to-back-startups-bringing-ai-to-drug-development/">TechCrunch</a></p><ul></ul></article><article><h2>OpenAI收購AI旅遊新創Odessia，尚未公布旅遊產品計畫</h2><p>AI旅遊新創Odessia創辦人Francis Davidson宣布，公司已被OpenAI收購，他也已加入OpenAI，投入旅遊相關工作。OpenAI發言人向TechCrunch確認Davidson加入，但未進一步說明旅遊產品規畫，交易條件也未公開。

Odessia成立約一年，曾完成由Sequoia領投的600萬美元種子前輪募資，約五個月前推出AI旅遊代理工具。Davidson在宣布交易時，著重介紹自己如何指揮多組AI代理打造產品；這項工具目前已關閉。

Davidson曾於2014年就讀大學期間創辦旅遊新創Sonder，業務聚焦全球主要城市的高級公寓短期租賃。他於2025年6月宣布辭去執行長職務。這段創業經歷提供了他在旅遊產業的背景，但不能據此推定Odessia收購案的具體整合方向。

OpenAI表示，旅遊是聊天機器人使用者經常詢問的領域之一，但尚未宣布新的旅遊專用產品或計畫。目前能確認的進展，是Davidson披露收購，以及OpenAI確認他已加入；至於交易金額、Odessia技術將如何運用，或是否推出訂房服務，都沒有具體資訊。</p><aside>編輯觀察：這起交易顯示OpenAI延攬旅遊領域創業者的動作，但人員加入與產品推出仍是不同層次的進展，不宜把收購直接解讀為即將提供訂房或完整旅遊代理服務。</aside><p><a href="https://techcrunch.com/2026/11/10/openai-acquires-odessia-travel-startup-created-by-sonder-founder/">TechCrunch</a></p><ul></ul></article></main></noscript>
