  <noscript><main><h1>國際條約與司法進展、金融市場波動及公共政策焦點</h1><p>2026-11-25 時事焦點</p><article><h2>澳洲與索羅門群島簽全面性條約　重申不設外國軍事基地</h2><p>澳洲與索羅門群島11月25日簽署全面性條約，重申索國境內不設任何外國軍事或安全基地，敏感基礎設施也將維持非軍事化，不受外國干預，並禁止未經授權的使用。條約確立兩國安全合作方向，但索國與中國既有安全協議的狀態，仍待釐清。

索國總理瓦爾率15名部長訪問澳洲，雙方就安全、基礎建設、教育及衛生等領域會談，並正式簽署條約。兩國聯合聲明表示，將推動經濟、發展與安全領域的共同優先事項，並稱條約有助澳洲、索國及區域的安全與繁榮。

瓦爾自5月當選總理後，陸續前往坎培拉與華盛頓，重建與傳統夥伴的關係。有報導指他已透過提前6個月通知，終止索國與北京的秘密安全協議；但瓦爾25日僅表示，與中國的討論「仍在進行中」，並以協議保密條款為由拒絕進一步說明，未確認終止協議的說法。

中國外交部24日表示，中國與太平洋島國的關係不搞地緣博弈或集團對抗。索國前總理、現任反對黨領袖蘇嘉瓦瑞則批評，政府在對中安全協議狀態仍不明朗時，加速推進與澳洲的條約。新條約中的基地與基礎設施承諾已明確寫出，但不能據此認定索國對中安全協議已經終止。</p><p><a href="https://www.cna.com.tw/news/aopl/202611250034.aspx">中央社國際</a></p><ul></ul></article><article><h2>烏克蘭無人艇攻擊利比亞班加西港　俄軍艦沉沒、貨船遇襲</h2><p>烏克蘭海上無人艇11月22日攻擊停泊在利比亞班加西港的俄羅斯艦船，俄軍飛彈護衛艦Merkury遭至少兩艘無人艇擊中後沉沒，同行的俄羅斯貨船MV Angara也遭到攻擊。這起行動將烏克蘭對俄羅斯艦船的打擊延伸至北非港口。

烏克蘭安全局表示，行動使用7艘由母船釋放的海上無人艇，以Merkury為目標。烏克蘭總統澤倫斯基公布的影片顯示，無人艇接近已燃燒的俄軍艦與貨船，隨後在船身附近爆炸。澤倫斯基另稱，Merkury搭載的一架Ka-27作戰直升機也被摧毀。

貨船的用途與人員損失仍須區分各方說法。澤倫斯基稱，MV Angara正在運送武器；利比亞國民軍官員則表示，攻擊造成至少10人傷亡，包括利比亞與俄羅斯籍人士，部分俄軍艦上的傷員已送往當地醫院。這項傷亡數字並非死亡人數。

Merkury屬俄羅斯20380型飛彈護衛艦，可搭載反艦及防空飛彈，也配有反潛魚雷與艦砲。班加西目前由利比亞國民軍控制，俄羅斯向該組織提供物資支援；該組織與設於的黎波里、獲國際承認的利比亞政府交戰。此次攻擊發生於這一背景下，但貨船所載物資與直升機損失，仍屬烏方公布的說法。</p><p><a href="https://arstechnica.com/gadgets/2026/11/ukraines-sea-drones-blow-up-russian-warship-in-benghazi-operation/">Ars Technica</a></p><ul></ul></article><article><h2>美陪審團裁定華為10項罪名成立　組織犯罪共謀罪不成立</h2><p>美國紐約布魯克林聯邦法院陪審團11月24日裁定，華為面臨的12項刑事罪名中，有10項成立，包括銀行詐欺、電信詐欺、違反制裁規定及共謀竊取商業機密；共謀妨礙司法與共謀從事組織犯罪兩項罪名則不成立。法官唐諾利預定於2027年9月14日宣判，目前刑罰尚未確定。

華為律師赫伯利格表示，公司對有罪裁決感到失望，預期會提出上訴。他認為，現在評論可能罰款金額仍言之過早，但組織犯罪共謀罪獲判無罪，可能對罰款產生重大影響。陪審團此次作成的是罪名是否成立的裁決，並非已確定最終罰款。

案件源於華為在伊朗的業務及美國制裁規定。2018年起訴書指控，華為就伊朗業務誤導匯豐、渣打及法國巴黎銀行；檢方2020年再追加罪名，指控華為長期共謀竊取美國科技公司的商業機密。庭審中，檢方指稱華為以獎金鼓勵員工取得競爭對手資訊；辯方則主張，銀行知悉華為在伊朗的業務，並批評檢方選擇少數互不相關的事件，拼湊長期共謀的說法。

這場司法攻防始於2018年12月華為財務長孟晚舟依美國逮捕令在加拿大遭拘留。她之後與美方達成緩起訴協議並返回中國，對她的指控其後撤銷，也未在此次庭審中作證。華為本次遭裁定有罪，與孟晚舟個人案件的處理結果，應分別看待。</p><p><a href="https://www.cna.com.tw/news/aopl/202611250027.aspx">中央社國際</a></p><ul></ul></article><article><h2>美國傳最快本週公布補貼調查結果　多國關稅方案仍未定案</h2><p>美國可能再度調高對中國及其他多國的關稅。知情人士透露，美國貿易代表葛里爾預計最快本週公布一項歷時數月、針對中國、歐盟及其他14國產業補貼措施的調查結果，但公布時間仍可能變動，最終稅率與產品豁免安排也尚未確定。

依目前披露的方案，中國、日本、韓國及歐盟成員國等可能面臨更高關稅，涵蓋其出口的大多數產品。鋼、鋁及汽車等部分工業產品可能獲排除，原因是這些產品已依另一項國家安全授權措施課稅。美國貿易代表署未予置評，白宮也未回應置評請求。

知情人士表示，已與川普政府達成貿易協議的經濟體，整體稅率可能依最高法院裁決前簽署的協議訂定，歐盟、日本及韓國可能適用15%或更低稅率；越南、印度等則可能依各自協議面臨較高稅率。中國的稅率也可能高於許多其他國家，但上述安排均非已公布的決定。

葛里爾先前主張，產業補貼與政府支持措施造成產能過剩，讓受調查經濟體的企業得以低價向全球市場大量銷售，損害美國生產商利益。知情人士另稱，新方案可能保留日後加稅條款，並可能疊加在7月公布、針對強迫勞動製品貿易問題的關稅之上；後者對60個經濟體設定10%至12.5%稅率，目前正面臨司法挑戰。</p><aside>編輯觀察：判讀這波關稅動向，必須區分調查結果、既有貿易協議與最終課稅公告；目前披露的方案，尚不能直接視為各國企業將適用的確定稅負。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611250002.aspx">中央社財經</a></p><ul></ul></article><article><h2>黃仁勳復職後國會追查政府角色　司法部長未詳述介入過程</h2><p>黃仁勳11月23日重返輝達執行長職位後，美國國會的追查焦點進一步延伸至川普政府在復職決策中的角色。黃仁勳預定12月1日接受眾議院3個委員會的閉門約談，12月3日赴參議院銀行委員會公開作證；兩黨議員並持續要求釐清晶片出口管制與公司治理問題。

輝達表示，董事會取得美國政府高層意見後，一致通過黃仁勳復職，並認為他不構成國安風險。川普也公開表示曾親自與董事會溝通。不過，黃仁勳24日在全體員工大會否認復職是川普施壓的結果，稱決定出自董事會對相關事實的評估。董事會則重申，委員會對他的調查仍將持續至得出最終結論。

司法部長布蘭希24日稱輝達是「良好企業公民」，但拒絕說明與川普的溝通內容，也未明確回答黃仁勳是否曾接受調查。他表示，若掌握黃仁勳涉及犯罪的資訊，就會據實告知總統，但情況並非如此。這項說法與川普所稱黃仁勳經調查證明清白，仍須區分，不能據此認定所有相關調查均已結束。

國會方面，民主黨參議院領袖舒默指控黃仁勳違反出口管制法，共和黨參議員柯頓則表示，輝達與Megaspeed的爭議不會因復職而結束。眾議院4個委員會的民主黨首席要求白宮交出與輝達董事會的通訊紀錄。美國政府已將Megaspeed列入貿易黑名單，並調查其是否非法轉運晶片至中國；該公司表示遵守適用法律。出口違法與相關間諜疑雲，目前仍屬指控或調查事項。

黃仁勳在員工大會承認違反公司行為準則並道歉，表示將接受360度績效評估。他仍主張，輝達因商業模式及領導團隊配置，無須像一般組織制定接班計畫。TechCrunch的報導也將接班問題列為治理焦點。除國會審查外，已披露的調查還涉及反壟斷、會計作業及加州法律等不同面向，不能以復職決定取代各案結論。</p><aside>編輯觀察：董事會的人事決定、行政部門提供的意見與司法調查，是不同層次的程序。後續審查的關鍵，在於復職依據能否被說明，以及出口管制與公司治理問題能否各自獲得查證。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611250036.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611250015.aspx">中央社國際</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611250021.aspx">中央社國際</a></li><li><a href="https://www.cna.com.tw/news/ait/202611240062.aspx">中央社科技</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611250012.aspx">中央社財經</a></li><li><a href="https://techcrunch.com/2026/11/24/jensen-huang-still-thinks-a-succession-plan-creates-unnecessary-hierarchy/">TechCrunch AI</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611250028.aspx">中央社國際</a></li></ul></article><article><h2>費半收跌7.88%後台股早盤挫逾2000點　失守4萬點與年線</h2><p>美國半導體股24日大幅回落後，台股25日早盤一度下跌2061.3點，低見38061.05點，失守4萬點關卡，也跌破約39554點的年線。其後跌勢略為收斂，指數回到38600點附近、跌幅約1500點；上述均為早盤行情，並非當日收盤結果。

美股24日收盤表現分歧，費城半導體指數重挫7.88%，收8832.50點；那斯達克指數下跌1.48%，標準普爾500指數下跌0.50%，道瓊工業指數則上漲0.85%，收50018.70點。輝達下跌5.86%，收155.38美元，台積電ADR下跌3.96%；台指期夜盤也下挫1842點。

台股前一交易日才大漲3310.46點，以40122.35點作收，創歷史收盤最大漲點，但成交值4194.05億元，為今年新低。25日早盤，台積電一度跌140元至2090元，跌幅6.28%；聯發科下挫175元至3875元，鴻海跌16.5元至210元。台達電相對強勢，盤中最高上漲30元至1115元。

這波震盪發生在市場對AI熱潮前景仍有疑慮、美國新關稅措施存在不確定性之際。美股24日開盤時，投資人也在等待本週將公布的美國通膨數據。台灣方面，證交所已自24日起將信用交易擔保維持率最低標準由130%降至120%；金管會表示，後續將觀察擔保維持率與追繳戶數是否恢復正常，再依情況調回130%。</p><aside>編輯觀察：台股在單日大幅反彈後迅速回落，顯示前一日漲勢尚未代表行情穩定。判讀時也應區分美股各指數的分歧，以及台股盤中低點與最終收盤，避免把短時間波動當成完整交易日結論。</aside><p><a href="https://www.cna.com.tw/news/afe/202611250031.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611250020.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/afe/202611250011.aspx">中央社財經</a></li><li><a href="https://www.cna.com.tw/news/afe/202611240323.aspx">中央社財經</a></li></ul></article><article><h2>美國今年麻疹病例逼近6000例　截至11月24日累計14人死亡</h2><p>美國麻疹疫情持續擴散，截至11月24日的報導統計，今年病例已接近6000例，為1991年以來最高，累計14人死亡、近650人住院。全美已有47個州及轄區通報病例，今年發生的43起群聚疫情占總病例數96%。

賓夕法尼亞州截至11月23日累計1638例，為病例最多的州；州衛生部門當天確認第9起死亡個案，死者是未接種疫苗的中央郡居民。威斯康辛州則於24日通報第3起麻疹死亡，死者為拉法葉郡一名成人；該州先前兩名死者分別為嬰兒及兒童。

各州疫情走勢有所不同。賓夕法尼亞州的疫情曲線看似已過高峰，威斯康辛州則仍處於疫情之中，截至24日累計920例，其中88例是在11月20日之後通報，11月以來已累計418例。

疫苗接種率是疫情防控的重要環節。報導所列資料顯示，2025至2026學年美國幼兒園兒童的麻疹、腮腺炎及德國麻疹混合疫苗（MMR）接種率為92.4%，低於阻止麻疹在社區立足所需的95%門檻。全美僅10州達到或超過這項門檻，即使在這些州，仍有接種率不足的社區。</p><p><a href="https://arstechnica.com/health/2026/11/measles-death-toll-rises-to-14-as-national-case-tally-nears-6000/">Ars Technica</a></p><ul></ul></article><article><h2>地方選舉、公投11月28日投票　縣市長選舉人逾1957萬</h2><p>九合一選舉及全國性公民投票案第22案將於11月28日投票。中央選舉委員會11月24日公布，直轄市、縣市長選舉人共1957萬6028人，公投投票權人則有2000萬3835人，兩項人數分屬不同投票資格統計。

各類地方公職選舉的人數也不相同。直轄市、縣市議員選舉人為1948萬6232人；鄉鎮市長及直轄市山地原住民區長為504萬3956人；鄉鎮市民代表及直轄市山地原住民區民代表為503萬8121人；村里長則為1943萬9382人。六都市長選舉人以新北市343萬4625人最多，其次為台中市237萬6502人、高雄市230萬7917人。

此次第22案公投詢問選民，是否支持政府使用核電振興經濟，以廢除非核家園的能源政策。公投投票權人中，18至19歲共有40萬2980人，包括男性21萬130人、女性19萬2850人。

選務準備方面，中選會主委游盈隆24日前往台中市及彰化縣，視察選票印製、保管、投開票作業，以及原住民分赴兩地投票新制的執行情形。全國有31萬多名選務人員投入工作；游盈隆表示，希望各地開票作業能在28日午夜12時前完成，若能提前至晚間11時或更早結束更好。</p><p><a href="https://www.cna.com.tw/news/aipl/202611240290.aspx">中央社政治</a></p><ul></ul></article><article><h2>國防部：24小時偵獲9艘共艦、1架共機　國軍監控應處</h2><p>國防部11月25日公布共機艦動態，自11月24日上午6時至25日上午6時，偵獲9艘共艦及1架共機活動。

國防部表示，國軍運用任務機艦及岸置飛彈系統，嚴密監控與應處。</p><p><a href="https://www.cna.com.tw/news/aipl/202611250033.aspx">中央社政治</a></p><ul></ul></article><article><h2>卓榮泰宣布淡海科學城更名，首階段預計118年完成</h2><p>行政院長卓榮泰11月24日宣布，淡海科學城經檢討後，重新定名為「AI新基地．淡海智慧科技城」，將分階段推動。依他提出的規畫，第一階段預計民國118年完成，屆時供智慧製造、智慧物流、健康產業及海洋經濟相關供應鏈進駐。

卓榮泰當天傍晚在民進黨新北市長候選人蘇巧慧等人陪同下，前往八里開台天后宮參香。他表示，蘇巧慧建議在淡海科學城設置AI園區，行政院檢討後提出新的名稱與分階段推動方向，希望透過中央、地方合作，帶動八里及新北整體發展。相關時程與產業進駐仍屬政府規畫。

地方建設也是這次行程的焦點。蘇巧慧表示，八里過去因左岸觀光與十三行博物館成為北台灣重要觀光景點，但20多年過去，左岸需要翻新，交通也有新的需求。她將現階段定位為八里重新定位、強化基礎建設的契機，並強調會爭取中央資源落實地方建設。</p><p><a href="https://www.cna.com.tw/news/aipl/202611240294.aspx">中央社政治</a></p><ul></ul></article><article><h2>曠世智能公股投資遭質疑未退場，台企銀稱持續追蹤營運</h2><p>曠世智能獲政府投資引發的爭議，延伸至公股資金是否應評估退場。國民黨立法院黨團11月24日質疑，曾被視為投資考量的法人股東已出脫持股，公股資金卻仍未退出。台企銀董事長李嘉祥日前則表示，公司經營狀況逐步改善，去年開始獲利，銀行也持續追蹤營運。

國民黨團書記長許宇甄表示，依財政部提供的書面說明，台企銀創投2022年11月投資曠世智能，主要考量之一是其法人股東嘉實資訊。她指出，嘉實資訊2020年至2024年的財報都列有曠世智能股票，2025年卻已沒有持股，據此要求說明公股資金未退場的原因。

許宇甄另主張，蘇家當時以每股新台幣0.5元入股，國發基金以每股13元進場，如今股權價值降至3.8元，依相關作業要點應啟動退場評估。這些價格比較與退場義務，是國民黨團提出的質疑。曠世智能董事蘇巧純為民進黨新北市長候選人蘇巧慧的妹妹，相關投資也遭質疑涉及利益迴避問題。

李嘉祥日前在立法院說明，公司曾因經營環境變化、骨幹人力離職而面臨技術研發困難，但後續營運逐漸改善。國發基金則回應，投資審議皆依法辦理，已於民國115年5月26日及11月11日發布新聞稿，在符合法令與資訊保護規範的前提下，說明投資背景、審議程序及投後管理情形。</p><p><a href="https://www.cna.com.tw/news/aipl/202611240285.aspx">中央社政治</a></p><ul></ul></article><article><h2>黃國昌指控涉炒地，林國漳反駁並預告提告</h2><p>宜蘭縣長選戰出現土地投資爭議。台灣民眾黨主席黃國昌指控民進黨籍候選人林國漳涉及「新潮流炒地集團」，林國漳11月24日反駁，稱合法投資遭抹黑，將委由律師提告；國民黨籍候選人吳宗憲則要求他對外說明。

黃國昌前一天在臉書發文，以「拒絕新潮流炒地集團入主宜蘭」為題，聲稱宜蘭近年成為獵地集團的目標，並透過圖卡指控林國漳與相關集團的關係。林國漳表示，選戰進入倒數4天，對手陣營以「連連看」方式發動負面攻勢，從影片、布條到看板持續抹黑他的合法投資，因此將採取法律行動。

吳宗憲當天與新北市長侯友宜在宜蘭市車隊掃街前接受媒體聯訪，要求林國漳說清楚。不過，吳宗憲也表示，自己目前沒有黃國昌所提相關資料。他主張政治人物有接受檢驗的責任，不能只以遭抹黑或不隨之起舞回應。

林國漳則表示，將持續以正面、乾淨的選風及具體施政藍圖爭取支持。他此次對法律程序的表態是將委由律師提告，土地投資是否涉及不法，不能僅憑選戰中的指控認定。</p><p><a href="https://www.cna.com.tw/news/aipl/202611240261.aspx">中央社政治</a></p><ul></ul></article><article><h2>紐約州立法限制車用功能訂閱收費，2027年2月生效</h2><p>紐約州州長Kathy Hochul於2026年11月23日簽署法案，限制汽車業者將部分車用功能鎖在訂閱付費機制之後，新法預定2027年2月27日生效。規範焦點是使用車上預先安裝的零組件或硬體、且不產生持續成本的功能，並非所有車用訂閱服務一律禁止。

依報導所列內容，法案規範對象涵蓋汽車製造商、經銷商與第三方服務供應商，限制業者針對符合條件的功能加設訂閱服務或購車後費用。州政府發布的說明提及加熱座椅，也列出不會為業者帶來持續支出的進階導航、免手持駕駛及娛樂選項。Hochul主張，消費者不應為原本就應隨車提供的功能再次付費。

實際適用範圍的關鍵，在於如何認定「持續成本」。Ars Technica分析，加熱座椅與需要持續更新地圖、資料庫或軟體的服務，成本結構並不相同，後者可能仍有收取持續費用的空間。因此，新法雖對購車後再付費解鎖既有硬體功能設下限制，仍不能據此認定導航、駕駛輔助或車聯網服務都將免收訂閱費。</p><aside>編輯觀察：這項規範的核心，是區分已隨車購得的功能與需要持續投入成本的服務；兩者如何劃界，將影響消費者實際能免除哪些購車後費用。</aside><p><a href="https://arstechnica.com/cars/2026/11/new-york-says-no-more-subscriptions-for-in-car-features-or-does-it/">Ars Technica</a></p><ul></ul></article><article><h2>Kalshi暫停猶他州業務，預測市場監管權爭議持續</h2><p>預測市場平台Kalshi在未能透過法院阻止猶他州依賭博法執法後，決定暫停當地業務。公司發言人Jacki McGavick表示，這是一項艱難的決定，平台仍將持續在法院爭取，並希望在法律立場獲得支持後重返猶他州。

猶他州涉及Kalshi的多起訴訟仍在進行。平台曾向聯邦上訴法院要求，在上訴結果出爐前暫停相關案件，但未獲准。美國商品期貨交易委員會（CFTC）也提出緊急聲請，主張預測市場交易屬於該機關的專屬管轄範圍；截至報導時，聯邦地方法院尚未准許其阻止猶他州執法的要求。

爭議核心是聯邦市場監管與州賭博法之間的權限界線。猶他州檢察長Derek Brown指控Kalshi經營違反州憲法的「線上賭場」，並主張預測市場就是賭博；CFTC則主張應由聯邦機關專屬監管。這些分歧尚不能因平台暫停營運，就視為已有最終法律定論。

依Kalshi公布的數字，猶他州使用者超過17萬7,000人。McGavick稱，暫停業務對這些使用者而言是不幸的結果；不過，平台未向Ars Technica說明此次暫停對使用者或整體業務的具體影響。</p><aside>編輯觀察：暫停業務顯示，即使平台主張交易受聯邦監管，州政府的執法與法院是否提供暫時救濟，仍會直接影響服務能否繼續提供。</aside><p><a href="https://arstechnica.com/tech-policy/2026/11/kalshi-makes-difficult-decision-to-halt-utah-trading-after-losing-court-fights/">Ars Technica</a></p><ul></ul></article><article><h2>Tidal將禁完全由AI生成的音樂，12月9日起移除曲目</h2><p>音樂串流平台Tidal宣布，將自2026年12月9日起移除完全由人工智慧（AI）生成的音樂，並禁止個別上傳者與發行服務繼續提交這類作品。新政策並非排除所有使用AI工具的創作；平台表示，仍接受AI輔助、但保有人類創作元素的歌曲。

Tidal表示，過去90天新上傳曲目中，約43%完全由AI生成，是促使平台加強管制的重要原因。目前平台約有2,700萬首完全由AI生成的曲目，占整體曲庫6.3%；公司另預估，到年底累計移除量將超過2,900萬首。前者是目前曲庫數量，後者則是年底預估，並非同一時間點的統計。

平台先前已對完全由AI生成的歌曲採取標示與取消營利措施，但公司認為仍不足以遏止大量上傳。Tidal稱，這類曲目中有96%在過去90天沒有播放紀錄，且大量內容會使訂戶想尋找的音樂與創作者被淹沒。公司也表示，已因冒充藝人而移除約6萬6,000首曲目；冒充行為在此次政策更新前就已違規。

在執行層面，Tidal將拒收中繼資料標明完全由AI製作的歌曲，並預估新規上路後，每天會拒絕約8萬至8萬5,000首曲目。不過，公司尚未具體說明如何偵測AI音樂，辨識方式與執行成效仍有待觀察。相較之下，Spotify與YouTube Music目前採取標示AI生成內容的做法，顯示串流平台對同類內容正採取不同治理路線。</p><aside>編輯觀察：Tidal把治理方式從標示與取消營利推進到拒收、下架，關鍵不只在禁令本身，也在於能否可靠區分完全由AI生成與人類使用AI輔助的作品。</aside><p><a href="https://techcrunch.com/2026/11/24/tidal-to-ban-and-remove-millions-of-ai-generated-tracks-as-ai-slop-inundates-music-streaming/">TechCrunch AI</a></p><ul><li><a href="https://arstechnica.com/ai/2026/11/tidal-will-ban-fully-ai-generated-music-on-december-9/">Ars Technica</a></li></ul></article><article><h2>白宮擬提高Artemis年度化經費水準至98億美元，待國會處理</h2><p>白宮向美國國會提出預算例外項目，希望將NASA Artemis探月計畫的年度化經費水準，由2026會計年度約78億美元提高至98億美元。這是提高經費運作水準的要求，並非NASA已立即取得額外20億美元，仍須經國會處理。

這項要求出現在聯邦預算尚未定案之際。2027會計年度已於10月1日開始，但國會與白宮尚未達成預算協議，NASA等聯邦機關目前依臨時撥款決議運作。現行決議效期至12月11日，屆時須通過正式預算或另一份臨時決議，否則政府將面臨停擺。

白宮文件主張，Artemis需要增加整體經費，以免排擠科學等其他既有優先計畫。擬支援的工作包括加速供應鏈、運用NASA內部製造能力，以及更新太空衣、推進器、SLS相關硬體、棲地與太空人安全系統等技術能力。文件並警告，若缺少這筆經費，相關工作將延誤，無法趕上所需的運作時程。

NASA接下來的探月工作，仍涉及與SpaceX、Blue Origin完成載人月球登陸器開發，以及協助Axiom Space研製月球太空衣。供應鏈與測試問題是其中的挑戰；白宮也要求NASA建立並保留少量生產複雜零組件與大型組件的能力。這次提案反映加速探月的預算方向，但尚不代表相關研發瓶頸已獲解決。</p><p><a href="https://arstechnica.com/space/2026/11/nasa-may-get-2-billion-boost-as-white-house-seeks-to-accelerate-artemis/">Ars Technica</a></p><ul></ul></article><article><h2>廣西古人類牙齒研究：直立人在亞洲大陸存續更久，具雨林適應能力</h2><p>中國廣西兩處洞穴出土的古人類牙齒，為直立人在亞洲大陸的存續年代與生活環境提供新證據。研究團隊分析牙齒蛋白質與同位素後認為，直立人在當地活動的年代，比先前已知紀錄至少晚6萬年，且能在樹冠茂密的熱帶雨林中生存。

研究材料來自相距約15公里的Baxian與Naxian石灰岩洞穴。團隊共找到9顆古人類牙齒，其中5顆接受琺瑯質蛋白質及化學同位素分析；4顆的蛋白質明確指向直立人，另外4顆未接受這項蛋白質分析的牙齒，則由形態測量支持同一物種判定。依洞穴沉積物與骨骼定年，包覆化石的角礫岩約形成於32萬4,000至18萬4,000年前。

第5顆接受蛋白質分析的牙齒，物種歸屬仍不確定。它的蛋白質與形態不同於已知直立人，研究團隊推測可能屬於丹尼索瓦人，但蛋白質也未與已知丹尼索瓦人序列完全吻合。因此，兩者可能曾在相近區域活動，仍不能寫成已證實彼此互動或共同居住洞穴。

古人類與動物牙齒中的碳、氧同位素，共同指向當時溫暖潮濕、樹冠封閉的熱帶雨林環境。鍶同位素另顯示，部分直立人幼年時可能曾跨區移動，或食用來自不同地區的食物；部分訊號可與約250公里外的越南北部岩床相符，但不足以單獨確定遷移路線。

這些發現挑戰了直立人難以適應茂密雨林的既有看法。不過，研究團隊也保留範圍限制：這種適應能力是否僅見於中國南方較晚存續的族群，仍需其他遺址的同位素研究檢驗。</p><p><a href="https://arstechnica.com/science/2026/11/homo-erectus-lived-in-the-rainforest-alongside-denisovans/">Ars Technica</a></p><ul></ul></article><article><h2>野火煙霧影響啤酒花風味，研究指用量與投料時機是關鍵</h2><p>受到野火煙霧影響的啤酒花，是否仍能用來釀酒，取決於使用比例與加入製程的時機。奧勒岡州立大學研究團隊比較不同釀造方式後發現，受煙霧影響的啤酒花若用於發酵後的乾投製程，較容易帶來明顯煙燻異味；在麥汁煮沸時加入，感官評估結果則有所不同。

研究使用愛達荷州種植的Cascade啤酒花，在窯爐中以木質顆粒製造煙霧暴露條件，另設未經煙燻的對照組。團隊以不同比例混合兩類啤酒花，分別進行乾投與煮沸階段投料，再以氣相層析測量啤酒中的揮發性酚濃度，並由24人進行盲飲評估。研究刊於Journal of the American Society of Brewing Chemists。

結果顯示，乾投時使用的受煙霧影響啤酒花越多，揮發性酚濃度越高，品評者也感受到更強烈的煙燻氣味，以及肉味、藥味與人工烤肉風味。相較之下，在煮沸階段加入的實驗啤酒，感官上與未使用受煙霧影響啤酒花的對照啤酒幾乎無法區分；但揮發性酚濃度仍有增加，不能將風味差異不明顯解讀為相關化合物已被去除。

這項研究源於2020年奧勒岡野火後的原料問題。美國太平洋西北地區供應全美逾95%、全球約40%的啤酒花，煙霧造成的風味損害具有產業影響。不過，研究仍需重複驗證、確認混合比例，並測試田間仍在生長時受到煙霧影響的啤酒花，以及更廣泛消費者的接受程度；目前不宜把初步結果直接當成通用釀造配方。</p><p><a href="https://arstechnica.com/science/2026/11/how-brewers-can-protect-beers-from-smoke-tainted-hops/">Ars Technica</a></p><ul></ul></article><article><h2>Novartis執行長估AI可縮短藥物開發，平均12年降至8年</h2><p>人工智慧能否在十年內治癒重大疾病，製藥業與AI業界出現不同判斷。瑞士藥廠Novartis執行長、同時擔任Anthropic董事的Vas Narasimhan提出較審慎的預測：未來十年內，AI有望將藥物開發的平均時間從12年縮短至8年，但人類對生物機制的理解仍有限，漫長的動物與人體試驗依然必要。

模型之外，控制資訊存取、工具使用與行動方式的執行框架也會影響表現，部分模型在不同框架下的排名甚至逆轉。不過，這次並未在Muse、Dots或Claude Duet各自原生的執行框架內測試，因此結果不能直接視為這些消費產品的實際失敗率，也不宜外推至所有日常使用情境。</p><p><a href="https://techcrunch.com/2026/11/24/even-the-best-ai-agents-struggle-with-everyday-life/">TechCrunch AI</a></p><ul></ul></article><article><h2>MCP正式提供背景任務與補問功能，技能支援進入公開測試</h2><p>Anthropic擴充MCP協定，讓AI代理能把較長的工作交由伺服器在背景執行，也能在流程中暫停、向使用者詢問缺少的資訊。兩項功能Tasks與Elicitation已在10月公開測試後正式提供；技能支援仍處於公開測試階段，檔案上傳則尚待推出。

檔案上傳功能則是後續規畫。推出後，Claude將能把PDF、試算表與圖片等檔案直接傳給MCP伺服器。Anthropic計畫在Claude與Claude Code向Pro、Max、Ultra訂閱者，以及符合資格的Team與Enterprise客戶提供，但現有資料未列出確切上線日期。

Anthropic另宣稱，MCP開發工具套件每月下載量已超過7億次，Claude可用的MCP連接器超過1萬個。這些數字反映的是公司公布的下載與連接器規模，不能直接當作實際使用者人數，也不能據此判定新功能的可靠度。</p><p><a href="https://the-decoder.com/anthropic-tops-700-million-monthly-mcp-sdk-downloads-and-expands-the-protocol-for-more-autonomous-ai-agents/">The Decoder</a></p><ul></ul></article><article><h2>Claude Ship推出測試版，串接程式碼審查、修正與政策核准</h2><p>Anthropic推出Claude Ship測試版，主打將程式碼變更的審查、修正與核准串成自動化流程。這套工具結合既有的Code Review功能，以及新增的PR Steward、Claude Approvals兩個AI代理，依團隊設定的政策決定哪些變更可由AI核准、哪些仍須人工簽核。

依產品公布的運作方式，Code Review負責分析程式碼、找出錯誤；當測試失敗、變更發生衝突，或審查者留下修正意見時，PR Steward會接手修改，並記錄處理步驟。完成後，Claude Approvals會檢查專案目錄內的政策檔案，判斷例行變更是否符合自動核准條件。

全程不經人工介入的合併並非無條件執行。報導所述文件指出，必須啟用GitHub自動合併功能，並搭配相應政策，程式碼才可能在無人介入的情況下完成合併；是否需要人工簽核，仍取決於政策設定。

Claude Ship提供給Team與Enterprise方案使用，但須依token用量另外計費。PR Steward預設沒有支出上限，團隊可自行設定預算以控制費用。報導也指出，有特定資料隱私要求的組織無法使用這項功能，但所提供資料未進一步說明限制條件。</p><aside>編輯觀察：這項工具將自動化範圍從找出程式錯誤延伸到修改與核准。團隊評估時，重點不只在審查能力，也在政策如何界定人工簽核範圍，以及如何管理預設無支出上限的代理費用。</aside><p><a href="https://the-decoder.com/anthropics-claude-ship-lets-ai-agents-review-fix-and-approve-pull-requests-on-their-own/">The Decoder</a></p><ul></ul></article></main></noscript>
