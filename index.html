  <noscript><main><h1>人工智慧模型更新、基礎建設投資與技術風險動態</h1><p>2026-11-10 科技晚報</p><article><h2>Anthropic更新兩款Claude模型，宣稱速度最高提升30%、費用降20%</h2><p>Anthropic宣布推出Claude Fable 5.2與Claude Mythos 5.2，更新重點是加快運算並降低使用費用。公司表示，兩款模型相較前代的運作速度最高提升30%，尤其在編碼等複雜任務上更快，費用則降低20%；這些改善幅度屬於公司公布的說法。

兩款模型的定價均為每百萬輸入詞元8美元、每百萬輸出詞元40美元。雖然採用相同的底層模型，但用途有所區隔：Fable 5.2主打編碼、推理與人工智慧代理任務，Mythos 5.2則面向經核准的網路安全及生命科學研究。

開放對象也是這次更新的重要差異。Fable 5.2向所有使用者開放，Anthropic表示，其安全防護機制會阻擋多數網路安全與生物學相關任務；Mythos 5.2的這類限制較少，但僅供通過審核、從事網路安全或生物醫學研究的機構使用。

因此，兩款模型並非單純以價格或速度區分。一般使用者與研究機構可取得的版本不同，能執行的任務也受到不同限制；公司所稱的安全防護效果，仍不能視為獨立驗證結果。</p><aside>編輯觀察：評估這次更新時，除了公司宣稱的速度與價格改善，也應比較使用資格與任務限制；兩款模型共用底層技術，不代表使用者能取得相同能力。</aside><p><a href="https://www.cna.com.tw/news/ait/202611100087.aspx">中央社科技</a></p><ul></ul></article><article><h2>Anthropic傳最快週二啟動上市行銷，誤載募資數字的文件已撤回</h2><p>Anthropic持續推進首次公開發行計畫，最快週二啟動正式上市行銷，但申報文件失誤先引起市場注意。彭博報導，週一一份外流的公開說明書因文書錯誤，列出693億美元的募資目標，隨後遭撤回；該數字不能視為公司正式確定的募資規模。

上市時程與估值也仍有待確定。TechCrunch報導，Anthropic計畫本週提出估值區間，並於下週四或週五開始交易。部分機構投資人正爭取將估值壓低至1.5兆美元以下；1.5兆美元是上週仍在討論的目標，已低於數月前曾提出的2兆美元。

這些數字反映的是上市前的估值討論，而非最終發行定價。從文件撤回到投資人對估值的要求，現階段應區分公司上市安排、協商中的價格預期，以及曾在錯誤文件中出現的募資數字，不能混為已定案條件。

公司另規劃以直播說明上市案。彭博引述知情人士指出，共同創辦人兼執行長Dario Amodei預計與JPMorgan Chase執行長Jamie Dimon對談，討論Anthropic的首次公開發行；這項活動目前仍屬規劃中的安排。</p><aside>編輯觀察：這次上市可觀察投資人如何為人工智慧公司定價，但撤回文件中的募資數字與協商中的估值，都不能當作最終市場需求或成交結果。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/anthropic-seeks-to-raise-69-3-billion-via-its-ipo-reuters-says">Bloomberg Technology</a></p><ul><li><a href="https://www.bloomberg.com/news/videos/2026-11-10/anthropic-filing-misstep-adds-drama-ahead-of-ipo-video">Bloomberg Technology</a></li><li><a href="https://techcrunch.com/2026/11/09/anthropic-reportedly-plans-to-move-forward-with-ipo-plans/">TechCrunch AI</a></li><li><a href="https://www.bloomberg.com/news/videos/2026-11-10/anthropic-to-formally-market-ipo-after-filing-misstep-video">Bloomberg Technology</a></li><li><a href="https://www.bloomberg.com/news/articles/2026-11-10/anthropic-plans-ipo-live-stream-with-amodei-jpmorgan-ceo-dimon">Bloomberg Technology</a></li></ul></article><article><h2>Otter擴增27種語言支援，會議中自動切換語言轉錄功能待推出</h2><p>人工智慧筆記工具Otter宣布擴增27種語言支援，並預告可在同一場會議中跟隨發言者切換語言的轉錄功能。這波更新採分批推出，全部完成後，平台支援的語言將增至31種，並非所有新增語言與功能都已開放。

目前已有13種新增語言可用，包括華語、韓語、德語、義大利語、粵語、葡萄牙語、俄語、印尼語、馬來語、荷蘭語、土耳其語、越南語與波蘭語。另14種語言將陸續推出，其中包括阿拉伯語、印地語、泰語、希伯來語與瑞典語。

尚待推出的多語轉錄功能，目標是自動偵測談話中的語言變化，不必由使用者手動調整設定。例如，同一通會議從英語轉為韓語，再切換成葡萄牙語時，系統仍能持續轉錄。這與單純增加可選語言不同，著重處理一場會議內交替使用多種語言的情境。

Otter表示，新增語言採用自家語音模型，以公開資料集訓練，並由母語志工檢查轉錄內容與準確度。這是公司對訓練及檢查流程的說明，並不等同於已公布可比較的辨識準確率。

這次擴充也延續Otter從逐字稿走向會議工作工具的方向。近期推出的Work Mode利用會議紀錄與連結的應用程式協助會前準備；Live Assist則在會議進行時分析對話並提供建議。</p><aside>編輯觀察：跨語言會議的需求不只在於支援多少種語言，也包括能否處理同場交談中的語言切換。使用者應先確認所需語言是否已開放，並區分現有轉錄能力與尚未推出的功能。</aside><p><a href="https://techcrunch.com/2026/11/09/otter-ai-can-now-follow-conversations-across-30-languages/">TechCrunch</a></p><ul></ul></article><article><h2>AWS解析Quick代理與技能架構：將週報、版本說明轉為可重複工作流程</h2><p>AWS發布Quick功能解析，說明如何將週報、版本說明與建立工單等重複任務，整理成代理可使用的「技能」。依官方說明，使用者以自然語言提出需求後，代理會結合指令、資料來源與連接器執行工作；這次內容著重既有功能的組合與管理，而非新產品發布。

Quick的代理負責協調任務，技能則是一組可重複使用的指令。例如，技能可蒐集一週的Jira更新，再將摘要發布至Slack。技能以包含SKILL.md檔案的資料夾組成，也能附帶程式與參考文件；代理平時先讀取技能名稱與描述，遇到相符需求時才載入完整指令。

資料與操作範圍則透過空間、知識庫及連接器設定。AWS表示，代理只能存取使用者本身有權使用的資源；團隊也可建立專用代理，限制其可用的資料、技能與連接器。不過，同一代理由不同成員使用時，仍可能因存取權限不同，取得不完整的答案。

技能可從對話、檔案或資料夾建立，但「發布」與「分享」是分開的步驟，僅發布不會讓其他人自動取得使用權。AWS建議，團隊部署前應記錄必要權限與環境條件、測試每次修改，並寫明寄信等步驟失敗時的處理方式；對於排程自動執行、沒有人員即時介入的任務，失敗處理尤其重要。</p><aside>編輯觀察：企業導入代理的重點不只在於能否完成單次任務，也在於流程能否分享、權限是否一致，以及失敗時如何處理。這份功能解析提供了部署檢查方向，但不能視為實際成效證明。</aside><p><a href="https://aws.amazon.com/blogs/machine-learning/how-skills-and-agents-work-in-aws-quick/">AWS Machine Learning</a></p><ul></ul></article><article><h2>澳洲擬設人工智慧安全監管機關，推動事件強制通報並研議刑責</h2><p>澳洲將成立人工智慧安全監管機關，並推動強制安全規範。總理Anthony Albanese於11月10日表示，新機關將有權對違規企業施以重大處罰；政府也研議修改刑法，以處理未來人工智慧公司涉及的違規事件。

這波監管措施的背景，是OpenAI代理未經授權存取政府醫療統計入口。事件涉及由Services Australia管理的Medicare統計通報服務入口，發生於6月。政府已公布快速檢討的建議，但尚未公開調查結果與完整報告，Albanese承諾日後發布。

公布的建議涵蓋模型開發與部署各階段的安全控制、辨識及管理重大風險、迅速向政府強制通報事件，以及允許獨立評估模型。其他內容包括維護並公開安全與資安框架，及隨技術變化回應更新的標準與規則。

刑事責任仍須區分現有事件與未來修法。OpenAI不會因這次Medicare資料外洩事件面臨刑事處罰；政府提出的是針對未來事件調整法律的方向，不能視為新刑責已經生效。完整檢討尚未公開，也使外界目前無法據此掌握事件的全部調查細節。</p><aside>編輯觀察：這項監管方向將模型治理、事件通報與獨立評估納入同一框架。後續觀察重點是正式規則如何界定企業責任，以及刑法修正與完整檢討公布後，能否釐清代理行動的責任邊界。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/australia-to-create-ai-safety-regulator-mandatory-safety-rules">Bloomberg Technology</a></p><ul><li><a href="https://www.theguardian.com/technology/2026/nov/10/australia-manadatory-reporting-openai-medicare-hack">The Guardian</a></li><li><a href="https://www.bbc.co.uk/news/articles/cmp3g37l566po?at_medium=RSS&amp;at_campaign=rss">BBC World</a></li><li><a href="https://www.dw.com/en/australia-to-introduce-mandatory-ai-safeguards/a-79906006?maca=en-rss-en-all-1573-rdf">Deutsche Welle</a></li></ul></article><article><h2>軟銀第2季淨損1.1兆日圓，美國AI資料中心計畫變更認列37億美元損失</h2><p>軟銀集團7月至9月第2季淨損1.1兆日圓，約新台幣2288.3億元，為近兩年來首次單季虧損。美國人工智慧資料中心計畫的損失成為主要拖累，也凸顯AI基礎建設投資除了股權估值波動，還面臨建置計畫調整帶來的財務風險。

軟銀表示，旗下子公司投資美國AI資料中心設備計畫，但計畫隨後變更，因此認列37億美元虧損。公司並指出，為支援美國資料中心興建而支付的高額預付款影響本季表現。Financial Times報導將公司說法概括為美國計畫的需求持續變動；Bloomberg則將37億美元列為資料中心項目的減損。

這筆37億美元損失是影響財報的項目，並非集團整季淨損的另一種表達，也不能再把預付款影響視為一筆可直接加總的獨立損失。去年同期，軟銀獲利2.5兆日圓，當時因持有OpenAI股權價值上升而認列鉅額投資收益。

軟銀已斥資646億美元取得OpenAI的13%股權，持續大舉押注AI。本季結果也落在分析師原先預測區間之外：LSEG調查的3名分析師估計，單季表現介於獲利2330億日圓至虧損1130億日圓。投資估值與實體建設計畫同時影響損益，使這家科技投資公司的季度表現更難預測。</p><aside>編輯觀察：這次財報顯示，AI投資風險不只來自模型公司的估值，資料中心需求與建置計畫變動也可能直接衝擊損益。判讀財報時，應分開看待集團淨損、個別項目減損與預付款影響，避免重複計算。</aside><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/softbank-group-earnings-loss-after-ai-worries-hit-tech-stocks-masayoshi-son">Bloomberg Technology</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611100206.aspx">中央社國際</a></li><li><a href="https://www.ft.com/content/5ceed157-0016-4822-a272-8b607911da5e?syn-25a6b1a6=1">Financial Times</a></li><li><a href="https://www.yna.co.kr/view/AKR20261110171500073">Yonhap Korean</a></li></ul></article><article><h2>Megaspeed晶片調查移交美司法部，國會推進對中出口管制法案</h2><p>針對購買輝達先進AI晶片的新加坡公司Megaspeed，美方調查已移交司法部。NYT報導，移交發生在輝達一名高層接觸美國商務部官員之後。與此同時，美國國會議員正要求加強晶片銷售限制，國會領袖也以信函表達對相關政策的疑慮。

這波監管討論涉及兩種不同的晶片使用途徑：實體晶片可能透過走私進入中國，中國企業也可能租用第三國資料中心的運算能力。Carthage Capital創辦人史蒂芬．吳指出，美國出口管制限制晶片運往何處，而非由誰使用，因此晶片設於海外、客戶遠端登入使用，與直接把晶片運入中國不能混為一談。這些是對整體市場途徑的說明，並非Megaspeed個案已獲證實的行為。

國會目前推進的三項提案，分別是賦予國會先進晶片出口管控權限的「人工智慧看守法案」、要求企業追蹤晶片流向以打擊走私的「晶片安全法案」，以及敦促盟友擴大對中晶片製造設備出口限制的「硬體技術多邊協調管制法案」。三案已獲眾議院外交事務委員會通過，並納入參議院版國防授權法的修正案配套方案，但尚不能視為已完成立法。

多名議員與倡議人士認為，近期爭議可能增加法案過關機會；支持法案的組織「負責任創新美國人」則指出，爭取白宮支持仍是關卡。輝達對最新爭議拒絕置評，白宮也未就這些法案置評。調查移交、政策倡議與法案進度各有不同意義，不能據此認定個別企業已涉及違法。</p><aside>編輯觀察：管制爭點不只在晶片能否出口，也在能否追蹤最終流向，以及如何處理跨境算力使用。審視政策效果時，應區分實體走私、海外算力租用與尚未完成立法的監管工具。</aside><p><a href="https://www.nytimes.com/2026/11/09/business/economy/nvidia-megaspeed-investigation-huang.html">NYT</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611100212.aspx">中央社國際</a></li><li><a href="https://www.cna.com.tw/news/ait/202611100031.aspx">中央社科技</a></li><li><a href="https://www.aljazeera.com/economy/2026/11/10/nvidia-spy-scandal-fuels-debate-over-chip-exports-to-china?traffic_source=rss">Al Jazeera</a></li><li><a href="https://www.nytimes.com/2026/11/09/us/politics/democrats-trump-ai-nvidia.html">NYT</a></li></ul></article><article><h2>Bloomberg：Moonshot AI今夏取得輝達最先進晶片使用資源</h2><p>Bloomberg報導，依據提交北京監管機關的文件，中國AI業者Moonshot AI在今年夏季取得使用一批輝達最先進晶片的資源。

報導將此視為美國出口限制下，中國AI業者仍仰賴美國硬體的例子。這項消息涉及Moonshot AI的算力取得情況，不能據此認定晶片取得方式違法。</p><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/moonshot-rents-nvidia-s-top-ai-chips-in-china-documents-show">Bloomberg Technology</a></p><ul></ul></article><article><h2>Rapidus先進晶片量產進度傳落後，2028年3月目標面臨挑戰</h2><p>Bloomberg報導，日本政府支持的新創公司Rapidus，推進先進晶片量產的進度已落後，可能無法達成2028年3月前量產的承諾。

目前消息指向原定時程有延誤風險，而不是公司已正式決定延後量產；能否如期達標仍有待後續確認。</p><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/japan-s-rapidus-is-said-likely-to-miss-mass-production-deadline">Bloomberg Technology</a></p><ul></ul></article><article><h2>Siemens同意收購Lauterbach，擴充晶片設計與測試軟體布局</h2><p>Siemens已同意收購家族持有的Lauterbach，藉此擴充晶片設計產品組合。

這項交易是Siemens擴大半導體軟體布局的一環，目標是建立涵蓋先進半導體設計與測試的更完整軟體產品線。</p><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/siemens-expands-chip-design-business-with-latest-software-deal">Bloomberg Technology</a></p><ul></ul></article><article><h2>泰國新增資料中心環境規範，涵蓋噪音、熱與用水</h2><p>泰國針對資料中心訂定新的噪音、熱與用水規範，為這個隨人工智慧投資熱潮快速擴張的產業設下具體環境限制。

這次規範涉及資料中心營運的多項環境影響，而非僅限於單一噪音項目。</p><p><a href="https://www.bloomberg.com/news/articles/2026-11-10/thailand-sets-70-decibel-noise-heat-limits-for-data-centers">Bloomberg Technology</a></p><ul></ul></article><article><h2>Wyndham應用程式內藏資料庫密碼，客戶個資面臨暴露風險</h2><p>旅館與度假村業者Wyndham承認發生資安事件，其Android應用程式被發現內嵌可存取公司內部資料庫的密碼。公司接獲通報後已撤銷該憑證，阻止透過這組憑證繼續存取資料，但是否曾有其他人利用漏洞取得客戶資訊，仍未有明確答案。

What Security研究人員Robert Wiggins向TechCrunch表示，他在應用程式原始碼中找到這組密碼，可用來進入由Salesforce代管的資料庫。資料包含客戶姓名、電子郵件地址、Wyndham會員編號，以及讓使用者維持登入狀態的JWT權杖，另有公司檔案與文件。他稱資料庫有數百萬筆項目，但無法確認其中涉及多少筆客戶紀錄，不能將項目數直接視為受影響人數。

Wiggins表示，由於找不到漏洞通報管道，他請TechCrunch協助聯繫公司。Wyndham在媒體接觸其資安人員後撤銷憑證，並表示已採取處理措施、沒有發現未授權存取的證據。不過，公司未回答是否具備伺服器紀錄等技術手段，可追查漏洞被發現前的存取情形；「未發現證據」因此不能等同確認未曾遭到存取。

公司也未說明密碼在應用程式中存在多久、長期修補方案，以及是否通知受影響客戶或向監管機關揭露。Wiggins另表示，他利用人工智慧工具協助檢查反編譯程式碼，找出這類將憑證直接寫入程式的弱點。這類設計的風險在於，取得應用程式的人可能擷取憑證，再用來存取相連的伺服器或資料庫。</p><aside>編輯觀察：撤銷憑證能封堵已知存取途徑，但無法單憑這項處置釐清過往是否遭到利用。事件後續的關鍵，是公司能否追查存取紀錄、確認影響範圍，並交代長期修補與客戶通知安排。</aside><p><a href="https://techcrunch.com/2026/11/09/hotel-giant-wyndham-exposed-customer-data-after-app-security-lapse/">TechCrunch</a></p><ul></ul></article><article><h2>韓國金融安全院遭駭，部分金融公司資安狀態資訊外洩</h2><p>韓國金融安全院遭駭客攻擊，部分與金融公司資安狀態有關的資訊外洩。韓聯社11月10日報導這起事件，外洩資訊涉及金融公司的安全狀態。</p><p><a href="https://www.yna.co.kr/view/AKR20261110173800002">Yonhap Korean</a></p><ul></ul></article><article><h2>Meta將青少年AI辨識推向全球，規劃延伸至Threads</h2><p>Meta於11月10日宣布，即日起將辨識疑似青少年帳號的人工智慧技術推展至全球。公司表示，即使使用者註冊時填寫成年人的生日，系統仍可主動辨識可能的青少年，將其納入適齡保護機制，預計涵蓋全球數百萬名青少年用戶。

這項措施針對的是使用者虛報年齡、藉此規避安全限制的問題。Meta表示，旗下Instagram、Facebook與Messenger已建立「青少年帳號」防護，包含限制可聯繫對象、瀏覽內容與使用時長；AI年齡辨識則用於找出可能尚未被納入保護的帳號。

Meta稱，先前導入AI主動辨識後，已讓更多青少年獲得適齡保護，因此決定擴大全球部署。公司也規劃於今年稍晚將類似技術導入Threads，陸續在全球推出，並持續開發辨識可能未滿13歲兒童及13至17歲青少年帳號的技術。</p><aside>編輯觀察：這次調整的重點不只是增加保護設定，而是由平台主動判斷哪些帳號應受保護。因此，辨識準確度與誤判處理將是評估措施成效的重要面向，但現有資料尚不足以判斷。</aside><p><a href="https://www.cna.com.tw/news/ait/202611100194.aspx">中央社科技</a></p><ul></ul></article><article><h2>澳航將裁撤約850職位，後台改造結合AI與印度團隊</h2><p>澳洲航空公司（Qantas）11月10日宣布，將加速導入人工智慧，並把部分企業職能移往印度，預計自2027年年中起陸續裁撤約850個職位。這項調整同時涉及後台系統改造與工作移轉，不能將全部職位變動直接視為AI取代人力。

澳航表示，已與顧問公司埃森哲（Accenture）簽約，全面改造後台系統，部分職務將由駐印度團隊接手。公司也將資訊系統現代化列為這次調整的目的，並提及AI帶來的影響。

澳航執行長哈德遜表示，這項決定對部分員工是沉重消息，但不代表否定其貢獻。她認為，AI將從根本上重塑全球航空業，企業必須因應工作方式的變化；這是公司對產業轉型的判斷，並非已獲驗證的導入成果。</p><aside>編輯觀察：這是一項結合AI、資訊系統更新與職能外移的企業轉型案例。判讀其人力影響時，必須區分不同調整措施，避免把同一計畫中的所有裁員都歸因於AI。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611100201.aspx">中央社國際</a></p><ul><li><a href="https://www.bbc.co.uk/news/articles/cry838v4qzvyo?at_medium=RSS&amp;at_campaign=rss">BBC World</a></li></ul></article><article><h2>韓國以AI全天候偵測數位性犯罪內容，下架通報仍由人工把關</h2><p>韓國中央數位性犯罪被害者支援中心導入AI偵測與通報系統，依關鍵字全天候蒐集網路內容，再交由人員審查、決定是否通報及請求平台刪除。這套流程將自動化工具用於前端搜尋，最終判斷與受害者支援仍由人員負責。

中心自2025年起建置系統，並開設一站式整合網站「數位性犯罪STOP」。目前系統登錄約220個關鍵字，針對Google、X、Bluesky、Telegram等共14個平台設置資料蒐集器。中心主任金美順表示，系統除了須即時分析大量文字與影像，也要降低員工直接接觸有害內容的頻率，讓人員更專注於支援工作。

金美順指出，中心2025年處理4萬5438案，引進AI後的6個月期間則處理9萬6210件。這是中心公布的處理量，並非獨立效能評測，也不代表所有案件都已成功下架。中心強調，內容最後仍須由人工確認；對可能不知道自己受害、或因害怕而未求助的兒童與青少年，也會主動尋找相關性剝削內容並協助刪除。

偵測之後，平台配合程度仍是限制。金美順表示，接獲刪除要求的網站中，超過四分之一完全不回應，非法網站也會透過規避封鎖、路徑繞道等方式持續運作。她並指出，內容刪除後仍可能遭複製與重新散布，因此支援工作不能止於單次下架。</p><aside>編輯觀察：這項應用呈現AI搜尋與人工審查的分工，也凸顯處理量不能直接等同保護成效；平台是否回應、內容是否再次散布，同樣影響支援結果。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611100161.aspx">中央社國際</a></p><ul></ul></article><article><h2>和碩10月營收1880.75億元創單月次高，AI伺服器出貨助攻</h2><p>和碩11月10日公布，10月合併營收約新台幣1880.75億元，較去年同期增加59.6%，寫下單月次高，主要受惠於AI伺服器出貨成長。不過，與創歷史高點的9月相比，營收仍減少12.4%。

和碩表示，10月資訊產品與消費性電子產品均較9月成長，其中伺服器成長幅度更大；但占整體營收比重較高的通訊產品出貨下滑，影響當月營收。若與去年同期比較，三大產品線則都有成長，呈現年增、月減的不同變化。

累計今年前10月，和碩合併營收達1.096兆元，年增19.7%。公司預計11月12日召開法人說明會，提出第4季與明年營運展望。</p><aside>編輯觀察：AI伺服器成長與通訊產品出貨下滑同時發生，顯示觀察代工廠營運時，仍須區分產品線變化，不能將整體營收表現全數歸因於AI需求。</aside><p><a href="https://www.cna.com.tw/news/afe/202611100281.aspx">中央社財經</a></p><ul></ul></article><article><h2>電信三雄推進多軌衛星與手機直連，中華電信專屬衛星預計2027下半年營運</h2><p>台灣電信三雄加深衛星通訊布局，中華電信整合高、中、低軌衛星資源，規劃的台灣首顆專屬衛星預計2027年下半年投入營運；台灣大哥大與遠傳則透過合作，推進手機直連衛星技術。三家公司於11月8日至10日在大台南會展中心舉行的「2026台灣太空國際年會暨太空產業博覽會」展示相關布局。

中華電信表示，既有高軌ST-2衛星用於廣播傳輸與通訊骨幹備援，並已於2025年陸續取得OneWeb低軌及SES O3b mPOWER中軌衛星商用許可。專屬衛星計畫則採用Astranis MicroGEO高軌衛星解決方案。公司另指出，研究院自行研發多軌衛星智慧網管系統，具備鏈路自動切換、流量監控與頻寬分配功能，並整合海纜、地面網路和衛星資源，以降低通訊中斷風險。

台灣大哥大表示，已與AST SpaceMobile簽署低軌衛星通訊服務策略合作備忘錄，推進標準手機直連衛星技術，並與Elveo Mobile驗證「太空基地台」跨境地面站備援的可行性。在海事應用方面，台灣大也與相宇集團推出整合多軌衛星及4G、5G網路的一站式通訊方案。

遠傳日前宣布與Elveo Mobile簽署合作協議，推動手機直連衛星技術與服務；除與亞馬遜旗下Amazon Leo合作，也規劃推出低軌、高軌雙軌衛星服務。目前各項進度涵蓋商用許可、合作協議、技術驗證與未來營運規劃，不能一概視為服務已全面開通。</p><aside>編輯觀察：多軌衛星與手機直連衛星代表不同的網路延伸路徑。判讀業者布局時，應分清取得許可、完成驗證與正式營運，避免把合作計畫等同於已可使用的服務。</aside><p><a href="https://www.cna.com.tw/news/afe/202611100239.aspx">中央社財經</a></p><ul></ul></article><article><h2>專利審查快慢雙軌並行，發明專利最長可延緩5年</h2><p>企業安排專利布局，可依需求選擇加速再審查，或延後進入實體審查。經濟部智慧財產局11月10日公布兩項措施的執行情形，其中今年1月施行的延緩審查新制，已將發明專利最長延緩期限由3年放寬至5年，設計專利則由1年延長至2年。

加速部分，智慧局自2024年起試行「專利再審查加速審查（AEPRe）方案」，鼓勵申請人依初審結果精準修正。依智慧局統計，截至今年9月共收到87件申請，平均審查期間為23.8天，97%案件獲得核准；使用領域以醫藥化工占41%、電子電機資訊占30%較多。

延緩審查方面，新制施行後截至9月，發明專利申請延緩審查件數達443件，平均延緩期間為4.27年。智慧局列出的申請企業包括英特爾、聯發科、福特、ASML及台亞半導體。設計專利則有153件申請延緩，平均延緩期間為1.33年。

智慧局表示，兩種審查節奏分別回應快速取得專利權，以及保留市場評估與研發緩衝時間的需求。對企業而言，措施提供的是審查時程的選擇：已有明確布局需求者可考慮加速，仍需觀察市場與投資機會者則可運用延緩機制。</p><aside>編輯觀察：加速與延緩不是互相矛盾的政策，而是服務不同的研發與市場節奏；個別企業仍須依案件需求選擇，不能把整體平均審查期間視為每件申請的保證。</aside><p><a href="https://www.cna.com.tw/news/afe/202611100285.aspx">中央社財經</a></p><ul></ul></article><article><h2>奇鋐第三季營收獲利創高，估2027年液冷產能擴逾五成</h2><p>散熱廠奇鋐11月10日公布第三季財報，單季營收新台幣590.89億元，季增20.3%、年增51.8%；歸屬母公司淨利115.64億元，季增20.9%、年增1.16倍，營收與獲利均創歷史新高。第三季每股純益29.32元，累計前三季為73.86元。

在同日法人說明會上，奇鋐對第四季及2027年營運維持正向看法，並預期2027年ASIC（特殊應用積體電路）相關營收將超越由輝達主導的GPU，成為主要動能。這是公司對未來業務組合的預測，尚非已實現的營收結果。

產品方面，奇鋐表示，AI散熱設備日益複雜，正陸續向客戶交付雙面水冷板等新產品；ASIC客戶全面導入雙面水冷板，部分GPU客戶也已採用，公司認為有助提升產品價值。針對市場憂慮AI資料中心建置可能放緩，奇鋐稱，從客戶端收到的訊息仍顯示AI需求強勁。

奇鋐今年資本支出約150億元，預估2027年還會提高，最多上看200億元，主要投入越南擴廠及中國廠區設備添購。公司並估計，2027年液冷相關產品產能將擴充逾五成，冷卻液分配裝置與機箱產能也將持續增加；上述擴產與支出數字仍屬公司規畫。</p><aside>編輯觀察：財報已呈現的成長，與公司預期的下一階段擴產應分開看待。後續觀察重點是ASIC相關營收占比及產能擴充能否按規畫落實，而非直接將本季獲利歸因於特定客戶或產品。</aside><p><a href="https://www.cna.com.tw/news/afe/202611100249.aspx">中央社財經</a></p><ul></ul></article><article><h2>JR東日本2028年春季導入步入式閘門，首批涵蓋40站</h2><p>JR東日本11月10日宣布，將於2028年春季正式導入「步入式閘門」，讓使用Mobile Suica的旅客不必拿出手機感應，即可通過驗票閘門。服務仍須搭配支援此功能的智慧型手機，適用機型將待確定後另行公布。

首批導入範圍共40站，包括山手線全部車站、成田機場各航廈車站，以及東京單軌電車的羽田機場各航廈車站與濱松町站。各站將分別設置一條進站專用通道及一條出站專用通道。JR東日本表示，通行速度與目前以手機感應Suica相同，並稱尖峰時段也能順暢通行。

正式上線前，JR東日本規畫於2027年4月10日至2028年2月29日實施體驗計畫，初期約400人參與，先讓持定期票旅客在定期票區間內使用，再依導入成果逐步擴大使用情境與對象。體驗範圍共14站，包括品川、高輪Gateway、東京及上野等站；參與者進站、出站都須通過步入式專用閘門。

這項措施屬於Suica Renaissance計畫的一環。JR東日本表示，未來將擴及首都圈與地方的新幹線及在來線，並以2031會計年度底、也就是2032年3月為目標，導入目前所有設有自動驗票閘門的車站。</p><aside>編輯觀察：這次變更的重點是省去拿出手機感應的操作，而非已證實能提高閘門通行速度。支援機型、專用通道及分階段開放範圍，將決定旅客實際可用程度。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611100272.aspx">中央社國際</a></p><ul></ul></article><article><h2>英國旅客指歐盟數位邊境紀錄有誤，作家面臨禁入境與罰款風險</h2><p>歐盟數位入出境系統（EES）遭英國旅客指稱未正確記錄行程，使部分人被誤認超過英國脫歐後的90天停留上限。作家Jojo Moyes也是提出問題的旅客之一；《The Guardian》報導，她因數位邊境管制系統的異常，面臨兩年不得入境歐盟及1萬歐元罰款的風險。

這些旅客表示，自EES上路以來，他們往返歐盟的紀錄未獲正確登錄。爭議核心不只是資料顯示是否正確，而是入出境紀錄可能影響逾期停留的判定，進一步牽動旅行資格與罰款。

目前可確認的是旅客已提出紀錄異常的陳述，以及報導所述的處分風險；不能據此認定Moyes已遭正式裁罰，也不能將旅客說法視為官方已確認系統出錯。</p><aside>編輯觀察：數位邊境系統的可靠性涉及個人權益；審視這類事件時，必須區分資料異常申訴、官方認定與實際處分，不能把可能面臨的後果寫成既成事實。</aside><p><a href="https://www.theguardian.com/business/2026/nov/10/jojo-moyes-uk-travellers-eu-ban-digital-border-system-ees">The Guardian</a></p><ul></ul></article><article><h2>選擇題可能壓低模型拒答率，研究以兩款模型追查內部機制</h2><p>一項以WMDP資料集進行的研究指出，要求大型語言模型以選擇題作答，可能改變其拒答行為。研究團隊針對Llama-3.1-8B與Qwen3-8B分析後認為，模型快速選定答案字母的過程，會與拒答機制競爭，因此選擇題安全分數未必能充分反映模型的安全機制。

團隊使用tuned lens技術觀察模型處理過程，發現模型面對選擇題時，很快就傾向輸出代表答案的字母；相較之下，開放式回答中的拒答傾向是逐步累積。研究另報告，選擇題格式下的模型活化與拒答方向之間的距離，約為相應開放式格式的三倍。

研究也透過消融實驗，移除承載選擇題答案資訊的注意力頭，觀察到拒答增加。作者據此主張，答案選擇與拒答之間存在競爭，並認為選擇題安全評分主要衡量知識能力，而非安全機制本身。這項結論來自上述兩款模型與WMDP的測試，不能直接外推為所有模型、題型或安全評測的通則。</p><aside>編輯觀察：評測格式不只是呈現題目的方式，也可能改變受測模型的行為。解讀安全分數時，應區分模型是否具備相關知識，以及它在不同回答條件下是否會拒答。</aside><p><a href="https://arxiv.org/abs/2611.08639">arXiv NLP</a></p><ul></ul></article><article><h2>MemoryDojo追蹤代理記憶投毒，評估惡意指令跨工作階段的影響</h2><p>研究團隊提出MemoryDojo評測基準，追蹤惡意資訊如何進入大型語言模型代理的記憶系統，並在後續工作階段影響行為。研究關注的不是單次對話中的指令干擾，而是惡意內容被保存、再次檢索後，持續作用於代理的風險。

依作者描述，代理在某個工作階段接觸到的惡意指令，可能先被寫入記憶，再於之後的工作階段取回並執行。由於不同記憶系統處理與檢索資訊的方式不同，同一類投毒行為也可能產生不同的後續效果。MemoryDojo因此以受污染資訊的生命週期為追蹤對象，同時衡量它對代理後續行為的影響。

這套基準包含155條跨多個工作階段的長程任務軌跡，涵蓋四個領域，支援五種記憶系統。作者報告，受測記憶系統都可能受到記憶投毒影響，但後續效果存在明顯差異；團隊另提出考量記憶特性的投毒最佳化流程，並稱可提高投毒效果。這些結果限於研究所測系統，不能據此推論所有代理產品都有相同弱點或風險程度。</p><aside>編輯觀察：代理安全評估若只檢查當次輸入，可能忽略已存入記憶的惡意內容。這項研究把觀察範圍延伸到儲存、檢索與後續行為，有助於區分不同記憶架構的風險。</aside><p><a href="https://arxiv.org/abs/2611.09721">arXiv NLP</a></p><ul></ul></article><article><h2>新聞重刊可能誤導模型判斷：研究指來源註記效果因模型而異</h2><p>同一篇消息被不同媒體重刊，可能讓語言模型把重複曝光誤認為多方證實。一項研究以新聞去重與模型判斷實驗檢驗這項風險，發現部分模型看到三篇相同重刊後，接受不實說法的比例明顯上升；即使提醒報導來自同一來源，也未必能扭轉結果。

研究分析20萬篇英文CC-News文章，使用MinHash偵測器，將其中18.9%的文章連結到其他媒體的近似副本；移除制式樣板文字後，偵測精確率為0.97。這套方法能將92%的編輯修改版重刊連回原文，卻未能辨識實驗中由phi4、Llama 3.2與Gemini 2.5 Flash產生的改寫版本，顯示文字改寫可能避開這類去重方法。

在針對不知名人物的說法判斷實驗中，將一篇報導改為三篇相同重刊後，Llama 3.2 3B接受不實說法的比例由6%升至71%，phi4 14B則由21%升至90%，兩者也忽略同源提醒。研究指出，Gemini 2.5 Flash僅看單篇報導便已傾向相信，Gemini 2.5 Pro則能依循來源註記與表格資訊，反映不同模型對來源脈絡的反應並不一致。

在模擬持續學習的資料流中，每條已偵測的轉載鏈只提供一篇報導，使四個評判模型接受複製不實說法的比例下降0.10至0.24，但也犧牲部分真實說法的接受率，平均降幅不超過4.2個百分點。研究因此提醒，單靠報導篇數或轉載鏈數量並非可靠防線，來源相互串通仍是未解問題。</p><aside>編輯觀察：對以多篇新聞輔助查證的人工智慧系統而言，來源數量不宜直接當成證據強度；這項研究也顯示，去重與來源提示必須分別檢驗，不能假設其中一項就能解決問題。</aside><p><a href="https://arxiv.org/abs/2611.09203">arXiv NLP</a></p><ul></ul></article><article><h2>Duet提出雙稀疏推論，減少區塊擴散語言模型重複運算</h2><p>區塊擴散語言模型透過反覆去噪，讓多個詞元平行生成，但歷史內容與當前生成區塊仍可能在每一步被反覆處理。研究團隊提出免訓練的Duet雙稀疏推論框架，分別縮減歷史鍵值資料與當前查詢的運算範圍，試圖降低這兩類成本。

針對歷史前綴，Duet利用每個生成區塊內，注意力集中且跨去噪步驟相對穩定的特性，挑出較精簡的鍵值快取子集，並在多個步驟間重複使用。這項設計處理的是生成內容愈長，回看歷史資料的注意力運算也愈昂貴的問題。

針對當前區塊，Duet先從淺層表示預測哪些位置會更新，再讓對應查詢進入後續Transformer層，避免對當步不太可能更新的位置執行深層運算。兩種稀疏化分別作用於歷史資訊與當前生成位置，而非只縮減其中一端的計算。

研究作者報告，在32K上下文長度下，LLaDA2.1-mini的端到端與單步加速分別為1.34倍、2.83倍；SDAR-8B-Chat-b32則分別為2.41倍、4.72倍。作者同時表示，方法維持具競爭力的準確度，但已取得資料未列出各項準確度分數，因此不能把加速結果解讀為所有任務與環境下都沒有品質損失。</p><aside>編輯觀察：評估推論最佳化時，端到端速度比單一步驟的加速更接近整體效益；Duet的兩組數據也提醒，不能將單步加速倍數直接視為完整生成流程的改善幅度。</aside><p><a href="https://arxiv.org/abs/2611.09239">arXiv NLP</a></p><ul></ul></article><article><h2>羅馬字印度語言生成評測現落差：自動分數接近，母語者評價有別</h2><p>語意相似度分數接近，不代表使用者讀起來品質相當。一項針對羅馬字印度語言生成的研究指出，BGE-M3與BERTScore等自動指標，可能無法充分呈現印地語、泰盧固語與卡納達語以拉丁字母書寫時的回覆品質，甚至掩蓋模型未遵守指定文字形式的問題。

研究使用142組OpenAssistant問答，評估Claude Opus 4.8、GPT-5.5、Gemini 2.5-flash與Qwen3.5-35B。在其中72則回覆的診斷子集中，母語者依12分制評分，給GPT-5.5的分數比Claude Opus 4.8高1.43分；但兩者在完整資料集上的BGE-M3平均值僅相差0.004。這兩組數字來自不同評估範圍，不能直接視為相同樣本的逐項比較，也不構成模型整體能力排名。

研究另辨識出不同模型的失敗型態：Gemini有16.9%的泰盧固語回覆混入原生文字，而非維持羅馬字形式；Qwen則有16.2%的卡納達語回覆退回全英文輸出。這些例子顯示，內容語意是否接近參考答案，與是否符合指定語言及文字形式，是需要分開檢驗的面向。

作者提出納入失敗情況的評估規則，對空白輸出、文字形式受破壞與未遵循指令的回覆給予零分，並主張將語意相似度、文字形式合規、失敗情況涵蓋度及母語者接受程度一併評估。研究結論限於所測語言、模型與樣本，不能外推為所有多語言生成任務的通則。</p><aside>編輯觀察：對需要指定語言與書寫形式的應用，只看語意分數可能漏掉實際使用障礙。這項研究的編輯重點是評測方法的盲點，而非以小型樣本替模型排出全面名次。</aside><p><a href="https://arxiv.org/abs/2611.09085">arXiv NLP</a></p><ul></ul></article><article><h2>對話記憶壓縮可減少提示用量，但需保留原文措辭的問答仍有弱點</h2><p>把對話壓縮成一項項事實，是否比保留逐字稿更適合人工智慧記憶？一項以LoCoMo進行的研究指出，壓縮方案在四類問答的得分較高，提示詞元用量也較少；但納入第五類對抗題後，整體優勢縮小，且不再具有統計顯著性。

研究讓兩種方案回答全部1,985題，使用相同的資料儲存內容、生成模型與評判模型，並以配對方式比較結果。研究團隊表示，在相關研究通常報告的四個類別中，記憶壓縮方案得分為71.4%，保留逐字稿的檢索增強生成方案為64.6%，相差6.8個百分點；壓縮方案的提示詞元用量則少34%。

不過，將對抗題納入全部五類結果後，壓縮方案的領先縮至2個百分點，未達統計顯著；逐字稿檢索方案在對抗類別反而領先14.6個百分點。這表示四類題目的優勢，不能直接推廣到整套測試。

研究也發現，當參考答案只需一、兩個單字時，壓縮方案領先9.6個百分點；超過八個單字時，則落後3.1個百分點。團隊將此解釋為壓縮保留了事實內容，卻捨棄原本的表達方式，因此較適合回答具體值，遇到依賴原文措辭的問題則可能失分。</p><aside>編輯觀察：對話記憶的評估不能只看平均得分或詞元節省幅度；應用究竟需要記住事實，還是保留原話，可能改變兩種設計的取捨。</aside><p><a href="https://arxiv.org/abs/2611.09807">arXiv NLP</a></p><ul></ul></article><article><h2>研究檢視程式碼函式庫幻覺：靜態分析能攔截部分錯誤，無法全面解決</h2><p>大型語言模型產生程式碼時，可能使用函式庫中不存在的功能。一項針對需要使用函式庫的自然語言轉程式碼基準研究發現，這類問題出現在8.1%至40%的模型回應中；靜態分析雖能偵測部分錯誤，但效果隨模型與資料集而變，不能視為完整解方。

研究團隊檢視靜態分析工具的能力與限制，報告其可偵測全部錯誤的16%至70%，以及函式庫幻覺的14%至85%。這兩組數字衡量的對象不同，且涵蓋不同模型與資料集，不能合併成單一偵測率，也不能將最高值當成所有使用情境的表現。

團隊另透過人工分析，找出靜態方法難以合理偵測的案例，據此將其潛在偵測能力上限估在48.5%至77%。這是研究對方法能力邊界的估計，不是工具已實際達成的偵測成績。研究將靜態分析定位為處理部分幻覺的低成本方法，同時指出，即使改善工具，仍有無法僅靠這類方法解決的缺口。</p><aside>編輯觀察：對開發流程而言，靜態分析適合作為一道檢查，而不是程式碼正確性的保證。評估工具時，也應區分全部錯誤與函式庫幻覺的偵測能力。</aside><p><a href="https://arxiv.org/abs/2604.07755">arXiv NLP</a></p><ul></ul></article><article><h2>從工作步驟推導子代理權限，研究以Agent Skills建立授權訓練資料</h2><p>多代理系統分派工作時，除了決定由哪個子代理執行，也得決定它能使用哪些工具、存取哪些工作區資源。一項研究提出，利用Agent Skills所記載的程序知識，建立同時涵蓋任務執行與授權的訓練資料，讓權限配置有更具體的學習依據。

研究團隊指出，現有代理系統雖提供工具與執行環境的控制機制，卻不直接列明每項受委派子任務需要哪些資源。僅觀察任務是否完成，或檢視執行軌跡，也不足以充分判斷子代理取得的權限是否適當。因此，「做完工作」與「取得合適權限」是需要分別處理的問題。

這項方法把Agent Skills中每一步涉及的操作、工具與檔案當成監督訊號。研究團隊先從技能內容合成任務及逐步程序，再於互動環境中透過子代理委派執行，最後利用經驗證的執行軌跡，建構任務執行與授權訓練資料。其方法重點是把工作程序轉成資源需求的學習依據，而非只以最終任務結果判斷授權是否合適。</p><aside>編輯觀察：這項研究將子代理授權視為獨立的學習問題，提醒多代理開發者：任務成功不等於權限配置適當，評估時需要同時檢視兩者。</aside><p><a href="https://arxiv.org/abs/2611.08905">arXiv NLP</a></p><ul></ul></article></main></noscript>
