  <noscript><main><p>原定12:00 · 完成13:53 · 實際發布13:54</p><h1>補刊 · 國際談判、公共安全與台灣政策動態</h1><p>2026-11-12 時事焦點</p><article><h2>美特使將分晤普丁、澤倫斯基　歐洲對終戰進程評估不一</h2><p>阿布達比兩天的俄烏終戰會談後，美國特使魏科夫與庫許納預定11月12日先赴莫斯科會見俄羅斯總統普丁，再前往愛爾蘭首都都柏林，向烏克蘭總統澤倫斯基簡報。這波外交行程將延續美方斡旋，但歐洲對談判是否已有實質進展，仍有不同評估。

已抵達愛爾蘭的澤倫斯基表示，2027年之前或許存在結束戰爭的「機會之窗」，並稱參與談判者都希望在此前取得成果。他期待美方帶著具體方案與普丁會談，也能帶回具體內容；不過，他同時表明自己仍抱持懷疑態度，並未宣告談判已經突破。

談判範圍也是焦點。澤倫斯基歡迎美方對讓歐洲參與斡旋的態度轉變；另一方面，俄方推動重新檢討整個歐洲的安全格局，莫斯科首席談判代表更以現代版「雅爾達會議」描述目標。俄方的訴求及美方提出的新架構，已讓歐洲各國感到不安。

約50位歐洲領袖預定12日在都柏林開會，阿布達比會談預料將是主要議題。歐盟官員認為，和平進程目前幾乎沒有實質進展，戰火停止前也沒有必要與莫斯科討論更廣泛的安全規畫；北約秘書長呂特則表示，會談顯示美國、烏克蘭與歐洲立場一致且團結。</p><aside>編輯觀察：外交行程增加，不等於終戰條件已獲共識。是否提出具體方案，以及歐洲如何參與涉及自身安全的安排，是判讀後續進展的重要觀察點。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120061.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611120011.aspx">中央社國際</a></li></ul></article><article><h2>川普稱伊朗戰爭將結束　以方否認與美方因重啟戰事爭執</h2><p>美國總統川普11月11日在阿靈頓國家公墓的退伍軍人節紀念儀式上，再度為伊朗戰爭辯護，宣稱衝突很快就會結束，但美國要取得的是「全面勝利」，而非「93%的勝利」。這是他的政策宣示與預測，並非已達成停戰協議的消息。

美國與以色列自2月28日聯手對伊朗開戰，至今已超過8個月。川普在演說中稱，美國已經獲勝，問題只是何時結束戰爭；他並表示，美方失去18條生命，重申不能讓伊朗擁有核武。他也宣稱，衝突結束後，世界將更加安全與和平。

川普近期對重啟大規模戰事的態度較為保留。他8日接受「60分鐘」訪問時，表示不認為有理由恢復打擊伊朗；9日在白宮會晤卡達總理穆罕默德後，也淡化短期內重啟重大戰事的可能性，但仍未接受伊朗既有的停火方案。卡達與其他波灣國家則持續遊說美方不要恢復戰事。

美以之間是否對後續路線存在衝突，也受到關注。以色列《新消息報》與Ynet引述消息人士稱，總理尼坦雅胡在上週末通話中要求恢復戰事，川普則主張繼續推進外交談判，雙方因此爭執。尼坦雅胡辦公室否認這項報導；一名以色列高階官員承認兩人曾通話，但否認發生口角。</p><aside>編輯觀察：川普一面強調全面勝利，一面淡化重啟重大戰事的可能性，兩者仍須透過具體停戰條件銜接。美以通話內容存在爭議，不能據此認定雙方已公開決裂。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120016.aspx">中央社國際</a></p><ul><li><a href="https://www.cna.com.tw/news/aopl/202611120013.aspx">中央社國際</a></li></ul></article><article><h2>路透／益普索民調：71%美國受訪者盼國會立法結束伊朗戰爭</h2><p>美國期中選舉後公布的路透社／益普索民調顯示，71%受訪者希望國會通過法案，結束美國對伊朗的戰爭；另有62%支持撤銷川普政府對進口商品課徵的關稅。兩項議題都獲過半受訪者支持，但調查反映的是民意，並不代表國會已採取行動。

結束戰爭的主張在兩黨受訪者中均獲過半支持，其中民主黨受訪者支持比例為93%，共和黨受訪者為51%。兩者差距明顯，也顯示共和黨受訪者並非一致支持延續戰爭；至於撤銷關稅，已取得資料僅列出整體支持比例，沒有兩黨各自的數據。

這項調查透過網路在全美進行，為期4天，於11月9日結束，共取得1,705名美國成年人的回覆，抽樣誤差約為正負2個百分點。調查對象是美國成年人，而非僅限已投票選民。

民主黨在期中選舉後取得參眾兩院多數，新一屆國會將於2027年1月3日宣誓就職。民主黨領袖已承諾處理生活成本問題，並設法促使美國結束對伊朗的戰爭；黨內也有許多人承諾終止關稅。這些政治承諾與民調呈現的態度相呼應，但仍不能據此判定相關法案必然通過或政策必然改變。</p><aside>編輯觀察：結束戰爭的訴求跨越兩黨受訪者，但支持比例差距仍大。民調可作為觀察新國會施政壓力的依據，不能替代對立法進度與政策結果的查證。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120004.aspx">中央社國際</a></p><ul></ul></article><article><h2>盧比歐與王毅通話討論川習互訪　三方領袖會晤仍屬可能選項</h2><p>美國國務卿盧比歐與中國外交部長王毅11日通話，討論美國總統川普赴中國出席APEC峰會，以及中國國家主席習近平隨後赴美出席G20峰會的安排。依目前公布的行程，兩國領袖預計在年底前接續互訪，川普並將在深圳與習近平再次會晤。

美國國務院發布的通話摘要指出，這次通話應中方要求進行。雙方重申兩國領導人的承諾，要在尊重、公平與互惠基礎上，建立具建設性的戰略穩定關係；雙方也認為，領導人層級的實質對話，對推動和平及非核化等目標至關重要。

川普預計先赴菲律賓，於11月17日出席東協－美國特別峰會，再轉往中國深圳參加APEC峰會。若按計畫與習近平會面，將是繼5月北京峰會、9月華府峰會後，兩人今年第三度會晤。習近平則預計12月赴佛羅里達州，參加由川普主持的G20峰會。

通話內容也提及可能與俄羅斯舉行三方領導人會晤，但這仍是可能選項，並非已確定的峰會安排。此次公開說明的具體行程，仍以川習互訪及兩場多邊峰會為主。</p><aside>編輯觀察：兩場多邊峰會提供美中領袖接續對話的機會；但雙方表達對話意願，不等於已就非核化或三方會晤達成具體協議。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120040.aspx">中央社國際</a></p><ul></ul></article><article><h2>媒體判定柯隆贏得密西西比州參議員選舉　海德－史密斯承認敗選</h2><p>美國密西西比州聯邦參議員選舉出現席次翻轉。美聯社及包括CNN、NBC在內的多家媒體11日判定，民主黨候選人柯隆擊敗尋求連任的共和黨參議員海德－史密斯；她的發言人隨後證實，海德－史密斯已致電對手承認敗選。

這場選舉的結果經過數天計票才逐漸明朗，地方選務人員持續處理郵寄選票，以及州內稱為「誓詞選票」的臨時選票後，美聯社作出柯隆勝選的判定。目前所獲資訊是媒體判定與對手認敗，並非選務機關的正式認證結果。

43歲的柯隆擔任地方檢察官。依媒體判定結果，他將成為140多年來首位從密西西比州當選聯邦參議員的非裔美國人，也打破該州自1947年以來未選出民主黨籍聯邦參議員的局面。這次席次翻轉發生在民主黨重新取得聯邦參眾兩院多數的期中選舉中。

柯隆競選期間強調，他要代表全體密西西比州民，並主張民主黨應重新代表鄉村、郊區與都市地區的民眾，以具體成果改善選民生活。在種族分歧長期影響政治與社會發展的密西西比州，這項競選訴求與此次勝選的代表性，成為選舉受到關注的重要面向。</p><aside>編輯觀察：這場選舉同時涉及政黨席次翻轉與非裔政治代表性的變化；判讀結果時，仍應區分媒體勝選判定、對手認敗與正式認證。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120025.aspx">中央社國際</a></p><ul></ul></article><article><h2>巴拉圭Ueno Bank倒閉後啟動退款　央行稱合格存戶均已取回部分存款</h2><p>巴拉圭數位銀行Ueno Bank倒閉後，存戶退款已有進展。巴拉圭中央銀行11日表示，所有符合存款保障基金理賠資格的客戶，都已至少取回部分存款，累計有181萬2348人收到部分退款；這不代表存款已全數償還，銀行持有的大部分資金仍未追回。

Ueno Bank因嚴重償付能力疑慮，於11月3日遭接管，存戶帳戶遭凍結、無法提款，並引發大規模抗議。央行官員阿科斯達表示，合格客戶已「百分之百」獲得至少部分退款，但銀行高階主管與股東不在存款保障基金的理賠範圍內。

危機影響也不僅限於個別存戶。Ueno Bank曾持有逾8億美元公共資金，並承辦國家退休金業務及多個政府機構帳戶。這家原本規模不大的金融科技公司，以數位服務為主要營運模式，吸引許多低收入客戶，短短3年內成為金融業的重要業者。

與銀行有關聯的前總統潘尼亞於11月6日遭彈劾，目前被羈押候審。他曾持有Ueno Bank控股公司股份，直到去年才出售。潘尼亞被控利用總統職權，將數百萬美元政府存款轉入該銀行，並在外界已對放貸及償付能力提出警告後，隱瞞或淡化財務困境；他否認所有指控。</p><aside>編輯觀察：合格存戶全數收到部分退款，與所有損失獲得清償是不同進度。銀行涉及公共資金與退休金業務，也使資金追償及責任釐清不只是私人存款問題。</aside><p><a href="https://www.cna.com.tw/news/aopl/202611120068.aspx">中央社國際</a></p><ul></ul></article><article><h2>義大利逾6000所學校收炸彈恐嚇信　警方未發現爆裂物</h2><p>義大利超過6000所公立學校11月11日收到炸彈恐嚇郵件，數百所學校緊急疏散。警方清查後未發現爆裂物，學校12日恢復上課。恐嚇信寄件地址使用台灣大葉大學網域，駐義代表處表示，台灣相關機構願與義大利當局合作，提供技術支援、協助查明真相。

這批郵件約在11日上午9時50分寄抵各地學校，聲稱校內裝有遙控爆炸裝置。各校處置不一，部分緊急通知家長接走學生，也有學校在檢查確認安全後，讓師生返回校內繼續上課。

義大利總理梅洛尼當天下午召開緊急會議，晚間透過影片表示，目前沒有具體危險，不會讓匿名郵件決定學校行事曆。她也警告，類似恐嚇可能再次出現，目的在於製造恐懼與混亂。

恐嚇信的寄件人顯示名稱為繁體中文，內文卻以俄文名字署名。報導提及信箱疑遭盜用，但實際寄件者與寄送方式仍待查明，不能僅憑郵件網域或署名判定來源。駐義代表處同時表明，台灣譴責任何恐嚇行為。</p><p><a href="https://www.cna.com.tw/news/aopl/202611120019.aspx">中央社國際</a></p><ul></ul></article><article><h2>紐約布魯克林3層樓建築倒塌　至少1死12傷、仍有人受困</h2><p>美國紐約市布魯克林福來布許一棟3層樓建築，11月11日下午約4時倒塌。CNN較晚消息指出，事故造成至少1人死亡、12人受傷，仍有1人受困；消防人員持續在瓦礫中搜尋。

事故發生時間為台灣時間12日上午5時左右。紐約市消防局稍早公布的傷亡為1人死亡、4人傷勢危急送醫，另有6人受輕傷，與後續報導的受傷總數有時間差。現場影像顯示，倒塌建築的牆面崩落，臥室及衣櫃外露；已有多人從瓦礫中獲救，其中一名兒童由擔架抬出。

倒塌建築附近有一處工地，但事故原因仍待釐清，尚不能認定與鄰近工程有關。紐約市建築局表示，稽查人員已到場協助搜救，並檢查附近建築物的結構穩定性。</p><p><a href="https://www.cna.com.tw/news/aopl/202611120024.aspx">中央社國際</a></p><ul></ul></article><article><h2>俄駐美大使達爾奇耶夫逝世　享年66歲、死因未公布</h2><p>俄羅斯駐美國大使達爾奇耶夫逝世，享年66歲。俄羅斯外交部11月11日證實死訊，但未公布具體死因及相關細節；美國國務院也證實，他當天在莫斯科逝世。

達爾奇耶夫於2025年3月獲任命為駐美大使，任職約一年半，長期負責俄美外交事務。他曾在2014年至2021年間擔任俄羅斯駐加拿大大使，並於2021年至2024年間出任俄羅斯外交部北美司司長。

俄羅斯外交部形容他是傑出的外交官、經驗豐富的領導者與親切友善的同事。美國國務院發言人則向他的家人及親友表達哀悼，並表示有關逝世的其他詳細資訊，應向俄羅斯政府洽詢。雙方已確認死訊，但目前公布的資訊未說明死亡原因。</p><p><a href="https://www.cna.com.tw/news/aopl/202611120035.aspx">中央社國際</a></p><ul></ul></article><article><h2>G7外長重申反對武力改變台海現狀，總統府表達感謝</h2><p>七大工業國集團（G7）外長在巴黎會議後發表聯合聲明，重申維持台灣海峽和平與穩定至關重要，反對以武力或脅迫片面改變現狀，並支持台灣有意義地參與國際組織。總統府11月12日回應，台灣將持續強化自我防衛能力與全社會韌性，並與國際夥伴合作維護區域穩定。

法國擔任2026年G7輪值主席國，G7外長與歐盟外交與安全政策高級代表於11月9日至10日在巴黎開會。會後聲明涵蓋烏克蘭、中東及印太情勢；在台海議題上，外長們對中國在台灣以東海域日益強勢的活動表達關切，認為這些活動威脅區域穩定、航行自由及國際航運安全，並鼓勵透過建設性對話和平解決兩岸議題。

聲明也將台海置於更廣泛的印太安全脈絡，強調主權、領土完整、法治與和平解決爭端等原則，重申維護航行及飛越自由，呼籲各國遵守包括《聯合國海洋法公約》在內的國際法義務，並對東海、南海局勢表達嚴重關切。

總統府發言人郭雅慧表示，台海及印太和平穩定攸關全球安全與繁榮，感謝G7成員國與歐盟持續關切台海情勢。她說，台灣將與包括G7成員國在內、理念相近的國際夥伴緊密合作，善盡國際義務，維護區域安全與繁榮。</p><aside>編輯觀察：聲明同時涵蓋台海安全、國際航運與台灣國際參與，顯示相關政策表態不只著眼於兩岸，也涉及印太共同秩序。總統府則以自我防衛、社會韌性及國際合作回應。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611120003.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611120063.aspx">中央社政治</a></li></ul></article><article><h2>輝達傳研議黃仁勳去留，國會要求說明涉諜爭議</h2><p>輝達執行長黃仁勳面臨董事會調查與美國國會要求說明。董事會已就他承認與Megaspeed高階主管黃樂的婚外情啟動調查；另有知情人士透露，董事會預計11月11日討論其去留，並與外部機構尋找潛在接班人。會議與接班安排仍屬消息人士說法，尚無撤換決定獲得證實。

公司治理爭議也涉及另一項尚未證實的指控。《紐約時報》引述5名輝達前員工稱，黃仁勳與直接向他報告工作的醫療保健事業部副總裁鮑爾發展婚外情。輝達行為準則要求員工避免私人關係造成利益衝突；針對這項關係指控，公司拒絕評論，鮑爾未立即回應。董事會先前啟動的調查由外部律師事務所主導。

黃樂被美方指為中國情報人員，中國否認相關間諜指控，黃樂尚未回應置評請求。美國聯邦眾議院3個委員會的共和黨籍領導人已要求黃仁勳出席聯合閉門簡報，說明雙方往來。議員表示，若他未同意出席，可能發出傳票；目前取得的報導並未確認傳票已發出，也未證實黃仁勳洩露機密。

爭議另延伸至Megaspeed的晶片出口管制問題。Axios的消息人士指稱，美國財長貝森特曾質問商務部長盧特尼克，為何尚未將這家被控非法轉運美國晶片至中國的公司列入實體清單。相關閉門交涉與官員阻擋追究責任的說法，均來自匿名消息人士。Megaspeed先前表示，已啟動專案調查，並多次向美國政府表達全力配合的意願。

科技記者、黃仁勳傳記作者維特則提出，涉案資料中心可能以假伺服器營造設備已安裝的假象，再將真設備轉運中國。他也談到遠端出租算力等可能途徑，但這些屬於對規避管制手法的分析與推測，不能視為Megaspeed已被證實採用的做法。</p><aside>編輯觀察：這起事件涉及高階主管利益衝突、接班安排與出口管制三個不同層次。董事會調查、國會要求說明及轉運指控應分開檢視，不能因彼此相關，就將未證實的關係或手法推定為違法結論。</aside><p><a href="https://www.cna.com.tw/news/afe/202611120036.aspx">中央社財經</a></p><ul><li><a href="https://techcrunch.com/2026/11/11/nvidias-stock-drops-as-board-reportedly-preps-to-oust-ceo-jensen-huang/">TechCrunch</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611120021.aspx">中央社國際</a></li><li><a href="https://techcrunch.com/2026/11/11/congress-to-call-jensen-huang-in-to-answer-for-alleged-chinese-spy-affair/">TechCrunch</a></li><li><a href="https://www.cna.com.tw/news/aopl/202611120008.aspx">中央社國際</a></li><li><a href="https://www.cna.com.tw/news/ait/202611110088.aspx">中央社科技</a></li></ul></article><article><h2>英格蘭高教監管機構促增加現場評量，警告不改善可能受制裁</h2><p>英格蘭高等教育監管機構Office for Students（OfS）要求大學增加不依賴AI的評量，鼓勵採用傳統考試與現場簡報，並警告，未能建立可靠評量方式的學校可能面臨制裁。這項警告針對評量制度的可信度，並非已對學校作出處分。

OfS與Advance HE共同調查127所機構的逾300名受訪者，發現學生大量使用AI撰寫文章及學位論文，往往未被察覺，成績也與未使用AI者相近。調查報告提及，有學生以ChatGPT完成整篇作業，事後卻無法回憶基本內容；教師也反映，收到大批引用來源及文風高度一致的作業。這些發現來自受訪者經驗，不能直接當作所有學生使用AI的比例。

OfS策略主管Josh Fleming認為，這對學位公信力構成「世代風險」，要求更廣泛採用不使用AI的評量。部分大學已轉向口試、重視學習過程的評量，或要求學生批判性修改AI生成文字。英國教育部也要求大學認真處理，並希望OfS就AI使用建立明確、有力且持久的監管架構。</p><aside>編輯觀察：核心問題不只是能否辨識AI文字，而是成績能否可靠反映學生能力。現場表現、學習過程與批判性修改等方式，代表評量重點可能由繳交成品轉向可核實的理解與表達。</aside><p><a href="https://the-decoder.com/uk-regulator-threatens-universities-with-sanctions-unless-they-adopt-ai-proof-exam-formats/">The Decoder</a></p><ul></ul></article><article><h2>台美簽署備忘錄啟動學人計畫　外交部：來台美官員不處理機敏資料</h2><p>台美11月10日在華府簽署合作瞭解備忘錄，啟動台灣學人計畫，將安排美國官員來台接受華語訓練，再進入政府機關、立法院或非政府組織交流。外交部次長陳明祺12日表示，來台官員不會處理機敏資料；台灣也正爭取派員赴美，但尚非已確立的對等安排。

備忘錄由駐美代表俞大㵢與美國在台協會執行理事藍鶯代表簽署。依駐美代表處說明，美方官員可先在台學習中文至多一年，接著在相關機構工作至多一年。外交部指出，計畫結合語言訓練、政策研習與實務交流，目標是培育熟悉台灣議題及印太區域事務的美國政府專業人才。

對於實務交流的範圍，陳明祺說明，主要是參與、推動及觀察一般政務，讓美方官員了解台灣政策如何運作，不涉及機敏資料。至於台方赴美交流，他表示仍在爭取機會，並提及外交部及其他部會人員已有參與美國智庫的交流經驗。

這次簽署也是先前立法走向執行的進展。美國聯邦眾議員貝拉於2021年提出台灣學人法案，法案納入2023年國防授權法，於2022年12月簽署生效。貝拉表示，讓美國官員在台生活與工作、取得第一手經驗，有助累積未來強化雙方關係所需的專業與人脈。</p><aside>編輯觀察：計畫把語言學習與政策實務交流納入同一架構；判讀其進展時，應區分已簽署啟動的美方來台安排，以及台方仍在爭取的赴美機會。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611120026.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611120065.aspx">中央社政治</a></li><li><a href="https://www.cna.com.tw/news/aipl/202611120022.aspx">中央社政治</a></li><li><a href="https://www.cna.com.tw/news/aipl/202611110320.aspx">中央社政治</a></li></ul></article><article><h2>施振榮將代表台灣出席深圳APEC領袖會議　聚焦經濟合作與供應鏈</h2><p>總統府11月11日宣布，總統賴清德敦請宏碁集團創辦人暨榮譽董事長施振榮，代表台灣出席今年的亞太經濟合作經濟領袖會議。會議預定11月18日至19日在中國深圳舉行。

知情人士表示，賴清德期許此行達成三項目標：讓台灣聲音在國際舞台清楚傳遞、彰顯台灣在關鍵半導體供應鏈中的不可或缺性，以及表達台灣將持續扮演區域和平與繁榮的穩定力量。這些是會前設定的出席目標，尚非會議成果。

該人士指出，選擇產業領袖擔任代表，是要凸顯台灣參與APEC聚焦經濟合作、追求務實成果的目的，並借重施振榮的產業經驗，向各經濟體傳達政策願景。供應鏈韌性也是此行論述重點，知情人士以施振榮倡議的全球分工與資源整合，說明透過互補合作建立安全供應網絡的方向。

對於中國可能限制台灣參與，知情人士12日表示，台灣不會因此放棄會員義務，並稱中國爭取主辦權時曾承諾保障各會員權益及會議品質。該人士認為，若北京違反承諾，將反映其對國際規則的態度。這些說法屬會前風險評估與政治表態，不能視為本屆會議已發生具體限制。</p><aside>編輯觀察：此次代表人選與會前目標，呈現台灣以產業及供應鏈議題推動國際參與的方向；實際參與條件與合作成果，仍須與會前政治表態分開檢視。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611110268.aspx">中央社政治</a></p><ul><li><a href="https://www.cna.com.tw/news/aipl/202611120051.aspx">中央社政治</a></li></ul></article><article><h2>育兒留停放寬至子女未滿9歲獲協商共識　產假、產檢假仍待議</h2><p>立法院衛環委員會11月11日就性別平等工作法、就業保險法修法進行黨團協商，同意將育兒留職停薪及彈性育兒假的適用期限放寬至子女未滿9歲，並同意雙親都領滿6個月育兒留職停薪津貼後，雙方可各再多領3個月。相關內容仍待完成立法，並非已生效的新制。

年齡上限是這次協商的主要進展。勞動部條件及就業平等司長黃琦雅表示，6至8歲兒童仍可能因腸病毒等情況臨時停課，因此同意放寬至9歲以前。原主張延伸至12歲的民眾黨立委邱慧洳，同意此次先以未滿9歲為期限，另提出附帶決議，要求勞動部以獎勵方式鼓勵企業支持9至12歲子女的照顧需求。

產假與產檢假天數則尚未取得共識。勞動部提出產檢假增至10個工作日、產假延長為12週的方案，但朝野立委仍有歧見，相關條文保留後續協商。這與先前行政部門提出的育兒假可用到6歲等措施，應分別看待，不能一併當作已通過的法律。

立法院長韓國瑜預定13日上午召集協商，再依議事規定處理。由於法案已過一個月協商冷凍期，最快可能於當天三讀，但是否通過及最終條文內容，仍須以後續議事結果為準。</p><aside>編輯觀察：協商共識將照顧支持範圍延伸至學齡初期，但家庭與雇主規劃請假安排時，仍須確認最終通過條文及施行規定，不能把協商結果直接當成現行權利。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611110248.aspx">中央社政治</a></p><ul></ul></article><article><h2>卓榮泰：十年供電規畫納入AI需求　核三是否重啟仍待程序確認</h2><p>行政院長卓榮泰11月11日表示，政府未來十年的電力供應規畫已納入AI產業成長需求，並將持續推動智慧儲能、科技節能及電網韌性建設。核三廠則正依程序確認是否重啟，尚非已決定重啟。

卓榮泰在接見國家磐石獎及海外台商磐石獎得獎企業時指出，經濟部估計，未來十年國家用電需求的平均年成長率，將由原先的1.7%提高至2.5%。他表示，相關供電需求已納入計畫；這是政府對需求與供應規畫的說明，並非已完成供電建設的成果。

在既有供電規畫之外，卓榮泰將核三重啟列為可能增加的能源選項，並表示台灣正接觸研發中的小型模組化反應爐（SMR）等新型核能。但他也提出前提：技術必須安全、核廢料能有更好的處理方式，且具備足夠社會共識，才會與相關先進技術接軌。

產業配套方面，卓榮泰表示，政府提出「中小微企業轉型升級條例」，希望協助中小微企業成為高科技產業的合作夥伴，政策涵蓋範圍也包括觀光、商圈、夜市、傳統市場及農業。他另提到跨國勞動力引進方案與串連南北水資源的珍珠串計畫，將人力、水與電力供應一併列為支持產業發展的政策工作。</p><aside>編輯觀察：用電需求估計上修，使供電建設進度與電網韌性成為檢視政策的重要環節；十年規畫、核三重啟評估及新型核能接軌，仍須區分各自的程序與前提，不能視為已落實的供電能力。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611110247.aspx">中央社政治</a></p><ul></ul></article><article><h2>曠世智能投資案遭要求公開投審資料　財政部稱正補件回覆審計部</h2><p>曠世智能獲政府投資引發利益衝突迴避爭議，國民黨立法院黨團11月11日要求國發會、財政部在24小時內公布完整投審資料。財政部回應，已提供資料給審計部，並正依後續要求彙整補充內容；國發基金則表示，已依法提供立委所需資料並配合查核。

爭議涉及擔任曠世智能董事的蘇巧純，她是民進黨新北市長參選人蘇巧慧的妹妹。國民黨團書記長許宇甄質疑，財政部未按先前承諾提出完整說明，並表示若當週仍未提出報告，將嚴審相關首長與機關預算。立委王鴻薇另質疑，財政部11月6日提交的內容未滿足審計部要求。這些均為國民黨方面的質疑，尚不能據此認定存在違法或利益輸送。

財政部長莊翠雲在立法院答詢時否認拖延，說明審計部要求提供所有泛公股金融資料，彙整需要時間，財政部已於11月6日送交相關資料。審計部11月9日再行文要求其他資料，財政部正彙整中，將於文到七日內依要求項目答覆。

國發基金表示，將在符合法令及資訊保護規範的前提下，持續配合審計、監察機關調閱與查核，兼顧資訊透明及企業合法權益。基金並提出後續作法：在受理申請階段，主動提醒申請者留意是否涉及「公職人員利益衝突迴避法」所定關係人，鼓勵揭露相關資訊，並持續落實投後管理。</p><aside>編輯觀察：本案須分開檢視資料是否按要求提供，以及投資程序是否涉及利益衝突。補件時程與公開程度是監督焦點，但不能直接代替對投資合法性的查核結論。</aside><p><a href="https://www.cna.com.tw/news/aipl/202611110306.aspx">中央社政治</a></p><ul></ul></article><article><h2>MSCI調升台股三項指數權重　成分股調整11月30日收盤生效</h2><p>MSCI於11月12日公布半年度調整結果，台股在全球市場、全球新興市場及亞洲除日本三項指數的權重同步提高，相關權重與成分股調整將於11月30日收盤生效。全球標準指數的台灣成分股新增三檔、刪除四檔，全球小型指數則為18檔納入、12檔剔除。

權重方面，台股在全球市場指數由3.25%升至3.28%，增加0.03個百分點；在全球新興市場指數由28.86%升至29.01%，增加0.15個百分點；在亞洲除日本指數由32.72%升至32.83%，增加0.11個百分點。全球新興市場指數中，印度權重增幅最大，增加0.17個百分點；中國降幅最大，減少0.13個百分點。

全球標準指數新增台燿、南電、景碩，刪除中租-KY、嘉澤、元太及萬海，MSCI台灣指數成分股降為73檔。台燿權重增加0.37個百分點至0.37%，為此次調升最多的成分股；台積電則減少0.25個百分點至54.29%，為調降最多者。另有24檔成分股調整在外流通股數。

台燿、南電與景碩今年8月曾列入全球標準指數新增名單，但當時三檔股票均遭台灣證券交易所列為處置股，受指數編纂規則限制而延後納入，仍留在小型指數。本次調整後，三檔由小型指數轉入標準指數；中租-KY、元太與嘉澤則由標準指數轉入小型指數。小型指數其他新增成分股包括營邦、永擎及波若威，其他剔除者包括中碳、東方風能及崑鼎。

MSCI每年2月、5月、8月及11月進行定期審核與調整。此次變動可能影響全球基金對台股及個別股票的資金配置，但權重提高本身不等於已發生資金流入，也不能直接推算流入金額。</p><aside>編輯觀察：台股整體權重上升與個別成分股權重下降可以同時發生；投資人需區分市場配置比重、個股進出及指數間轉列，不能把此次調整一概解讀為所有台股同步受惠。</aside><p><a href="https://www.cna.com.tw/news/afe/202611120066.aspx">中央社財經</a></p><ul><li><a href="https://www.cna.com.tw/news/afe/202611120027.aspx">中央社財經</a></li></ul></article><article><h2>南亞擬投資115.3億元建彰濱玻纖布廠，另增資台灣必成8億元</h2><p>南亞董事會11月11日通過，擬投資新台幣115.3億元，在彰化縣彰濱廠區興建第5座玻纖布廠，規劃年產能1億公尺、月產約800萬至900萬公尺，重點生產薄布與超薄布。同時，南亞將對全資子公司台灣必成增資8億元，擴充上游特殊玻纖紗產能。

南亞目前在台灣的4座玻纖布廠均位於嘉義新港，新廠則選址彰濱，鄰近台塑新智能的電芯工廠。公司表示，未來也將持續規劃在彰濱擴建銅箔基板等電子材料產能；這些後續布局仍屬規劃，並非已完成投產。

此次投資的需求判斷，來自南亞對AI伺服器、網通產品等高階應用成長的預期。公司認為，印刷電路板層數提高，將帶動玻纖布需求；除台灣新廠外，也將持續規劃增加兩岸產能。南亞目前在中國大陸昆山另有4座玻纖布廠。

上游布局方面，台灣必成目前股本約10億元，設有3座大型工廠，主要生產通用級電子級玻纖紗。南亞表示，這次增資是因應特殊玻纖紗擴產所需資金，希望透過玻纖紗與玻纖布的產能配置，強化上下游材料的垂直整合。</p><aside>編輯觀察：這次布局同時涵蓋玻纖布及其上游玻纖紗，重點不只在單一工廠擴產，也在材料供應的垂直整合。不過，投資決議與產能規劃仍須和實際投產、訂單需求分開看待。</aside><p><a href="https://www.cna.com.tw/news/afe/202611120043.aspx">中央社財經</a></p><ul></ul></article><article><h2>元大台灣50正2規模突破3000億元，投信提醒留意單日槓桿風險</h2><p>元大台灣50正2（00631L）ETF資產規模首度突破新台幣3000億元。根據台灣證券交易所統計，最新規模達3186億元，位居台股ETF規模第6名；資產擴大的同時，這項以指數單日正向兩倍報酬為目標的產品，也讓槓桿操作風險受到關注。

元大投信指出，00631L規模今年4月16日突破1000億元、6月12日跨過2000億元，11月11日再突破3000億元。公司將規模成長歸因於今年台股上漲及資金挹注，不能將資產規模的增加全數視為新投入資金。

集保結算所數據則顯示，今年以來截至11月6日當週，00631L累計淨申購金額為2220億元，投資人數增加35.2萬人，達39.1萬人。這組數據呈現資金與參與人數的變化，與基金資產規模是不同的觀察指標。

元大投信表示，00631L以台灣50指數為標的，操作目標是追蹤指數「單日」正向兩倍報酬，並提醒產品僅適合能持續留意行情變化的投資人，操作時應審慎評估、嚴設停損。單日報酬目標不應被當成任何持有期間都能取得兩倍報酬的承諾。</p><aside>編輯觀察：規模與參與人數增加，使投資人是否理解「單日兩倍」的適用範圍更為重要。基金規模、淨申購金額與投資報酬各有不同意義，不能彼此替代，也不代表未來績效。</aside><p><a href="https://www.cna.com.tw/news/afe/202611120067.aspx">中央社財經</a></p><ul></ul></article><article><h2>CoreWeave營收增168%仍虧損，轉向客戶預付款與合約融資</h2><p>出租AI運算能力的CoreWeave，正調整支應算力擴張的資金來源，增加客戶預付款、以特定客戶合約支持的借款，並爭取價格較高的短期合約。公司第三季營收達36.6億美元、年增168%，但同季仍有7.09億美元淨損，利息支出達8.46億美元，顯示營收快速成長仍伴隨沉重的融資成本。

執行長Michael Intrator在財報電話會議表示，公司不會以目前殖利率水準進入無擔保債市場籌資，也認為沒有必要。CoreWeave計畫改以特定客戶合約作為貸款支持，按資金需求分批動用，支應履行1325億美元待履行訂單所需的大部分待建基礎設施。

公司預期，未來3個月將取得約90億美元的客戶預付款與訂金，其中超過30億美元與已建置產能的新客戶合約有關，不需額外投入硬體支出。這些金額仍是公司預期，並非已全數收取的現金。預付款可望降低近期借款需求，但也意味公司須依約定價格提供後續服務。

短期合約則是另一條籌資與定價路徑。CoreWeave在8月完成一筆26億美元貸款，專為較短期的客戶合約設計，可依需求分期借款。公司表示，7月曾將各項服務價格調高約25%，當季稍後再調高10%，本季價格仍持續上升；這些定價變化屬公司說法。

短約讓公司更頻繁調整價格，卻未必同樣有利於融資。放款方更重視長約帶來的可預測現金流，即使其價格較低。TechCrunch報導，CoreWeave部分債券殖利率上月曾超過15%；新策略能否改善資金壓力，仍取決於後續需求、續約與定價能力，不能僅憑營收成長就判定債務風險已解除。</p><aside>編輯觀察：CoreWeave的資金安排呈現AI算力擴張中的取捨：預付款有助降低眼前借款需求，短約提供調價彈性，但長約較能支持放款方重視的穩定現金流。資金來源改變，不等於風險消失。</aside><p><a href="https://techcrunch.com/2026/11/11/coreweave-turns-to-customer-prepayments-shorter-contracts-to-fund-ai-growth/">TechCrunch</a></p><ul></ul></article><article><h2>Ramp客戶10月AI支出創高、月增1.65%　高額支出仍集中少數企業</h2><p>金融服務業者Ramp的AI支出指數顯示，其美國企業客戶2026年10月的AI支出再創新高，較前月增加1.65%，但成長幅度有限。這項指數取自逾8.5萬家美國企業的支付資料，呈現的是Ramp客戶的支出變化，不能直接視為全美企業的採用情況。

樣本內的支出差距相當大。AI支出最高的1%企業，每名員工每月AI支出中位數達1萬200美元，增加9%；相較之下，一般企業為16.32美元，較前月增加不到1美元。Ramp首席經濟學家Ara Kharazian指出，樣本中僅1%的企業便貢獻OpenAI與Anthropic相關營收的80%，這些高支出客戶主要是獲創投支持的科技、金融與技術服務企業。

使用量增加，也未必帶來同等幅度的收入成長。Ramp資料顯示，平均每百萬文字token的價格較前月下跌21%，用量成長快於支出。不過，token用量與相關支出數據僅來自使用Ramp Token Spend Management的企業，不能代表整個平台的AI支出。

部門用途也出現變化：軟體開發團隊仍占追蹤支出的72%，但支出已較夏季高點下降；客服與客戶成功部門的占比則從6月的0.8%升至10月的13.3%。Kharazian認為，這類用途較偏好便宜、快速的模型，新客戶未必能帶來同樣高的利潤。解讀整體趨勢仍須注意，Ramp客戶較偏向成長型、熟悉科技且規模較大的企業，免費工具與個人帳號使用也可能未被納入，採用率因此可能偏高。</p><aside>編輯觀察：支出集中與單位價格下降須分開觀察：企業增加AI用量，不等於供應商收入或利潤同步增加；而這份客戶樣本也不足以證明AI已普遍滲透所有產業。</aside><p><a href="https://the-decoder.com/us-corporate-ai-spending-hits-a-new-high-in-october-but-growth-slows-to-1-65-percent/">The Decoder</a></p><ul></ul></article><article><h2>資安公司檢查Grok應用：94.7%可免登入存取，部分含病患與企業資料</h2><p>資安公司Claroc表示，在其檢查的37,571個仍在線Grok生成應用程式中，有35,578個不需登入即可存取，占94.7%。研究發現，部分應用包含病患資料、明文密碼及企業機密；這項比例指的是受檢應用的公開存取狀態，並不代表全部都含敏感資料或已遭入侵。

Grok的「Build」模式讓使用者透過對話描述需求，再由AI生成程式；建立者點選發布後，應用便取得grok.me網址。Claroc指出，其測試使用的付費帳號在發布視窗中，預先勾選的是允許持有連結者存取。每個應用又有獨立子網域，首次造訪後，名稱便可能出現在可依規則搜尋的商業被動DNS資料庫，使網址不難被找到。

Claroc稱，多數公開應用是遊戲、介紹頁或計算工具，但估計有650至800個含私人資料。確認案例包括載有病患檢驗數值的加護病房簡報，以及原始碼內含18組帳號與明文密碼的工時紀錄應用。另有24個公開應用來自SpaceXSI與X員工，其中包含機密新人到職計畫、594個策略客戶及銷售商機資料。

研究也指出，加入登入功能不必然代表權限控管正確。Claroc自行建立的銷售團隊測試應用，會先把已登入者加入團隊，之後才檢查成員資格，導致外部Google帳號仍能讀取、修改與刪除紀錄。Claroc表示，寫入與刪除測試只在自有應用進行；將權限設為僅本人使用時，則能阻擋外部存取。

SpaceXSI回應，應用在建立者分享前維持私人狀態，發布須經多個步驟並包含法律告知，員工帳號也預設僅本人可用。Claroc則主張，最後一步若仍預選開放連結存取，多次確認並不足夠。報導指出，24個員工應用已下線，其他使用者與組織的公開應用尚未移除；Claroc正直接通知受影響者。該公司本身也銷售AI生成應用的資安產品。</p><aside>編輯觀察：這項研究凸顯兩個不同風險：發布時的預設分享權限，以及生成程式本身的授權邏輯。應用具備登入畫面，不等於資料存取限制已正確生效。</aside><p><a href="https://the-decoder.com/grok-built-apps-exposed-patient-data-plaintext-passwords-and-spacexsis-own-sales-pipeline/">The Decoder</a></p><ul></ul></article><article><h2>日本宜得利伺服器遭非法存取　最多約3762萬筆會員資料恐外洩</h2><p>日本家具連鎖企業宜得利（NITORI）公布，伺服器遭到非法存取，最多可能有約3762萬筆會員及網路購物使用者的個人資料外洩，可能涉及姓名、住址與電子郵件等資訊。

宜得利控股表示，已於11月6日確認伺服器遭非法存取。由於系統未保存信用卡資訊，信用卡資料不在這次可能外洩的範圍內。目前公布的是可能受影響的資料筆數，並非已確認外洩的總量，也不能直接視為相同數量的受影響人數。</p><aside>編輯觀察：信用卡資訊未被納入可能外洩範圍，不代表其他個資風險已排除；事件仍須區分可能受影響範圍與最終確認的外洩規模。</aside><p><a href="https://www.cna.com.tw/news/ait/202611110191.aspx">中央社科技</a></p><ul></ul></article><article><h2>Helsing發表軍事AI平台Clarity，稱目標交付武器系統須由人員授權</h2><p>德國國防科技公司Helsing在柏林發表Clarity平台，主打將感測器、公開情報與軍事報告整合為目標建議，再交由人員審查。公司表示，選擇打擊目標的權限仍由人類掌握，每次將資料交付武器系統，都必須取得人員授權。

依Helsing說明，Clarity可處理軍事單位能取得的各類資料，透過數百個專門化AI代理，辨識軍事部隊、設施及位置，整理敵方資產資訊。平台會先將分析結果交付人員檢視，再把資料整理成適合相應武器系統使用的形式；這些代理的訓練資料包括真實作戰資料、AI生成的合成資料及模擬環境。

在監督機制上，Helsing宣稱，只有當獨立來源相互吻合、評估具高度可信度時，系統才會提出目標建議，而且每項決策都會記錄負責人的姓名。這些是公司提出的設計與使用承諾，不能直接等同於實際作戰中已能確保人員充分審查或避免錯誤。

資料控制也是產品訴求之一。Helsing表示，Clarity在客戶自己的基礎設施上運行，模型與介面均在歐洲開發，資料及操作由使用的軍隊掌控。公司並稱，平台遵循模組化開放系統架構與北約標準，可連接不同製造商的武器系統；但並未說明是否已有客戶實際運行Clarity。</p><aside>編輯觀察：評估軍事AI的人類監督，關鍵不只在於是否設有授權步驟，還包括審查者能否核對證據，以及責任紀錄能否支援追查。現有資料足以說明產品承諾，尚不足以判定其實際成效。</aside><p><a href="https://the-decoder.com/helsing-built-an-ai-system-that-prepares-targets-for-weapons-systems-and-says-every-decision-will-carry-a-human-name/">The Decoder</a></p><ul></ul></article><article><h2>AlphaProof Code驗證Signal密碼核心，研究團隊稱四週完成</h2><p>Google DeepMind發表AlphaProof Code，研究團隊表示，這套AI系統以Signal實際在使用者裝置上運行的密碼核心程式為對象，在四週內完成通常需要數年的形式驗證工作。這項成果針對指定程式與安全規格，不代表Signal整體或所有軟體已不存在漏洞。

研究人員Pushmeet Kohli與Swarat Chaudhuri說明，過去相關驗證工作停留在理論設計階段，此次則進一步檢查實際程式。流程先由專家定義形式化安全要求，再由以Gemini Carbon為基礎的AI代理，使用Lean證明語言撰寫超過600萬行內容，並標記約百分之一的程式碼交由人員審查。

依團隊公布的測試結果，兩個刻意植入的錯誤都立即被找出。Signal技術長Ehren Kret認為，這種方法有助在AI威脅增加之際強化資料隱私的信任；DeepMind也計畫透過CodeMender等系統，將方法延伸至電網及醫療裝置。這些後續用途仍屬計畫，不能視為已完成同等驗證。</p><aside>編輯觀察：這項工作值得關注之處，是將形式驗證推進至實際運行的程式；但判讀安全性時，仍須區分「符合所定義的安全要求」與「整套服務沒有任何漏洞」。</aside><p><a href="https://the-decoder.com/google-deepminds-alphaproof-code-verified-signals-cryptographic-core-in-four-weeks-instead-of-years/">The Decoder</a></p><ul></ul></article><article><h2>AI納入美國颶風預報作業，專家仍須整合模型與即時觀測</h2><p>AI模型已成為美國颶風預報的作業工具之一。美國國家颶風中心作業部門主管布朗表示，中心於2025年6月底開始在實際作業中使用AI模型，並在2026年將Google DeepMind模型納入部分路徑與強度綜合預測輔助系統；不過，最終預報仍須由專家綜合不同模型與觀測資料判斷。

DeepMind於8月在《自然》發表的研究指出，其模型平均可將同等準確度的預測時間向後延長一天，也就是把原本未來兩天的準確度水準，延伸至未來三天。模型還能為每個氣旋產生1000種可能發展情境，同步推估降雨量、行進路徑及強度。這反映的是研究所述的平均表現，並非每場風暴都能獲得相同幅度的改善。

在伊賽亞斯颶風案例中，DeepMind模型於風暴形成前一週辨識出其可能發展為熱帶氣旋。布朗表示，AI模型在這次風暴的路徑預測表現良好，似乎擅長快速預測複雜引導氣流的變化。國家颶風中心也使用歐洲中期天氣預報中心及美國國家氣象局的AI模型，而非只依賴單一工具。

限制在於，個別模型對路徑或強度的預測，可能在不同預測週期之間大幅變動。布朗指出，專家必須判斷哪些模型較能掌握特定風暴，再整合結果；演算法呈現的路徑機率，也不能取代人員查看即時飛機觀測與衛星資料、判讀風暴當下結構的工作。</p><aside>編輯觀察：更長的有效預測時間與多情境推估，對防災判斷具有價值；但單一風暴的成功案例不能代表所有情況，模型之間的差異及預測變動仍需要專業解讀。</aside><p><a href="https://www.cna.com.tw/news/ait/202611110106.aspx">中央社科技</a></p><ul></ul></article><article><h2>瑞典達拉木馬獲歐盟地理標示保護，產區外雕刻仍可納入製程</h2><p>瑞典傳統工藝達拉木馬於11月4日取得歐盟手工藝與工業產品地理標示保護，成為瑞典首件申請通過的手工藝品。未來只有符合指定產區及傳統製作規範的木馬，才能使用受保護的達拉木馬名稱；不過，這並不代表所有製作步驟都必須在產區內完成。

達拉木馬源自瑞典中部達拉納省的莫拉地區，原是家庭中的木雕裝飾。1939年紐約世界博覽會期間，瑞典館在門口設置大型達拉木馬，進一步打開國際知名度，讓這項地方工藝成為瑞典的文化象徵與遊客伴手禮。

達拉納的工坊也聘用瑞典其他地區的匠人協助製作。住在南部阿爾維斯塔的退休美術老師特德斯湯，就是其中之一。他向中央社表示，自己從工坊帶回150隻已有雛形的木馬、4把刀具及2隻完成品作為參考。雕刻要求包括四腿粗細一致、腹部平坦、臉部不帶特別表情，整隻木馬則須留下手工雕刻痕跡；他選擇在閒暇時每天雕刻5隻。

產地保護與跨地區分工如何並存，是這次取得保護後的具體界線。特德斯湯表示，依規定，製程須包括9個步驟，其中3個可在指定產區以外完成，雕刻便是其一，工坊經理也已向他保證工作不受影響。對這位擁有木工與藝術背景的退休教師而言，雕刻木馬不只是工作，也讓他重新連結童年在瑞典北部接觸的木工傳統，並參與技藝的代代傳承。</p><aside>編輯觀察：這項保護的重點在於產地名稱與傳統製作規範，而非要求每道工序都集中在產區。保留部分跨地區分工，呈現傳統工藝保護與匠人參與之間的安排。</aside><p><a href="https://www.cna.com.tw/news/acul/202611120017.aspx">中央社國際</a></p><ul></ul></article></main></noscript>
