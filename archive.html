<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史期數 · Daily Briefing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-meta">
      <div class="issue-number"><a href="index.html" style="color:inherit;text-decoration:none;">← 最新一期</a></div>
      <div class="weather">Archive</div>
      <div class="date"></div>
    </div>
    <h1 class="masthead-title" style="font-size:clamp(48px,8vw,96px);">歷史期數</h1>
    <p class="masthead-tagline">
      所有過往的每日早報
      <span class="en">All past issues of Daily Briefing</span>
    </p>
  </header>

  <main class="archive-list" id="archive-list">
    <p style="text-align:center;color:var(--ink-muted);padding:40px;">載入中…</p>
  </main>

  <footer class="site-footer">
    <a href="index.html">最新一期</a>
  </footer>

  <script>
    (async function () {
      try {
        const res = await fetch('data/archive.json');
        const data = await res.json();
        const list = document.getElementById('archive-list');
        const issues = [...data.issues].reverse(); // newest first
        list.innerHTML = issues.map(issue => `
          <a class="archive-item" href="index.html?date=${issue.date}">
            <div class="archive-date">${issue.date}</div>
            <div class="archive-issue-num">No. ${issue.issue_number}</div>
            <div class="archive-headline">
              ${escapeHtml(issue.headline_zh)}
              <span class="en">${escapeHtml(issue.headline_en)}</span>
            </div>
          </a>
        `).join('');
      } catch (err) {
        document.getElementById('archive-list').innerHTML =
          `<p style="text-align:center;color:var(--ink-muted);padding:40px;">載入失敗：${err.message}</p>`;
      }

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[c]));
      }
    })();
  </script>
</body>
</html>
