<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史期數 · Daily Briefing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-meta">
      <div class="issue-number"><a href="index.html" style="color:inherit;text-decoration:none;">← 最新一期</a></div>
      <div class="weather">新聞存檔</div>
      <div class="date"></div>
    </div>
    <h1 class="masthead-title" style="font-size:clamp(48px,8vw,96px);">歷史期數</h1>
    <p class="masthead-tagline">
      所有過往的早晚報
    </p>
  </header>

  <main class="archive-list" id="archive-list">
    <p style="text-align:center;color:var(--ink-muted);padding:40px;">載入中…</p>
  </main>

  <footer class="site-footer">
    <a href="index.html">最新一期</a>
  </footer>

  <script>
    (async function () {
      const escapeHtml = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const get = async path => { try { const r=await fetch(path,{cache:'no-store'});return r.ok?await r.json():null; }catch{return null;} };
      try {
        const [legacy,modern]=await Promise.all([get('data/archive.json'),get('data/editions/index.json')]);
        if(!legacy && !modern)throw new Error('無法取得歷史期數');
        const rows=[...((legacy&&legacy.issues)||[]).map(i=>({date:i.date,label:'第 '+i.issue_number+' 期',title:i.headline_zh,url:'index.html?date='+encodeURIComponent(i.date)})),
          ...((modern&&modern.editions)||[]).map(i=>({date:i.date,label:i.edition==='morning'?'早報':'晚報',title:i.title,url:'index.html?date='+encodeURIComponent(i.date)+'&edition='+encodeURIComponent(i.edition)}))];
        rows.sort((a,b)=>b.date.localeCompare(a.date)||(a.label==='晚報'?-1:1));
        document.getElementById('archive-list').innerHTML=rows.map(i=>`<a class="archive-item" href="${escapeHtml(i.url)}"><div class="archive-date">${escapeHtml(i.date)}</div><div class="archive-issue-num">${escapeHtml(i.label)}</div><div class="archive-headline">${escapeHtml(i.title)}</div></a>`).join('');
      }catch(err){document.getElementById('archive-list').textContent='載入失敗：'+err.message;}
    })();
  </script>
</body>
</html>
