<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史期數 · Daily Briefing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-meta">
      <div class="issue-number"><a href="index.html" style="color:inherit;text-decoration:none;">← 最新一期</a></div>
      <div class="weather">新聞存檔</div>
      <div class="date"></div>
    </div>
    <h1 class="masthead-title" style="font-size:clamp(48px,8vw,96px);">歷史期數</h1>
    <p class="masthead-tagline">
      所有過往的早晚報
    </p>
  </header>

  <main class="archive-list" id="archive-list">
    <p style="text-align:center;color:var(--ink-muted);padding:40px;">載入中…</p>
  </main>

  <footer class="site-footer">
    <a href="index.html">最新一期</a>
  </footer>

  <script>
    (async function () {
      const escapeHtml = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const get = async path => { try { const r=await fetch(path,{cache:'no-store'});return r.ok?await r.json():null; }catch{return null;} };
      try {
        const [legacy,modern,midday]=await Promise.all([get('data/archive.json'),get('data/editions/index.json'),get('data/midday/index.json')]);
        if(!legacy && !modern && !midday)throw new Error('無法取得歷史期數');
        const labels={morning:'科技早報',midday:'時事焦點',evening:'科技晚報'};
        const order={morning:1,midday:2,evening:3,'':0};
        const validDate=value=>typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
          && Number.isFinite(Date.parse(value+'T00:00:00Z')) && new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value;
        const rowsByIdentity=new Map();
        const add=(i,historical=false)=>{
          if(!i || !validDate(i.date))return;
          // Unscoped single-file archives keep their original date-only route.
          const edition=historical && i.edition==null ? '' : i.edition;
          if(!Object.hasOwn(labels,edition) && !(historical && i.edition==null))return;
          if(!historical && i.key!==i.date+'-'+edition)return;
          const key=JSON.stringify([i.date,edition]);
          rowsByIdentity.set(key,{date:i.date,edition,
            label:historical?'第 '+i.issue_number+' 期'+(edition?' · '+labels[edition]:''):labels[edition],
            title:historical?i.headline_zh:i.title,
            url:'index.html?date='+encodeURIComponent(i.date)+(edition?'&edition='+encodeURIComponent(edition):'')});
        };
        // Merge for display only: independent inventories are never rewritten.
        (Array.isArray(legacy?.issues)?legacy.issues:[]).forEach(i=>add(i,true));
        (Array.isArray(modern?.editions)?modern.editions:[]).forEach(i=>add(i));
        (Array.isArray(midday?.editions)?midday.editions:[]).forEach(i=>add(i));
        const rows=[...rowsByIdentity.values()];
        rows.sort((a,b)=>b.date.localeCompare(a.date)||order[b.edition]-order[a.edition]);
        document.getElementById('archive-list').innerHTML=rows.map(i=>`<a class="archive-item" href="${escapeHtml(i.url)}"><div class="archive-date">${escapeHtml(i.date)}</div><div class="archive-issue-num">${escapeHtml(i.label)}</div><div class="archive-headline">${escapeHtml(i.title)}</div></a>`).join('');
      }catch(err){document.getElementById('archive-list').textContent='載入失敗：'+err.message;}
    })();
  </script>
</body>
</html>
